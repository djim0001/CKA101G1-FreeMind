<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>修改密碼</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.6;
	padding: 40px 20px;
}

h1 {
	max-width: 520px;
	margin: 0 auto 28px;
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
	padding-bottom: 16px;
	border-bottom: 2px solid #e8b4b4;
	display: flex;
	align-items: center;
	justify-content: space-between;
}

h1 a {
	display: inline-block;
	padding: 8px 20px;
	background-color: #e8b4b4;
	color: #fff;
	text-decoration: none;
	border-radius: 6px;
	font-size: 14px;
	font-weight: 500;
	transition: background-color 0.2s;
}
h1 a:hover { background-color: #d39393; }

.error-msg {
	max-width: 520px;
	margin: 0 auto 16px;
	padding: 12px 16px;
	background-color: #fdecea;
	color: #c0392b;
	border: 1px solid #f5c6c1;
	border-radius: 6px;
	font-size: 14px;
}

form {
	max-width: 520px;
	margin: 0 auto;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	padding: 40px;
}

form > div { margin-bottom: 24px; }

label {
	display: block;
	margin-bottom: 8px;
	font-size: 15px;
	font-weight: 600;
	color: #7a6b6b;
}

input[type="password"] {
	width: 100%;
	padding: 10px 14px;
	border: 1px solid #f2dddd;
	border-radius: 6px;
	font-size: 15px;
	color: #444;
	outline: none;
	transition: border-color 0.2s;
}
input[type="password"]:focus {
	border-color: #e8b4b4;
	box-shadow: 0 0 0 3px rgba(232, 180, 180, 0.2);
}

.field-error { color: #d9534f; font-size: 13px; margin-top: 4px; }
.hint { font-size: 13px; color: #999; margin-top: 4px; }

button[type="submit"] {
	display: inline-block;
	width: 100%;
	padding: 10px 24px;
	font-size: 15px;
	font-weight: 500;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	background-color: #e8b4b4;
	color: #fff;
	transition: background-color 0.2s;
}
button[type="submit"]:hover { background-color: #d39393; }
</style>
</head>
<body>
	<h1>
		<span>修改密碼</span> <a th:href="@{/psych/profile}">返回</a>
	</h1>

	<p class="error-msg" th:if="${errorMessage}" th:text="${errorMessage}"></p>

	<form th:action="@{/psych/profile/password}" th:object="${passwordReq}" method="post">
		<div>
			<label>舊密碼</label>
			<input type="password" th:field="*{oldPassword}" autocomplete="current-password" />
			<p class="field-error" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></p>
		</div>

		<div>
			<label>新密碼</label>
			<input type="password" th:field="*{newPassword}" autocomplete="new-password" />
			<p class="hint">長度6~20字</p>
			<p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
		</div>

		<div>
			<label>再次輸入新密碼</label>
			<input type="password" th:field="*{confirmPassword}" autocomplete="new-password" />
			<p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
		</div>

		<div>
			<button type="submit">確認修改(修改後需重新登入)</button>
		</div>
	</form>
</body>
</html>
