<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>修改密碼</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/psych/psych.css}" href="/css/psych/psych.css" />
<!-- 這頁沒有專屬樣式,全部走 psych.css -->
</head>

<body class="psych-page">

	<div th:replace="~{fragments/header :: header}"></div>

	<main class="psych-wrap w-sm">

		<div class="psych-head">
			<div>
				<span class="script">Security</span>
				<h1>修改密碼</h1>
			</div>
			<div class="head-actions">
				<a class="btn btn-ghost" th:href="@{/psych/profile}">返回</a>
			</div>
		</div>

		<p class="error-msg" th:if="${errorMessage}" th:text="${errorMessage}"></p>

		<form class="psych-card" th:action="@{/psych/profile/password}" th:object="${passwordReq}" method="post">
			<div>
				<label>舊密碼</label>
				<input type="password" th:field="*{oldPassword}" autocomplete="current-password" />
				<p class="field-error" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></p>
			</div>

			<div>
				<label>新密碼</label>
				<input type="password" th:field="*{newPassword}" autocomplete="new-password" />
				<p class="hint">長度6~20字</p>
				<p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
			</div>

			<div>
				<label>再次輸入新密碼</label>
				<input type="password" th:field="*{confirmPassword}" autocomplete="new-password" />
				<p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
			</div>

			<div>
				<button type="submit" class="block">確認修改(修改後需重新登入)</button>
			</div>
		</form>

	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script src="/js/nav.js"></script>
</body>
</html>
