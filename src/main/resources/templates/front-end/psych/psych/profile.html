<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>我的資料</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/psych/psych.css}" href="/css/psych/psych.css" />

<style>
/* 本頁專屬:profile */
.psych-page .profile-top { display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; }
.psych-page .avatar {
	width: 132px; height: 132px; border-radius: 50%; object-fit: cover;
	border: 4px solid #fff; box-shadow: 0 0 0 2px var(--pink); flex-shrink: 0;
}
.psych-page .avatar-placeholder {
	width: 132px; height: 132px; border-radius: 50%; flex-shrink: 0;
	background: var(--pink-soft); color: var(--ink-soft);
	display: flex; align-items: center; justify-content: center;
	font-size: .82rem; border: 2px dashed var(--pink);
}
.psych-page .name-block { min-width: 0; }
.psych-page .name-block h2 { font-family: var(--serif); font-weight: 700; font-size: 1.5rem; color: var(--ink); margin: 0; }
.psych-page .name-block .account { font-size: .88rem; color: var(--ink-soft); margin: .2rem 0 0; }
.psych-page .info-grid {
	display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 2rem;
	margin-top: 1.8rem; padding-top: 1.6rem; border-top: 1px solid var(--line);
}
.psych-page .info-item .label { font-size: .8rem; font-weight: 600; color: var(--ink-soft); margin: 0 0 .15rem; }
.psych-page .info-item .value { font-size: .98rem; color: var(--ink); margin: 0; word-break: break-all; }
@media (max-width: 640px) {
	.psych-page .profile-top { flex-direction: column; align-items: center; text-align: center; }
	.psych-page .info-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body class="psych-page">

	<div th:replace="~{fragments/header :: header}"></div>

	<main class="psych-wrap">

		<div class="psych-head">
			<div>
				<span class="script">My Profile</span>
				<h1>我的資料</h1>
			</div>
			<div class="head-actions">
				<a class="btn btn-ghost" th:href="@{/psych/profile/password}">修改密碼</a>
				<a class="btn btn-primary" th:href="@{/psych/profile/edit}">編輯資料</a>
			</div>
		</div>
		<p class="success-msg" th:if="${successMessage}" th:text="${successMessage}"></p>

		<div class="psych-card">
			<div class="profile-top">
				<img class="avatar" th:if="${psych.profilePic != null && psych.profilePic != ''}"
					th:src="@{'/psych-images/' + ${psych.profilePic}}" alt="大頭照" />

				<div class="avatar-placeholder"
					th:if="${psych.profilePic == null || psych.profilePic == ''}">尚未上傳照片</div>

				<div class="name-block">
					<h2 th:text="${psych.name}">王小明</h2>
					<p class="account" th:text="'帳號:' + ${psych.psychAccount}">帳號:psych01</p>

					<span class="badge ok" th:if="${psych.accountStatus == 1}">帳號已啟用</span>
					<span class="badge warn" th:if="${psych.accountStatus == 0}">帳號未啟用</span>
					<span class="badge bad" th:if="${psych.accountStatus == 2}">帳號已停權</span>

					<span class="badge ok" th:if="${psych.hasPracticeLicense}">已取得執業許可</span>
					<span class="badge warn" th:unless="${psych.hasPracticeLicense}">執業許可審核中</span>
				</div>
			</div>

			<div class="info-grid">
				<div class="info-item">
					<p class="label">性別</p>
					<p class="value" th:text="${psych.gender}">男</p>
				</div>
				<div class="info-item">
					<p class="label">手機</p>
					<p class="value" th:text="${psych.phoneNumber}">0912345678</p>
				</div>
				<div class="info-item">
					<p class="label">信箱</p>
					<p class="value" th:text="${psych.email}">a@b.c</p>
				</div>
				<div class="info-item">
					<p class="label">心理師證照</p>
					<p class="value" th:text="${psych.psychCertificate}">心證字第000號</p>
				</div>
				<div class="info-item">
					<p class="label">工作地點</p>
					<p class="value" th:text="${psych.psychLoc}">台北市</p>
				</div>
				<div class="info-item">
					<p class="label">諮詢費(每次)</p>
					<p class="value" th:text="'NT$ ' + ${psych.psychFee}">NT$ 1800</p>
				</div>
				<div class="info-item">
					<p class="label">銀行帳號(撥款用)</p>
					<p class="value"
						th:text="${psych.bankAccount != null && psych.bankAccount != '' ? psych.bankAccount : '尚未填寫'}">尚未填寫</p>
				</div>
				<div class="info-item">
					<p class="label">加入時間</p>
					<p class="value"
						th:text="${psych.regisAt != null ? #dates.format(psych.regisAt, 'yyyy-MM-dd') : '-'}">2026-01-01</p>
				</div>
			</div>

			<p class="section-title">我的專長</p>
			<div>
				<span class="tag" th:each="e : ${psych.expertiseList}" th:text="${e.expertiseName}">焦慮</span>
				<span class="empty-hint" th:if="${#lists.isEmpty(psych.expertiseList)}">尚未設定專長,點右上「編輯資料」新增</span>
			</div>

			<p class="section-title">每週可預約時段</p>
			<div id="weekGrid" class="week-grid" th:attr="data-avail=${psych.weeklyAvailability}"></div>
			<p class="empty-hint" id="noAvailHint" style="display:none; margin-top:8px;">尚未設定時段</p>
		</div>

	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script src="/js/nav.js"></script>

	<script>
		// 唯讀時段格子:168碼,index = (星期幾-1)*24 + 小時,週一開頭
		(function() {
			const grid = document.getElementById('weekGrid');
			const avail = grid.dataset.avail || '';
			const days = ['一', '二', '三', '四', '五', '六', '日'];

			if (avail.length !== 168) {
				grid.style.display = 'none';
				document.getElementById('noAvailHint').style.display = 'block';
				return;
			}

			grid.appendChild(document.createElement('div'));
			days.forEach(d => {
				const h = document.createElement('div');
				h.className = 'head';
				h.textContent = '週' + d;
				grid.appendChild(h);
			});

			for (let hour = 0; hour < 24; hour++) {
				const label = document.createElement('div');
				label.className = 'hour';
				label.textContent = String(hour).padStart(2, '0');
				grid.appendChild(label);

				for (let day = 0; day < 7; day++) {
					const cell = document.createElement('div');
					cell.className = 'cell' + (avail.charAt(day * 24 + hour) === '1' ? ' on' : '');
					grid.appendChild(cell);
				}
			}
		})();
	</script>
</body>
</html>
