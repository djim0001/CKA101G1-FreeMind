<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>編輯我的資料</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/psych.css}" href="/css/psych.css" />

<style>
/* 本頁專屬:edit */
.psych-page .avatar-preview {
	width: 132px; height: 132px; border-radius: 50%; object-fit: cover;
	border: 4px solid #fff; box-shadow: 0 0 0 2px var(--pink); display: block; margin-bottom: .7rem;
}
.psych-page .btn-soft {
	padding: .55rem 1.2rem; background: var(--pink-soft); color: var(--orange-deep);
	border: 1px solid var(--pink); border-radius: 999px; cursor: pointer; font-family: var(--sans);
	font-size: .9rem; transition: background .2s, color .2s;
}
.psych-page .btn-soft:hover { background: var(--orange); color: #fff; border-color: var(--orange); }

/* 專長 chip */
.psych-page .expertise-list { display: flex; flex-wrap: wrap; gap: .6rem; }
.psych-page .expertise-list label {
	display: inline-flex; align-items: center; gap: .4rem; margin: 0;
	padding: .4rem 1rem; background: var(--bg-warm); border: 1px solid var(--line);
	border-radius: 999px; font-size: .9rem; font-weight: 400; color: var(--ink-soft);
	cursor: pointer; user-select: none; transition: background .2s, color .2s, border-color .2s;
}
.psych-page .expertise-list label:has(input:checked) { background: var(--orange); color: #fff; border-color: var(--orange); }
.psych-page .expertise-list input { accent-color: var(--orange-deep); }

/* 編輯頁的時段格子:可點、hover 提示(格子外觀本身走 psych.css) */
.psych-page #weekGrid .cell { cursor: pointer; transition: background .1s; }
.psych-page #weekGrid .cell:hover { outline: 2px solid var(--orange); }

/* 衝突確認 modal */
.psych-page .modal-backdrop {
	position: fixed; inset: 0; background: rgba(58, 75, 83, .45);
	display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1.2rem;
}
.psych-page .modal {
	background: #fff; border-radius: var(--radius-md); max-width: 560px; width: 100%;
	max-height: 85vh; overflow-y: auto; padding: 1.8rem; box-shadow: var(--shadow-md);
}
.psych-page .modal h2 { font-family: var(--serif); font-weight: 700; font-size: 1.25rem; color: var(--ink); margin: 0 0 .4rem; }
.psych-page .modal .modal-desc { font-size: .9rem; color: var(--ink-soft); margin: 0 0 1rem; }
.psych-page .conflict-row {
	display: flex; align-items: center; justify-content: space-between; gap: .8rem;
	padding: .8rem 1rem; border: 1px solid var(--line); border-radius: 14px;
	margin-bottom: .7rem; font-size: .9rem;
}
.psych-page .conflict-row .time { color: var(--ink); font-weight: 600; margin: 0; }
.psych-page .conflict-row .status { font-size: .78rem; color: var(--orange-deep); margin: .1rem 0 0; }
.psych-page .conflict-row .choices { display: flex; gap: .8rem; white-space: nowrap; }
.psych-page .conflict-row .choices label {
	display: inline-flex; gap: .25rem; align-items: center; margin: 0;
	font-weight: 400; font-size: .9rem; color: var(--ink); cursor: pointer;
}
.psych-page .conflict-row input { accent-color: var(--orange-deep); }
.psych-page .modal-actions { display: flex; justify-content: flex-end; gap: .8rem; margin-top: 1.2rem; }
.psych-page .modal-error { color: #c0563f; font-size: .82rem; margin-top: .5rem; display: none; }

@media (max-width: 640px) {
	.psych-page .conflict-row { flex-direction: column; align-items: flex-start; }
}
</style>
</head>

<body class="psych-page">

	<div th:replace="~{fragments/header :: header}"></div>

	<main class="psych-wrap">

		<div class="psych-head">
			<div>
				<span class="script">Edit Profile</span>
				<h1>編輯我的資料</h1>
			</div>
			<div class="head-actions">
				<a class="btn btn-ghost" th:href="@{/psych/profile}">返回</a>
			</div>
		</div>

		<p class="error-msg" th:if="${errorMessage}" th:text="${errorMessage}"></p>

		<form class="psych-card" id="editForm" th:action="@{/psych/profile/edit}"
			th:object="${updateReq}" method="post" enctype="multipart/form-data">

			<!-- 照片:選檔即預覽(檔案由 Controller 的 profilePicFile 參數接收) -->
			<div>
				<label>大頭照</label>
				<img id="picPreview" class="avatar-preview"
					th:src="${psych.profilePic != null && psych.profilePic != ''}
						? @{'/psych-images/' + ${psych.profilePic}} : ''"
					th:style="${psych.profilePic == null || psych.profilePic == ''} ? 'display:none;' : ''" />
				<input type="file" name="profilePicFile" id="picInput" accept="image/*" style="display: none;" />
				<button type="button" class="btn-soft" id="picBtn">選擇圖片</button>
				<span class="hint" id="picFileName"></span>
			</div>

			<div>
				<label>手機</label>
				<input type="text" th:field="*{phoneNumber}" />
				<p class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
			</div>

			<div>
				<label>信箱</label>
				<input type="text" th:field="*{email}" />
				<p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
			</div>

			<div>
				<label>工作地點</label>
				<input type="text" th:field="*{psychLoc}" />
				<p class="hint">變更地點後,未來已預約的會員將收到通知</p>
				<p class="field-error" th:if="${#fields.hasErrors('psychLoc')}" th:errors="*{psychLoc}"></p>
			</div>

			<div>
				<label>諮詢費(每次)</label>
				<input type="number" min="0" th:field="*{psychFee}" />
				<p class="hint">調整費用只影響新預約,已成立的預約金額不變</p>
				<p class="field-error" th:if="${#fields.hasErrors('psychFee')}" th:errors="*{psychFee}"></p>
			</div>

			<div>
				<label>銀行帳號(撥款用,選填)</label>
				<input type="text" th:field="*{bankAccount}" />
				<p class="field-error" th:if="${#fields.hasErrors('bankAccount')}" th:errors="*{bankAccount}"></p>
			</div>

			<!-- 專長:th:field 綁 List<Integer>,已勾的自動 checked -->
			<div>
				<label>我的專長</label>
				<div class="expertise-list">
					<label th:each="opt : ${expertiseOptions}">
						<input type="checkbox" th:field="*{expertiseIds}" th:value="${opt.expertiseId}" />
						<span th:text="${opt.expertiseName}">焦慮</span>
					</label>
				</div>
			</div>

			<!-- 每週時段:點格子開關,可按住拖曳;實際值同步進隱藏欄位(168碼) -->
			<div>
				<label>每週可預約時段(點選格子,可拖曳)</label>
				<div id="weekGrid" class="week-grid"></div>
				<input type="hidden" th:field="*{weeklyAvailability}" id="weeklyAvailability" />
				<p class="field-error" th:if="${#fields.hasErrors('weeklyAvailability')}" th:errors="*{weeklyAvailability}"></p>
			</div>

			<div>
				<button type="submit">儲存變更</button>
			</div>
		</form>

	</main>

	<!-- 衝突確認 modal:Controller 有放 conflicts 進 model 才會渲染 -->
	<div class="modal-backdrop" id="conflictModal"
		th:if="${conflicts != null && !#lists.isEmpty(conflicts)}">
		<div class="modal">
			<h2>新的上班時間與既有預約衝突</h2>
			<p class="modal-desc">以下預約落在你這次關閉的時段內。請逐筆決定:保留(照常進行會談)或取消(通知後釋放時段)。</p>

			<div class="conflict-row" th:each="c : ${conflicts}"
				data-order-id="0" th:attr="data-order-id=${c.orderId}">
				<div>
					<p class="time"
						th:text="${#temporals.format(c.consStart, 'yyyy-MM-dd HH:mm')} + ' ~ ' + ${#temporals.format(c.consEnd, 'HH:mm')}">
						2026-07-20 10:00 ~ 11:00</p>
					<p class="status" th:text="${c.orderStatus == 1 ? '已確認' : '待確認'}">已確認</p>
				</div>
				<div class="choices">
					<label>
						<input type="radio" name="decision-demo" th:name="'decision-' + ${c.orderId}" value="keep" /> 保留
					</label>
					<label>
						<input type="radio" name="decision-demo" th:name="'decision-' + ${c.orderId}" value="cancel" /> 取消
					</label>
				</div>
			</div>

			<p class="modal-error" id="modalError">每筆預約都要選「保留」或「取消」才能送出</p>

			<div class="modal-actions">
				<button type="button" class="btn btn-ghost" id="modalCancelBtn">先不更改</button>
				<button type="submit" form="editForm" id="modalConfirmBtn"
					style="padding:.8rem 1.8rem; font-size:1rem; border:none; border-radius:999px; cursor:pointer; background-color:var(--orange); color:#fff; box-shadow:0 8px 20px rgba(245,142,107,.4);">
					確定送出</button>
			</div>
		</div>
	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script src="/js/nav.js"></script>

	<script>
	// ========= 照片選檔即預覽 =========
	document.getElementById('picBtn').addEventListener('click', function() {
		document.getElementById('picInput').click();
	});
	document.getElementById('picInput').addEventListener('change', function(e) {
		const file = e.target.files[0];
		if (file) {
			const preview = document.getElementById('picPreview');
			preview.src = URL.createObjectURL(file);
			preview.style.display = 'block';
			document.getElementById('picFileName').textContent = file.name;
		}
	});

	// ========= 168 時段格子 =========
	(function() {
		const grid = document.getElementById('weekGrid');
		const hidden = document.getElementById('weeklyAvailability');
		const days = ['一', '二', '三', '四', '五', '六', '日'];

		let bits = (hidden.value && hidden.value.length === 168)
			? hidden.value.split('')
			: new Array(168).fill('0');

		function sync() { hidden.value = bits.join(''); }
		sync();

		grid.appendChild(document.createElement('div'));
		days.forEach(d => {
			const h = document.createElement('div');
			h.className = 'head';
			h.textContent = '週' + d;
			grid.appendChild(h);
		});

		let painting = false;
		let paintTo = '1';

		function apply(cell, idx, value) {
			bits[idx] = value;
			cell.classList.toggle('on', value === '1');
			sync();
		}

		for (let hour = 0; hour < 24; hour++) {
			const label = document.createElement('div');
			label.className = 'hour';
			label.textContent = String(hour).padStart(2, '0');
			grid.appendChild(label);

			for (let day = 0; day < 7; day++) {
				const idx = day * 24 + hour;
				const cell = document.createElement('div');
				cell.className = 'cell' + (bits[idx] === '1' ? ' on' : '');

				cell.addEventListener('mousedown', function(e) {
					e.preventDefault();
					painting = true;
					paintTo = bits[idx] === '1' ? '0' : '1';
					apply(cell, idx, paintTo);
				});
				cell.addEventListener('mouseover', function() {
					if (painting) apply(cell, idx, paintTo);
				});

				grid.appendChild(cell);
			}
		}
		document.addEventListener('mouseup', function() { painting = false; });
	})();

	// ========= 衝突 modal =========
	const modal = document.getElementById('conflictModal');
	if (modal) {
		document.getElementById('modalCancelBtn').addEventListener('click', function() {
			modal.style.display = 'none';
		});

		document.getElementById('modalConfirmBtn').addEventListener('click', function(e) {
			const rows = modal.querySelectorAll('.conflict-row');
			const form = document.getElementById('editForm');
			const keepIds = [], cancelIds = [];

			for (const row of rows) {
				const picked = row.querySelector('input[type="radio"]:checked');
				if (!picked) {
					e.preventDefault();
					document.getElementById('modalError').style.display = 'block';
					return;
				}
				(picked.value === 'keep' ? keepIds : cancelIds).push(row.dataset.orderId);
			}

			form.querySelectorAll('input[name="keepOrderIds"], input[name="cancelOrderIds"]')
				.forEach(el => el.remove());

			const addHidden = (name, val) => {
				const input = document.createElement('input');
				input.type = 'hidden';
				input.name = name;
				input.value = val;
				form.appendChild(input);
			};
			keepIds.forEach(id => addHidden('keepOrderIds', id));
			cancelIds.forEach(id => addHidden('cancelOrderIds', id));
		});
	}
	</script>
</body>
</html>
