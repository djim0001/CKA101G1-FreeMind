<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>忘記密碼｜諮由自在</title>
<link rel="stylesheet" th:href="@{/css/login/common/member-base.css}" />
</head>
<body class="thy2-member">
	<header th:replace="~{fragments/member/memberHeader :: authHeader}"></header>
	<main class="container">
		<div class="section-head">
			<div>
				<p class="eyebrow">Reset password</p>
				<h2>忘記密碼</h2>
			</div>
		</div>

		<div class="auth-card">
			<div class="panel">
				<p class="meta">請輸入註冊時使用的信箱，我們會寄送驗證碼給您。</p>

				<div class="notice" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

				<form th:action="@{/psych/forgot}" method="post">
					<div class="form-grid">
						<div class="form-group full">
							<label>信箱</label>
							<input type="text" name="email" class="field" autofocus>
						</div>
					</div>
					<div class="section-head-actions" style="margin-top:20px;">
						<a class="btn ghost" th:href="@{/front-end/psychologist/login}">回登入頁</a>
						<button type="submit" class="btn">寄送驗證碼</button>
					</div>
				</form>
			</div>
		</div>
	</main>
	<footer th:replace="~{fragments/member/memberFooter :: siteFooter}"></footer>
	<script th:src="@{/js/login/common/ui.js}"></script>
</body>
</html>
