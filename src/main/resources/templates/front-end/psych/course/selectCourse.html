<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>課程管理｜心理師中心</title><link rel="stylesheet" th:href="@{/css/course/psych-style.css}" /></head><body class="th2-page"><div class="layout"><aside class="sidebar"><a class="brand" th:href="@{/psych/course/select_course}">諮由自在 Free Mind<small>THERAPIST STUDIO</small></a><nav class="nav"><a class="active" th:href="@{/psych/course/select_course}">課程管理</a><a th:href="@{/psych/course/add_course}">新增／編輯課程</a><a th:href="@{/psych/payout/selectPayout}">營運與成長</a><a th:href="@{/psych/course/psych_qa}">學員提問</a></nav></aside><div class="main"><header class="topbar"><p>心理師中心／課程商城</p><div class="topbar-actions"><button class="btn ghost" type="button" data-toast="目前沒有新通知">通知</button><a class="profile-entry" th:href="@{/psych/profile}"><span class="profile-entry-avatar" aria-hidden="true">心</span><span th:text="${psychologist.name}">心理師</span></a></div></header><main class="content"><div class="page-head"><div><h1>課程管理</h1><p>查看課程狀態、設定上架後折扣與管理學員互動；課程下架由管理員執行。</p></div><a class="btn" th:href="@{/psych/course/add_course}">＋ 建立新課程</a></div><section class="stats"><div class="stat"><span>全部課程</span><strong th:text="${courseListAllPages != null ? courseListAllPages.totalElements : '—'}">—</strong></div><div class="stat"><span>已上架</span><strong th:text="${courseCountListed != null ? courseCountListed : 0}">0</strong></div><div class="stat"><span>審核中</span><strong th:text="${courseCountAwait != null ? courseCountAwait : 0}">0</strong></div><div class="stat"><span>待回覆提問</span><strong th:text="${unansweredCount != null ? unansweredCount : 0}">0</strong></div></section><div class="tabs" data-tabs><button class="active" data-tab="courses">課程狀態</button><button data-tab="students">學員互動</button></div>
<section class="tab-panel" data-panel="courses"><form class="course-search-form" method="get" th:action="@{/psych/course/select_course}" data-course-search-form><input class="field" type="search" name="keyword" th:value="${param.keyword != null ? param.keyword[0] : ''}" placeholder="搜尋課程名稱……"><select class="field" name="courseStatus"><option value="">全部狀態</option><option value="0" th:selected="${param.courseStatus != null and param.courseStatus[0] == '0'}">草稿</option><option value="1" th:selected="${param.courseStatus != null and param.courseStatus[0] == '1'}">審核中</option><option value="2" th:selected="${param.courseStatus != null and param.courseStatus[0] == '2'}">審核成功</option><option value="3" th:selected="${param.courseStatus != null and param.courseStatus[0] == '3'}">審核失敗</option><option value="4" th:selected="${param.courseStatus != null and param.courseStatus[0] == '4'}">已上架</option><option value="5" th:selected="${param.courseStatus != null and param.courseStatus[0] == '5'}">已下架</option></select><select class="field" name="orderBy"><option value="courseIdDesc" th:selected="${orderBy == null or orderBy == 'courseId' or orderBy == 'courseIdDesc'}">最近建立</option><option value="courseIdAsc" th:selected="${orderBy == 'courseIdAsc'}">最早建立</option><option value="courseStatusAsc" th:selected="${orderBy == 'courseStatusAsc'}">狀態順序</option><option value="courseStatusDesc" th:selected="${orderBy == 'courseStatusDesc'}">狀態反序</option></select><input type="hidden" name="page" value="1"><button class="btn secondary" type="submit">搜尋</button></form><div class="table-wrap"><table><thead><tr><th>課程名稱</th><th>原價／折扣</th><th>課程狀態</th><th>學員互動</th><th>可執行操作</th></tr></thead><tbody><tr th:if="${courseListAllPages == null || courseListAllPages.content.isEmpty()}"><td class="empty-state" colspan="5">沒有符合搜尋條件的課程</td></tr><tr th:each="course : ${courseListAllPages.content}"><td><div class="course-summary"><strong th:text="${course.courseName}">課程名稱</strong><span class="meta" th:text="${course.courseCategories.courseCatName}">分類</span></div></td><td>NT$ <span th:text="${course.price}">0</span><br><span class="meta" th:text="${course.psychDiscount == null ? '目前無折扣' : course.psychDiscount}">目前無折扣</span></td><td><span class="status" th:text="${course.courseStatusText}">狀態</span></td><td>收藏 <span th:text="${course.saveCount}">0</span>・評價 <span th:text="${course.reviewCount}">0</span>・提問 <span th:text="${course.commentCount}">0</span></td><td><form class="inline-form" method="get" th:action="@{get_one_course/{courseId}(courseId=${course.courseId})}"><input type="hidden" name="courseId" th:value="${course.courseId}"><button class="btn secondary" type="submit">查看詳情</button></form></td></tr></tbody></table></div><div data-course-search-pagination><div th:replace="~{fragments/pagination :: paginationWithOrder(${currentPage}, ${totalPages}, '/psych/course/select_course', ${orderBy})}"></div></div></section>
<section class="tab-panel" data-panel="students" hidden><div class="table-wrap"><table><thead><tr><th>學員</th><th>課程／內容</th><th>提問時間</th><th>狀態</th><th>操作</th></tr></thead><tbody><tr th:if="${questions == null || questions.isEmpty()}"><td class="empty-state" colspan="5">目前沒有學員提問</td></tr><tr th:each="courseQa : ${questions}"><td th:text="${courseQa.member.name}">會員</td><td><strong th:text="${courseQa.course.courseName}">課程</strong><br><span th:text="${courseQa.courseQuestion}">問題</span></td><td th:text="${courseQa.askedAt}">—</td><td><span class="status" th:text="${courseQa.courseAnswer == null ? '待回覆' : '已回覆'}">狀態</span></td><td><a class="btn secondary" th:href="@{/psych/course/psych_qa}">前往處理</a></td></tr></tbody></table></div></section></main></div></div><script th:src="@{/js/course/psych-js.js}"></script></body></html>
