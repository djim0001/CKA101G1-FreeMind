<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
<head>
<meta charset="UTF-8">
<title>心理師查詢課程頁面</title>
<style>
span.error{
color:  red;
font-size: 12px;
}
</style>
</head>
<body>
	<h3>
		<a th:href="@{/}">首頁</a>
	</h3>
	<h3>
		<a th:href="@{/psych/course/add_course}">心理師新增修改課程</a>
	</h3>
	<form method="post" th:action="@{set_psychId_session}">
		<span>心理師編號：</span> <input type="text" name="psychIdSession" />
		<button type="submit" id="submit">送出</button><br>
		<span class="error" th:text="${pError}"></span>
	</form>

	<div th:if="${session.psychId > 0}">
		<span>session心理師編號:</span><span th:text=${session.psychId}></span><br>
		<span>心理師名稱:</span><span th:text=${psychologist.name}></span><br>
		<table>
			<thead>
				<tr>
					<th><a th:href="@{/psych/course/select_course}">課程名稱</a></th>
					<th><a th:href="@{/psych/course/select_course(page=1,
							        orderBy=${orderBy == 'courseCategoriesAsc' ? 'courseCategoriesDesc' : 'courseCategoriesAsc'}
						    			)}">課程分類名稱</a>
					</th>
					<th><a th:href="@{/psych/course/select_course(page=1,
							        orderBy=${orderBy == 'courseStatusAsc' ? 'courseStatusDesc' : 'courseStatusAsc'}
						    			)}">課程狀態</a></th>
					<th><a th:href="@{/psych/course/select_course(page=1,
							        orderBy=${orderBy == 'saveCountAsc' ? 'saveCountDesc' : 'saveCountAsc'}
						    			)}">收藏次數</a></th>
					<th><a th:href="@{/psych/course/select_course(page=1,
							        orderBy=${orderBy == 'starCountAsc' ? 'starCountDesc' : 'starCountAsc'}
						    			)}">平均星數</a></th>
					<th><a th:href="@{/psych/course/select_course(page=1,
							        orderBy=${orderBy == 'reviewCountAsc' ? 'reviewCountDesc' : 'reviewCountAsc'}
						    			)}">評價次數</a></th>
					<th><a th:href="@{/psych/course/select_course(page=1,
							        orderBy=${orderBy == 'commentCountAsc' ? 'commentCountDesc' : 'commentCountAsc'}
						    			)}">提問次數</a></th>
					<th>心理師折扣</th>
					<th>折扣開始時間</th>
					<th>折扣結束時間</th>
					<th><a th:href="@{/psych/course/select_course(page=1,
							        orderBy=${orderBy == 'priceAsc' ? 'priceDesc' : 'priceAsc'}
						    			)}">課程定價</a></th>
					<th>功能</th>
				</tr>
			</thead>
			<tbody>
				<th:block th:each="course : ${courseListAllPages.content}">
					<tr>
						<td th:text="${course.courseName}"></td>
						<td th:text="${course.courseCategories.courseCatName}"></td>
						<td th:text="${course.courseStatusText}"></td>
						<td th:text="${course.saveCount}"></td>
						<td th:text="${course.reviewCount == 0 ? 0 : course.starCount / course.reviewCount}"></td>
						<td th:text="${course.reviewCount}"></td>
						<td th:text="${course.commentCount}"></td>
						<td th:text="${course.psychDiscount}"></td>
						<td th:text="${#temporals.format(course.discountStart, 'yyyy年MM月dd日')}"></td>
						<td th:text="${#temporals.format(course.discountEnd, 'yyyy年MM月dd日')}"></td>
						<td th:text="${course.price}"></td>
						<td>
							<form method="post" th:action="@{get_one_course}">
								<input type="hidden" name="courseId"
									th:value="${course.courseId}">
								<button type="submit">查看詳情</button>
							</form>
						</td>
					</tr>
				</th:block>
			</tbody>
		</table>
		
		<div th:replace="~{fragments/pagination :: paginationWithOrder(${currentPage}, ${totalPages}, '/psych/course/select_course', ${orderBy})}"></div>	
		
	</div>
	
</body>
</html>
