<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<h1>哈囉</h1>
	<table>
			<thead>
				<tr>
					<th>課程名稱</th>
					<th>會員編號</th>
					<th>提問時間</th>
					<th>會員提問</th>
					<th>回復時間</th>
					<th>心理師回復</th>
					
				</tr>
			</thead>
			<tbody>
				<th:block th:each="courseQa : ${questions}">
					<tr>
						<td th:text="${courseQa.course.courseName}"></td>
						<td th:text="${courseQa.course.courseName}"></td>
						
						<td>
							<form method="post" th:action="@{psychGetOneCourse}">
								<input type="hidden" name="courseId"
									th:value="${course.courseId}">
								<button type="submit">查看詳情</button>
							</form>
						</td>
					</tr>
				</th:block>
			</tbody>
		</table>
	
</body>
</html>
