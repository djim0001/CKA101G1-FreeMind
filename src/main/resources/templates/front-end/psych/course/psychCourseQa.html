<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>學員提問｜心理師中心｜諮由自在 Free Mind</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
	<style>
	/* 共用字體、色票、頁寬、Header、Footer 與按鈕基礎由 styles.css 提供。 */
	input, select, textarea { font: inherit; }

	/* 課程管理內容。 */
		.page-main { padding: 2.6rem 0 4.5rem; }
		.page-intro {
			display: grid;
			grid-template-columns: minmax(13rem, .72fr) minmax(0, 1.28fr);
			align-items: end;
			gap: .75rem 2rem;
			margin-bottom: 1.6rem;
			padding: 0 .3rem 1.5rem;
			border-bottom: 1px solid var(--line);
		}
		.page-intro h1 {
			overflow: hidden;
			margin: 0;
			font-family: var(--serif);
			font-size: clamp(1.75rem, 3vw, 2.6rem);
			line-height: 1.2;
			letter-spacing: 0;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.page-intro p {
			max-width: none;
			margin: 0 0 .15rem;
			color: var(--ink-soft);
			font-size: 1rem;
		}
		.page-main .btn,
		.modal-overlay .btn {
			justify-content: center;
			min-height: 44px;
			border: 1px solid transparent;
			white-space: nowrap;
		}
		.btn-secondary { border: 1px solid var(--line); background: #fff; color: var(--ink); }
		.btn-secondary:hover { border-color: var(--bg-soothing); background: var(--blue-soft); }
		.stats {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 1rem;
			margin-bottom: 1.25rem;
		}
		.stat {
			position: relative;
			overflow: hidden;
			min-height: 118px;
			padding: 1.35rem 1.45rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}
		.stat::after {
			content: "";
			position: absolute;
			right: -28px;
			bottom: -38px;
			width: 92px;
			height: 92px;
			border-radius: 50%;
			background: var(--pink-soft);
		}
		.stat:nth-child(even)::after { background: var(--blue-soft); }
		.stat span { position: relative; z-index: 1; color: var(--ink-soft); font-size: .9rem; }
		.stat strong {
			position: relative;
			z-index: 1;
			display: block;
			margin-top: .2rem;
			font-family: var(--serif);
			font-size: 2rem;
			line-height: 1.2;
		}
		.workspace {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: var(--radius-lg);
			background: var(--white);
			box-shadow: var(--shadow-md);
		}
		.tabs {
			display: flex;
			gap: .35rem;
			padding: 1rem 1.2rem 0;
			border-bottom: 1px solid var(--line);
			background: rgba(220, 234, 245, .22);
		}
		.tabs button {
			position: relative;
			padding: .8rem 1.25rem .95rem;
			font-weight: 500;
			color: var(--ink-soft);
		}
		.tabs button::after {
			content: "";
			position: absolute;
			right: 1rem;
			bottom: -1px;
			left: 1rem;
			height: 3px;
			border-radius: 999px 999px 0 0;
			background: transparent;
		}
		.tabs button:hover,
		.tabs button.active { color: var(--ink); }
		.tabs button.active::after { background: var(--orange); }
		.tab-panel { padding: 1.5rem; }
		.course-search-form {
			display: grid;
			grid-template-columns: minmax(240px, 1.5fr) minmax(145px, .65fr) minmax(145px, .65fr) auto;
			gap: .75rem;
			margin-bottom: 1.25rem;
		}
		.field {
			width: 100%;
			min-height: 46px;
			padding: .68rem .95rem;
			border: 1px solid var(--line);
			border-radius: 14px;
			outline: none;
			background: #fff;
			color: var(--ink);
			transition: border-color .18s, box-shadow .18s;
		}
		.field:focus { border-color: var(--bg-soothing); box-shadow: 0 0 0 4px rgba(194, 217, 237, .28); }
		.table-wrap {
			overflow-x: auto;
			border: 1px solid var(--line);
			border-radius: 18px;
		}
		table { width: 100%; border-collapse: collapse; min-width: 830px; }
		th, td { padding: 1rem 1.05rem; text-align: left; vertical-align: middle; }
		th {
			border-bottom: 1px solid var(--line);
			background: var(--bg-warm);
			font-size: .84rem;
			font-weight: 700;
			color: var(--ink-soft);
			white-space: nowrap;
		}
		td { border-bottom: 1px solid rgba(236, 223, 206, .72); font-size: .92rem; }
		.qa-time {
			min-width: 9.8rem;
			white-space: nowrap;
			font-variant-numeric: tabular-nums;
		}
		tbody tr:last-child td { border-bottom: 0; }
		tbody tr:hover { background: rgba(220, 234, 245, .16); }
		.course-summary { display: flex; flex-direction: column; gap: .12rem; min-width: 175px; }
		.course-summary strong { font-family: var(--serif); font-size: 1rem; }
		.meta { color: var(--ink-soft); font-size: .83rem; }
		.status {
			display: inline-flex;
			align-items: center;
			min-height: 31px;
			padding: .26rem .75rem;
			border-radius: 999px;
			background: var(--blue-soft);
			font-size: .82rem;
			font-weight: 500;
			white-space: nowrap;
		}
		.inline-form { display: inline-flex; margin: 0; }
		.empty-state {
			padding: 3.4rem 1rem;
			text-align: center;
			color: var(--ink-soft);
		}
		[data-course-search-pagination] { margin-top: 1.25rem; }
		.pagination-ui,
		[data-course-search-pagination] > div {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: .45rem;
		}
		.pagination-ui a,
		[data-course-search-pagination] a {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-width: 40px;
			min-height: 40px;
			padding: .45rem .75rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: #fff;
			color: var(--ink-soft);
			transition: background .18s, color .18s, border-color .18s;
		}
		.pagination-ui a:hover,
		.pagination-ui a.active,
		.pagination-ui .active a,
		[data-course-search-pagination] a:hover {
			border-color: var(--bg-soothing);
			background: var(--blue-soft);
			color: var(--ink);
		}
	
		/* 心理師課程子頁共用元件。 */
		.stack { display: grid; gap: 1rem; }
		.panel {
			padding: 1.5rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}
		.panel h2,
		.panel h3 { margin-top: 0; font-family: var(--serif); }
		.panel h2 { margin-bottom: 1rem; font-size: 1.3rem; }
		.panel h3 { margin-bottom: .45rem; font-size: 1.05rem; }
		.panel-title-row {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 1rem;
			margin-bottom: 1rem;
		}
		.panel-title-row h2,
		.panel-title-row p { margin: 0; }
		.page-actions { display: flex; flex-wrap: wrap; gap: .65rem; align-items: center; }
		.form-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
		}
		.form-group { display: grid; gap: .4rem; }
		.form-group.full { grid-column: 1 / -1; }
		.form-group label { font-weight: 500; }
		textarea.field { min-height: 118px; resize: vertical; }
		.outline-field { min-height: 240px; }
		.required,
		.error { color: var(--orange-deep); }
		.error { font-size: .82rem; }
		.form-note { color: var(--ink-soft); font-size: .82rem; }
		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.state-flow {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: .55rem;
			padding: 1rem 1.2rem;
			border: 1px solid var(--line);
			border-radius: 18px;
			background: rgba(220, 234, 245, .28);
		}
		.state-flow span {
			padding: .35rem .8rem;
			border-radius: 999px;
			background: #fff;
			color: var(--ink-soft);
			font-size: .84rem;
		}
		.state-flow span.active { background: var(--blue-soft); color: var(--ink); font-weight: 700; }
		.state-flow i { color: var(--orange); font-style: normal; }
		.state-flow small { flex-basis: 100%; color: var(--ink-soft); }
		.video-upload-grid,
		.video-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
		}
		.video-upload-card,
		.video-card {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 18px;
			background: var(--bg-warm);
		}
		.upload-heading {
			display: flex;
			align-items: center;
			gap: .8rem;
			padding: 1rem;
		}
		.upload-heading h3,
		.upload-heading p { margin: 0; }
		.upload-heading p { color: var(--ink-soft); font-size: .82rem; }
		.upload-heading strong { margin-left: auto; color: var(--orange-deep); font-size: .8rem; }
		.upload-icon {
			display: grid;
			width: 38px;
			height: 38px;
			place-items: center;
			border-radius: 50%;
			background: var(--pink-soft);
			color: var(--orange-deep);
		}
		.upload-dropzone {
			display: grid;
			min-height: 112px;
			margin: 0 1rem 1rem;
			place-content: center;
			border: 1px dashed var(--bg-soothing);
			border-radius: 14px;
			background: #fff;
			text-align: center;
			cursor: pointer;
		}
		.upload-dropzone span { color: var(--orange-deep); font-weight: 500; }
		.upload-dropzone small { color: var(--ink-soft); }
		.uploaded-preview,
		.video-card video { width: 100%; background: #26343a; }
		.video-card h3 { margin: 0; padding: 1rem; }
		.locked-message {
			padding: 1rem;
			border-radius: 14px;
			background: var(--bg-warm);
			color: var(--ink-soft);
		}
		.status.warning { background: #fff0c8; }
		.status.danger { background: var(--pink-soft); color: var(--orange-deep); }
		.preview-hero {
			display: grid;
			grid-template-columns: minmax(0, .9fr) minmax(280px, 1.1fr);
			gap: 1.5rem;
			margin-bottom: 1.25rem;
			padding: 1.5rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-lg);
			background: var(--white);
			box-shadow: var(--shadow-md);
		}
		.cover-mock {
			display: grid;
			min-height: 260px;
			padding: 2rem;
			place-content: center;
			border-radius: var(--radius-md);
			background: linear-gradient(145deg, var(--blue-soft), var(--pink-soft));
			text-align: center;
		}
		.cover-mock span { color: var(--ink-soft); font-size: .85rem; }
		.cover-mock strong { font-family: var(--serif); font-size: 1.45rem; }
		.preview-summary { align-self: center; }
		.preview-summary h1 { margin: .35rem 0 1rem; font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.6rem); }
		.price-preview {
			display: grid;
			gap: .15rem;
			padding: 1rem 1.2rem;
			border-radius: 16px;
			background: var(--bg-warm);
		}
		.price-preview strong { color: var(--orange-deep); font-size: 1.45rem; }
		.price-preview small { color: var(--ink-soft); }
		.preview-content {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 260px;
			gap: 1rem;
			margin-bottom: 1rem;
		}
		.preview-main,
		.preview-check {
			padding: 1.4rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}
		.preview-check { align-self: start; }
		.preview-check .btn { width: 100%; margin-top: .6rem; }
		.preview-tabs {
			display: flex;
			gap: .35rem;
			margin: -1.4rem -1.4rem 1.3rem;
			padding: .8rem 1rem 0;
			border-bottom: 1px solid var(--line);
			background: rgba(220, 234, 245, .22);
		}
		.preview-tabs button {
			padding: .7rem .9rem;
			border-bottom: 3px solid transparent;
			color: var(--ink-soft);
		}
		.preview-tabs button.active { border-color: var(--orange); color: var(--ink); }
		.detail-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
		}
		.summary-list { display: grid; gap: .65rem; margin: 0; }
		.summary-list div {
			display: flex;
			justify-content: space-between;
			gap: 1rem;
			padding: .75rem 0;
			border-bottom: 1px solid var(--line);
		}
		.summary-list dt { color: var(--ink-soft); }
		.summary-list dd { margin: 0; text-align: right; font-weight: 500; }
		.text-outline {
			min-height: 160px;
			padding: 1rem;
			border-radius: 14px;
			background: var(--bg-warm);
			white-space: pre-wrap;
		}
		.question-list { display: grid; gap: .85rem; }
		.question-card {
			padding: 1rem;
			border: 1px solid var(--line);
			border-radius: 16px;
			background: var(--bg-warm);
		}
		.question-head { display: flex; justify-content: space-between; gap: 1rem; }
		.answer-box {
			margin: .8rem 0;
			padding: .9rem 1rem;
			border-left: 3px solid var(--bg-soothing);
			border-radius: 0 12px 12px 0;
			background: #fff;
		}
		.modal-overlay {
			position: fixed;
			inset: 0;
			z-index: 300;
			display: grid;
			padding: 1rem;
			place-items: center;
			background: rgba(58, 75, 83, .42);
		}
		.modal-overlay[hidden] { display: none; }
		.modal-box {
			position: relative;
			overflow-y: auto;
			width: min(560px, 94vw);
			max-height: 90vh;
			padding: 1.6rem;
			border-radius: var(--radius-md);
			background: #fff;
			box-shadow: var(--shadow-md);
		}
		.modal-close { position: absolute; top: .8rem; right: 1rem; font-size: 1.7rem; }
		.modal-actions { display: flex; justify-content: flex-end; gap: .65rem; margin-top: 1rem; }
		.discount-quick { display: flex; flex-wrap: wrap; gap: .45rem; }
		.discount-chip {
			padding: .45rem .75rem;
			border-radius: 999px;
			background: var(--blue-soft);
			color: var(--ink);
		}
		.discount-chip.active { background: var(--orange); color: #fff; }
		.qa-search-form {
			display: grid;
			grid-template-columns: minmax(260px, 1.6fr) minmax(210px, .7fr) auto;
			align-items: end;
			gap: 1rem;
			margin-bottom: 1.25rem;
			padding: 1rem 1.1rem;
			border: 1px solid var(--line);
			border-radius: 18px;
			background: rgba(255, 250, 238, .72);
		}
		.qa-filter-group {
			display: grid;
			min-width: 0;
			gap: .45rem;
		}
		.qa-filter-group label {
			color: var(--ink);
			font-size: .88rem;
			font-weight: 700;
		}
		.qa-search-form .field {
			min-height: 48px;
			background: var(--white);
		}
		.qa-search-form .qa-submit {
			min-width: 110px;
			min-height: 48px;
		}
		[data-qa-search-pagination] { margin-top: 1.25rem; }
		[data-qa-search-pagination] > div {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: .45rem;
		}
		[data-qa-search-pagination] a {
			display: inline-flex;
			min-width: 40px;
			min-height: 40px;
			padding: .45rem .75rem;
			align-items: center;
			justify-content: center;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: #fff;
		}
		.payout-stats { grid-template-columns: repeat(3, 1fr); }
		.bar-list { display: grid; gap: .9rem; }
		.bar-row {
			display: grid;
			grid-template-columns: 110px minmax(160px, 1fr) 130px;
			gap: .8rem;
			align-items: center;
		}
		.bar {
			overflow: hidden;
			height: 14px;
			border-radius: 999px;
			background: var(--blue-soft);
		}
		.bar span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--orange); transition: width .5s; }
		.toast {
			position: fixed;
			right: 24px;
			bottom: 88px;
			z-index: 400;
			padding: .75rem 1rem;
			border-radius: 14px;
			background: var(--ink);
			color: #fff;
			box-shadow: var(--shadow-md);
			opacity: 0;
			transform: translateY(8px);
			transition: .2s;
			pointer-events: none;
		}
		.toast.show { opacity: 1; transform: translateY(0); }
	
	
		@media (max-width: 1080px) {
			.stats { grid-template-columns: repeat(2, 1fr); }
			.preview-content { grid-template-columns: 1fr; }
			.preview-check { width: 100%; }
		}
		@media (max-width: 940px) {
			.course-search-form { grid-template-columns: 1fr 1fr; }
			.qa-search-form { grid-template-columns: 1fr 1fr; }
			.qa-search-form .qa-submit {
				grid-column: 1 / -1;
				width: 100%;
			}
		}
		@media (max-width: 700px) {
			.page-main { padding-top: 1.8rem; }
			.page-intro { align-items: flex-start; flex-direction: column; gap: 1rem; }
			.page-intro .btn { width: 100%; }
			.stats { grid-template-columns: 1fr; }
			.tab-panel { padding: 1rem; }
			.course-search-form { grid-template-columns: 1fr; }
			.course-search-form .btn { width: 100%; }
			.form-grid,
			.video-upload-grid,
			.video-grid,
			.detail-grid,
			.preview-hero { grid-template-columns: 1fr; }
			.preview-hero { padding: 1rem; }
			.panel-title-row { flex-direction: column; }
			.qa-search-form { grid-template-columns: 1fr; }
			.qa-search-form .qa-submit { grid-column: auto; }
			.bar-row { grid-template-columns: 1fr; gap: .3rem; }
			.bar-row strong { text-align: right; }
		}
		@media (max-width: 520px) {
			.preview-tabs { overflow-x: auto; }
		}
	
		/* 心理師課程系列頁面共用：第一列標題與說明，第二列功能導覽。 */
		.page-intro-heading {
			min-width: 0;
		}
		.page-intro-description {
			align-self: end;
			justify-self: end;
			width: 100%;
			text-align: right;
		}
		.page-route-panel {
			display: grid;
			grid-column: 1 / -1;
			width: min(48rem, 66.666%);
			max-width: 66.666%;
			gap: .8rem;
			justify-items: stretch;
			margin: .2rem auto 0;
		}
		.page-route-nav {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: .45rem;
			width: 100%;
		}
		.page-route-nav a {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			box-sizing: border-box;
			width: 100%;
			min-width: 0;
			min-height: 48px;
			padding: .65rem .55rem;
			border: 1px solid transparent;
			border-radius: 999px;
			color: var(--ink-soft);
			background: transparent;
			font-size: .9rem;
			font-weight: 500;
			line-height: 1.2;
			text-align: center;
			white-space: nowrap;
			transition: border-color .18s, background .18s, color .18s;
		}
		.page-route-nav a:hover {
			border-color: var(--line);
			color: var(--ink);
			background: var(--white);
		}
		.page-route-nav a.active,
		.page-route-nav a[aria-current="page"] {
			border-color: var(--bg-soothing);
			color: var(--ink);
			background: var(--blue-soft);
		}
		.page-specific-actions {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: flex-end;
			gap: .65rem;
			width: 100%;
		}
		@media (max-width: 1080px) {
			.page-route-panel {
				width: 66.666%;
				max-width: 66.666%;
				justify-items: stretch;
			}
			.page-route-nav {
				width: 100%;
			}
			.page-specific-actions {
				width: 100%;
				justify-content: flex-end;
			}
		}
		@media (max-width: 700px) {
			.page-intro {
				grid-template-columns: 1fr;
			}
			.page-intro-description {
				margin: 0;
			}
			.page-route-panel {
				width: 100%;
				max-width: 100%;
				margin: .2rem 0 0;
			}
			.page-route-nav {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}
			.page-route-nav a {
				white-space: normal;
			}
			.page-specific-actions {
				align-items: stretch;
				flex-direction: column;
			}
			.page-specific-actions > *,
			.page-specific-actions .btn {
				width: 100%;
			}
		}
	</style>
</head>
<body th:with="activePage='qa'">
	<div th:replace="~{fragments/header :: header}"></div>

	<main class="page-main">
		<div class="wrap">
			<section class="page-intro" aria-labelledby="pageTitle">
				<div class="page-intro-heading">
					<span class="eyebrow">心理師中心</span>
					<h1 id="pageTitle">學員提問</h1>
				</div>
				<p class="page-intro-description">查看課程問題；每則提問只能回覆一次。</p>
				<aside class="page-route-panel" aria-label="心理師課程功能">
					<nav class="page-route-nav" aria-label="心理師課程功能導覽">
						<a th:classappend="${activePage == 'courses'} ? ' active' : ''"
							th:href="@{/psych/course/select_course}" href="/psych/course/select_course"
							th:attr="aria-current=${activePage == 'courses'} ? 'page' : null">課程管理</a>
						<a th:classappend="${activePage == 'editor'} ? ' active' : ''"
							th:href="@{/psych/course/add_course}" href="/psych/course/add_course"
							th:attr="aria-current=${activePage == 'editor'} ? 'page' : null">新增／編輯課程</a>
						<a th:classappend="${activePage == 'payout'} ? ' active' : ''"
							th:href="@{/psych/payout/selectPayout}" href="/psych/payout/selectPayout"
							th:attr="aria-current=${activePage == 'payout'} ? 'page' : null">營運與成長</a>
						<a th:classappend="${activePage == 'qa'} ? ' active' : ''"
							th:href="@{/psych/course/psych_qa}" href="/psych/course/psych_qa"
							th:attr="aria-current=${activePage == 'qa'} ? 'page' : null">學員提問</a>
					</nav>
				</aside>
			</section>

			<section class="workspace" aria-labelledby="questionListTitle">
				<div class="tab-panel">
					<div class="panel-title-row">
					<div>
						<h2 id="questionListTitle">提問清單</h2>
						<p class="meta">可依課程或會員搜尋，並依提問時間排序。</p>
					</div>
					</div>

					<form class="qa-search-form" method="get"
						th:action="@{/psych/course/psych_qa}" action="/psych/course/psych_qa"
						data-qa-search-form role="search">
						<div class="qa-filter-group">
							<label for="qaKeyword">搜尋課程或會員</label>
							<input class="field" id="qaKeyword" type="search" name="keyword"
								th:value="${param.keyword != null ? param.keyword[0] : ''}"
								placeholder="輸入課程名稱或會員姓名" />
						</div>

						<div class="qa-filter-group">
							<label for="qaOrderBy">排序方式</label>
							<select class="field" id="qaOrderBy" name="orderBy">
								<option value="courseIdDesc"
									th:selected="${param.orderBy == null or param.orderBy[0] == 'courseId' or param.orderBy[0] == 'courseIdDesc'}">
									提問時間新至舊
								</option>
								<option value="courseIdAsc"
									th:selected="${param.orderBy != null and param.orderBy[0] == 'courseIdAsc'}">
									提問時間舊至新
								</option>
							</select>
						</div>

						<input type="hidden" name="page" value="1" />
						<button class="btn btn-primary qa-submit" type="submit">搜尋</button>
					</form>

					<div class="table-wrap">
					<table>
						<thead>
							<tr>
								<th scope="col">課程／會員</th>
								<th scope="col">提問時間</th>
								<th scope="col">會員提問</th>
								<th scope="col">回覆時間</th>
								<th scope="col">心理師回覆</th>
								<th scope="col">操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:if="${questions == null or questions.isEmpty()}">
								<td class="empty-state" colspan="6">沒有符合搜尋條件的學員提問</td>
							</tr>
							<tr th:each="courseQa : ${questions != null ? questions.content : null}">
								<td>
									<strong th:text="${courseQa.course.courseName}">課程</strong><br />
									<span class="meta" th:text="${courseQa.member.name}">會員</span>
								</td>
								<td class="qa-time"
									th:text="${courseQa.askedAt == null ? '—' : #temporals.format(courseQa.askedAt, 'yyyy-MM-dd HH:mm')}">
									—
								</td>
								<td th:text="${courseQa.courseQuestion}">問題</td>
								<td class="qa-time"
									th:text="${courseQa.answeredAt == null ? '尚未回覆' : #temporals.format(courseQa.answeredAt, 'yyyy-MM-dd HH:mm')}">
									尚未回覆
								</td>
								<td
									th:text="${courseQa.courseAnswer == null ? '尚未回覆' : courseQa.courseAnswer}">
									尚未回覆
								</td>
								<td>
									<form class="stack" th:if="${courseQa.courseAnswer == null}"
										method="post" th:action="@{/psych/course/answer_qa}"
										action="/psych/course/answer_qa">
										<div class="form-group">
											<label class="sr-only"
												th:for="|courseAnswer-${courseQa.questionId}|">心理師回覆</label>
											<textarea class="field"
												th:id="|courseAnswer-${courseQa.questionId}|"
												name="courseAnswer" required></textarea>
										</div>
										<input type="hidden" name="questionId" th:value="${courseQa.questionId}" />
										<button class="btn btn-primary" type="submit">送出回覆</button>
									</form>
									<span class="status" th:if="${courseQa.courseAnswer != null}">已回覆</span>
								</td>
							</tr>
						</tbody>
					</table>
					</div>

					<nav class="pagination-ui" data-qa-search-pagination
						aria-label="學員提問分頁"
						th:if="${questions != null and questions.totalPages > 1}">
						<a class="page-link" th:if="${questions.number > 0}"
							th:href="@{/psych/course/psych_qa(
								page=${questions.number},
								orderBy=${param.orderBy != null ? param.orderBy[0] : null},
								keyword=${param.keyword != null ? param.keyword[0] : null}
							)}" href="?page=1">上一頁</a>
						<a class="page-link" th:each="pageNumber : ${#numbers.sequence(1, questions.totalPages)}"
							th:classappend="${pageNumber == questions.number + 1} ? ' active' : ''"
							th:attr="aria-current=${pageNumber == questions.number + 1} ? 'page' : null"
							th:href="@{/psych/course/psych_qa(
								page=${pageNumber},
								orderBy=${param.orderBy != null ? param.orderBy[0] : null},
								keyword=${param.keyword != null ? param.keyword[0] : null}
							)}" href="?page=1" th:text="${pageNumber}">1</a>
						<a class="page-link"
							th:if="${questions.number + 1 < questions.totalPages}"
							th:href="@{/psych/course/psych_qa(
								page=${questions.number + 2},
								orderBy=${param.orderBy != null ? param.orderBy[0] : null},
								keyword=${param.keyword != null ? param.keyword[0] : null}
							)}" href="?page=2">下一頁</a>
					</nav>
				</div>
			</section>
		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script th:src="@{/js/nav.js}"></script>
	<script th:src="@{/js/course/psych-js.js}"></script>
</body>
</html>
