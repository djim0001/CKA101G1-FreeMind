<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
<head>
<meta charset="UTF-8">
<title>心理師收款資料</title>
<style>
span.error{
color:  red;
font-size: 12px;
}
</style>
</head>
<body>
	<h3>
		<a th:href="@{/}">首頁</a>
	</h3>
	<h3>
		<a th:href="@{/psych/course/add_course}">心理師收款資料</a>
	</h3>
	<form method="post" th:action="@{set_psychId_session}">
		<span>心理師編號：</span> <input type="text" name="psychIdSession" />
		<button type="submit" id="submit">送出</button><br>
		<span class="error" th:text="${pError}"></span>
	</form>
	<div th:if="${session.psychId != null}">
	<table>
		<thead>
			<tr>
				<th>撥款編號</th>
				<th>銷售月份</th>
				<th>心理師編號</th>
				<th>應撥款金額</th>
				<th>平台抽成金額</th>
				<th>退款扣除</th>
				<th>實際撥款金額</th>
				<th>撥款時間</th>
				<th>撥款狀態</th>
			</tr>
		</thead>
		<tbody>
			<!-- 情況一：如果是用「會員編號」查出來的多筆訂單列表 (orders) -->
			<th:block th:if="${allPayout != null}"> 
				<tr th:each="onePayout : ${allPayout}">
					<td th:text="${onePayout.payoutId}"></td>
					<td th:text="${onePayout.billingMonth}"></td>
					<td th:text="${onePayout.psychologist.psychId}"></td>
					<td th:text="${onePayout.grossPayoutAmount}"></td>
					<td th:text="${onePayout.platformCommission}"></td>
					<td th:text="${onePayout.billingOffset}"></td>
					<td th:text="${onePayout.netPayoutAmount}"></td>
					<td th:text="${onePayout.paidAt}"></td>
					<td th:text="${onePayout.payoutStatusText}"></td>
					
				
				
				
<!-- 					付款方式判斷 -->
<!-- 					<td th:text="${order.paymentMethod == 0 ? '信用卡支付' : '第三方支付'}"></td> -->
<!-- 					付款狀態判斷 -->
<!-- 					<td> -->
<!-- 						<span th:if="${order.paymentStatus == 1}" class="status-paid">已付款</span> -->
<!-- 						<span th:if="${order.paymentStatus == 0}" class="status-unpaid">未付款</span> -->
<!-- 					</td> -->
<!-- 					<td th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm:ss')}"></td> -->
				</tr>
			</th:block>

			
		
		</tbody>
	</table>
	
	</div>
	
	
</body>
</html>
