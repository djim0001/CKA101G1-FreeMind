<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>課程詳情｜心理師中心｜諮由自在 Free Mind</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
	<style>
	/* 共用字體、色票、頁寬、Header、Footer 與按鈕基礎由 styles.css 提供。 */
	input, select, textarea { font: inherit; }

	/* 課程管理內容。 */
		.page-main { padding: 2.6rem 0 4.5rem; }
		.page-intro {
			display: grid;
			grid-template-columns: minmax(13rem, .72fr) minmax(0, 1.28fr);
			align-items: end;
			gap: .75rem 2rem;
			margin-bottom: 1.6rem;
			padding: 0 .3rem 1.5rem;
			border-bottom: 1px solid var(--line);
		}
		.page-intro h1 {
			overflow: hidden;
			margin: 0;
			font-family: var(--serif);
			font-size: clamp(1.75rem, 3vw, 2.6rem);
			line-height: 1.2;
			letter-spacing: 0;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.page-intro p {
			max-width: none;
			margin: 0 0 .15rem;
			color: var(--ink-soft);
			font-size: 1rem;
		}
		.page-main .btn,
		.modal-overlay .btn {
			justify-content: center;
			min-height: 44px;
			border: 1px solid transparent;
			white-space: nowrap;
		}
		.btn-secondary { border: 1px solid var(--line); background: #fff; color: var(--ink); }
		.btn-secondary:hover { border-color: var(--bg-soothing); background: var(--blue-soft); }
		.stats {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 1rem;
			margin-bottom: 1.25rem;
		}
		.stat {
			position: relative;
			overflow: hidden;
			min-height: 118px;
			padding: 1.35rem 1.45rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}
		.stat::after {
			content: "";
			position: absolute;
			right: -28px;
			bottom: -38px;
			width: 92px;
			height: 92px;
			border-radius: 50%;
			background: var(--pink-soft);
		}
		.stat:nth-child(even)::after { background: var(--blue-soft); }
		.stat span { position: relative; z-index: 1; color: var(--ink-soft); font-size: .9rem; }
		.stat strong {
			position: relative;
			z-index: 1;
			display: block;
			margin-top: .2rem;
			font-family: var(--serif);
			font-size: 2rem;
			line-height: 1.2;
		}
		.workspace {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: var(--radius-lg);
			background: var(--white);
			box-shadow: var(--shadow-md);
		}
		.tabs {
			display: flex;
			gap: .35rem;
			padding: 1rem 1.2rem 0;
			border-bottom: 1px solid var(--line);
			background: rgba(220, 234, 245, .22);
		}
		.tabs button {
			position: relative;
			padding: .8rem 1.25rem .95rem;
			font-weight: 500;
			color: var(--ink-soft);
		}
		.tabs button::after {
			content: "";
			position: absolute;
			right: 1rem;
			bottom: -1px;
			left: 1rem;
			height: 3px;
			border-radius: 999px 999px 0 0;
			background: transparent;
		}
		.tabs button:hover,
		.tabs button.active { color: var(--ink); }
		.tabs button.active::after { background: var(--orange); }
		.tab-panel { padding: 1.5rem; }
		.course-search-form {
			display: grid;
			grid-template-columns: minmax(240px, 1.5fr) minmax(145px, .65fr) minmax(145px, .65fr) auto;
			gap: .75rem;
			margin-bottom: 1.25rem;
		}
		.field {
			width: 100%;
			min-height: 46px;
			padding: .68rem .95rem;
			border: 1px solid var(--line);
			border-radius: 14px;
			outline: none;
			background: #fff;
			color: var(--ink);
			transition: border-color .18s, box-shadow .18s;
		}
		.field:focus { border-color: var(--bg-soothing); box-shadow: 0 0 0 4px rgba(194, 217, 237, .28); }
		.table-wrap {
			overflow-x: auto;
			border: 1px solid var(--line);
			border-radius: 18px;
		}
		table { width: 100%; border-collapse: collapse; min-width: 830px; }
		th, td { padding: 1rem 1.05rem; text-align: left; vertical-align: middle; }
		th {
			border-bottom: 1px solid var(--line);
			background: var(--bg-warm);
			font-size: .84rem;
			font-weight: 700;
			color: var(--ink-soft);
			white-space: nowrap;
		}
		td { border-bottom: 1px solid rgba(236, 223, 206, .72); font-size: .92rem; }
		tbody tr:last-child td { border-bottom: 0; }
		tbody tr:hover { background: rgba(220, 234, 245, .16); }
		.course-summary { display: flex; flex-direction: column; gap: .12rem; min-width: 175px; }
		.course-summary strong { font-family: var(--serif); font-size: 1rem; }
		.meta { color: var(--ink-soft); font-size: .83rem; }
		.status {
			display: inline-flex;
			align-items: center;
			min-height: 31px;
			padding: .26rem .75rem;
			border-radius: 999px;
			background: var(--blue-soft);
			font-size: .82rem;
			font-weight: 500;
			white-space: nowrap;
		}
		.inline-form { display: inline-flex; margin: 0; }
		.empty-state {
			padding: 3.4rem 1rem;
			text-align: center;
			color: var(--ink-soft);
		}
		[data-course-search-pagination] { margin-top: 1.25rem; }
		.pagination-ui,
		[data-course-search-pagination] > div {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: .45rem;
		}
		.pagination-ui a,
		[data-course-search-pagination] a {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-width: 40px;
			min-height: 40px;
			padding: .45rem .75rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: #fff;
			color: var(--ink-soft);
			transition: background .18s, color .18s, border-color .18s;
		}
		.pagination-ui a:hover,
		.pagination-ui a.active,
		.pagination-ui .active a,
		[data-course-search-pagination] a:hover {
			border-color: var(--bg-soothing);
			background: var(--blue-soft);
			color: var(--ink);
		}
	
		/* 心理師課程子頁共用元件。 */
		.stack { display: grid; gap: 1rem; }
		.panel {
			padding: 1.5rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}
		.panel h2,
		.panel h3 { margin-top: 0; font-family: var(--serif); }
		.panel h2 { margin-bottom: 1rem; font-size: 1.3rem; }
		.panel h3 { margin-bottom: .45rem; font-size: 1.05rem; }
		.panel-title-row {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 1rem;
			margin-bottom: 1rem;
		}
		.panel-title-row h2,
		.panel-title-row p { margin: 0; }
		.page-actions { display: flex; flex-wrap: wrap; gap: .65rem; align-items: center; }
		.form-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
		}
		.form-group { display: grid; gap: .4rem; }
		.form-group.full { grid-column: 1 / -1; }
		.form-group label { font-weight: 500; }
		textarea.field { min-height: 118px; resize: vertical; }
		.outline-field { min-height: 240px; }
		.required,
		.error { color: var(--orange-deep); }
		.error { font-size: .82rem; }
		.form-note { color: var(--ink-soft); font-size: .82rem; }
		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.state-flow {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: .55rem;
			padding: 1rem 1.2rem;
			border: 1px solid var(--line);
			border-radius: 18px;
			background: rgba(220, 234, 245, .28);
		}
		.state-flow span {
			padding: .35rem .8rem;
			border-radius: 999px;
			background: #fff;
			color: var(--ink-soft);
			font-size: .84rem;
		}
		.state-flow span.active { background: var(--blue-soft); color: var(--ink); font-weight: 700; }
		.state-flow i { color: var(--orange); font-style: normal; }
		.state-flow small { flex-basis: 100%; color: var(--ink-soft); }
		.video-upload-grid,
		.video-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
		}
		.video-upload-card,
		.video-card {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 18px;
			background: var(--bg-warm);
		}
		.upload-heading {
			display: flex;
			align-items: center;
			gap: .8rem;
			padding: 1rem;
		}
		.upload-heading h3,
		.upload-heading p { margin: 0; }
		.upload-heading p { color: var(--ink-soft); font-size: .82rem; }
		.upload-heading strong { margin-left: auto; color: var(--orange-deep); font-size: .8rem; }
		.upload-icon {
			display: grid;
			width: 38px;
			height: 38px;
			place-items: center;
			border-radius: 50%;
			background: var(--pink-soft);
			color: var(--orange-deep);
		}
		.upload-dropzone {
			display: grid;
			min-height: 112px;
			margin: 0 1rem 1rem;
			place-content: center;
			border: 1px dashed var(--bg-soothing);
			border-radius: 14px;
			background: #fff;
			text-align: center;
			cursor: pointer;
		}
		.upload-dropzone span { color: var(--orange-deep); font-weight: 500; }
		.upload-dropzone small { color: var(--ink-soft); }
		.uploaded-preview,
		.video-card video { width: 100%; background: #26343a; }
		.video-card h3 { margin: 0; padding: 1rem; }
		.locked-message {
			padding: 1rem;
			border-radius: 14px;
			background: var(--bg-warm);
			color: var(--ink-soft);
		}
		.status.warning { background: #fff0c8; }
		.status.danger { background: var(--pink-soft); color: var(--orange-deep); }
		.preview-hero {
			display: grid;
			grid-template-columns: minmax(0, .9fr) minmax(280px, 1.1fr);
			gap: 1.5rem;
			margin-bottom: 1.25rem;
			padding: 1.5rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-lg);
			background: var(--white);
			box-shadow: var(--shadow-md);
		}
		.cover-mock {
			display: grid;
			min-height: 260px;
			padding: 2rem;
			place-content: center;
			border-radius: var(--radius-md);
			background: linear-gradient(145deg, var(--blue-soft), var(--pink-soft));
			text-align: center;
		}
		.cover-mock span { color: var(--ink-soft); font-size: .85rem; }
		.cover-mock strong { font-family: var(--serif); font-size: 1.45rem; }
		.preview-summary { align-self: center; }
		.preview-summary h1 { margin: .35rem 0 1rem; font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.6rem); }
		.price-preview {
			display: grid;
			gap: .15rem;
			padding: 1rem 1.2rem;
			border-radius: 16px;
			background: var(--bg-warm);
		}
		.price-preview strong { color: var(--orange-deep); font-size: 1.45rem; }
		.price-preview small { color: var(--ink-soft); }
		.preview-content {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 260px;
			gap: 1rem;
			margin-bottom: 1rem;
		}
		.preview-main,
		.preview-check {
			padding: 1.4rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}
		.preview-check { align-self: start; }
		.preview-check .btn { width: 100%; margin-top: .6rem; }
		.preview-side {
			display: grid;
			align-content: start;
			gap: 1rem;
			min-width: 0;
		}
		.course-management-actions {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: .65rem;
		}
		.course-management-actions .inline-form,
		.course-management-actions .btn {
			width: 100%;
		}
		.preview-tabs {
			display: flex;
			gap: .35rem;
			margin: -1.4rem -1.4rem 1.3rem;
			padding: .8rem 1rem 0;
			border-bottom: 1px solid var(--line);
			background: rgba(220, 234, 245, .22);
		}
		.preview-tabs button {
			padding: .7rem .9rem;
			border-bottom: 3px solid transparent;
			color: var(--ink-soft);
		}
		.preview-tabs button.active { border-color: var(--orange); color: var(--ink); }
		.detail-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
		}
		.summary-list { display: grid; gap: .65rem; margin: 0; }
		.summary-list div {
			display: flex;
			justify-content: space-between;
			gap: 1rem;
			padding: .75rem 0;
			border-bottom: 1px solid var(--line);
		}
		.summary-list dt { color: var(--ink-soft); }
		.summary-list dd { margin: 0; text-align: right; font-weight: 500; }
		.text-outline {
			min-height: 160px;
			padding: 1rem;
			border-radius: 14px;
			background: var(--bg-warm);
			white-space: pre-wrap;
		}
		.question-list { display: grid; gap: .85rem; }
		.question-card {
			padding: 1rem;
			border: 1px solid var(--line);
			border-radius: 16px;
			background: var(--bg-warm);
		}
		.question-head { display: flex; justify-content: space-between; gap: 1rem; }
		.answer-box {
			margin: .8rem 0;
			padding: .9rem 1rem;
			border-left: 3px solid var(--bg-soothing);
			border-radius: 0 12px 12px 0;
			background: #fff;
		}
		.modal-overlay {
			position: fixed;
			inset: 0;
			z-index: 300;
			display: grid;
			padding: 1rem;
			place-items: center;
			background: rgba(58, 75, 83, .42);
		}
		.modal-overlay[hidden] { display: none; }
		.modal-box {
			position: relative;
			overflow-y: auto;
			width: min(560px, 94vw);
			max-height: 90vh;
			padding: 1.6rem;
			border-radius: var(--radius-md);
			background: #fff;
			box-shadow: var(--shadow-md);
		}
		.modal-close { position: absolute; top: .8rem; right: 1rem; font-size: 1.7rem; }
		.modal-actions { display: flex; justify-content: flex-end; gap: .65rem; margin-top: 1rem; }
		.discount-quick { display: flex; flex-wrap: wrap; gap: .45rem; }
		.discount-chip {
			padding: .45rem .75rem;
			border-radius: 999px;
			background: var(--blue-soft);
			color: var(--ink);
		}
		.discount-chip.active { background: var(--orange); color: #fff; }
		.qa-search-form {
			display: grid;
			grid-template-columns: minmax(220px, 1fr) minmax(180px, .4fr) auto;
			gap: .75rem;
			margin-bottom: 1rem;
		}
		[data-qa-search-pagination] { margin-top: 1.25rem; }
		[data-qa-search-pagination] > div {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: .45rem;
		}
		[data-qa-search-pagination] a {
			display: inline-flex;
			min-width: 40px;
			min-height: 40px;
			padding: .45rem .75rem;
			align-items: center;
			justify-content: center;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: #fff;
		}
		.payout-stats { grid-template-columns: repeat(3, 1fr); }
		.bar-list { display: grid; gap: .9rem; }
		.bar-row {
			display: grid;
			grid-template-columns: 110px minmax(160px, 1fr) 130px;
			gap: .8rem;
			align-items: center;
		}
		.bar {
			overflow: hidden;
			height: 14px;
			border-radius: 999px;
			background: var(--blue-soft);
		}
		.bar span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--orange); transition: width .5s; }
		.toast {
			position: fixed;
			right: 24px;
			bottom: 88px;
			z-index: 400;
			padding: .75rem 1rem;
			border-radius: 14px;
			background: var(--ink);
			color: #fff;
			box-shadow: var(--shadow-md);
			opacity: 0;
			transform: translateY(8px);
			transition: .2s;
			pointer-events: none;
		}
		.toast.show { opacity: 1; transform: translateY(0); }
	
	
		@media (max-width: 1080px) {
			.stats { grid-template-columns: repeat(2, 1fr); }
			.preview-content { grid-template-columns: 1fr; }
			.preview-check { width: 100%; }
		}
		@media (max-width: 940px) {
			.course-search-form { grid-template-columns: 1fr 1fr; }
			.qa-search-form { grid-template-columns: 1fr 1fr; }
			.qa-search-form .btn { grid-column: 1 / -1; }
		}
		@media (max-width: 700px) {
			.page-main { padding-top: 1.8rem; }
			.page-intro { align-items: flex-start; flex-direction: column; gap: 1rem; }
			.page-intro .btn { width: 100%; }
			.stats { grid-template-columns: 1fr; }
			.tab-panel { padding: 1rem; }
			.course-search-form { grid-template-columns: 1fr; }
			.course-search-form .btn { width: 100%; }
			.form-grid,
			.video-upload-grid,
			.video-grid,
			.detail-grid,
			.preview-hero { grid-template-columns: 1fr; }
			.preview-hero { padding: 1rem; }
			.panel-title-row { flex-direction: column; }
			.qa-search-form { grid-template-columns: 1fr; }
			.qa-search-form .btn { grid-column: auto; }
			.bar-row { grid-template-columns: 1fr; gap: .3rem; }
			.bar-row strong { text-align: right; }
		}
		@media (max-width: 520px) {
			.preview-tabs { overflow-x: auto; }
		}
	
		/* 心理師課程系列頁面共用：第一列標題與說明，第二列功能導覽。 */
		.page-intro-heading {
			min-width: 0;
		}
		.page-intro-description {
			align-self: end;
			justify-self: end;
			width: 100%;
			text-align: right;
		}
		.page-route-panel {
			display: grid;
			grid-column: 1 / -1;
			width: min(48rem, 66.666%);
			max-width: 66.666%;
			gap: .8rem;
			justify-items: stretch;
			margin: .2rem auto 0;
		}
		.page-route-nav {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: .45rem;
			width: 100%;
		}
		.page-route-nav a {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			box-sizing: border-box;
			width: 100%;
			min-width: 0;
			min-height: 48px;
			padding: .65rem .55rem;
			border: 1px solid transparent;
			border-radius: 999px;
			color: var(--ink-soft);
			background: transparent;
			font-size: .9rem;
			font-weight: 500;
			line-height: 1.2;
			text-align: center;
			white-space: nowrap;
			transition: border-color .18s, background .18s, color .18s;
		}
		.page-route-nav a:hover {
			border-color: var(--line);
			color: var(--ink);
			background: var(--white);
		}
		.page-route-nav a.active,
		.page-route-nav a[aria-current="page"] {
			border-color: var(--bg-soothing);
			color: var(--ink);
			background: var(--blue-soft);
		}
		.page-specific-actions {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: flex-end;
			gap: .65rem;
			width: 100%;
		}
		@media (max-width: 1080px) {
			.page-route-panel {
				width: 66.666%;
				max-width: 66.666%;
				justify-items: stretch;
			}
			.page-route-nav {
				width: 100%;
			}
			.page-specific-actions {
				width: 100%;
				justify-content: flex-end;
			}
		}
		@media (max-width: 700px) {
			.page-intro {
				grid-template-columns: 1fr;
			}
			.page-intro-description {
				margin: 0;
			}
			.page-route-panel {
				width: 100%;
				max-width: 100%;
				margin: .2rem 0 0;
			}
			.page-route-nav {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}
			.page-route-nav a {
				white-space: normal;
			}
			.page-specific-actions {
				align-items: stretch;
				flex-direction: column;
			}
			.page-specific-actions > *,
			.page-specific-actions .btn {
				width: 100%;
			}
		}
	</style>
</head>
<body th:with="activePage='courses'">
	<div th:replace="~{fragments/header :: header}"></div>

	<main class="page-main">
		<div class="wrap">
			<section class="page-intro" aria-labelledby="pageTitle">
				<div class="page-intro-heading">
					<span class="eyebrow">心理師中心</span>
					<h1 id="pageTitle" th:text="${course.courseName}">課程名稱</h1>
				</div>
				<p class="page-intro-description">
					<span th:text="${course.courseCategories.courseCatName}">分類</span>・心理師預覽模式
				</p>
				<aside class="page-route-panel" aria-label="心理師課程功能">
					<nav class="page-route-nav" aria-label="心理師課程功能導覽">
						<a th:classappend="${activePage == 'courses'} ? ' active' : ''"
							th:href="@{/psych/course/select_course}" href="/psych/course/select_course"
							th:attr="aria-current=${activePage == 'courses'} ? 'page' : null">課程管理</a>
						<a th:classappend="${activePage == 'editor'} ? ' active' : ''"
							th:href="@{/psych/course/add_course}" href="/psych/course/add_course"
							th:attr="aria-current=${activePage == 'editor'} ? 'page' : null">新增／編輯課程</a>
						<a th:classappend="${activePage == 'payout'} ? ' active' : ''"
							th:href="@{/psych/payout/selectPayout}" href="/psych/payout/selectPayout"
							th:attr="aria-current=${activePage == 'payout'} ? 'page' : null">營運與成長</a>
						<a th:classappend="${activePage == 'qa'} ? ' active' : ''"
							th:href="@{/psych/course/psych_qa}" href="/psych/course/psych_qa"
							th:attr="aria-current=${activePage == 'qa'} ? 'page' : null">學員提問</a>
					</nav>
				</aside>
			</section>

			<section class="workspace" aria-label="課程詳情工作區">
				<div class="tab-panel stack">
					<section class="preview-hero" aria-label="課程摘要">
				<div class="cover-mock">
					<span>課程封面預覽</span>
					<strong th:text="${course.courseName}">課程名稱</strong>
				</div>
				<div class="preview-summary">
					<span class="status" th:text="${course.courseStatusText}">狀態</span>
					<p class="eyebrow" th:text="${course.courseCategories.courseCatName}">分類</p>
					<h1 th:text="${course.courseName}">課程名稱</h1>
					<div class="price-preview">
						<span>課程原價</span>
						<strong>NT$ <span th:text="${course.price}">0</span></strong>
						<small
							th:text="${course.psychDiscount == null ? '目前無折扣' : '目前折扣：' + course.psychDiscount}">
							目前無折扣
						</small>
					</div>
				</div>
					</section>

					<section class="preview-content" aria-label="課程內容與操作">
				<article class="preview-main">
					<div class="preview-tabs" role="tablist" aria-label="課程內容">
						<button class="active" id="introTab" type="button" data-preview-tab="intro"
							role="tab" aria-selected="true" aria-controls="introPanel">課程資訊</button>
						<button id="outlineTab" type="button" data-preview-tab="outline"
							role="tab" aria-selected="false" aria-controls="outlinePanel">內容大綱</button>
						<button id="videoTab" type="button" data-preview-tab="video"
							role="tab" aria-selected="false" aria-controls="videoPanel">課程影片</button>
					</div>

					<div id="introPanel" data-preview-panel="intro"
						role="tabpanel" aria-labelledby="introTab">
						<h2>課程資訊</h2>
						<div class="detail-grid">
							<dl class="summary-list">
								<div>
									<dt>收藏次數</dt>
									<dd th:text="${course.saveCount}">0</dd>
								</div>
								<div>
									<dt>評價次數</dt>
									<dd th:text="${course.reviewCount}">0</dd>
								</div>
								<div>
									<dt>總星數</dt>
									<dd th:text="${course.starCount}">0</dd>
								</div>
								<div>
									<dt>提問次數</dt>
									<dd th:text="${course.commentCount}">0</dd>
								</div>
							</dl>
							<dl class="summary-list">
								<div th:if="${course.courseStatus == 4}">
									<dt>上架時間</dt>
									<dd th:text="${#temporals.format(course.listedAt,'yyyy年MM月dd日 HH:mm')}">—</dd>
								</div>
								<div th:if="${course.courseStatus == 5}">
									<dt>下架時間</dt>
									<dd th:text="${#temporals.format(course.delistedAt,'yyyy年MM月dd日 HH:mm')}">—</dd>
								</div>
								<div th:if="${course.courseStatus == 5}">
									<dt>下架原因</dt>
									<dd th:text="${course.delistReason.label}">—</dd>
								</div>
								<div th:if="${course.psychDiscount != null}">
									<dt>折扣期間</dt>
									<dd>
										<span
											th:text="${#temporals.format(course.discountStart,'yyyy年MM月dd日')}">—</span>
										至
										<span
											th:text="${#temporals.format(course.discountEnd,'yyyy年MM月dd日')}">—</span>
									</dd>
								</div>
							</dl>
						</div>
					</div>

					<div id="outlinePanel" data-preview-panel="outline"
						role="tabpanel" aria-labelledby="outlineTab" hidden>
						<h2>純文字內容大綱</h2>
						<div class="text-outline" th:text="${course.outline}">課程大綱</div>
					</div>

					<div id="videoPanel" data-preview-panel="video"
						role="tabpanel" aria-labelledby="videoTab" hidden>
						<h2>課程影片</h2>
						<div class="video-grid">
							<div class="video-card">
								<h3>完整課程影片</h3>
								<video controls>
									<source th:src="@{${course.videoSrc}}" type="video/mp4" />
								</video>
							</div>
							<div class="video-card">
								<h3>課程預覽影片</h3>
								<video controls>
									<source th:src="@{${course.videoSrcPre}}" type="video/mp4" />
								</video>
							</div>
						</div>
					</div>
				</article>

				<div class="preview-side">
					<aside class="preview-check">
						<h3>課程操作</h3>
						<p>課程下架僅能由管理員執行。</p>
						<form th:if="${course.canAddPsychDiscount()}" method="post"
							th:action="@{discount_model_box}" action="discount_model_box">
							<input type="hidden" name="courseId" th:value="${course.courseId}" />
							<button class="btn btn-primary" type="submit">設定心理師折扣</button>
						</form>
						<button class="btn btn-secondary" type="button"
							th:if="${!course.canAddPsychDiscount()}" disabled>目前無法設定折扣</button>
					</aside>
					<div class="course-management-actions" aria-label="課程編輯與送審">
						<form class="inline-form"
							th:if="${course.courseStatus == 0 or course.courseStatus == 3}"
							method="post" th:action="@{/psych/course/update_course}"
							action="/psych/course/update_course">
							<input type="hidden" name="courseId" th:value="${course.courseId}" />
							<button class="btn btn-secondary" type="submit">修改課程</button>
						</form>
						<form class="inline-form"
							th:if="${course.courseStatus == 0 or course.courseStatus == 3}"
							method="post" th:action="@{/psych/course/submit_course}"
							action="/psych/course/submit_course"
							data-confirm-form="送審後課程資料與原價會暫時鎖定，確定送出？">
							<input type="hidden" name="courseId" th:value="${course.courseId}" />
							<button class="btn btn-primary" type="submit">送出審核</button>
						</form>
					</div>
				</div>
					</section>

					<section class="panel" aria-labelledby="questionTitle">
				<div class="panel-title-row">
					<div>
						<h2 id="questionTitle">學員提問</h2>
						<p class="meta">一則提問只能由此課程的心理師回覆一次。</p>
					</div>
					<a class="btn btn-secondary" th:href="@{/psych/course/psych_qa}"
						href="/psych/course/psych_qa">查看全部提問</a>
				</div>
				<div class="question-list">
					<article class="question-card" th:each="comment : ${courseQuestions}">
						<div class="question-head">
							<strong th:text="${comment.member.name}">會員</strong>
							<span class="status"
								th:text="${comment.courseAnswer == null ? '待回覆' : '已回覆'}">狀態</span>
						</div>
						<p th:text="${comment.courseQuestion}">問題</p>
						<div class="answer-box" th:if="${comment.courseAnswer != null}">
							<strong>
								<span th:text="${comment.course.psychologist.name}">心理師</span>
								心理師回覆
							</strong>
							<p th:text="${comment.courseAnswer}">回覆</p>
						</div>
						<form class="stack" th:if="${comment.courseAnswer == null}"
							method="post" th:action="@{/psych/course/answer_course}"
							action="/psych/course/answer_course">
							<div class="form-group">
								<label th:for="|answer-${comment.questionId}|">心理師回覆</label>
								<textarea class="field" th:id="|answer-${comment.questionId}|"
									name="courseAnswer" required></textarea>
								<span class="error" th:text="${answerMsg}"></span>
							</div>
							<input type="hidden" name="questionId" th:value="${comment.questionId}" />
							<input type="hidden" name="courseId" th:value="${comment.course.courseId}" />
							<input type="hidden" name="returnUrl" />
							<button class="btn btn-primary" type="submit">送出回覆</button>
						</form>
					</article>
				</div>
					</section>
				</div>
			</section>
		</div>
	</main>

	<div class="modal-overlay" id="psychDiscountModal"
		th:if="${psychDiscountMsg == 'show'}" role="dialog" aria-modal="true"
		aria-labelledby="discountModalTitle">
		<div class="modal-box">
			<button class="modal-close" type="button" data-close-discount
				aria-label="關閉折扣設定">×</button>
			<h2 id="discountModalTitle">設定心理師折扣</h2>
			<form method="post" th:action="@{update_psych_discount}"
				action="update_psych_discount" th:object="${psychDiscountForm}">
				<div class="form-group">
					<label for="psychDiscount">折扣額度 <span class="required">＊</span></label>
					<div class="discount-quick">
						<button class="discount-chip" type="button" data-discount-rate="0.95">九五折</button>
						<button class="discount-chip" type="button" data-discount-rate="0.9">九折</button>
						<button class="discount-chip" type="button" data-discount-rate="0.85">八五折</button>
						<button class="discount-chip" type="button" data-discount-rate="0.8">八折</button>
						<button class="discount-chip" type="button" data-discount-rate="0.75">七五折</button>
					</div>
					<select id="psychDiscount" class="field"
						th:field="*{psychDiscount}" data-psych-discount-input required>
						<option value="">請選擇折扣</option>
						<option value="0.95">九五折</option>
						<option value="0.9">九折</option>
						<option value="0.85">八五折</option>
						<option value="0.8">八折</option>
						<option value="0.75">七五折</option>
						<option value="0.7">七折</option>
						<option value="0.65">六五折</option>
						<option value="0.6">六折</option>
						<option value="0.55">五五折</option>
						<option value="0.5">五折</option>
						<option value="0.45">四五折</option>
						<option value="0.4">四折</option>
						<option value="0.35">三五折</option>
						<option value="0.3">三折</option>
						<option value="0.25">二五折</option>
						<option value="0.2">二折</option>
						<option value="0.15">一五折</option>
						<option value="0.1">一折</option>
					</select>
					<span class="error" th:if="${#fields.hasErrors('psychDiscount')}"
						th:errors="*{psychDiscount}"></span>
				</div>

				<div class="form-group">
					<label for="discountMonth">折扣時間（月）</label>
					<input id="discountMonth" class="field" type="number"
						name="discountMonth" min="1" value="3" required />
					<span class="error" th:if="${#fields.hasErrors('discountMonth')}"
						th:errors="*{discountMonth}"></span>
				</div>

				<div class="form-group">
					<label for="discountStart">折扣開始日期</label>
					<input id="discountStart" class="field" type="date"
						th:field="*{discountStart}" data-discount-start required />
					<span class="form-note">最早從隔日起算。</span>
					<span class="error" th:if="${#fields.hasErrors('discountStart')}"
						th:errors="*{discountStart}"></span>
				</div>

				<input type="hidden" name="courseId" th:value="${course.courseId}" />
				<div class="modal-actions">
					<button class="btn btn-secondary" type="button" data-close-discount>取消</button>
					<button class="btn btn-primary" type="submit">儲存折扣</button>
				</div>
			</form>
		</div>
	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script th:src="@{/js/nav.js}"></script>
	<script th:src="@{/js/course/psych-js.js}"></script>
</body>
</html>
