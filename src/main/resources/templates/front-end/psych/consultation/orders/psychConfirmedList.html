<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>已確認訂單列表</title>
</head>
<body>
	<h3>心理師編號 <span th:text="${psychId}"></span> 的已確認訂單</h3>

	<table border="1">
		<tr>
			<th>訂單編號</th>
			<th>會員編號</th>
			<th>開始時間</th>
			<th>結束時間</th>
			<th>來訪目的</th>
			<th>來訪目的備註</th>
			<th>操作</th>
		</tr>
		<tr th:each="order : ${ordersListData}">
			<td th:text="${order.orderId}"></td>
			<td th:text="${order.member.memberId}"></td>
			<td th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
			<td th:text="${#temporals.format(order.consEnd, 'yyyy-MM-dd HH:mm')}"></td>
			<td th:text="${order.visitPurpose}"></td>
			<td th:text="${order.visitPurposeNote}"></td>
			<td>
				<form method="post" th:action="@{/orders/complete}">
					<input type="hidden" name="orderId" th:value="${order.orderId}">
					<input type="hidden" name="psychId" th:value="${psychId}">
					晤談筆記：<br>
					<textarea name="psychNote" rows="3" cols="30" style="resize:none;" placeholder="這次諮商的重點記錄，會員將能看到"></textarea><br>
					<input type="submit" value="送出"
						onclick="return confirm('確定這次諮商已經結束了嗎？')">
				</form>
			</td>
		</tr>
	</table>

	<a th:href="@{/orders/psychConfirmedForm}">重新查詢</a>

</body>
</html>
