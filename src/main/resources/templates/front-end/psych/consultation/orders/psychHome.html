<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>心理師預約管理</title>
<style>
    body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        margin: 30px;
        color: #333;
    }
    h3 {
        margin-bottom: 20px;
    }
    .menu {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 320px;
    }
    .menu a {
        display: block;
        padding: 14px 18px;
        background-color: #f2f2f2;
        border-radius: 6px;
        text-decoration: none;
        color: #333;
        font-size: 1rem;
        transition: background-color 0.15s;
    }
    .menu a:hover {
        background-color: #e0e0e0;
    }
</style>
</head>
<body>
	<h3>心理師預約管理</h3>

	<div class="menu">
		<a th:href="@{/psych/slots/manageSlotsForm}">預約時段表（單日調整）</a>
		<a th:href="@{/psych/slots/templateForm}">設定固定範本</a>
		<a th:href="@{/psych/orders/psychOrdersForm}">預約狀態</a>
		<a th:href="@{/psych/orders/psychHistoryForm}">歷史諮商紀錄</a>
		<a th:href="@{/psych/orders/psychCancelledForm}">取消紀錄</a>
		<a th:href="@{/psych/orders/psychReviews}">查看評價</a>
	</div>

</body>
</html>
