<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>我的訂單管理</title>
</head>
<body>
	<h3>心理師編號 <span th:text="${psychId}"></span> 的訂單管理</h3>

	<table border="1">
		<tr>
			<th>訂單編號</th>
			<th>會員編號</th>
			<th>開始時間</th>
			<th>結束時間</th>
			<th>來訪目的</th>
			<th>來訪目的備註</th>
			<th>狀態</th>
			<th>晤談筆記</th>
		</tr>
		<tr th:each="order : ${ordersListData}">
			<td th:text="${order.orderId}"></td>
			<td th:text="${order.member.memberId}"></td>
			<td th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
			<td th:text="${#temporals.format(order.consEnd, 'yyyy-MM-dd HH:mm')}"></td>
			<td th:text="${order.visitPurpose}"></td>
			<td th:text="${order.visitPurposeNote}"></td>
			<td th:switch="${order.orderStatus}">
				<span th:case="0">待確認</span>
				<span th:case="1">已確認</span>
			</td>
			<td>
				<!-- 待確認：顯示同意/拒絕 -->
				<div th:if="${order.orderStatus == 0}">
					<form method="post" th:action="@{/orders/approve}" style="display:inline;">
						<input type="hidden" name="orderId" th:value="${order.orderId}">
						<input type="hidden" name="psychId" th:value="${psychId}">
						<input type="submit" value="同意">
					</form>
					<form method="post" th:action="@{/orders/reject}" style="display:inline;">
						<input type="hidden" name="orderId" th:value="${order.orderId}">
						<input type="hidden" name="psychId" th:value="${psychId}">
						<input type="submit" value="拒絕"
							onclick="return confirm('確定要拒絕這筆訂單嗎？拒絕後時段將重新開放。')">
					</form>
				</div>

				<!-- 已確認：顯示填筆記+標記完成 -->
				<div th:if="${order.orderStatus == 1}">
					<form method="post" th:action="@{/orders/complete}">
						<input type="hidden" name="orderId" th:value="${order.orderId}">
						<input type="hidden" name="psychId" th:value="${psychId}">
						<textarea name="psychNote" rows="3" cols="30" style="resize:none;" placeholder="這次諮商的重點記錄，會員將能看到"></textarea><br>
						<input type="submit" value="標記為已完成"
							onclick="return confirm('確定這次諮商已經結束了嗎？')">
					</form>
				</div>
			</td>
		</tr>
	</table>

	<a th:href="@{/orders/psychOrdersForm}">重新查詢</a>

</body>
</html>
