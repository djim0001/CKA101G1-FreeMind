<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>歷史諮商紀錄</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
        color: #333;
    }

    .card {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        padding: 36px 40px;
    }

    h3 {
        font-size: 22px;
        color: #4a3e3e;
        margin: 0 0 20px;
        padding-bottom: 14px;
        border-bottom: 2px solid #e8b4b4;
    }

    .search-form {
        margin-bottom: 24px;
    }
    .search-form label {
        font-size: 14px;
        color: #7a6b6b;
        margin-right: 4px;
    }
    .search-form input[type="date"],
    .search-form select {
        padding: 6px 10px;
        margin-right: 16px;
        border: 1px solid #e0d5d5;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
    }
    .search-form input[type="date"]:focus,
    .search-form select:focus {
        outline: none;
        border-color: #e8b4b4;
    }
    .search-form input[type="submit"] {
        padding: 7px 20px;
        background-color: #e8b4b4;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    .search-form input[type="submit"]:hover {
        background-color: #d39393;
    }

    table {
        border-collapse: collapse;
        table-layout: fixed;
        width: 100%;
        margin-top: 10px;
    }

    th, td {
        border: 1px solid #f2dddd;
        padding: 12px 10px;
        text-align: center;
        vertical-align: middle;
        font-size: 14px;
        word-wrap: break-word;
    }

    th {
        background-color: #fbf2f2;
        color: #7a6b6b;
        font-weight: 600;
        white-space: nowrap;
    }

    tr:nth-child(even) td {
        background-color: #fdfafa;
    }

    .nowrap { white-space: nowrap; }

    .status-cancelled { color: #c62828; font-weight: bold; }
    .status-noshow    { color: #ef6c00; font-weight: bold; }
    .status-completed { color: #1565c0; font-weight: bold; }

    .empty-hint {
        font-size: 14px;
        color: #999;
        margin-top: 12px;
    }
</style>
</head>
<body>
	<div class="card">
		<h3>歷史諮商紀錄查詢</h3>

		<span style="color:red;" th:if="${errorMessage != null}" th:text="${errorMessage}"></span>

		<form class="search-form" method="post" th:action="@{/psych/orders/psychHistoryForm}">
			<label>諮商日期：</label><input type="date" name="slotDate" th:value="${slotDate}">
			<label>狀態：</label>
			<select name="orderStatus">
				<option value="" th:selected="${orderStatus == null or orderStatus == ''}">不限</option>
				<option value="2" th:selected="${orderStatus == '2'}">已取消</option>
				<option value="3" th:selected="${orderStatus == '3'}">未出席</option>
				<option value="4" th:selected="${orderStatus == '4'}">已完成</option>
			</select>
			<input type="submit" value="查詢">
		</form>

		<div th:if="${ordersListData != null}">
			<p class="empty-hint" th:if="${#lists.isEmpty(ordersListData)}">查無符合條件的歷史諮商紀錄。</p>

			<table th:unless="${#lists.isEmpty(ordersListData)}">
				<colgroup>
					<col style="width:14%;">
					<col style="width:14%;">
					<col style="width:18%;">
					<col style="width:24%;">
					<col style="width:16%;">
				</colgroup>
				<tr>
					<th>訂單編號</th>
					<th>會員編號</th>
					<th>會員姓名</th>
					<th>諮商日期</th>
					<th>狀態</th>
				</tr>
				<tr th:each="order : ${ordersListData}">
					<td th:text="${order.orderId}"></td>
					<td th:text="${order.member.memberId}"></td>
					<td class="nowrap" th:text="${order.member.name}"></td>
					<td class="nowrap" th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
					<td th:switch="${order.orderStatus}">
						<span th:case="2" class="status-cancelled">已取消</span>
						<span th:case="3" class="status-noshow">未出席</span>
						<span th:case="4" class="status-completed">已完成</span>
					</td>
				</tr>
			</table>
		</div>
	</div>
</body>
</html>
