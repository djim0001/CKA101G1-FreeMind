<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>歷史諮商紀錄</title>
<style>
    body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        margin: 30px;
        color: #333;
    }
    h3 {
        margin-bottom: 20px;
    }
    .search-form label {
        margin-right: 4px;
    }
    .search-form input[type="text"],
    .search-form input[type="date"],
    .search-form select {
        padding: 4px 8px;
        margin-right: 16px;
    }
    .search-form input[type="submit"] {
        padding: 5px 14px;
        cursor: pointer;
    }
    table {
        border-collapse: collapse;
        table-layout: fixed;
        width: 100%;
        margin-top: 10px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: center;
        vertical-align: middle;
        word-wrap: break-word;
    }
    th {
        background-color: #f2f2f2;
        white-space: nowrap;
    }
    .status-cancelled { color: #c62828; font-weight: bold; }
    .status-noshow    { color: #ef6c00; font-weight: bold; }
    .status-completed { color: #1565c0; font-weight: bold; }
</style>
</head>
<body>
	
	<span style="color:red;" th:if="${errorMessage != null}" th:text="${errorMessage}"></span>

	<form class="search-form" method="post" th:action="@{/orders/psychHistoryForm}">
		<label>心理師編號：</label><input type="text" name="psychId" th:value="${psychId}">
		<label>諮商日期：</label><input type="date" name="slotDate" th:value="${slotDate}">
		<label>狀態：</label>
		<select name="orderStatus">
			<option value="" th:selected="${orderStatus == null or orderStatus == ''}">不限</option>
			<option value="2" th:selected="${orderStatus == '2'}">已取消</option>
			<option value="3" th:selected="${orderStatus == '3'}">未出席</option>
			<option value="4" th:selected="${orderStatus == '4'}">已完成</option>
		</select>
		<input type="submit" value="查詢">
	</form>

	<!-- 查詢後，歷史紀錄直接顯示在同一頁的下方 -->
	<div th:if="${ordersListData != null}">
		<p th:if="${#lists.isEmpty(ordersListData)}">查無符合條件的歷史諮商紀錄。</p>

		<table th:unless="${#lists.isEmpty(ordersListData)}">
			<colgroup>
				<col style="width:12%;">
				<col style="width:12%;">
				<col style="width:16%;">
				<col style="width:22%;">
				<col style="width:20%;">
				<col style="width:18%;">
			</colgroup>
			<tr>
				<th>訂單編號</th>
				<th>會員編號</th>
				<th>姓名</th>
				<th>諮商日期</th>
				<th>來訪目的</th>
				<th>狀態</th>
			</tr>
			<tr th:each="order : ${ordersListData}">
				<td th:text="${order.orderId}"></td>
				<td th:text="${order.member.memberId}"></td>
				<td th:text="${order.member.name}"></td>
				<td th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
				<td th:switch="${order.visitPurpose}">
					<span th:case="'emotion'">情緒困擾</span>
					<span th:case="'stress'">壓力調適</span>
					<span th:case="'relationship'">人際關係</span>
					<span th:case="'family'">家庭問題</span>
					<span th:case="'career'">職涯困惑</span>
					<span th:case="'academic'">課業壓力</span>
					<span th:case="'self_growth'">自我探索</span>
					<span th:case="'sleep'">睡眠問題</span>
					<span th:case="'anxiety'">焦慮傾向</span>
					<span th:case="'other'">其他</span>
					<span th:case="*" th:text="${order.visitPurpose}"></span>
				</td>
				<td th:switch="${order.orderStatus}">
					<span th:case="2" class="status-cancelled">已取消</span>
					<span th:case="3" class="status-noshow">未出席</span>
					<span th:case="4" class="status-completed">已完成</span>
				</td>
			</tr>
		</table>
	</div>

</body>
</html>
