<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>我的訂單管理</title>
<style>
    body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        margin: 30px;
        color: #333;
    }
    h3 {
        margin-bottom: 20px;
    }
    .search-form {
        margin-bottom: 20px;
    }
    .search-form input[type="text"] {
        padding: 4px 8px;
    }
    .search-form input[type="submit"] {
        padding: 5px 14px;
        cursor: pointer;
    }
    table {
        border-collapse: collapse;
        width: 100%;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: center;
        vertical-align: middle;
    }
    th {
        background-color: #f2f2f2;
    }
    textarea {
        width: 100%;
        height: 70px;
        resize: none;
        box-sizing: border-box;
        font-family: inherit;
        text-align: center;
        padding: 8px;
    }
    .status-pending {
        color: #b8860b;
        font-weight: bold;
    }
    .status-confirmed {
        color: #1a7a1a;
        font-weight: bold;
    }
    .action-form {
        margin-bottom: 6px;
    }
    .btn {
        width: 100%;
        padding: 6px 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        color: white;
        font-size: 0.9rem;
    }
    .btn-approve  { background-color: #2e7d32; }
    .btn-reject   { background-color: #c62828; }
    .btn-complete { background-color: #1565c0; margin-top: 6px; }
    .btn-noshow   { background-color: #ef6c00; }
    a.back-link {
        display: inline-block;
        margin-top: 20px;
    }
</style>
</head>
<body>

	<span style="color:red;" th:if="${errorMessage != null}" th:text="${errorMessage}"></span>

	<form class="search-form" method="post" th:action="@{/orders/psychOrders}">
		心理師編號：<input type="text" name="psychId" th:value="${psychId}">
		<input type="submit" value="查詢">
	</form>

	<!-- 查詢後，結果直接顯示在同一頁的下方 -->
	<div th:if="${ordersListData != null}">

		<table>
			<tr>
				<th>訂單編號</th>
				<th>會員編號</th>
				<th>姓名</th>
				<th>開始時間</th>
				<th>結束時間</th>
				<th>來訪目的</th>
				<th>來訪目的備註</th>
				<th>狀態</th>
				<th>晤談筆記</th>
				<th>操作</th>
			</tr>
			<tr th:each="order : ${ordersListData}">
				<td th:text="${order.orderId}"></td>
				<td th:text="${order.member.memberId}"></td>
				<td th:text="${order.member.name}"></td>
				<td th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
				<td th:text="${#temporals.format(order.consEnd, 'yyyy-MM-dd HH:mm')}"></td>
				<td th:switch="${order.visitPurpose}">
					<span th:case="'emotion'">情緒困擾</span>
					<span th:case="'stress'">壓力調適</span>
					<span th:case="'relationship'">人際關係</span>
					<span th:case="'family'">家庭問題</span>
					<span th:case="'career'">職涯困惑</span>
					<span th:case="'academic'">課業壓力</span>
					<span th:case="'self_growth'">自我探索</span>
					<span th:case="'sleep'">睡眠問題</span>
					<span th:case="'anxiety'">焦慮傾向</span>
					<span th:case="'other'">其他</span>
					<span th:case="*" th:text="${order.visitPurpose}"></span>
				</td>
				<td th:text="${order.visitPurposeNote}"></td>
				<td th:switch="${order.orderStatus}">
					<span th:case="0" class="status-pending">待確認</span>
					<span th:case="1" class="status-confirmed">已確認</span>
				</td>

				<!-- 晤談筆記欄：只有已確認的訂單能填寫筆記並標記完成 -->
				<td>
					<form th:if="${order.orderStatus == 1}" class="action-form"
					      method="post" th:action="@{/orders/complete}">
						<input type="hidden" name="orderId" th:value="${order.orderId}">
						<input type="hidden" name="psychId" th:value="${psychId}">
						<textarea name="psychNote" rows="3" placeholder="這次諮商的重點記錄，會員將能看到"></textarea>
						<button type="submit" class="btn btn-complete"
						        onclick="return confirm('確定這次諮商已經結束了嗎？')">標記為已完成</button>
					</form>
				</td>

				<!-- 操作欄：依狀態顯示同意/拒絕，或標記未出席 -->
				<td>
					<div th:if="${order.orderStatus == 0}">
						<form method="post" th:action="@{/orders/approve}" class="action-form">
							<input type="hidden" name="orderId" th:value="${order.orderId}">
							<input type="hidden" name="psychId" th:value="${psychId}">
							<button type="submit" class="btn btn-approve">同意</button>
						</form>
						<form method="post" th:action="@{/orders/reject}" class="action-form">
							<input type="hidden" name="orderId" th:value="${order.orderId}">
							<input type="hidden" name="psychId" th:value="${psychId}">
							<button type="submit" class="btn btn-reject"
							        onclick="return confirm('確定要拒絕這筆訂單嗎？拒絕後時段將重新開放。')">拒絕</button>
						</form>
					</div>

					<div th:if="${order.orderStatus == 1}">
						<form method="post" th:action="@{/orders/noShow}" class="action-form">
							<input type="hidden" name="orderId" th:value="${order.orderId}">
							<input type="hidden" name="psychId" th:value="${psychId}">
							<button type="submit" class="btn btn-noshow"
							        onclick="return confirm('確定會員沒有出席這次諮商嗎？')">標記為未出席</button>
						</form>
					</div>
				</td>
			</tr>
		</table>
	</div>

</body>
</html>
