<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的訂單管理</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft JhengHei","Noto Sans TC",sans-serif; background: #faf6f4; color: #4a3e3e; line-height: 1.7; padding: 44px 20px; }
    .wrap { max-width: 1200px; margin: 0 auto; }

    .top { margin-bottom: 20px; }
    .top h1 { font-size: 26px; font-weight: 700; }

    /* 頁籤 */
    .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 2px solid #f2e0dc; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 11px 22px; font-size: 15px; font-weight: 600; color: #a99a95; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; transition: color 0.2s, border-color 0.2s; }
    .tab:hover { color: #c07d7d; }
    .tab.active { color: #c07d7d; border-bottom-color: #e8b4b4; }
    .tab .count { background: #f2dddd; color: #c07d7d; font-size: 12.5px; font-weight: 600; padding: 1px 10px; border-radius: 999px; }
    .tab.active .count { background: #e8b4b4; color: #fff; }

    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 14px rgba(160,120,120,0.07); }
    thead th { background: #fbf2f2; color: #7a6b6b; font-weight: 600; font-size: 13.5px; padding: 13px 10px; white-space: nowrap; text-align: center; }
    tbody td { padding: 12px 10px; font-size: 13.5px; border-bottom: 1px solid #f2e9e5; text-align: center; vertical-align: middle; }
    .nowrap { white-space: nowrap; }

    /* 同時段競爭：整列淡橘 + 徽章 */
    tr.competing td { background: #fff7ed !important; }
    .compete-badge { margin-top: 4px; font-size: 12px; color: #c2410c; font-weight: bold; white-space: nowrap; }

    textarea { width: 100%; height: 66px; resize: none; font-family: inherit; font-size: 13px; padding: 8px; border: 1px solid #e0d5d5; border-radius: 6px; }
    textarea:focus { outline: none; border-color: #e8b4b4; }
    .deadline { font-size: 12px; color: #7a6b6b; margin-bottom: 6px; }
    .deadline .over { color: #c62828; font-weight: bold; }

    .action-form { margin-bottom: 6px; }
    .btn { width: 100%; padding: 8px 0; border: none; border-radius: 6px; cursor: pointer; color: #fff; font-size: 0.9rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-approve  { background: #2e7d32; }
    .btn-reject   { background: #c62828; }
    .btn-complete { background: #1565c0; margin-top: 6px; }
    .btn-noshow   { background: #ef6c00; }

    .empty { color: #b3a5a0; font-size: 14px; padding: 44px; text-align: center; background: #fff; border-radius: 12px; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* 中文來訪目的欄用 */
    .purpose { white-space: nowrap; }
</style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <h1>心理師編號 <span th:text="${psychId}"></span> 的訂單管理</h1>
        </div>

        <!-- 頁籤 -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('pending', this)">
                待確認 <span class="count" th:text="${#lists.size(ordersListData.?[orderStatus == 0])}"></span>
            </button>
            <button class="tab" onclick="showTab('confirmed', this)">
                已確認 <span class="count" th:text="${#lists.size(ordersListData.?[orderStatus == 1])}"></span>
            </button>
        </div>

        <!-- 待確認 -->
        <div id="pending" class="panel active">
            <table th:if="${!#lists.isEmpty(ordersListData.?[orderStatus == 0])}">
                <thead>
                    <tr>
                        <th>訂單編號</th><th>會員編號</th><th>姓名</th>
                        <th>開始時間</th><th>結束時間</th>
                        <th>來訪目的</th><th>來訪目的備註</th><th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${ordersListData}" th:if="${order.orderStatus == 0}"
                        th:classappend="${competitionMap.containsKey(order.orderId)} ? 'competing' : ''">
                        <td th:text="${order.orderId}"></td>
                        <td th:text="${order.member.memberId}"></td>
                        <td class="nowrap" th:text="${order.member.name}"></td>
                        <td class="nowrap">
                            <span th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></span>
                            <div th:if="${competitionMap.containsKey(order.orderId)}" class="compete-badge"
                                 th:text="'⚠ 同時段 ' + ${competitionMap.get(order.orderId)} + ' 人'"></div>
                        </td>
                        <td class="nowrap" th:text="${#temporals.format(order.consEnd, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="purpose" th:switch="${order.visitPurpose}">
                            <span th:case="'emotion'">情緒困擾</span><span th:case="'stress'">壓力調適</span>
                            <span th:case="'relationship'">人際關係</span><span th:case="'family'">家庭問題</span>
                            <span th:case="'career'">職涯困惑</span><span th:case="'academic'">課業壓力</span>
                            <span th:case="'self_growth'">自我探索</span><span th:case="'sleep'">睡眠問題</span>
                            <span th:case="'anxiety'">焦慮傾向</span><span th:case="'other'">其他</span>
                            <span th:case="*" th:text="${order.visitPurpose}"></span>
                        </td>
                        <td th:text="${order.visitPurposeNote}"></td>
                        <td class="nowrap">
                            <form method="post" th:action="@{/psych/orders/approve}" class="action-form">
                                <input type="hidden" name="orderId" th:value="${order.orderId}">
                                <input type="hidden" name="psychId" th:value="${psychId}">
                                <button type="submit" class="btn btn-approve">同意</button>
                            </form>
                            <form method="post" th:action="@{/psych/orders/reject}" class="action-form">
                                <input type="hidden" name="orderId" th:value="${order.orderId}">
                                <input type="hidden" name="psychId" th:value="${psychId}">
                                <button type="submit" class="btn btn-reject"
                                        onclick="return confirm('確定要拒絕這筆訂單嗎？拒絕後時段將重新開放。')">拒絕</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="empty" th:if="${#lists.isEmpty(ordersListData.?[orderStatus == 0])}">目前沒有待確認的訂單。</div>
        </div>

        <!-- 已確認 -->
        <div id="confirmed" class="panel">
            <table th:if="${!#lists.isEmpty(ordersListData.?[orderStatus == 1])}">
                <thead>
                    <tr>
                        <th>訂單編號</th><th>會員編號</th><th>姓名</th>
                        <th>開始時間</th><th>結束時間</th>
                        <th>來訪目的</th><th>來訪目的備註</th>
                        <th>晤談筆記</th><th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${ordersListData}" th:if="${order.orderStatus == 1}">
                        <td th:text="${order.orderId}"></td>
                        <td th:text="${order.member.memberId}"></td>
                        <td class="nowrap" th:text="${order.member.name}"></td>
                        <td class="nowrap" th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="nowrap" th:text="${#temporals.format(order.consEnd, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="purpose" th:switch="${order.visitPurpose}">
                            <span th:case="'emotion'">情緒困擾</span><span th:case="'stress'">壓力調適</span>
                            <span th:case="'relationship'">人際關係</span><span th:case="'family'">家庭問題</span>
                            <span th:case="'career'">職涯困惑</span><span th:case="'academic'">課業壓力</span>
                            <span th:case="'self_growth'">自我探索</span><span th:case="'sleep'">睡眠問題</span>
                            <span th:case="'anxiety'">焦慮傾向</span><span th:case="'other'">其他</span>
                            <span th:case="*" th:text="${order.visitPurpose}"></span>
                        </td>
                        <td th:text="${order.visitPurposeNote}"></td>
                        <td style="min-width:220px;">
                            <form class="action-form" method="post" th:action="@{/psych/orders/complete}">
                                <input type="hidden" name="orderId" th:value="${order.orderId}">
                                <input type="hidden" name="psychId" th:value="${psychId}">
                                <div class="deadline">
                                    完成期限：<span th:text="${#temporals.format(order.consEnd.plusDays(3), 'yyyy-MM-dd HH:mm')}"></span>
                                    <span th:if="${overdueOrders.contains(order.orderId)}" class="over">（已逾期）</span>
                                </div>
                                <textarea name="psychNote" rows="3" required placeholder="這次諮商的重點記錄，會員將能看到"></textarea>
                                <button type="submit" class="btn btn-complete"
                                        onclick="return confirmComplete(this)">標記為已完成</button>
                            </form>
                        </td>
                        <td class="nowrap">
                            <form method="post" th:action="@{/psych/orders/noShow}" class="action-form">
                                <input type="hidden" name="orderId" th:value="${order.orderId}">
                                <input type="hidden" name="psychId" th:value="${psychId}">
                                <button type="submit" class="btn btn-noshow"
                                        onclick="return confirm('確定會員沒有出席這次諮商嗎？')">未出席</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="empty" th:if="${#lists.isEmpty(ordersListData.?[orderStatus == 1])}">目前沒有已確認的訂單。</div>
        </div>
    </div>

    <script>
        function showTab(id, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }
        function confirmComplete(btn) {
            var note = btn.form.querySelector('textarea[name="psychNote"]');
            if (!note.value.trim()) {
                alert('請先填寫晤談筆記，才能標記為已完成。');
                note.focus();
                return false;
            }
            return confirm('確定這次諮商已經結束了嗎？');
        }
    </script>
</body>
</html>
