<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>我的訂單管理</title>
<style>
* {
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
	background-color: #f5f5f5;
	margin: 0;
	padding: 40px 20px;
	color: #333;
}

.card {
	max-width: 1200px;
	margin: 0 auto;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	padding: 36px 40px;
}

h3 {
	font-size: 22px;
	color: #4a3e3e;
	margin: 0 0 20px;
	padding-bottom: 14px;
	border-bottom: 2px solid #e8b4b4;
}

table {
	border-collapse: collapse;
	width: 100%;
	margin-top: 10px;
}

th, td {
	border: 1px solid #f2dddd;
	padding: 12px 10px;
	text-align: center;
	vertical-align: middle;
	font-size: 14px;
}

th {
	background-color: #fbf2f2;
	color: #7a6b6b;
	font-weight: 600;
	white-space: nowrap;
}

tr:nth-child(even) td {
	background-color: #fdfafa;
}

.nowrap {
	white-space: nowrap;
}

textarea {
	width: 100%;
	height: 70px;
	resize: none;
	box-sizing: border-box;
	font-family: inherit;
	font-size: 13px;
	padding: 8px;
	border: 1px solid #e0d5d5;
	border-radius: 6px;
}

textarea:focus {
	outline: none;
	border-color: #e8b4b4;
}

.status-pending {
	color: #b8860b;
	font-weight: bold;
}

.status-confirmed {
	color: #1a7a1a;
	font-weight: bold;
}

.action-form {
	margin-bottom: 6px;
}

.btn {
	width: 100%;
	padding: 8px 0;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	color: white;
	font-size: 0.9rem;
	transition: opacity 0.2s;
}

.btn:hover {
	opacity: 0.85;
}

.btn-approve {
	background-color: #2e7d32;
}

.btn-reject {
	background-color: #c62828;
}

.btn-complete {
	background-color: #1565c0;
	margin-top: 6px;
}

.btn-noshow {
	background-color: #ef6c00;
}
</style>
</head>
<body>
	<div class="card">
		<h3>
			心理師編號 <span th:text="${psychId}"></span> 的訂單管理
		</h3>

		<div th:if="${ordersListData != null}">
			<table>
				<tr>
					<th>訂單編號</th>
					<th>會員編號</th>
					<th>姓名</th>
					<th>開始時間</th>
					<th>結束時間</th>
					<th>來訪目的</th>
					<th>來訪目的備註</th>
					<th>狀態</th>
					<th>晤談筆記</th>
					<th>操作</th>
				</tr>
				<tr th:each="order : ${ordersListData}">
					<td th:text="${order.orderId}"></td>
					<td th:text="${order.member.memberId}"></td>
					<td class="nowrap" th:text="${order.member.name}"></td>
					<td class="nowrap"
						th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
					<td class="nowrap"
						th:text="${#temporals.format(order.consEnd, 'yyyy-MM-dd HH:mm')}"></td>
					<td th:switch="${order.visitPurpose}"><span
						th:case="'emotion'">情緒困擾</span> <span th:case="'stress'">壓力調適</span>
						<span th:case="'relationship'">人際關係</span> <span
						th:case="'family'">家庭問題</span> <span th:case="'career'">職涯困惑</span>
						<span th:case="'academic'">課業壓力</span> <span
						th:case="'self_growth'">自我探索</span> <span th:case="'sleep'">睡眠問題</span>
						<span th:case="'anxiety'">焦慮傾向</span> <span th:case="'other'">其他</span>
						<span th:case="*" th:text="${order.visitPurpose}"></span></td>
					<td class="nowrap" th:text="${order.visitPurposeNote}"></td>
					<td class="nowrap" th:switch="${order.orderStatus}"><span
						th:case="0" class="status-pending">待確認</span> <span th:case="1"
						class="status-confirmed">已確認</span></td>

					<!-- 晤談筆記欄：只有已確認的訂單能填寫筆記並標記完成 -->
					<td>
						<form th:if="${order.orderStatus == 1}" class="action-form"
							method="post" th:action="@{/psych/orders/complete}">
							<input type="hidden" name="orderId" th:value="${order.orderId}">
							<input type="hidden" name="psychId" th:value="${psychId}">

							<div style="font-size: 12px; color: #7a6b6b; margin-bottom: 6px;">
								完成期限：<span
									th:text="${#temporals.format(order.consEnd.plusDays(3), 'yyyy-MM-dd HH:mm')}"></span>
								<span th:if="${overdueOrders.contains(order.orderId)}"
									style="color: #c62828; font-weight: bold;">（已逾期）</span>
							</div>

							<textarea name="psychNote" rows="3" required
								placeholder="這次諮商的重點記錄，會員將能看到"></textarea>
							<button type="submit" class="btn btn-complete"
								onclick="return confirmComplete(this)">標記為已完成</button>
						</form>
					</td>

					<!-- 操作欄：依狀態顯示同意/拒絕，或標記未出席 -->
					<td class="nowrap">
						<div th:if="${order.orderStatus == 0}">
							<form method="post" th:action="@{/psych/orders/approve}"
								class="action-form">
								<input type="hidden" name="orderId" th:value="${order.orderId}">
								<input type="hidden" name="psychId" th:value="${psychId}">
								<button type="submit" class="btn btn-approve">同意</button>
							</form>
							<form method="post" th:action="@{/psych/orders/reject}"
								class="action-form">
								<input type="hidden" name="orderId" th:value="${order.orderId}">
								<input type="hidden" name="psychId" th:value="${psychId}">
								<button type="submit" class="btn btn-reject"
									onclick="return confirm('確定要拒絕這筆訂單嗎？拒絕後時段將重新開放。')">拒絕</button>
							</form>
						</div>

						<div th:if="${order.orderStatus == 1}">
							<form method="post" th:action="@{/psych/orders/noShow}"
								class="action-form">
								<input type="hidden" name="orderId" th:value="${order.orderId}">
								<input type="hidden" name="psychId" th:value="${psychId}">
								<button type="submit" class="btn btn-noshow"
									onclick="return confirm('確定會員沒有出席這次諮商嗎？')">未出席</button>
							</form>
						</div>
					</td>
				</tr>
			</table>
		</div>
	</div>
	<script>
		function confirmComplete(btn) {
			var note = btn.form.querySelector('textarea[name="psychNote"]');
			if (!note.value.trim()) {
				alert('請先填寫晤談筆記，才能標記為已完成。');
				note.focus();
				return false;
			}
			return confirm('確定這次諮商已經結束了嗎？');
		}
	</script>
</body>
</html>
