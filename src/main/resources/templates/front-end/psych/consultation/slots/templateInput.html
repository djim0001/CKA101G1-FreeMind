<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定固定範本</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
    .template-section { padding: 3.5rem 0 6rem; }

    .template-card {
        max-width: 640px; margin: 0 auto;
        background: var(--white); border: 1px solid var(--line);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
        padding: 2.6rem 2.4rem;
    }
    .template-card h3 {
        font-family: var(--serif); font-size: 1.5rem; color: var(--ink);
        margin: 0 0 1.1rem; padding-bottom: 1rem; border-bottom: 2px solid var(--pink);
    }

    .info-row { font-size: .92rem; margin-bottom: .5rem; color: var(--ink); }
    .hint { font-size: .85rem; color: var(--ink-soft); margin: 0 0 1.2rem; }

    .toolbar { margin-bottom: 1.2rem; display: flex; gap: .6rem; }
    .toolbar button {
        padding: .5rem 1rem; border: 1.5px solid var(--line);
        background: var(--bg-warm); color: var(--ink-soft); border-radius: var(--radius-md);
        cursor: pointer; font-size: .84rem; font-family: inherit; transition: all .2s;
    }
    .toolbar button:hover { background: var(--orange); color: #fff; border-color: var(--orange); }

    .hour-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: 1.6rem; }
    .hour-item {
        display: flex; align-items: center; gap: .55rem; padding: .55rem .8rem;
        border: 1.5px solid var(--line); border-radius: var(--radius-md); font-size: .85rem;
        background: var(--bg-warm);
    }
    .hour-item input[type="checkbox"] { accent-color: var(--orange); width: 16px; height: 16px; }

    .template-submit { width: 100%; justify-content: center; border: none; }

    @media (max-width: 560px) {
        .hour-grid { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="template-section">
    <div class="wrap">
        <div class="template-card">
            <h3>設定固定可預約範本</h3>

            <div class="info-row">心理師編號：<span th:text="${slots.psychologist.psychId}"></span></div>
            <p class="hint">這是您每天固定開放的時段規則，之後系統會依此自動產生未來時段：</p>

            <div class="toolbar">
                <button type="button" onclick="checkAll(true)">一鍵全選</button>
                <button type="button" onclick="checkAll(false)">一鍵全部取消</button>
            </div>

            <form method="post" th:action="@{/psych/slots/templateSubmit}">
                <input type="hidden" name="psychId" th:value="${slots.psychologist.psychId}">

                <div class="hour-grid">
                    <div class="hour-item" th:each="hour : ${#numbers.sequence(0, 23)}">
                        <input type="checkbox" name="openHours" class="hourCheckbox" th:value="${hour}"
                            th:checked="${slots.consStatus.charAt(hour) == '1'}">
                        <span th:text="${hour} + ':00 - ' + ${hour + 1} + ':00'"></span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary template-submit">儲存範本</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: backToTop}"></div>
<script src="/js/nav.js"></script>
<script>
    function checkAll(shouldCheck) {
        var checkboxes = document.getElementsByClassName('hourCheckbox');
        for (var i = 0; i < checkboxes.length; i++) {
            checkboxes[i].checked = shouldCheck;
        }
    }
</script>
</body>
</html>
