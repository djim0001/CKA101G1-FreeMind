<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調整當日可預約時段</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
    .slots-input-section { padding: 3.5rem 0 6rem; }

    .slots-input-card {
        max-width: 620px; margin: 0 auto;
        background: var(--white); border: 1px solid var(--line);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
        padding: 2.6rem 2.4rem;
    }
    .slots-input-card h3 {
        font-family: var(--serif); font-size: 1.5rem; color: var(--ink);
        margin: 0 0 1.2rem; padding-bottom: 1rem; border-bottom: 2px solid var(--pink);
    }

    .info-row { font-size: .92rem; margin-bottom: .4rem; color: var(--ink); }
    .info-row .label { font-weight: 700; color: var(--ink-soft); margin-right: .4rem; }
    .hint { font-size: .82rem; color: var(--ink-soft); margin: .6rem 0 1.2rem; }
    .warning { color: var(--orange-deep); font-size: .88rem; margin-bottom: .9rem; background: var(--pink-soft); padding: .6rem .9rem; border-radius: var(--radius-md); }

    .toolbar { margin-bottom: 1.2rem; display: flex; gap: .6rem; }
    .toolbar button {
        padding: .5rem 1rem; border: 1.5px solid var(--line);
        background: var(--bg-warm); color: var(--ink-soft); border-radius: var(--radius-md);
        cursor: pointer; font-size: .84rem; font-family: inherit; transition: all .2s;
    }
    .toolbar button:hover { background: var(--orange); color: #fff; border-color: var(--orange); }

    .hours { display: flex; gap: 1rem; }
    .hour-col { flex: 1; display: flex; flex-direction: column; gap: .6rem; }
    .col-title { font-size: .84rem; font-weight: 700; color: var(--ink-soft); text-align: center; margin-bottom: .1rem; }
    .hour-item {
        display: flex; align-items: center; gap: .6rem; padding: .55rem .8rem;
        border: 1.5px solid var(--line); border-radius: var(--radius-md); font-size: .88rem;
        background: var(--bg-warm);
    }
    .hour-item input[type="checkbox"] { accent-color: var(--orange); width: 16px; height: 16px; }
    .hour-item .booked { color: var(--orange-deep); font-size: .76rem; }
    .hour-item .past { color: var(--ink-soft); opacity: .6; font-size: .76rem; }

    .slots-submit { width: 100%; justify-content: center; border: none; margin-top: 1.6rem; }

    @media (max-width: 560px) {
        .hours { flex-direction: column; }
    }
</style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="slots-input-section">
    <div class="wrap">
        <div class="slots-input-card">
            <h3>調整可預約時段</h3>

            <div class="info-row"><span class="label">日期：</span><span th:text="${slots.slotDate}"></span></div>
            <p class="hint">已被預約成立、以及今天已過的時段無法更動；請勾選您要開放預約的時段：</p>

            <p class="warning" th:if="${warningMessage != null}" th:text="${warningMessage}"></p>

            <div class="toolbar">
                <button type="button" onclick="checkAll(true)">全選</button>
                <button type="button" onclick="checkAll(false)">全部取消</button>
            </div>

            <form method="post" th:action="@{/psych/slots/manageSubmit}">
                <input type="hidden" name="slotDate" th:value="${slots.slotDate}">

                <div class="hours">
                    <!-- 左欄：上午 0-11 -->
                    <div class="hour-col">
                        <div class="col-title">上午</div>
                        <div class="hour-item" th:each="hour : ${#numbers.sequence(0, 11)}">
                            <input type="checkbox" name="openHours" class="hourCheckbox" th:value="${hour}"
                                th:checked="${slots.consStatus.charAt(hour) == '1' or slots.consStatus.charAt(hour) == '2' or slots.consStatus.charAt(hour) == '4'}"
                                th:disabled="${slots.consStatus.charAt(hour) == '2' or (isToday and hour <= currentHour)}">
                            <span th:text="${hour} + ':00 - ' + ${hour + 1} + ':00'"></span>
                            <span class="booked" th:if="${slots.consStatus.charAt(hour) == '2'}">（已預約）</span>
                            <span class="past" th:if="${isToday and hour <= currentHour and slots.consStatus.charAt(hour) != '2'}">（已過）</span>
                        </div>
                    </div>

                    <!-- 右欄：下午 12-23 -->
                    <div class="hour-col">
                        <div class="col-title">下午</div>
                        <div class="hour-item" th:each="hour : ${#numbers.sequence(12, 23)}">
                            <input type="checkbox" name="openHours" class="hourCheckbox" th:value="${hour}"
                                th:checked="${slots.consStatus.charAt(hour) == '1' or slots.consStatus.charAt(hour) == '2' or slots.consStatus.charAt(hour) == '4'}"
                                th:disabled="${slots.consStatus.charAt(hour) == '2' or (isToday and hour <= currentHour)}">
                            <span th:text="${hour} + ':00 - ' + ${hour + 1} + ':00'"></span>
                            <span class="booked" th:if="${slots.consStatus.charAt(hour) == '2'}">（已預約）</span>
                            <span class="past" th:if="${isToday and hour <= currentHour and slots.consStatus.charAt(hour) != '2'}">（已過）</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary slots-submit">儲存設定</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: backToTop}"></div>
<script src="/js/nav.js"></script>
<script>
    function checkAll(shouldCheck) {
        var checkboxes = document.getElementsByClassName('hourCheckbox');
        for (var i = 0; i < checkboxes.length; i++) {
            if (!checkboxes[i].disabled) {
                checkboxes[i].checked = shouldCheck;
            }
        }
    }
</script>
</body>
</html>
