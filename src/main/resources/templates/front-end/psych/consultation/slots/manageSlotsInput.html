<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>調整當日可預約時段</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background-color: #f5f5f5;
        margin: 0; padding: 40px 20px; color: #333;
    }
    .card {
        max-width: 560px; margin: 0 auto; background: #fff;
        border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 36px 40px;
    }
    h3 {
        font-size: 22px; color: #4a3e3e; margin: 0 0 20px;
        padding-bottom: 14px; border-bottom: 2px solid #e8b4b4;
    }
    .info-row { font-size: 14px; margin-bottom: 6px; }
    .info-row .label { font-weight: 600; color: #7a6b6b; margin-right: 6px; }
    .hint { font-size: 13px; color: #999; margin: 10px 0 16px; }
    .warning { color: #ef6c00; font-size: 14px; margin-bottom: 12px; }

    .toolbar { margin-bottom: 16px; }
    .toolbar button {
        padding: 6px 14px; margin-right: 8px; border: 1px solid #e0d5d5;
        background: #fbf2f2; color: #7a6b6b; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .toolbar button:hover { background: #e8b4b4; color: #fff; }

    .hours { display: flex; gap: 12px; }
    .hour-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .col-title { font-size: 13px; font-weight: 600; color: #7a6b6b; text-align: center; margin-bottom: 2px; }
    .hour-item {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        border: 1px solid #f2dddd; border-radius: 6px; font-size: 14px;
    }
    .hour-item .booked { color: #c62828; font-size: 12px; }
    .hour-item .past { color: #c4b8b3; font-size: 12px; }

    input[type="submit"] {
        display: block; width: 100%; margin-top: 24px; padding: 12px 0;
        background-color: #e8b4b4; color: #fff; border: none; border-radius: 6px;
        font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s;
    }
    input[type="submit"]:hover { background-color: #d39393; }
</style>
</head>
<body>
    <div class="card">
        <h3>調整可預約時段</h3>

        <div class="info-row"><span class="label">日期：</span><span th:text="${slots.slotDate}"></span></div>
        <p class="hint">已被預約成立、以及今天已過的時段無法更動；請勾選您要開放預約的時段：</p>

        <p class="warning" th:if="${warningMessage != null}" th:text="${warningMessage}"></p>

        <div class="toolbar">
            <button type="button" onclick="checkAll(true)">全選</button>
            <button type="button" onclick="checkAll(false)">全部取消</button>
        </div>

        <form method="post" th:action="@{/psych/slots/manageSubmit}">
            <input type="hidden" name="slotDate" th:value="${slots.slotDate}">

            <div class="hours">
                <!-- 左欄：上午 0-11 -->
                <div class="hour-col">
                    <div class="col-title">上午</div>
                    <div class="hour-item" th:each="hour : ${#numbers.sequence(0, 11)}">
                        <input type="checkbox" name="openHours" class="hourCheckbox" th:value="${hour}"
                            th:checked="${slots.consStatus.charAt(hour) == '1' or slots.consStatus.charAt(hour) == '2' or slots.consStatus.charAt(hour) == '4'}"
                            th:disabled="${slots.consStatus.charAt(hour) == '2' or (isToday and hour <= currentHour)}">
                        <span th:text="${hour} + ':00 - ' + ${hour + 1} + ':00'"></span>
                        <span class="booked" th:if="${slots.consStatus.charAt(hour) == '2'}">（已預約）</span>
                        <span class="past" th:if="${isToday and hour <= currentHour and slots.consStatus.charAt(hour) != '2'}">（已過）</span>
                    </div>
                </div>

                <!-- 右欄：下午 12-23 -->
                <div class="hour-col">
                    <div class="col-title">下午</div>
                    <div class="hour-item" th:each="hour : ${#numbers.sequence(12, 23)}">
                        <input type="checkbox" name="openHours" class="hourCheckbox" th:value="${hour}"
                            th:checked="${slots.consStatus.charAt(hour) == '1' or slots.consStatus.charAt(hour) == '2' or slots.consStatus.charAt(hour) == '4'}"
                            th:disabled="${slots.consStatus.charAt(hour) == '2' or (isToday and hour <= currentHour)}">
                        <span th:text="${hour} + ':00 - ' + ${hour + 1} + ':00'"></span>
                        <span class="booked" th:if="${slots.consStatus.charAt(hour) == '2'}">（已預約）</span>
                        <span class="past" th:if="${isToday and hour <= currentHour and slots.consStatus.charAt(hour) != '2'}">（已過）</span>
                    </div>
                </div>
            </div>

            <input type="submit" value="儲存設定">
        </form>
    </div>

    <script>
        function checkAll(shouldCheck) {
            var checkboxes = document.getElementsByClassName('hourCheckbox');
            for (var i = 0; i < checkboxes.length; i++) {
                if (!checkboxes[i].disabled) {
                    checkboxes[i].checked = shouldCheck;
                }
            }
        }
    </script>
</body>
</html>
