<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>撰寫文章</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC",
		sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.6;
	padding: 40px 20px;
}

h1 {
	max-width: 860px;
	margin: 0 auto 28px;
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
	padding-bottom: 16px;
	border-bottom: 2px solid #e8b4b4;
	display: flex;
	align-items: center;
	justify-content: space-between;
}

h1 a {
	display: inline-block;
	padding: 8px 20px;
	background-color: #e8b4b4;
	color: #fff;
	text-decoration: none;
	border-radius: 6px;
	font-size: 14px;
	font-weight: 500;
	transition: background-color 0.2s;
}

h1 a:hover {
	background-color: #d39393;
}

form {
	max-width: 860px;
	margin: 0 auto;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	padding: 40px;
}

form>div {
	margin-bottom: 24px;
}

label {
	display: block;
	margin-bottom: 8px;
	font-size: 15px;
	font-weight: 600;
	color: #7a6b6b;
}

input[type="text"], select {
	width: 100%;
	padding: 10px 14px;
	border: 1px solid #f2dddd;
	border-radius: 6px;
	font-size: 15px;
	color: #444;
	outline: none;
	transition: border-color 0.2s;
}

input[type="text"]:focus, select:focus {
	border-color: #e8b4b4;
	box-shadow: 0 0 0 3px rgba(232, 180, 180, 0.2);
}

input[type="file"] {
	display: block;
	width: 100%;
	padding: 8px 0;
	font-size: 14px;
	color: #666;
}

button {
	display: inline-block;
	padding: 10px 24px;
	font-size: 15px;
	font-weight: 500;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	transition: background-color 0.2s, color 0.2s;
	margin-right: 12px;
}

button[value="draft"] {
	background-color: #fbf2f2;
	color: #7a6b6b;
	border: 1px solid #f2dddd;
}

button[value="draft"]:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

button[value="submit"] {
	background-color: #e8b4b4;
	color: #fff;
}

button[value="submit"]:hover {
	background-color: #d39393;
}

@media ( max-width : 640px) {
	form {
		padding: 24px 20px;
	}
	button {
		width: 100%;
		margin-bottom: 12px;
		margin-right: 0;
	}
}

</style>
</head>
<body>

	<h1>
		<span>撰寫文章</span> 
		<a th:href="@{/psych/article/myArticles}">返回</a>
	</h1>

	<p th:if="${errorMessage}" th:text="${errorMessage}"
		style="color: red;"></p>

	<form th:action="@{/psych/article/create}" th:object="${form}"
		method="post" enctype="multipart/form-data">
		<div>
			<label>標題</label> <input type="text" th:field="*{title}" />
		</div>

		<div>
			<label>文章分類</label> <select th:field="*{articleCatId}">
				<option value="">請選擇分類</option>
				<option th:each="cat : ${articleCats}"
					th:value="${cat.articleCatId}" th:text="${cat.articleCatName}"></option>
			</select>
		</div>

		<div>
			<label>首圖</label> <input type="file" th:field="*{coverImageFile}" />
		</div>

		<div>
			<label>內文</label>
			<textarea id="content" th:field="*{content}"></textarea>
		</div>

		<button type="submit" name="action" value="draft">儲存草稿</button>
		<button type="submit" name="action" value="submit">送審發布</button>

	</form>

	<script src="/js/tinymce/tinymce.min.js"></script>
	<script>
		tinymce.init({
					selector : '#content',
					license_key : 'gpl',
					height : 400,
					plugins : 'link image',
					toolbar : 'undo redo | blocks | bold italic | alignleft aligncenter alignright | image link',
					images_upload_url : '/article/uploadImage',
					relative_urls : false,
					remove_script_host : true,
					convert_urls : false,
					content_css: false,
					content_style: 'body { line-height: 1.2 !important; margin: 4px !important; } p { margin: 0 0 0.3em 0 !important; }'
				});
	</script>

</body>
</html>
