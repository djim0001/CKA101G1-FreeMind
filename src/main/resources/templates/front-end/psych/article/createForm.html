<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />
<title>撰寫文章</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC",
		sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.6;
	padding: 40px 20px;
}

h1 {
	max-width: 860px;
	margin: 0 auto 28px;
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
	padding-bottom: 16px;
	border-bottom: 2px solid #e8b4b4;
	display: flex;
	align-items: center;
	justify-content: space-between;
}

h1 a {
	display: inline-block;
	padding: 8px 20px;
	background-color: #e8b4b4;
	color: #fff;
	text-decoration: none;
	border-radius: 6px;
	font-size: 14px;
	font-weight: 500;
	transition: background-color 0.2s;
}

h1 a:hover {
	background-color: #d39393;
}

form {
	max-width: 860px;
	margin: 0 auto;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	padding: 40px;
}

form>div {
	margin-bottom: 24px;
}

label {
	display: block;
	margin-bottom: 8px;
	font-size: 15px;
	font-weight: 600;
	color: #7a6b6b;
}

input[type="text"], select {
	width: 100%;
	padding: 10px 14px;
	border: 1px solid #f2dddd;
	border-radius: 6px;
	font-size: 15px;
	color: #444;
	outline: none;
	transition: border-color 0.2s;
}

input[type="text"]:focus, select:focus {
	border-color: #e8b4b4;
	box-shadow: 0 0 0 3px rgba(232, 180, 180, 0.2);
}

input[type="file"] {
	display: block;
	width: 100%;
	padding: 8px 0;
	font-size: 14px;
	color: #666;
}

.field-error {
	color: #d9534f;
	font-size: 13px;
	margin-top: 4px;
}

.form-actions {
	display: flex;
	align-items: center;
	gap: 12px;
}

.form-actions button,
.form-actions a.btn-preview {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	height: 42px;
	padding: 0 24px;
	font-size: 15px;
	font-weight: 500;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	transition: background-color 0.2s, color 0.2s;
	text-decoration: none;
	box-sizing: border-box;
}

button[value="draft"] {
	background-color: #fbf2f2;
	color: #7a6b6b;
	border: 1px solid #f2dddd;
}

button[value="draft"]:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

button[value="submit"] {
	background-color: #e8b4b4;
	color: #fff;
}

button[value="submit"]:hover {
	background-color: #d39393;
}

.btn-preview {
	margin-left: auto;
	background-color: #fff;
	color: #7a6b6b;
	border: 1px solid #ccc !important;
}

.btn-preview:hover {
	background-color: #f0f0f0;
}

@media ( max-width : 640px) {
	form {
		padding: 24px 20px;
	}
	.form-actions {
		flex-direction: column;
		align-items: stretch;
	}
	.form-actions button,
	.form-actions a.btn-preview {
		width: 100%;
		margin-left: 0;
	}
}

</style>
</head>
<body>

	<h1>
		<span>撰寫文章</span> 
		<a th:href="@{/psych/article/myArticles}" id="backLink">返回</a>
	</h1>

	<p th:if="${errorMessage}" th:text="${errorMessage}"
		style="color: red;"></p>

	<form th:action="@{/psych/article/create}" th:object="${form}"
		method="post" enctype="multipart/form-data">
		<div>
	    	<label>標題</label> 
		    <input type="text" th:field="*{title}" maxlength="50" id="titleInput" />
		    <p id="titleCounter" style="font-size: 13px; color: #999; text-align: right;">0/50</p>
		    <p th:if="${titleError}" th:text="${titleError}" class="field-error"></p>
		</div>
		
		<div>
		    <label>文章分類</label> 
		    <select th:field="*{articleCatId}" id="articleCatSelect">
		        <option value="">請選擇分類</option>
		        <option th:each="cat : ${articleCats}"
		            th:value="${cat.articleCatId}" th:text="${cat.articleCatName}"></option>
		    </select>
		    <p th:if="${catError}" th:text="${catError}" class="field-error"></p>
		</div>
		
		<div>
		    <label>首圖</label> 
		    <input type="file" th:field="*{coverImageFile}" />
		    <p th:if="${coverError}" th:text="${coverError}" class="field-error"></p>
		</div>
		
		<div class="cover-image" th:if="${article != null and article.coverImage != null}"></div>
		
		<div>
		    <label>內文</label>
		    <textarea id="content" th:field="*{content}"></textarea>
		    <p th:if="${contentError}" th:text="${contentError}" class="field-error"></p>
		</div>

		<div class="form-actions">
			<button type="submit" name="action" value="draft">儲存草稿</button>
			<button type="submit" name="action" value="submit">送審發布</button>
			<button type="button" class="btn-preview" onclick="openPreview()">預覽文章</button>
		</div>

	</form>

	<!-- 隱藏的預覽表單, 跟主表單分開, 避免衝突；開新分頁提交 -->
	<form id="previewForm" th:action="@{/psych/article/preview}" method="post"
		target="_blank" style="display: none;">
		<input type="hidden" name="title" id="previewTitleInput">
		<input type="hidden" name="content" id="previewContentInput">
		<input type="hidden" name="articleCatId" id="previewCatIdInput">
	</form>
	
	<script>
		// 標題字數計數
		const titleInput = document.getElementById('titleInput');
		const titleCounter = document.getElementById('titleCounter');
	
		function updateTitleCounter() {
		    titleCounter.textContent = titleInput.value.length + '/50';
		}
	
		titleInput.addEventListener('input', updateTitleCounter);
	
		// 編輯過, 點擊返回按鈕確認離開
		let formChanged = false;
		document.querySelector('form').addEventListener('input', function() {
		    formChanged = true;
		});
		document.querySelector('form').addEventListener('change', function() {
		    formChanged = true;
		});
	
		document.getElementById('backLink').addEventListener('click', function(e) {
		    if (!formChanged) {
		        return;
		    }
		    e.preventDefault();
		    const confirmLeave = confirm('尚未儲存草稿，確定要離開嗎？');
		    if (confirmLeave) {
		        window.location.href = this.href;
		    }
		});

		// 預覽：把目前表單輸入值複製到隱藏表單，開新分頁送出
		function openPreview() {
		    document.getElementById('previewTitleInput').value = titleInput.value;
		    document.getElementById('previewContentInput').value = tinymce.get('content').getContent();
		    document.getElementById('previewCatIdInput').value = document.getElementById('articleCatSelect').value;
		    document.getElementById('previewForm').submit();
		}
	</script>

	<script src="/js/tinymce/tinymce.min.js"></script>
	<script>
		tinymce.init({
			selector : '#content',
			license_key : 'gpl',
			height : 400,
			plugins : 'link image',
			toolbar : 'undo redo | blocks | bold italic | alignleft aligncenter alignright | image link',
			images_upload_handler : function(blobInfo, progress) {
				return new Promise(function(resolve, reject) {
					var xhr = new XMLHttpRequest();
					xhr.open('POST', '/psych/article/uploadImage');
					xhr.setRequestHeader(
						document.querySelector('meta[name="_csrf_header"]').content,
						document.querySelector('meta[name="_csrf"]').content
					);
					xhr.upload.onprogress = function(e) {
						progress(e.loaded / e.total * 100);
					};
					xhr.onload = function() {
						var json;
						try {
							json = JSON.parse(xhr.responseText);
						} catch (e) {
							json = null;
						}
						if (xhr.status !== 200) {
							reject((json && json.error) ? json.error : 'HTTP Error: ' + xhr.status);
							return;
						}
						if (!json || typeof json.location !== 'string') {
							reject('Invalid response: ' + xhr.responseText);
							return;
						}
						resolve(json.location);
					};
					xhr.onerror = function() {
						reject('Image upload failed due to a network error');
					};
					var formData = new FormData();
					formData.append('file', blobInfo.blob(), blobInfo.filename());
					xhr.send(formData);
				});
			},
			relative_urls : false,
			remove_script_host : true,
			convert_urls : false,
			content_css: false,
			content_style: 'body { line-height: 1.2; margin: 4px; } p { margin: 0 0 0.3em 0; }',
			setup: function(editor) {
			    editor.on('input change', function() {
			        formChanged = true;
			    });
			}
		});
	</script>
</body>
</html>
