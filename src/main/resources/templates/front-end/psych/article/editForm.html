<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>編輯文章</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC",
		sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.6;
	padding: 40px 20px;
}

h1 {
	max-width: 860px;
	margin: 0 auto 28px;
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
	padding-bottom: 16px;
	border-bottom: 2px solid #e8b4b4;
	display: flex;
	align-items: center;
	justify-content: space-between;
}

h1 a {
	display: inline-block;
	padding: 8px 20px;
	background-color: #e8b4b4;
	color: #fff;
	text-decoration: none;
	border-radius: 6px;
	font-size: 14px;
	font-weight: 500;
	transition: background-color 0.2s;
}

h1 a:hover {
	background-color: #d39393;
}

form {
	max-width: 860px;
	margin: 0 auto;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	padding: 40px;
}

form>div {
	margin-bottom: 24px;
}

label {
	display: block;
	margin-bottom: 8px;
	font-size: 15px;
	font-weight: 600;
	color: #7a6b6b;
}

input[type="text"], select {
	width: 100%;
	padding: 10px 14px;
	border: 1px solid #f2dddd;
	border-radius: 6px;
	font-size: 15px;
	color: #444;
	outline: none;
	transition: border-color 0.2s;
}

input[type="text"]:focus, select:focus {
	border-color: #e8b4b4;
	box-shadow: 0 0 0 3px rgba(232, 180, 180, 0.2);
}

textarea {
	width: 100%;
	padding: 10px 14px;
	border: 1px solid #f2dddd;
	border-radius: 6px;
	font-size: 15px;
	color: #444;
	outline: none;
	transition: border-color 0.2s;
	resize: vertical;
}

textarea:focus {
	border-color: #e8b4b4;
	box-shadow: 0 0 0 3px rgba(232, 180, 180, 0.2);
}

.field-error {
	color: #d9534f;
	font-size: 13px;
	margin-top: 4px;
}

button {
	display: inline-block;
	padding: 10px 24px;
	font-size: 15px;
	font-weight: 500;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	transition: background-color 0.2s, color 0.2s;
	margin-right: 12px;
}

button[value="draft"] {
	background-color: #fbf2f2;
	color: #7a6b6b;
	border: 1px solid #f2dddd;
}

button[value="draft"]:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

button[value="submit"] {
	background-color: #e8b4b4;
	color: #fff;
}

button[value="submit"]:hover {
	background-color: #d39393;
}

@media ( max-width : 640px) {
	form {
		padding: 24px 20px;
	}
	button {
		width: 100%;
		margin-bottom: 12px;
		margin-right: 0;
	}
}
</style>
</head>
<body>
	<h1>
		<span>編輯文章</span> <a th:href="@{/psych/article/myArticles(page=${currentPage})}" id="backLink">返回</a>
	</h1>

	<p th:if="${errorMessage}" th:text="${errorMessage}"
		style="color: red;"></p>

	<form th:action="@{/psych/article/{id}/edit(id=${articleId}, page=${currentPage})}"
		method="post" enctype="multipart/form-data">
		<div>
			<label>標題</label>
    		<input type="text" name="title" th:value="${form.title}" maxlength="50" id="titleInput" />
    		<p id="titleCounter" style="font-size: 13px; color: #999; text-align: right;">0/50</p>
			<p th:if="${titleError}" th:text="${titleError}" class="field-error"></p>
		</div>
		<div>
			<label>分類</label>
			<select name="articleCatId">
				<option value="" disabled selected>請選擇分類</option>
				<option th:each="cat : ${articleCats}"
					th:value="${cat.articleCatId}" th:text="${cat.articleCatName}"
					th:selected="${cat.articleCatId == form.articleCatId}"></option>
			</select>
			<p th:if="${catError}" th:text="${catError}" class="field-error"></p>
		</div>
		<div>
		    <label>首圖</label>
		    <div th:if="${hasCoverImage}">
		        <img id="coverPreview"
		             th:src="@{/article/{id}/cover(id=${articleId})}"
		             style="max-width: 200px; max-height: 150px; margin-bottom: 10px; border-radius: 6px;" />
		        <p id="coverFileName" style="font-size: 13px; color: #999;">已有封面圖片</p>
		    </div>
		    
		     <!-- 沒有舊圖時準備一個隱藏的 img, 選檔後顯示 -->
		    <div th:unless="${hasCoverImage}">
		        <img id="coverPreview"
		             style="max-width: 200px; max-height: 150px; margin-bottom: 10px; border-radius: 6px; display: none;" />
		        <p id="coverFileName" style="font-size: 13px; color: #999;"></p>
		    </div>
		
		    <!-- 隱藏原生 file input -->
		    <input type="file" name="coverImageFile" accept="image/*"
		           id="coverInput" style="display: none;" />
		    <!-- 自訂按鈕 -->
		    <button type="button" id="coverBtn"
		            style="padding: 8px 16px; background-color: #fbf2f2; color: #7a6b6b;
		                   border: 1px solid #f2dddd; border-radius: 6px; cursor: pointer; font-size: 14px;">
		        選擇圖片
		    </button>
		
		    <p th:if="${coverError}" th:text="${coverError}" class="field-error"></p>
		</div>
		<div>	
			<label>內容</label>
			<textarea name="content" id="content" th:text="${form.content}"></textarea>
			<p th:if="${contentError}" th:text="${contentError}" class="field-error"></p>
		</div>
		<div>
			<button type="submit" name="action" value="draft">儲存草稿</button>
			<button type="submit" name="action" value="submit">儲存並送審</button>
		</div>
	</form>
	
	<script>
		// 標題字數計數
		const titleInput = document.getElementById('titleInput');
		const titleCounter = document.getElementById('titleCounter');
	
		function updateTitleCounter() {
		    titleCounter.textContent = titleInput.value.length + '/50';
		}
	
		titleInput.addEventListener('input', updateTitleCounter);
		updateTitleCounter(); // 已帶入舊標題, 需主動呼叫計數器
	
		// 編輯過, 點擊返回按鈕確認離開
		let formChanged = false;
		document.querySelector('form').addEventListener('input', function() {
		    formChanged = true;
		});
		document.querySelector('form').addEventListener('change', function() {
		    formChanged = true;
		});
	
		document.getElementById('backLink').addEventListener('click', function(e) {
		    if (!formChanged) {
		        return;
		    }
		    e.preventDefault();
		    const confirmLeave = confirm('尚未儲存草稿，確定要離開嗎？');
		    if (confirmLeave) {
		        window.location.href = this.href;
		    }
		});
	</script>

	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>
	<script>
		tinymce.init({
			selector : '#content',
			license_key : 'gpl',
			height : 400,
			plugins : 'link image',
			toolbar : 'undo redo | blocks | bold italic | alignleft aligncenter alignright | image link',
			images_upload_url : '/article/uploadImage',
			relative_urls : false,
			remove_script_host : true,
			convert_urls : false,
			content_css: false,
			content_style: 'body { line-height: 1.2; margin: 4px; } p { margin: 0 0 0.3em 0; }',
			setup: function(editor) {
			    editor.on('input change', function() {
			        formChanged = true;
			    });
			}   
		});
	</script>	
	<script>
		// 點按鈕觸發檔案選擇
		document.getElementById('coverBtn').addEventListener('click', function() {
		    document.getElementById('coverInput').click();
		});
		// 選檔後更新預覽和檔名
		document.getElementById('coverInput').addEventListener('change', function(e) {
		    const file = e.target.files[0];
		    const preview = document.getElementById('coverPreview');
		    const fileName = document.getElementById('coverFileName');
		    if (file) {
		        preview.src = URL.createObjectURL(file);
		        preview.style.display = 'block';
		        fileName.textContent = file.name;  // 顯示檔名
		    }
		});
	</script>
</body>
</html>
