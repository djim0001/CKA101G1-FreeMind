<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />
<title>編輯文章｜諮由自在 Free Mind</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />

<style>
/* ---------- 頁首標題區 ---------- */
.form-head { background: var(--bg-warm); padding: 2.6rem 0 1.6rem; }
.form-head .crumb { font-size: .84rem; color: var(--ink-soft); letter-spacing: .04em; }
.form-head .crumb a:hover { color: var(--orange); }
.form-head .crumb span { margin: 0 .45rem; opacity: .5; }
.form-head h1 {
	font-family: var(--zen-maru); font-weight: 700;
	font-size: clamp(2rem, 3.6vw, 2.8rem); margin: .5rem 0 .4rem; line-height: 1.3;
}
.form-head h1 em { font-style: normal; color: var(--orange); }
.form-head p { color: var(--ink-soft); margin: 0; max-width: 34rem; }

/* ---------- 版面 ---------- */
.form-page { background: var(--bg-warm); padding: .6rem 0 3.4rem; }

/* ---------- 頂部動作列 ---------- */
.form-toolbar {
	display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
	margin-bottom: 1.6rem;
}
.form-toolbar .btn { padding: .68rem 1.4rem; font-size: .9rem; }

/* ---------- 表單卡片 ---------- */
.form-card {
	background: #fff; border: 1px solid var(--line);
	border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
	padding: 2.4rem 2.6rem; max-width: 860px; margin: 0 auto;
}

.form-card .field { margin-bottom: 1.6rem; }

.form-card label {
	display: block; margin-bottom: .45rem;
	font-family: var(--serif); font-size: .9rem; font-weight: 600;
	color: var(--ink); letter-spacing: .04em;
}

.form-card input[type="text"],
.form-card select {
	width: 100%; height: 48px; padding: 0 1.2rem;
	border: 1px solid var(--line); border-radius: 12px;
	background: #f6f1e8; font-family: inherit; font-size: .95rem;
	color: var(--ink); transition: border-color .2s, background .2s;
}
.form-card input[type="text"]:focus,
.form-card select:focus {
	outline: none; border-color: var(--orange); background: #fff;
}

.form-card .title-counter {
	font-size: .78rem; color: var(--ink-soft); text-align: right; margin-top: .25rem;
}

.form-card .field-error {
	color: #c0392b; font-size: .82rem; margin-top: .35rem;
}

.form-card .error-msg {
	background: #fde6e6; color: #c0392b; font-size: .88rem;
	padding: .7rem 1rem; border-radius: 10px; margin-bottom: 1.4rem;
}

/* ---------- 首圖上傳 ---------- */
.cover-preview-img {
	max-width: 220px; max-height: 160px; border-radius: 12px;
	border: 1px solid var(--line); margin-bottom: .6rem; object-fit: cover;
}
.cover-upload-btn {
	display: inline-flex; align-items: center; gap: .4rem;
	padding: .55rem 1.2rem; font-size: .86rem; font-weight: 500;
	background: #f6f1e8; color: var(--ink-soft);
	border: 1px solid var(--line); border-radius: 999px;
	cursor: pointer; transition: all .2s; font-family: inherit;
}
.cover-upload-btn:hover {
	background: var(--orange); color: #fff; border-color: var(--orange);
}

/* ---------- 底部按鈕列 ---------- */
.form-actions {
	display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
	padding-top: 1.2rem; border-top: 1px solid var(--line); margin-top: .4rem;
}

.form-actions .btn { padding: .68rem 1.6rem; font-size: .9rem; }
.form-actions .btn-spacer { margin-left: auto; }

/* ---------- 自訂下拉選單 ---------- */
.custom-select { position: relative; display: block; }
.custom-select-trigger {
	display: flex; align-items: center;
	width: 100%; height: 48px; padding: 0 2.4rem 0 1.2rem;
	border: 1px solid var(--line); border-radius: 12px;
	background: #f6f1e8; font-family: inherit; font-size: .95rem;
	color: var(--ink); cursor: pointer;
	transition: border-color .2s, background .2s;
	user-select: none; position: relative;
}
.custom-select-trigger::after {
	content: ""; position: absolute; right: 1rem; top: 50%;
	border: 5px solid transparent; border-top: 6px solid var(--ink-soft);
	transform: translateY(-1px);
	transition: transform .2s;
}
.custom-select.open .custom-select-trigger::after {
	transform: translateY(-5px) rotate(180deg);
}
.custom-select-trigger:hover { border-color: var(--orange); }
.custom-select.open .custom-select-trigger {
	border-color: var(--orange); background: #fff;
	box-shadow: 0 0 0 2px rgba(232,135,37,.15);
}
.custom-select-panel {
	display: none; position: absolute; top: calc(100% + 4px); left: 0;
	width: 100%; max-height: 220px; overflow-y: auto;
	background: #fff; border: 1px solid var(--line);
	border-radius: 12px; box-shadow: var(--shadow-md);
	z-index: 100; padding: .3rem 0;
}
.custom-select.open .custom-select-panel { display: block; }
.custom-select-option {
	padding: .65rem 1.2rem; font-size: .95rem; color: var(--ink);
	cursor: pointer; transition: background .15s;
}
.custom-select-option:hover { background: #f6f1e8; }
.custom-select-option.selected {
	font-weight: 600; color: var(--orange);
}
.custom-select-option.placeholder-opt { color: var(--ink-soft); }

/* ---------- RWD ---------- */
@media (max-width: 640px) {
	.form-card { padding: 1.6rem 1.2rem; }
	.form-actions { flex-direction: column; align-items: stretch; }
	.form-actions .btn { width: 100%; justify-content: center; }
	.form-actions .btn-spacer { margin-left: 0; }
}
</style>
</head>

<body>

<!-- ================= 導覽列 ================= -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- ================= 頁首標題 ================= -->
<section class="form-head">
	<div class="wrap">
		<div class="crumb">
			<a th:href="@{/}" href="/">首頁</a><span>/</span>
			<a th:href="@{/psych/article/myArticles}" href="#">我的文章</a><span>/</span>
			<span style="opacity:1;color:var(--ink)">編輯文章</span>
		</div>
		<span class="script" style="font-size:1.3rem;">慢慢修，慢慢好</span>
		<h1>編輯<em>文章</em></h1>
	</div>
</section>

<!-- ================= 主體 ================= -->
<section class="form-page">
	<div class="wrap">

		<!-- 頂部動作列 -->
		<div class="form-toolbar">
			<a class="btn btn-outline" th:href="@{/psych/article/myArticles(page=${currentPage})}" id="backLink">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
				回我的文章
			</a>
		</div>

		<!-- 錯誤訊息 -->
		<p class="error-msg" th:if="${errorMessage}" th:text="${errorMessage}" style="max-width:860px;"></p>

		<!-- 表單 -->
		<div class="form-card">
			<form th:action="@{/psych/article/{id}/edit(id=${articleId}, page=${currentPage})}"
				method="post" enctype="multipart/form-data" id="mainForm">

				<div class="field">
					<label>標題</label>
					<input type="text" name="title" th:value="${form.title}" maxlength="50" id="titleInput" />
					<p class="title-counter" id="titleCounter">0/50</p>
					<p th:if="${titleError}" th:text="${titleError}" class="field-error"></p>
				</div>

				<div class="field">
					<label>分類</label>
					<div class="custom-select" id="catSelectWrap">
						<div class="custom-select-trigger" id="catSelectTrigger">請選擇分類</div>
						<div class="custom-select-panel">
							<div class="custom-select-option placeholder-opt" data-value="">請選擇分類</div>
							<div th:each="cat : ${articleCats}"
								 class="custom-select-option"
								 th:data-value="${cat.articleCatId}"
								 th:text="${cat.articleCatName}"
								 th:classappend="${cat.articleCatId == form.articleCatId} ? ' selected'"></div>
						</div>
						<input type="hidden" name="articleCatId" id="articleCatSelect"
							   th:value="${form.articleCatId}" />
					</div>
					<p th:if="${catError}" th:text="${catError}" class="field-error"></p>
				</div>

				<div class="field">
					<label>首圖</label>
					<!-- 有舊圖時顯示預覽 -->
					<div th:if="${hasCoverImage}">
						<img id="coverPreview" class="cover-preview-img"
							 th:src="@{/article/{id}/cover(id=${articleId})}" />
						<p id="coverFileName" style="font-size:.78rem; color:var(--ink-soft); margin-bottom:.5rem;">已有封面圖片</p>
					</div>
					<!-- 沒有舊圖時準備一個隱藏的 img, 選檔後顯示 -->
					<div th:unless="${hasCoverImage}">
						<img id="coverPreview" class="cover-preview-img" style="display:none;" />
						<p id="coverFileName" style="font-size:.78rem; color:var(--ink-soft); margin-bottom:.5rem;"></p>
					</div>

					<input type="file" name="coverImageFile" accept="image/*"
						   id="coverInput" style="display:none;" />
					<button type="button" class="cover-upload-btn" id="coverBtn">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
						選擇圖片
					</button>
					<p th:if="${coverError}" th:text="${coverError}" class="field-error"></p>
				</div>

				<div class="field">
					<label>內容</label>
					<textarea name="content" id="content" th:text="${form.content}"></textarea>
					<p th:if="${contentError}" th:text="${contentError}" class="field-error"></p>
				</div>

				<div class="form-actions">
					<button type="submit" name="action" value="draft" class="btn btn-outline">儲存草稿</button>
					<button type="submit" name="action" value="submit" class="btn btn-primary">儲存並送審</button>
					<a th:href="@{/psych/article/{id}/preview(id=${articleId})}" target="_blank"
					   class="btn btn-ghost btn-spacer">預覽文章</a>
				</div>

			</form>
		</div>

	</div>
</section>

<!-- ================= Footer ================= -->
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: backToTop}"></div>

<script th:src="@{/js/nav.js}" src="/js/nav.js"></script>
<script>
	// 自訂下拉選單邏輯
	(function() {
		var wrap = document.getElementById('catSelectWrap');
		var trigger = document.getElementById('catSelectTrigger');
		var hidden = document.getElementById('articleCatSelect');
		var options = wrap.querySelectorAll('.custom-select-option');

		var selectedOpt = wrap.querySelector('.custom-select-option.selected');
		if (selectedOpt) {
			trigger.textContent = selectedOpt.textContent;
		}

		trigger.addEventListener('click', function(e) {
			e.stopPropagation();
			wrap.classList.toggle('open');
		});

		options.forEach(function(opt) {
			opt.addEventListener('click', function(e) {
				e.stopPropagation();
				options.forEach(function(o) { o.classList.remove('selected'); });
				if (opt.getAttribute('data-value')) {
					opt.classList.add('selected');
				}
				trigger.textContent = opt.textContent;
				hidden.value = opt.getAttribute('data-value');
				wrap.classList.remove('open');
				formChanged = true;
			});
		});

		document.addEventListener('click', function() {
			wrap.classList.remove('open');
		});
	})();
</script>
<script>
	// 標題字數計數
	var titleInput = document.getElementById('titleInput');
	var titleCounter = document.getElementById('titleCounter');

	function updateTitleCounter() {
	    titleCounter.textContent = titleInput.value.length + '/50';
	}
	titleInput.addEventListener('input', updateTitleCounter);
	updateTitleCounter();

	// 編輯過, 點擊返回按鈕確認離開
	var formChanged = false;
	document.getElementById('mainForm').addEventListener('input', function() { formChanged = true; });
	document.getElementById('mainForm').addEventListener('change', function() { formChanged = true; });

	document.getElementById('backLink').addEventListener('click', function(e) {
	    if (!formChanged) return;
	    e.preventDefault();
	    if (confirm('尚未儲存草稿，確定要離開嗎？')) {
	        window.location.href = this.href;
	    }
	});

	// 點按鈕觸發檔案選擇
	document.getElementById('coverBtn').addEventListener('click', function() {
	    document.getElementById('coverInput').click();
	});
	// 選檔後更新預覽和檔名
	document.getElementById('coverInput').addEventListener('change', function(e) {
	    var file = e.target.files[0];
	    var preview = document.getElementById('coverPreview');
	    var fileName = document.getElementById('coverFileName');
	    if (file) {
	        preview.src = URL.createObjectURL(file);
	        preview.style.display = 'block';
	        fileName.textContent = file.name;
	    }
	});
</script>

<script th:src="@{/js/tinymce/tinymce.min.js}" src="/js/tinymce/tinymce.min.js"></script>
<script>
	tinymce.init({
		selector : '#content',
		license_key : 'gpl',
		height : 400,
		plugins : 'link image',
		toolbar : 'undo redo | blocks | bold italic | alignleft aligncenter alignright | image link',
		images_upload_handler : function(blobInfo, progress) {
			return new Promise(function(resolve, reject) {
				var xhr = new XMLHttpRequest();
				xhr.open('POST', '/psych/article/uploadImage');
				xhr.setRequestHeader(
					document.querySelector('meta[name="_csrf_header"]').content,
					document.querySelector('meta[name="_csrf"]').content
				);
				xhr.upload.onprogress = function(e) {
					progress(e.loaded / e.total * 100);
				};
				xhr.onload = function() {
					var json;
					try {
						json = JSON.parse(xhr.responseText);
					} catch (e) {
						json = null;
					}
					if (xhr.status !== 200) {
						reject((json && json.error) ? json.error : 'HTTP Error: ' + xhr.status);
						return;
					}
					if (!json || typeof json.location !== 'string') {
						reject('Invalid response: ' + xhr.responseText);
						return;
					}
					resolve(json.location);
				};
				xhr.onerror = function() {
					reject('Image upload failed due to a network error');
				};
				var formData = new FormData();
				formData.append('file', blobInfo.blob(), blobInfo.filename());
				xhr.send(formData);
			});
		},
		relative_urls : false,
		remove_script_host : true,
		convert_urls : false,
		content_css: false,
		content_style: 'body { line-height: 1.2; margin: 4px auto; max-width: 698px; } p { margin: 0 0 0.3em 0; } img { max-width: 100%; height: auto; }',
		setup: function(editor) {
		    editor.on('input change', function() {
		        formChanged = true;
		    });
		}
	});
</script>
</body>
</html>
