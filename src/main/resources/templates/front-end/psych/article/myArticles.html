<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>我的文章</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC",
		sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.6;
	padding: 40px 20px;
}

h1 {
	max-width: 1000px;
	margin: 0 auto 10px;
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
}

h3 {
	max-width: 1000px;
	margin: 0 auto 24px;
}

h3 a {
	display: inline-block;
	padding: 8px 18px;
	font-size: 14px;
	font-weight: 500;
	border-radius: 6px;
	text-decoration: none;
	transition: background-color 0.2s, color 0.2s;
}

h3 a.btn-create {
	background-color: #e8b4b4;
	color: #fff;
	margin-right: 12px;
}

h3 a.btn-create:hover {
	background-color: #d39393;
}

h3 a.btn-home {
	background-color: #fbf2f2;
	color: #7a6b6b;
	border: 1px solid #f2dddd;
}

h3 a.btn-home:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

table {
	max-width: 1000px;
	width: 100%;
	margin: 0 auto;
	background: #fff;
	border-collapse: collapse;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	overflow: hidden;
	table-layout: fixed;
}

th, td {
	padding: 14px 20px;
	text-align: left;
	font-size: 15px;
}

th:nth-child(1), td:nth-child(1) {
	width: 35%;
}

th:nth-child(2), td:nth-child(2) {
	width: 22%;
	white-space: nowrap;
}

th:nth-child(3), td:nth-child(3) {
	width: 13%;
}

th:nth-child(4), td:nth-child(4) {
	width: 15%;
}

th:nth-child(5), td:nth-child(5) {
	width: 15%;
}

th {
	background-color: #fbf2f2;
	color: #7a6b6b;
	font-weight: 600;
	border-bottom: 2px solid #f2dddd;
}

td {
	color: #555;
	border-bottom: 1px solid #f9f9f9;
	word-break: break-all;
}

tr:last-child td {
	border-bottom: none;
}

tr:hover td {
	background-color: #fdfafaf5;
}

button[type="submit"] {
	display: inline-block;
	padding: 6px 16px;
	font-size: 14px;
	font-weight: 500;
	background-color: #fbf2f2;
	color: #7a6b6b;
	border: 1px solid #f2dddd;
	border-radius: 6px;
	cursor: pointer;
	transition: all 0.2s;
	font-family: inherit;
}

button[type="submit"]:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

a.btn-edit {
	display: inline-block;
	padding: 6px 16px;
	font-size: 14px;
	font-weight: 500;
	background-color: #fbf2f2;
	color: #7a6b6b;
	border: 1px solid #f2dddd;
	border-radius: 6px;
	text-decoration: none;
	cursor: pointer;
	transition: all 0.2s;
	margin-right: 6px;
}

a.btn-edit:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

a.btn-edit.disabled {
	opacity: 0.4;
	pointer-events: none;
	cursor: default;
}

button.btn-status {
	display: inline-block;
	padding: 6px 16px;
	font-size: 14px;
	font-weight: 500;
	background-color: #fbf2f2;
	color: #7a6b6b;
	border: 1px solid #f2dddd;
	border-radius: 6px;
	cursor: pointer;
	transition: all 0.2s;
	font-family: inherit;
}

button.btn-status:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

button.btn-status.disabled {
	opacity: 0.4;
	pointer-events: none;
	cursor: default;
}

.status-rejected {
	color: #d9534f;
	font-weight: bold;
}

.pagination {
	max-width: 1000px;
	margin: 24px auto 0;
	display: flex;
	justify-content: center;
	gap: 6px;
	list-style: none;
}

.pagination a, .pagination span {
	display: inline-block;
	padding: 8px 14px;
	font-size: 14px;
	font-weight: 500;
	border-radius: 6px;
	text-decoration: none;
	border: 1px solid #f2dddd;
	background-color: #fbf2f2;
	color: #7a6b6b;
	transition: all 0.2s;
}

.pagination a:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

.pagination .active {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
	pointer-events: none;
}

.pagination .disabled {
	opacity: 0.4;
	pointer-events: none;
}

.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    justify-content: center;
    align-items: center;
}

.modal-overlay.active {
    display: flex;
}

.modal-box {
    background: #fff;
    border-radius: 10px;
    padding: 24px;
    max-width: 500px;
    width: 90%;
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.modal-box h3 {
    margin-bottom: 12px;
    font-size: 18px;
    color: #4a3e3e;
}

.modal-box p {
    margin-bottom: 10px;
    font-size: 15px;
    color: #555;
    white-space: pre-wrap;
    word-break: break-word;
}

.modal-close {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 16px;
    font-size: 14px;
    background-color: #e8b4b4;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.modal-close:hover {
    background-color: #d39393;
}

@media ( max-width : 768px) {
	table {
		display: block;
		overflow-x: auto;
		white-space: nowrap;
		table-layout: auto;
	}
}
</style>
</head>
<body>
	<h1>我的文章</h1>
	<h3>
		<a class="btn-create" th:href="@{/psych/article/create}">新增文章</a> <a
			class="btn-home" th:href="@{/}">回首頁</a>
	</h3>
	<table>
		<thead>
			<tr>
				<th>標題</th>
				<th>文章分類</th>
				<th>文章狀態</th>
				<th>建立時間</th>
				<th>操作</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="article : ${articlePage.content}">
				<td th:text="${article.title}"></td>
				<td
					th:text="${article.articleCat != null ? article.articleCat.articleCatName : '未分類'}"></td>
				<td th:text="${article.articleStatus}"
					th:classappend="${article.articleStatus == 3} ? 'status-rejected' : ''"></td>
				<td th:text="${article.createdAt}"></td>
					<td>
					<!-- 草稿+已發布：編輯 已發布：送審, 刪除 -->
				    <a th:if="${article.articleStatus == 0 || article.articleStatus == 2}"
				       th:href="@{/psych/article/{id}/edit(id=${article.articleId})}"
				       class="btn-edit">編輯</a>
				
				    <form th:if="${article.articleStatus == 0}"
				          th:action="@{/psych/article/{id}/submit(id=${article.articleId})}"
				          method="post" style="display: inline;">
				        <button type="submit" class="btn-status">送審</button>
				    </form>
				
				    <form th:if="${article.articleStatus == 0}"
				          th:action="@{/psych/article/{id}/delete(id=${article.articleId})}"
				          method="post" style="display: inline;"
				          onsubmit="return confirm('確定要刪除此草稿嗎？刪除後無法復原');">
				        <button type="submit" class="btn-status">刪除</button>
				    </form>
				
				    <!-- 審核中 -->
				    <a th:if="${article.articleStatus == 1}"
				       class="btn-edit disabled">審核中</a>
				
				    <!-- 已發布：查看, 下架 -->
					<a th:if="${article.articleStatus == 2}"
					   th:href="@{/article/detail/{id}(id=${article.articleId})}"
					   target="_blank"
					   class="btn-edit">查看</a>
				    <form th:if="${article.articleStatus == 2}"
				          th:action="@{/psych/article/{id}/unpublish(id=${article.articleId})}"
				          method="post" style="display: inline;"
				          onsubmit="return confirm('確定要下架此文章嗎？');">
				        <button type="submit" class="btn-status">下架</button>
				    </form>
				
				    <!-- 審核未通過：編輯, 查看退回原因, 刪除 -->
				    <a th:if="${article.articleStatus == 3}"
					   th:href="@{/psych/article/{id}/edit(id=${article.articleId})}"
					   class="btn-edit">編輯</a>
   
					<button th:if="${article.articleStatus == 3}"
					        class="btn-status"
					        th:data-reason="${article.rejectReason}"
					        th:data-note="${article.rejectNote}"
					        onclick="showRejectDetail(this)">查看</button>
				
					<form th:if="${article.articleStatus == 3}"
					      th:action="@{/psych/article/{id}/delete(id=${article.articleId})}"
					      method="post" style="display: inline;"
					      onsubmit="return confirm('確定要刪除此草稿嗎？刪除後無法復原。');">
					    <button type="submit" class="btn-status">刪除</button>
					</form>

				    <!-- 已下架：編輯, 查看 -->
				    <a th:if="${article.articleStatus == 4}" class="btn-edit disabled">編輯</a>
					<button th:if="${article.articleStatus == 4}" class="btn-status disabled" disabled>查看</button>
				</td>
			</tr>
		</tbody>
	</table>

	<ul class="pagination" th:if="${articlePage.totalPages > 1}">
		<li><a th:if="${currentPage > 1}"
			th:href="@{/psych/article/myArticles(page=${currentPage - 1})}">上一頁</a>
			<span th:if="${currentPage <= 1}" class="disabled">上一頁</span></li>

		<li th:each="i : ${#numbers.sequence(1, articlePage.totalPages)}">
			<a th:if="${i != currentPage}"
			th:href="@{/psych/article/myArticles(page=${i})}" th:text="${i}"></a>
			<span th:if="${i == currentPage}" class="active" th:text="${i}"></span>
		</li>

		<li><a th:if="${currentPage < articlePage.totalPages}"
			th:href="@{/psych/article/myArticles(page=${currentPage + 1})}">下一頁</a>
			<span th:if="${currentPage >= articlePage.totalPages}"
			class="disabled">下一頁</span></li>
	</ul>
	
	<!-- 退回原因 Modal -->
	<div id="rejectModal" class="modal-overlay" onclick="closeModal(event)">
	    <div class="modal-box">
	        <h3>退回原因</h3>
	        <p id="modalReason"></p>
	        <p id="modalNote"></p>
	        <button class="modal-close" onclick="closeModal()">關閉</button>
	    </div>
	</div>

	<script th:if="${alertMessage}">
		window.onload = function() {
			alert('[[${alertMessage}]]');
		};
	</script>	
		
	<script>	
		function showRejectDetail(btn) {
			const reasonMap = {
		            '0': '內容品質',
		            '1': '違反專業法規',
		            '2': '版權問題',
		            '3': '違反平台規範',
		            '4': '其他'
		        };
		        const reasonCode = btn.getAttribute('data-reason');
		        const note = btn.getAttribute('data-note');
		        const reasonText = reasonMap[reasonCode] || '未知';

		        document.getElementById('modalReason').textContent = '退回原因：' + reasonText;
		        document.getElementById('modalNote').textContent = note ? '退回說明：' + note : '';
		        document.getElementById('rejectModal').classList.add('active');
		    }

		    function closeModal(event) {
		        if (!event || event.target === document.getElementById('rejectModal') || event.target.classList.contains('modal-close')) {
		            document.getElementById('rejectModal').classList.remove('active');
		        }
		    }
	</script>

</body>
</html>
