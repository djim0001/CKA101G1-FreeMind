<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>數據總覽</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC",
		sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.6;
	padding: 40px 20px;
}

h1 {
	max-width: 1100px;
	margin: 0 auto 10px;
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
}

h3 {
	max-width: 1100px;
	margin: 0 auto 24px;
}

h3 a {
	display: inline-block;
	padding: 8px 18px;
	font-size: 14px;
	font-weight: 500;
	border-radius: 6px;
	text-decoration: none;
	transition: background-color 0.2s, color 0.2s;
}

h3 a.btn-back {
	background-color: #fbf2f2;
	color: #7a6b6b;
	border: 1px solid #f2dddd;
}

h3 a.btn-back:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

.dashboard-wrap {
	max-width: 1100px;
	margin: 0 auto;
}

.section-title {
	font-size: 16px;
	font-weight: 700;
	color: #7a6b6b;
	margin: 24px 0 12px;
}

.section-title:first-child {
	margin-top: 0;
}

.stats-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 16px;
}

.stats-item {
	background: #fff;
	border: 1px solid #f2dddd;
	border-radius: 12px;
	padding: 24px;
	text-align: center;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
}

.stats-item .stats-label {
	font-size: 14px;
	color: #7a6b6b;
	margin-bottom: 10px;
}

.stats-item .stats-value {
	font-size: 32px;
	font-weight: 700;
	color: #4a3e3e;
}

.stats-item.status-published .stats-value {
	color: #5a9e6f;
}

.stats-item.status-unpublished .stats-value {
	color: #d9534f;
}

@media (max-width: 768px) {
	.stats-grid {
		grid-template-columns: 1fr;
	}
}
</style>
</head>
<body>
	<h1>數據總覽</h1>
	<h3>
		<a class="btn-back" th:href="@{/psych/article/myArticles}">回我的文章</a>
	</h3>

	<div class="dashboard-wrap">

		<!-- 文章狀態統計 -->
		<div class="section-title">文章狀態</div>
		<div class="stats-grid">
			<div class="stats-item status-published">
				<div class="stats-label">已上架文章</div>
				<div class="stats-value" th:text="${summary.totalPublishedCount}">0</div>
			</div>
			<div class="stats-item status-unpublished">
				<div class="stats-label">已下架文章</div>
				<div class="stats-value" th:text="${summary.totalUnPublishedCount}">0</div>
			</div>
		</div>

		<!-- 互動數據統計 -->
		<div class="section-title">互動數據總計</div>
		<div class="stats-grid">
			<div class="stats-item">
				<div class="stats-label">總瀏覽數</div>
				<div class="stats-value" th:text="${summary.totalViewCount}">0</div>
			</div>
			<div class="stats-item">
				<div class="stats-label">總按讚數</div>
				<div class="stats-value" th:text="${summary.totalLikeCount}">0</div>
			</div>
			<div class="stats-item">
				<div class="stats-label">總收藏數</div>
				<div class="stats-value" th:text="${summary.totalBookmarkCount}">0</div>
			</div>
			<div class="stats-item">
				<div class="stats-label">總分享數</div>
				<div class="stats-value" th:text="${summary.totalShareCount}">0</div>
			</div>
		</div>
	</div>
</body>
</html>
