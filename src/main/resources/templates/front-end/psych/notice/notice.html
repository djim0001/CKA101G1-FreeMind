<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>我的通知</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/psych/psych.css}" href="/css/psych.css" />

<style>
/* 本頁專屬:notice */
.psych-page .unread-count { font-family: var(--sans); font-size: .9rem; font-weight: 500; color: var(--orange-deep); }

/* 篩選列 + 一鍵已讀 */
.psych-page .toolbar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
.psych-page .filter-btn {
	padding: .45rem 1.1rem; border-radius: 999px; font-size: .9rem;
	background: #fff; color: var(--ink-soft); border: 1px solid var(--line);
	text-decoration: none; transition: background .2s, color .2s, border-color .2s, transform .2s;
}
.psych-page .filter-btn:hover { transform: translateY(-2px); color: var(--orange); border-color: var(--orange); }
.psych-page .filter-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }
.psych-page .toolbar form { margin-left: auto; }
.psych-page .toolbar button {
	padding: .45rem 1.1rem; border-radius: 999px; font-size: .9rem; cursor: pointer;
	background: #fff; color: var(--ink); border: 1px solid var(--line);
	font-family: var(--sans); transition: background .2s, color .2s, border-color .2s;
}
.psych-page .toolbar button:hover { background: var(--orange); color: #fff; border-color: var(--orange); }

/* 通知卡 */
.psych-page .notice-list { display: flex; flex-direction: column; gap: .7rem; }
.psych-page .notice-list .empty-hint { text-align: center; padding: 2.5rem 0; }
.psych-page .notice-card {
	background: #fff; border-radius: var(--radius-md); padding: 1rem 1.25rem;
	box-shadow: var(--shadow-sm); border: 1px solid var(--line);
	border-left: 4px solid transparent; transition: box-shadow .2s, transform .2s;
}
.psych-page .notice-card.unread { border-left-color: var(--orange); background: #fffdf6; cursor: pointer; }
.psych-page .notice-card.unread:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.psych-page .notice-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .3rem; }
.psych-page .type-badge {
	padding: .15rem .7rem; border-radius: 999px; font-size: .76rem;
	background: var(--pink-soft); color: var(--orange-deep);
}
/* 覆蓋 styles.css 的 .dot(導覽列紅點),避免未讀點被絕對定位 */
.psych-page .notice-head .dot {
	position: static; width: 8px; height: 8px; border-radius: 50%;
	background: var(--orange); border: none; flex: 0 0 auto;
}
.psych-page .time { font-size: .76rem; color: var(--ink-soft); margin-left: auto; }
.psych-page .content { font-size: .95rem; color: var(--ink); white-space: pre-wrap; word-break: break-all; }
.psych-page .notice-card:not(.unread) .content { color: var(--ink-soft); }
</style>
</head>

<body class="psych-page">

	<div th:replace="~{fragments/header :: header}"></div>

	<main class="psych-wrap w-md">

		<div class="psych-head">
			<div>
				<span class="script">Notifications</span>
				<h1>
					我的通知
					<span class="unread-count" th:if="${unreadCount > 0}"
						th:text="'(' + ${unreadCount} + ' 則未讀)'"></span>
				</h1>
			</div>
			<div class="head-actions">
				<a class="btn btn-ghost" th:href="@{/}">返回首頁</a>
			</div>
		</div>

		<div class="toolbar">
			<a class="filter-btn" th:classappend="${type == null} ? 'active'" th:href="@{/psych/notice}">全部</a>
			<a class="filter-btn" th:classappend="${type != null && type == 0} ? 'active'"
				th:href="@{/psych/notice(type=0)}" th:text="'文章審核'">文章審核</a>
			<a class="filter-btn" th:classappend="${type != null && type == 1} ? 'active'"
				th:href="@{/psych/notice(type=1)}" th:text="'預約'">預約</a>
			<a class="filter-btn" th:classappend="${type != null && type == 2} ? 'active'"
				th:href="@{/psych/notice(type=2)}" th:text="'課程'">課程</a>
			<form th:action="@{/psych/notice/readAll}" method="post">
				<input type="hidden" name="type" th:value="${type}" th:if="${type != null}" />
				<button type="submit" th:if="${unreadCount > 0}">全部標為已讀</button>
			</form>
		</div>

		<div class="notice-list">
			<!-- 未讀:整張卡可點,點了送出隱藏表單標已讀 -->
			<div th:each="n : ${notices}"
				th:classappend="${!n.isRead} ? 'unread'"
				class="notice-card"
				th:attr="data-form-id='readForm-' + ${n.psychNoticeId}"
				onclick="var f=document.getElementById(this.dataset.formId); if(f) f.submit();">

				<div class="notice-head">
					<span class="dot" th:if="${!n.isRead}"></span>
					<span class="type-badge" th:text="${n.noticeTypeMsg}">預約通知</span>
					<span class="time"
						th:text="${#dates.format(n.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-15 10:00</span>
				</div>
				<p class="content" th:text="${n.noticeContent}">通知內容</p>

				<form th:if="${!n.isRead}" th:id="'readForm-' + ${n.psychNoticeId}"
					th:action="@{/psych/notice/{id}/read(id=${n.psychNoticeId})}" method="post"
					style="display: none;">
					<input type="hidden" name="type" th:value="${type}" th:if="${type != null}" />
				</form>
			</div>

			<p class="empty-hint" th:if="${#lists.isEmpty(notices)}">目前沒有任何通知</p>
		</div>

	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script src="/js/nav.js"></script>
</body>
</html>
