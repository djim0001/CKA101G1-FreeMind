<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>收藏課程｜我的療癒足跡</title>
  <link rel="stylesheet" th:href="@{/css/course/member-style.css}" />
</head>
<body class="thy2-member healing-page coupon-tone-page">
<header class="site-header">
  <a class="brand" th:href="@{/}">諮由自在 Free Mind<small>MY HEALING JOURNEY</small></a>
  <nav class="main-nav"><a th:href="@{/member/course/select_course}">探索課程</a><a th:href="@{/member/dashboard}">我的療癒足跡</a><a class="active" th:href="@{/member/dashboard/myCollection/course}">我的收藏</a><a th:href="@{/member/coupon/my_coupon}">我的優惠券</a><a th:href="@{/member/course/my_course_order}">訂單紀錄</a></nav>
  <div class="header-actions">
    <a class="cart-link" th:href="@{/member/course/shopping_cart}">購物車</a>
    <a class="profile-entry" th:href="@{/member/profile}">
      
      <span th:text="${member.name}">會員</span>
    </a>
  </div>
</header>

<main class="container healing-shell">
  <div class="healing-header">
    <div>
      <p class="eyebrow">My collection</p>
      <h1>我的療癒足跡／收藏課程</h1>
    </div>
    <a class="btn" th:href="@{/member/dashboard}">返回我的療癒足跡</a>
  </div>

  <div class="notice member-message" th:if="${cartMsg != null}" th:text="${cartMsg}"></div>

  <div class="empty-state" th:if="${myBookmarks == null || myBookmarks.isEmpty()}">
    <h3>尚無收藏課程</h3>
    <a class="btn" th:href="@{/member/course/select_course}">探索課程</a>
  </div>

  <section class="course-grid" th:if="${myBookmarks != null && !myBookmarks.isEmpty()}">
    <article
      class="course-card"
      data-course-card
      th:each="course : ${myBookmarks}"
      th:attr="data-category=${course.courseCategories.courseCatName}">
      <a
        class="course-cover course-video-cover course-cover-link"
        th:href="@{/member/course/get_one_course/{courseId}(courseId=${course.courseId})}"
        th:attr="aria-label=${'查看「' + course.courseName + '」課程詳情'}">
        <video
          muted
          playsinline
          preload="metadata"
          data-course-thumbnail
          th:src="${course.videoSrcPre != null and !#strings.isEmpty(course.videoSrcPre) ? course.videoSrcPre : course.videoSrc}"
          th:attr="aria-label=${course.courseName + '影片預覽圖'}">
        </video>
        <span th:text="${course.courseCategories.courseCatName}">課程分類</span>
      </a>

      <div class="course-body">
        <span class="tag">已收藏</span>
        <h3 th:text="${course.courseName}">課程名稱</h3>
        <p class="meta"><span th:text="${course.psychologist.name}">心理師</span> 心理師</p>
        <div class="course-stats">
          <span>收藏 <b th:text="${course.saveCount}">0</b></span>
          <span>平均星數 <b th:text="${course.reviewCount == 0 ? 0 : course.starCount / course.reviewCount}">0</b></span>
          <span>評價 <b th:text="${course.reviewCount}">0</b></span>
          <span>提問 <b th:text="${course.commentCount}">0</b></span>
        </div>

        <div class="price-row">
          <span class="price">NT$ <span th:text="${course.price}">0</span></span>
        </div>

        <div class="inline-actions">
          <form method="post" th:action="@{/member/course/add_cart}">
            <input type="hidden" name="courseId" th:value="${course.courseId}">
            <input type="hidden" name="returnUrl">
            <button class="btn" type="submit">加入購物車</button>
          </form>
          <form method="post" th:action="@{/member/dashboard/favorite/toggle}">
            <input type="hidden" name="courseId" th:value="${course.courseId}">
            <input type="hidden" name="returnUrl">
            <button class="btn ghost" type="submit">
              <span class="favorite-heart" aria-hidden="true">♥</span>
              <span>取消收藏</span>
            </button>
          </form>
        </div>
      </div>
    </article>
  </section>

  <div th:replace="~{fragments/pagination :: pagination(${currentPage}, ${totalPages}, '/member/dashboard/myCollection/course')}"></div>
</main>

<footer class="site-footer">收藏喜歡的內容，留給需要時的自己。</footer>
<script th:src="@{/js/course/member-js.js}"></script>
</body>
</html>
