<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>探索課程｜諮由自在</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" type="text/css"
		th:href="@{/css/styles.css}" href="/css/styles.css" />
	<style>
		.course-market {
			position: relative;
			padding: clamp(2.75rem, 6vw, 4.75rem) 0 5rem;
			isolation: isolate;
		}

		.course-market::before {
			position: absolute;
			z-index: -1;
			top: 1.5rem;
			right: -7vw;
			width: clamp(180px, 25vw, 340px);
			aspect-ratio: 1;
			border-radius: 50%;
			background: rgba(194, 217, 237, .42);
			content: "";
			filter: blur(1px);
		}

		.course-market .hero {
			display: grid;
			grid-template-columns: minmax(0, 1.35fr) minmax(220px, .65fr);
			align-items: center;
			gap: clamp(2rem, 6vw, 5rem);
			padding-bottom: clamp(2rem, 5vw, 3.6rem);
		}

		.course-market .hero h1 {
			max-width: 13em;
			margin: .7rem 0 1rem;
			font-family: var(--zen-maru);
			font-size: clamp(2rem, 4.2vw, 3.15rem);
			font-weight: 700;
			letter-spacing: .01em;
			line-height: 1.28;
		}

		.course-market .hero p:last-child {
			max-width: 34rem;
			margin: 0;
			color: var(--ink-soft);
			font-size: 1.02rem;
		}

		.course-market .hero-art {
			position: relative;
			width: min(100%, 280px);
			aspect-ratio: 1;
			justify-self: end;
			border-radius: 52% 48% 44% 56% / 48% 42% 58% 52%;
			background:
				radial-gradient(circle at 38% 35%, var(--white) 0 9%, transparent 10%),
				linear-gradient(145deg, var(--pink-soft), var(--bg-soothing));
			box-shadow: var(--shadow-md);
		}

		.course-market .hero-art::before,
		.course-market .hero-art::after {
			position: absolute;
			border-radius: 999px 999px 22px 22px;
			content: "";
			transform-origin: bottom center;
		}

		.course-market .hero-art::before {
			left: 38%;
			bottom: 23%;
			width: 24%;
			height: 43%;
			background: rgba(155, 184, 147, .75);
			transform: rotate(-22deg);
		}

		.course-market .hero-art::after {
			right: 26%;
			bottom: 21%;
			width: 20%;
			height: 36%;
			background: rgba(245, 142, 107, .72);
			transform: rotate(24deg);
		}

		.course-market .toolbar {
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(190px, 240px) auto;
			gap: .85rem;
			margin-bottom: 1.25rem;
			padding: 1rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}

		.course-market .field {
			width: 100%;
			min-height: 48px;
			padding: .75rem 1rem;
			border: 1px solid var(--line);
			border-radius: 14px;
			outline: none;
			color: var(--ink);
			background: var(--bg-warm);
			font: inherit;
			transition: border-color .18s, box-shadow .18s, background .18s;
		}

		.course-market .field:focus {
			border-color: var(--orange);
			background: var(--white);
			box-shadow: 0 0 0 3px rgba(245, 142, 107, .14);
		}

		.course-market .course-filter-row {
			display: grid;
			gap: 1rem;
			margin-bottom: clamp(2.5rem, 5vw, 4rem);
			padding: 1.15rem 1.25rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: rgba(255, 255, 255, .62);
		}

		.course-market .course-filter-group {
			display: grid;
			grid-template-columns: 6rem minmax(0, 1fr);
			align-items: start;
			gap: .85rem;
		}

		.course-market .course-filter-label {
			margin: .15rem 0 0;
			color: var(--ink-soft);
			font-size: .86rem;
			font-weight: 700;
			letter-spacing: .08em;
		}

		.course-market .tabs {
			display: flex;
			gap: .55rem;
			flex-wrap: wrap;
		}

		.course-market .tabs a,
		.course-market .tabs button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 40px;
			padding: .55rem 1rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--ink-soft);
			background: var(--white);
			font-size: .9rem;
			font-weight: 500;
			transition: color .18s, border-color .18s, background .18s,
				transform .18s;
		}

		.course-market .tabs a:hover,
		.course-market .tabs button:hover,
		.course-market .tabs .active {
			border-color: var(--orange);
			color: var(--white);
			background: var(--orange);
			transform: translateY(-1px);
		}

		.course-market .section-head {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 1.5rem;
			margin-bottom: 1.65rem;
			padding-bottom: 1.15rem;
			border-bottom: 1px solid var(--line);
		}

		.course-market .section-head h2 {
			margin: .2rem 0 0;
			font-family: var(--serif);
			font-size: clamp(1.8rem, 3vw, 2.4rem);
			line-height: 1.35;
		}

		.course-market .section-head > p {
			margin: 0;
			color: var(--ink-soft);
		}

		.course-market .empty-state {
			margin-bottom: 1.5rem;
			padding: clamp(2rem, 6vw, 4rem);
			border: 1px dashed var(--line);
			border-radius: var(--radius-lg);
			background: var(--white);
			text-align: center;
		}

		.course-market .empty-state h3 {
			margin: 0 0 .45rem;
			font-family: var(--serif);
			font-size: 1.35rem;
		}

		.course-market .empty-state p {
			margin: 0;
			color: var(--ink-soft);
		}

		.course-market .course-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 1.4rem;
		}

		.course-market .course-card {
			display: flex;
			min-width: 0;
			overflow: hidden;
			flex-direction: column;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
			transition: transform .25s, box-shadow .25s;
		}

		.course-market .course-card:hover {
			box-shadow: var(--shadow-md);
			transform: translateY(-5px);
		}

		.course-market .course-cover {
			position: relative;
			display: block;
			overflow: hidden;
			aspect-ratio: 16 / 9;
			background: linear-gradient(135deg, var(--blue-soft), var(--pink-soft));
		}

		.course-market .course-cover video {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transition: transform .35s;
		}

		.course-market .course-card:hover .course-cover video {
			transform: scale(1.035);
		}

		.course-market .course-cover > span {
			position: absolute;
			left: 1rem;
			bottom: 1rem;
			padding: .32rem .72rem;
			border-radius: 999px;
			color: var(--ink);
			background: rgba(255, 255, 255, .92);
			font-size: .76rem;
			font-weight: 500;
			box-shadow: var(--shadow-sm);
		}

		.course-market .course-body {
			display: flex;
			flex: 1;
			flex-direction: column;
			padding: 1.3rem;
		}

		.course-market .tag {
			align-self: flex-start;
			padding: .27rem .68rem;
			border-radius: 999px;
			color: var(--orange-deep);
			background: var(--pink-soft);
			font-size: .74rem;
			font-weight: 700;
			letter-spacing: .06em;
		}

		.course-market .course-body h3 {
			margin: .75rem 0 .35rem;
			font-family: var(--serif);
			font-size: 1.16rem;
			line-height: 1.5;
		}

		.course-market .meta {
			margin: 0 0 .8rem;
			color: var(--ink-soft);
			font-size: .86rem;
		}

		.course-market .course-stats {
			display: flex;
			gap: .4rem .85rem;
			flex-wrap: wrap;
			color: var(--ink-soft);
			font-size: .8rem;
		}

		.course-market .course-stats b {
			color: var(--ink);
		}

		.course-market .price-row {
			margin-top: auto;
			padding-top: 1rem;
			border-top: 1px solid var(--line);
		}

		.course-market .course-list-price-block {
			width: 100%;
		}

		.course-market .course-list-discount {
			display: grid;
			grid-template-columns: max-content minmax(0, 1fr);
			align-items: center;
			gap: .45rem .7rem;
		}

		.course-market .course-list-discount p {
			margin: 0;
		}

		.course-market .original-price {
			color: var(--ink-soft);
			font-size: .8rem;
			white-space: nowrap;
		}

		.course-market .original-price del {
			text-decoration-color: var(--orange-deep);
			text-decoration-thickness: 2px;
		}

		.course-market .price {
			color: var(--orange-deep);
			font-size: 1.08rem;
			font-weight: 700;
		}

		.course-market .discount-price {
			display: flex;
			min-width: 0;
			align-items: center;
			gap: .42rem;
			white-space: nowrap;
		}

		.course-market .discount-badge {
			display: inline-flex;
			align-items: center;
			padding: .2rem .52rem;
			border-radius: 999px;
			color: var(--orange-deep);
			background: var(--pink-soft);
			font-size: .7rem;
			font-weight: 700;
			letter-spacing: .04em;
		}

		.course-market .discount-period {
			grid-column: 1 / -1;
			color: var(--ink-soft);
			font-size: .74rem;
			line-height: 1.65;
		}

		.course-market .discount-date-range {
			display: flex;
			gap: .2rem;
			flex-wrap: wrap;
			color: var(--ink);
			font-weight: 500;
		}

		.course-market .inline-actions {
			display: flex;
			gap: .6rem;
			margin-top: 1rem;
			flex-wrap: wrap;
		}

		.course-market .inline-form {
			margin: 0;
		}

		.course-market .inline-actions .btn {
			padding: .68rem 1.05rem;
			font-size: .88rem;
		}

		.course-market .favorite-toggle.is-active {
			color: var(--orange-deep);
			box-shadow: inset 0 0 0 1px var(--orange);
		}

		.course-market .favorite-heart {
			color: var(--orange-deep);
			font-size: 1.05rem;
		}

		.thy2-member .floating-cart {
			position: fixed;
			z-index: 85;
			right: 24px;
			bottom: 88px;
			display: grid;
			width: 54px;
			height: 54px;
			place-items: center;
			border-radius: 50%;
			color: var(--white);
			background: var(--ink);
			box-shadow: var(--shadow-md);
			transition: transform .2s, background .2s;
		}

		.thy2-member .floating-cart:hover {
			background: var(--orange-deep);
			transform: translateY(-3px);
		}

		.thy2-member .floating-cart svg {
			width: 25px;
			height: 25px;
		}

		.thy2-member .floating-cart-count {
			position: absolute;
			top: -5px;
			right: -4px;
			display: grid;
			min-width: 23px;
			height: 23px;
			padding: 0 5px;
			place-items: center;
			border: 2px solid var(--white);
			border-radius: 999px;
			color: var(--white);
			background: var(--orange);
			font-size: .7rem;
			font-weight: 700;
		}

		.course-market [data-cart-message][hidden] {
			display: none;
		}

		@media (max-width: 980px) {
			.course-market .toolbar {
				grid-template-columns: minmax(0, 1fr) minmax(180px, .55fr);
			}

			.course-market .toolbar .btn {
				grid-column: 1 / -1;
				justify-self: start;
			}

			.course-market .course-grid {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}
		}

		@media (max-width: 720px) {
			.course-market {
				padding-top: 2.4rem;
			}

			.course-market .hero {
				grid-template-columns: 1fr;
			}

			.course-market .hero-art {
				display: none;
			}

			.course-market .toolbar,
			.course-market .course-filter-group {
				grid-template-columns: 1fr;
			}

			.course-market .toolbar .btn {
				width: 100%;
				justify-content: center;
			}

			.course-market .course-filter-label {
				margin: 0;
			}

			.course-market .section-head {
				display: block;
			}

			.course-market .section-head > p {
				margin-top: .55rem;
			}

			.course-market .course-grid {
				grid-template-columns: 1fr;
			}
		}

		@media (max-width: 520px) {
			.course-market .tabs > * {
				flex: 1 1 auto;
			}

			.course-market .course-list-discount {
				gap: .35rem .45rem;
			}

			.course-market .original-price {
				font-size: .74rem;
			}

			.course-market .discount-price {
				gap: .3rem;
				font-size: .98rem;
			}

			.course-market .discount-badge {
				padding-inline: .4rem;
				font-size: .64rem;
			}

			.course-market .inline-actions,
			.course-market .inline-form,
			.course-market .inline-actions .btn {
				width: 100%;
			}

			.course-market .inline-actions .btn {
				justify-content: center;
			}

			.thy2-member .floating-cart {
				right: 16px;
				bottom: 72px;
				width: 48px;
				height: 48px;
			}
		}
	</style>
</head>
<body class="thy2-member"
	th:attr="data-member-unread-count=${countMemberUnread != null ? countMemberUnread : ''}">
	<div th:replace="~{fragments/header :: header}"></div>

	<main class="wrap course-market">
		<section class="hero" aria-labelledby="course-market-title">
			<div>
				<p class="eyebrow">Course market</p>
				<h1 id="course-market-title">找到適合此刻的心理課程</h1>
				<p>用自己的速度學習，從理解情緒、關係與自我開始。</p>
			</div>
			<div class="hero-art" aria-hidden="true"></div>
		</section>

		<div data-cart-message hidden th:if="${cartMsg != null}"
			th:text="${cartMsg}"></div>

		<form class="toolbar" method="get"
			th:action="@{/member/course/select_course}">
			<input class="field" type="search" name="keyword"
				placeholder="搜尋課程名稱或心理師……" aria-label="搜尋課程"
				data-course-search>
			<select class="field" name="orderBy" aria-label="課程排列方式">
				<option value="listedAt"
					th:selected="${orderBy == 'listedAt'}">最新上架</option>
				<option value="popular"
					th:selected="${orderBy == 'popular'}">熱門課程</option>
				<option value="priceAsc"
					th:selected="${orderBy == 'priceAsc'}">價格由低至高</option>
				<option value="priceDesc"
					th:selected="${orderBy == 'priceDesc'}">價格由高至低</option>
			</select>
			<button class="btn btn-primary" type="submit">搜尋課程</button>
		</form>

		<div class="course-filter-row" role="group" aria-label="課程篩選條件">
			<div class="course-filter-group">
				<p class="course-filter-label">排序方式</p>
				<form class="tabs course-sort-tabs" method="get"
					th:action="@{/member/course/select_course}" aria-label="課程排序">
					<button type="submit" name="orderBy" value="popular"
						th:classappend="${orderBy == 'popular'} ? 'active' : ''">熱門課程</button>
					<button type="submit" name="orderBy" value="listedAt"
						th:classappend="${orderBy == null or orderBy == '' or orderBy == 'listedAt'} ? 'active' : ''">最新課程</button>
				</form>
			</div>

			<div class="course-filter-group">
				<p class="course-filter-label">課程分類</p>
				<form class="tabs course-category-tabs" method="get"
					th:action="@{/member/course/select_course}" aria-label="課程分類">
					<a th:href="@{/member/course/select_course}"
						th:classappend="${param.courseCatId == null or #strings.isEmpty(param.courseCatId[0])} ? 'active' : ''">全部課程</a>
					<button type="submit" name="keyword"
						th:each="courseCategories : ${courseCategoriesListAll}"
						th:value="${courseCategories.courseCatName}"
						th:text="${courseCategories.courseCatName}"
						th:classappend="${param.courseCatId != null and param.courseCatId[0] == #strings.toString(courseCategories.courseCatId)} ? 'active' : ''">課程分類</button>
				</form>
			</div>
		</div>

		<div class="section-head">
			<div>
				<p class="eyebrow">Available courses</p>
				<h2 id="available-course-title">所有課程</h2>
			</div>
			<p>依你的步調，選一堂想開始的課。</p>
		</div>

		<div class="empty-state"
			th:if="${courseList == null || courseList.isEmpty()}">
			<h3>目前沒有符合條件的課程</h3>
			<p>請調整搜尋條件後再試一次。</p>
		</div>

		<section class="course-grid" aria-labelledby="available-course-title">
			<article class="course-card" data-course-card
				th:each="course : ${courseList}"
				th:attr="data-category=${course.courseCategories.courseCatId}">
				<a class="course-cover course-video-cover course-cover-link"
					th:href="@{/member/course/get_one_course/{courseId}(courseId=${course.courseId})}"
					th:attr="aria-label=${'查看「' + course.courseName + '」課程詳情'}">
					<video muted playsinline preload="metadata" data-course-thumbnail
						th:src="${course.videoSrcPre != null and !#strings.isEmpty(course.videoSrcPre) ? course.videoSrcPre : course.videoSrc}"
						th:attr="aria-label=${course.courseName + '影片預覽圖'}"></video>
					<span th:text="${course.courseCategories.courseCatName}">課程分類</span>
				</a>

				<div class="course-body">
					<span class="tag"
						th:text="${course.courseCategories.courseCatName}">分類</span>
					<h3 th:text="${course.courseName}">課程名稱</h3>
					<p class="meta">
						<span th:text="${course.psychologist.name}">心理師</span> 心理師
					</p>

					<div class="course-stats">
						<span>收藏 <b th:text="${course.saveCount}">0</b></span>
						<span>評價 <b th:text="${course.reviewCount}">0</b></span>
						<span>提問 <b th:text="${course.commentCount}">0</b></span>
					</div>

					<div class="price-row">
						<div class="course-list-price-block">
							<div class="course-list-discount"
								th:if="${course.isDiscountValid() == true}">
								<p class="original-price">
									原價
									<del>NT$ <span th:text="${course.price}">0</span></del>
								</p>
								<p class="price discount-price">
									<span class="discount-badge">限時優惠</span>
									<span>NT$ <span
										th:text="${course.price * course.psychDiscount}">0</span></span>
								</p>
								<p class="discount-period">
									<span>優惠期間</span>
									<span class="discount-date-range">
										<time th:datetime="${course.discountStart}"
											th:text="${#temporals.format(course.discountStart, 'yyyy年MM月dd日 HH:mm')}">開始時間</time>
										<span aria-hidden="true">－</span>
										<time th:datetime="${course.discountEnd}"
											th:text="${#temporals.format(course.discountEnd, 'yyyy年MM月dd日 HH:mm')}">結束時間</time>
									</span>
								</p>
							</div>
							<span class="price"
								th:unless="${course.isDiscountValid() == true}">
								NT$ <span th:text="${course.price}">0</span>
							</span>
						</div>
					</div>

					<div class="inline-actions">
						<form class="inline-form" method="post"
							th:action="@{/member/course/add_cart}">
							<input type="hidden" name="courseId"
								th:value="${course.courseId}">
							<input type="hidden" name="returnUrl">
							<button class="btn btn-primary" type="submit">加入購物車</button>
						</form>

						<form class="inline-form" method="post"
							th:action="@{/member/dashboard/favorite/toggle}">
							<input type="hidden" name="courseId"
								th:value="${course.courseId}">
							<input type="hidden" name="currentPage"
								th:value="${currentPage}">
							<input type="hidden" name="orderBy"
								th:value="${orderBy}">
							<input type="hidden" name="returnUrl">
							<button class="btn btn-ghost favorite-toggle" type="submit"
								th:classappend="${course.saved} ? ' is-active' : ''">
								<span class="favorite-heart" aria-hidden="true"
									th:text="${course.saved} ? '♥' : '♡'">♡</span>
								<span th:text="${course.saved} ? '已收藏' : '收藏'">收藏</span>
							</button>
						</form>
					</div>
				</div>
			</article>
		</section>

		<div
			th:replace="~{fragments/pagination :: pagination(${currentPage}, ${totalPages}, '/member/course/select_course', ${orderBy})}"></div>
	</main>

	<a class="floating-cart" th:href="@{/member/course/shopping_cart}"
		aria-label="前往購物車" title="前往購物車">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
			stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
			aria-hidden="true">
			<circle cx="9" cy="20" r="1"></circle>
			<circle cx="18" cy="20" r="1"></circle>
			<path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.5h7.8a2 2 0 0 0 1.9-1.4L21 8H6"></path>
		</svg>
		<span class="floating-cart-count" data-cart-count
			th:text="${countMemberCartCount != null ? countMemberCartCount : 0}"
			th:hidden="${countMemberCartCount == null or countMemberCartCount <= 0}"
			th:attr="data-cart-count-value=${countMemberCartCount != null ? countMemberCartCount : ''},aria-label=${countMemberCartCount != null and countMemberCartCount > 0 ? '購物車內有 ' + countMemberCartCount + ' 門課程' : '購物車目前沒有課程'}"
			aria-live="polite" aria-atomic="true">0</span>
	</a>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script th:src="@{/js/nav.js}"></script>
	<script th:src="@{/js/course/member-js.js}"></script>
</body>
</html>
