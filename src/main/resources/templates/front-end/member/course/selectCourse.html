<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>探索課程｜諮由自在</title>
<link rel="stylesheet" th:href="@{/css/course/member-style.css}" />
</head>
<body class="thy2-member">
	<header class="site-header">
		<a class="brand" th:href="@{/}">諮由自在 Free Mind<small>COURSE
				MARKET</small></a>
		<nav class="main-nav">
			<a class="active" th:href="@{/member/course/select_course}">探索課程</a><a
				th:href="@{/member/dashboard}">我的療癒足跡</a><a
				th:href="@{/member/dashboard/myCollection}">我的收藏</a><a
				th:href="@{/member/coupon/my_coupon}">我的優惠券</a><a
				th:href="@{/member/course/my_course_order}">訂單紀錄</a>
		</nav>
		<div class="header-actions"><a class="cart-link" th:href="@{/member/course/shopping_cart}">購物車</a><a class="profile-entry" th:href="@{/member/profile}"><span th:text="${member.name}">會員</span></a></div>
	</header>
	<main class="container">
		<section class="hero">
			<div>
				<p class="eyebrow">Course market</p>
				<h1>找到適合此刻的心理課程</h1>
				<p>用自己的速度學習，從理解情緒、關係與自我開始。</p>
			</div>
			<div class="hero-art" aria-hidden="true"></div>
		</section>
		<div class="notice member-message" th:if="${cartMsg != null}"
			th:text="${cartMsg}" style="margin-top: 22px"></div>
		<form class="toolbar" method="get"
			th:action="@{/member/course/select_course}">
			<input class="field" type="search" name="keyword"
				placeholder="搜尋課程名稱或心理師……" data-course-search><select
				class="field" name="orderBy"><option value="listedAt"
					th:selected="${orderBy == 'listedAt'}">最新上架</option>
				<option value="popular" th:selected="${orderBy == 'popular'}">熱門課程</option>
				<option value="priceAsc" th:selected="${orderBy == 'priceAsc'}">價格由低至高</option>
				<option value="priceDesc" th:selected="${orderBy == 'priceDesc'}">價格由高至低</option></select>
			<button class="btn" type="submit">搜尋課程</button>
		</form>
		<div class="course-filter-row">
			<form class="tabs course-sort-tabs" method="get"
				th:action="@{/member/course/select_course}" aria-label="課程排序">
				<button type="submit" name="orderBy" value="popular"
					th:classappend="${orderBy == 'popular'} ? 'active' : ''">熱門課程</button>
				<button type="submit" name="orderBy" value="listedAt"
					th:classappend="${orderBy == null or orderBy == '' or orderBy == 'listedAt'} ? 'active' : ''">最新課程</button>
			</form>
			<form class="tabs course-category-tabs" method="get"
				th:action="@{/member/course/select_course}" aria-label="課程分類">
				<a th:href="@{/member/course/select_course}"
					th:classappend="${param.courseCatId == null or #strings.isEmpty(param.courseCatId[0])} ? 'active' : ''">全部課程</a>
				<button type="submit" name="courseCatId"
					th:each="courseCategories : ${courseCategoriesListAll}"
					th:value="${courseCategories.courseCatId}"
					th:text="${courseCategories.courseCatName}"
					th:classappend="${param.courseCatId != null and param.courseCatId[0] == #strings.toString(courseCategories.courseCatId)} ? 'active' : ''">課程分類</button>
			</form>
		</div>
		<div class="section-head">
			<div>
				<p class="eyebrow">Available courses</p>
				<h2>所有課程</h2>
			</div>
			<p>依你的步調，選一堂想開始的課。</p>
		</div>
		<div class="empty-state"
			th:if="${courseList == null || courseList.isEmpty()}">
			<h3>目前沒有符合條件的課程</h3>
			<p>請調整搜尋條件後再試一次。</p>
		</div>
		<section class="course-grid">
			<article class="course-card" data-course-card
				th:each="course : ${courseList}"
				th:attr="data-category=${course.courseCategories.courseCatId}">
				<a class="course-cover course-video-cover course-cover-link"
					th:href="@{/member/course/get_one_course/{courseId}(courseId=${course.courseId})}"
					th:attr="aria-label=${'查看「' + course.courseName + '」課程詳情'}">
					<video muted playsinline preload="metadata" data-course-thumbnail
						th:src="${course.videoSrcPre != null and !#strings.isEmpty(course.videoSrcPre) ? course.videoSrcPre : course.videoSrc}"
						th:attr="aria-label=${course.courseName + '影片預覽圖'}"></video>
					<span th:text="${course.courseCategories.courseCatName}">課程分類</span>
				</a>
				<div class="course-body">
					<span class="tag"
						th:text="${course.courseCategories.courseCatName}">分類</span>
					<h3 th:text="${course.courseName}">課程名稱</h3>
					<p class="meta">
						<span th:text="${course.psychologist.name}">心理師</span> 心理師
					</p>
					<div class="course-stats">
						<span>收藏 <b th:text="${course.saveCount}">0</b></span><span>評價
							<b th:text="${course.reviewCount}">0</b>
						</span><span>提問 <b th:text="${course.commentCount}">0</b></span>
					</div>
					<div class="price-row">
						<span class="price">NT$ <span th:text="${course.price}">0</span></span>
					</div>
					<div class="inline-actions">
						<form class="inline-form" method="post"
							th:action="@{/member/course/add_cart}">
							<input type="hidden" name="courseId"
								th:value="${course.courseId}"><input type="hidden"
								name="returnUrl">
							<button class="btn" type="submit">加入購物車</button>
						</form>
						<form class="inline-form" method="post"
							th:action="@{/member/dashboard/favorite/toggle}">
							<input type="hidden" name="courseId"
								th:value="${course.courseId}"><input type="hidden"
								name="currentPage" th:value="${currentPage}"><input
								type="hidden" name="orderBy" th:value="${orderBy}"><input
								type="hidden" name="returnUrl">
							<button class="btn ghost" type="submit"
								th:classappend="${course.saved} ? ' is-active' : ''">
								<span class="favorite-heart" aria-hidden="true"
									th:text="${course.saved} ? '♥' : '♡'">♡</span><span
									th:text="${course.saved} ? '已收藏' : '收藏'">收藏</span>
							</button>
						</form>
					</div>
				</div>
			</article>
		</section>
		<div
			th:replace="~{fragments/pagination :: paginationWithOrder(${currentPage}, ${totalPages}, '/member/course/select_course', ${orderBy})}"></div>
	</main>
	<footer class="site-footer">讓學習成為照顧自己的方式。</footer>
	<script th:src="@{/js/course/member-js.js}"></script>
</body>
</html>
