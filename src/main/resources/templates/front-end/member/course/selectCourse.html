<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
<head>
<meta charset="UTF-8">
<title>會員課程一覽頁面</title>
<style>
span.error {
	color: red;
	font-size: 12px;
}
</style>
</head>
<body>
	<h3>
		<a th:href="@{/course_index}">課程商城</a>
	</h3>
	<form method="post" th:action="@{set_memberId_session}">
		<span>會員編號：</span> <input type="text" name="memberIdSession" />
		<button type="submit" id="submit">送出</button>
		<br> <span class="error" th:text="${mError}"></span>
	</form>
	<span>session會員編號:</span>
	<span th:text=${session.memberId}></span>
	<br>
	<table>
		<thead>
			<tr>
				<th>課程名稱</th>
				<th>心理師名稱</th>
				<th>課程分類名稱</th>
				<th>課程狀態</th>
				<th>收藏次數</th>
				<th>平均星數</th>
				<th>評價次數</th>
				<th>提問次數</th>
				<th>課程定價</th>
				<th>功能</th>
			</tr>
		</thead>
		<tbody>
			<th:block th:each="course : ${courseListListed}">
				<tr>
					<td th:text="${course.courseName}"></td>
					<td th:text="${course.psychologist.name}"></td>
					<td th:text="${course.courseCategories.courseCatName}"></td>
					<td th:text="${course.courseStatusText}"></td>
					<td th:text="${course.saveCount}"></td>
					<td
						th:text="${course.reviewCount == 0 ? 0 : course.starCount / course.reviewCount}"></td>
					<td th:text="${course.reviewCount}"></td>
					<td th:text="${course.commentCount}"></td>
					<td th:text="${course.price}"></td>
					<td>
						<form method="post" th:action="@{memberGetOneCourse}">
							<input type="hidden" name="courseId"
								th:value="${course.courseId}">
							<button type="submit">查看詳情</button>
						</form>
					</td>	
				</tr>
			</th:block>
		</tbody>
	</table>

</body>
</html>
