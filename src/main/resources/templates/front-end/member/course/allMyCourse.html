<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>個人學習空間｜我的療癒足跡</title>
  <link rel="stylesheet" th:href="@{/css/course/member-style.css}" />
</head>
<body class="thy2-member healing-page coupon-tone-page">
<header class="site-header">
  <a class="brand" th:href="@{/}">諮由自在 Free Mind<small>MY HEALING JOURNEY</small></a>
  <nav class="main-nav"><a th:href="@{/member/course/select_course}">探索課程</a><a class="active" th:href="@{/member/dashboard/myLearning}">我的療癒足跡</a><a th:href="@{/member/dashboard/myCollection/course}">我的收藏</a><a th:href="@{/member/coupon/my_coupon}">我的優惠券</a><a th:href="@{/member/course/my_course_order}">訂單紀錄</a></nav>
  <div class="header-actions">
    <a class="cart-link" th:href="@{/member/course/shopping_cart}">購物車</a>
    <a class="profile-entry" th:href="@{/member/profile}">
      
      <span th:text="${member.name}">會員</span>
    </a>
  </div>
</header>

<main class="container healing-shell">
  <div class="healing-header">
    <div>
      <p class="eyebrow">My healing journey</p>
      <h1>我的療癒足跡／個人學習空間</h1>
      <p class="meta">歡迎回來，<span th:text="${member.name}">會員</span>。</p>
    </div>
    <div class="healing-header-actions">
      <a class="btn secondary" th:href="@{/member/dashboard/my_review}">我的評價</a>
      <a class="btn" th:href="@{/member/course/select_course}">探索更多課程</a>
    </div>
  </div>

  <div class="notice member-message" th:if="${cartMsg != null}" th:text="${cartMsg}"></div>

  <div class="empty-state" th:if="${myCoursePage == null || myCoursePage.isEmpty()}">
    <h3>尚未開始任何課程</h3>
    <p>購買課程後，就能在這裡繼續學習。</p>
  </div>

  <section class="stack">
    <article class="panel learning-card" th:each="item : ${myCoursePage}">
      <div class="learning-cover">
        <video
          muted
          playsinline
          preload="metadata"
          data-course-thumbnail
          th:src="${item.course.videoSrcPre != null and !#strings.isEmpty(item.course.videoSrcPre) ? item.course.videoSrcPre : item.course.videoSrc}"
          th:attr="aria-label=${item.course.courseName + '影片預覽圖'}">
        </video>
        <span>繼續學習</span>
      </div>

      <div>
        <span class="tag">我的課程</span>
        <h2 th:text="${item.course.courseName}">課程名稱</h2>
        <p class="meta">
          上次播放位置：
          <span th:text="${item.playbackPosition != null ? item.playbackPosition : '尚未觀看'}">—</span>
        </p>

        <div
          class="progress"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          th:attr="aria-valuenow=${item.courseProgress != null ? item.courseProgress : 0}">
          <span
            th:style="|width:${item.courseProgress != null ? item.courseProgress : 0}%|"
            style="width:0">
          </span>
        </div>

        <div class="course-actions">
          <span>
            課程進度
            <b th:text="${item.courseProgress != null ? #numbers.formatDecimal(item.courseProgress, 1, 2) + '%' : '0%'}">0%</b>
          </span>
          <form method="get" th:action="@{/member/course/get_one_course/{courseId}(courseId=${item.course.courseId})}">
            <button class="btn" type="submit">繼續學習</button>
          </form>
        </div>
      </div>
    </article>
  </section>

  <div th:replace="~{fragments/pagination :: pagination(${currentPage}, ${totalPages}, '/member/course/my_bookmarks')}"></div>
</main>

<footer class="site-footer">每一次回來，都是照顧自己的足跡。</footer>
<script th:src="@{/js/course/member-js.js}"></script>
</body>
</html>
