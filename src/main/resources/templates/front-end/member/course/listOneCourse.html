<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員課程一覽頁面</title>
  <link rel="stylesheet" th:href="@{/css/course/listOneCourse.css}"/>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" th:href="@{/member/course/select_course}" aria-label="回到課程商城">
        <span class="brand-mark">課</span>
        <span>課程商城</span>
      </a>
      <nav class="course-path" aria-label="課程導覽">
        <strong th:text="${course.courseName}"></strong>
      </nav>
      <div class="profile">
        <div class="progress-ring" aria-label="會員課程">會員</div>
        <div class="avatar" aria-label="使用者">蘇</div>
      </div>
    </header>

    <main class="layout">
      <section class="main" aria-label="課程觀看主內容">
        <section class="player">
          <div class="video-frame video-native" th:if="${coursePermission}">
            <video id="courseVideo" controls preload="metadata" poster="">
              <source src="" th:src="${course.videoSrc}" type="video/mp4" />
              您的瀏覽器不支援影片播放。
            </video>
            <button class="play-button" id="heroPlayButton" type="button" aria-label="播放課程">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z"></path>
              </svg>
            </button>
          </div>

          <div class="video-frame video-native" th:if="${!coursePermission}">
            <video id="courseVideo" controls preload="metadata" poster="">
              <source src="" th:src="@{${course.videoSrcPre}}" type="video/mp4" />
              您的瀏覽器不支援影片播放。
            </video>
            <button class="play-button" id="heroPlayButton" type="button" aria-label="播放預覽影片">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z"></path>
              </svg>
            </button>
          </div>
        </section>

        <section class="course-info">
          <div class="lesson-meta">
            <div>
              <span class="badge" th:text="${course.courseCategories.courseCatName}">心理健康</span>
              <h1 th:text="${course.courseName}">情緒覺察與壓力調節入門</h1>
            </div>

            <form class="favorite-form" th:action="@{/member/dashboard/favorite/toggle}" method="post">
              <input type="hidden" name="courseId" th:value="${course.courseId}" />
              <input type="hidden" name="currentPage" th:value="${currentPage}" />
              <input type="hidden" name="orderBy" th:value="${orderBy}" />
              <input type="hidden" name="returnUrl" id="returnUrl" />
              <button
                type="submit"
                class="favorite-btn"
                th:classappend="${course.saved} ? ' active' : ''"
                th:attr="aria-pressed=${course.saved}">
                ♥
              </button>
            </form>
          </div>

          <p class="summary" th:text="${course.outline}">
            這裡會顯示課程大綱，協助會員快速理解課程內容與學習重點。
          </p>

          <div class="listed-time" th:if="${course.courseStatus == 4}">
            <span>上架時間：</span>
            <strong th:text="${#temporals.format(course.listedAt, 'yyyy年MM月dd日 HH:mm')}">2026年07月09日 10:00</strong>
          </div>

          <div class="actions course-actions" aria-label="課程操作">
            <form class="add-cart-form" method="post" th:action="@{/member/course/add_cart}" th:if="${!coursePermission}">
              <input type="hidden" name="courseId" th:value="${course.courseId}" />
              <input type="hidden" name="returnUrl" />
              <button type="submit" id="addCart" class="action primary">加入購物車</button>
            </form>
          </div>
        </section>

        <section class="notes" aria-label="筆記與教材">
          <div class="note-editor">
            <h2 class="section-title">我的課堂提問</h2>
            <form th:action="@{/member/dashboard/my_course_comment}" method="post">
	            <textarea 
	            		name="courseQuestion" 
	            		id="noteInput" 
	            		th:placeholder="${courseQuestionMsg==null
	            							?'建議把影片中的問題、想法與疑問記錄下來，方便後續提問與複習。'
	            							:courseQuestionMsg}" required></textarea>
	            <div class="note-actions">
	              <input type="hidden" name="returnUrl">
	              <input type="hidden" name="courseId" th:value="${course.courseId}"/>
	              <button class="action primary" id="saveNoteButton" type="submit">交出提問</button>
	              <span class="save-state" id="saveState" aria-live="polite"></span>
	            </div>
			</form>
          </div>
          <aside class="materials" aria-label="課程資訊">
            <h2 class="section-title">課程資訊</h2>
            <div class="material">
              <span>課程分類</span>
              <strong th:text="${course.courseCategories.courseCatName}">心理健康</strong>
            </div>
            <div class="material">
              <span>收藏次數</span>
              <strong th:text="${course.saveCount}">0</strong>
            </div>
            <div class="material">
              <span>提問次數</span>
              <strong th:text="${course.commentCount}">0</strong>
            </div>
          </aside>
        </section>
      </section>

      <aside class="sidebar" aria-label="課程側欄">
        <section class="side-panel stats-panel">
          <div class="panel-header">
            <h2>課程數據</h2>
            <span class="badge">即時</span>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <span>收藏次數</span>
              <strong th:text="${course.saveCount}">0</strong>
            </div>
            <div class="stat-card">
              <span>評價次數</span>
              <strong th:text="${course.starCount}">0</strong>
            </div>
            <div class="stat-card">
              <span>平均星數</span>
              <div
                class="rating-stars"
                th:with="avg=${course.starCount != null and course.starCount > 0 ? (course.reviewCount != null ? course.reviewCount : 0) * 1.0 / course.starCount : 0}">
                <div class="stars" th:attr="aria-label=|平均 ${#numbers.formatDecimal(avg, 1, 1)} 顆星|">
                  <span class="star" th:classappend="${avg >= 1 ? ' full' : avg >= 0.5 ? ' half' : ''}">★</span>
                  <span class="star" th:classappend="${avg >= 2 ? ' full' : avg >= 1.5 ? ' half' : ''}">★</span>
                  <span class="star" th:classappend="${avg >= 3 ? ' full' : avg >= 2.5 ? ' half' : ''}">★</span>
                  <span class="star" th:classappend="${avg >= 4 ? ' full' : avg >= 3.5 ? ' half' : ''}">★</span>
                  <span class="star" th:classappend="${avg >= 5 ? ' full' : avg >= 4.5 ? ' half' : ''}">★</span>
                </div>
                <strong th:text="${#numbers.formatDecimal(avg, 1, 1)}">0.0</strong>
              </div>
            </div>
            <div class="stat-card">
              <span>提問次數</span>
              <strong th:text="${course.commentCount}">0</strong>
            </div>
          </div>
        </section>

        <section class="side-panel mentor">
          <h2 class="section-title">學習提醒</h2>
          <div class="mentor-card">
            <div class="mentor-photo">學</div>
            <div>
              <strong>完成影片後，整理 3 個重點</strong>
              <p>看看其他人問了什麼</p>
            </div>
          </div>
			<a class="action primary"
			   th:href="@{/member/course/get_all_qa/{courseId}(courseId=${course.courseId})}">
			    查看課程提問</a>        
		</section>
		<section class="side-panel mentor" th:if="${comments!=null}">
			<div th:each="comment : ${comments}">
				<p th:text="${comment.member.name} + ':'"></p>
				<p th:text="${comment.courseQuestion}"></p>
				<div th:if="${comment.courseAnswer!=null}">
					<p style="text-align: right;" th:text="${comment.course.psychologist.name} + '心理師回覆:'"></p>
					<p style="text-align: right;" th:text="${comment.courseAnswer}"></p>
				</div>
			</div>
		</section>
      </aside>
    </main>
  </div>

  <div id="cartModal" class="cart-modal" th:if="${cartMsg != null}">
    <div class="cart-modal-content">
      <p th:text="${cartMsg}">已加入購物車。</p>
      <button type="button" class="action primary" onclick="closeCartModal()">確定</button>
    </div>
  </div>

  <script th:src="@{/js/course/listOneCourse.js}"></script>
</body>
</html>
