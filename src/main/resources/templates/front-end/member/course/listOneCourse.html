<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
<meta name="_csrf_header" th:if="${_csrf != null}"
	th:content="${_csrf.headerName}">
<title th:text="${course.courseName} + '｜課程詳情'">課程詳情</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" th:href="@{/css/styles.css}" />
<style>
@font-face {
	font-family: 'OpenHuninn';
	src:
		url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff') format('woff'),
		url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf') format('truetype');
	font-weight: 400;
	font-style: normal;
	font-display: swap;
}
:root {
	--bg-warm: #FFFAEE;
	--bg-soothing: #C2D9ED;
	--blue-soft: #DCEAF5;
	--orange: #F58E6B;
	--orange-deep: #E5764F;
	--pink: #FBD0BE;
	--pink-soft: #FDE6DB;
	--ink: #3A4B53;
	--ink-soft: #6b7981;
	--white: #FFFFFF;
	--line: #ecdfce;
	--shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
	--shadow-md: 0 16px 44px rgba(58, 75, 83, .13);
	--radius-lg: 34px;
	--radius-md: 22px;
	--serif: "OpenHuninn", "Noto Sans TC", sans-serif;
	--zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
	--sans: "Noto Sans TC", system-ui, sans-serif;
	--script: "Caveat", "OpenHuninn", cursive;
	--display-en: "Baloo 2", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body.thy2-member {
	margin: 0;
	color: var(--ink);
	background: var(--bg-warm);
	font-family: var(--sans);
	line-height: 1.78;
	-webkit-font-smoothing: antialiased;
	overflow-x: hidden;
}
body.thy2-member a { color: inherit; text-decoration: none; }
body.thy2-member img,
body.thy2-member svg { display: block; max-width: 100%; }
body.thy2-member button {
	border: none;
	background: none;
	font-family: inherit;
	cursor: pointer;
}
body.thy2-member .wrap,
body.thy2-member .container {
	width: min(1160px, 92vw);
	margin-inline: auto;
}
body.thy2-member .container {
	padding: clamp(2.2rem, 5vw, 4rem) 0 4.5rem;
}
body.thy2-member .site-header {
	position: sticky;
	top: 0;
	z-index: 100;
	width: 100%;
	border-bottom: 1px solid rgba(236, 223, 206, .7);
	color: var(--ink);
	background: rgba(253, 246, 237, .85);
	font-family: var(--sans);
	backdrop-filter: blur(12px);
}
body.thy2-member .site-header .nav-inner {
	display: flex;
	align-items: center;
	gap: 1.4rem;
	height: 74px;
}
body.thy2-member .brand {
	display: flex;
	flex: 0 0 auto;
	align-items: center;
	gap: .8rem;
}
body.thy2-member .logo-mind {
	display: flex;
	flex: 0 0 auto;
	flex-direction: column;
	align-items: flex-start;
	line-height: 1;
	user-select: none;
}
body.thy2-member .logo-mind .word {
	display: flex;
	align-items: flex-end;
}
body.thy2-member .logo-mind .word span {
	display: inline-block;
	font-family: var(--display-en);
	font-size: 1.5rem;
	font-weight: 700;
	letter-spacing: -.03em;
	text-align: center;
}
body.thy2-member .logo-mind .word .m { width: 24px; color: #EFB65E; }
body.thy2-member .logo-mind .word .i { width: 9px; color: #DB93A9; }
body.thy2-member .logo-mind .word .n { width: 17px; color: #8FB2C9; }
body.thy2-member .logo-mind .word .d { width: 17px; color: #9BB893; }
body.thy2-member .logo-mind .faces {
	display: flex;
	align-items: flex-start;
	margin-top: -1px;
}
body.thy2-member .logo-mind .faces svg { display: block; }
body.thy2-member .logo-mind .faces .fm { width: 24px; height: 11px; }
body.thy2-member .logo-mind .faces .fi { width: 9px; height: 11px; }
body.thy2-member .logo-mind .faces .fn { width: 17px; height: 11px; }
body.thy2-member .logo-mind .faces .fd { width: 17px; height: 11px; }
body.thy2-member .brand-text {
	display: flex;
	flex-direction: column;
	line-height: 1.15;
}
body.thy2-member .brand-text .logo {
	color: var(--ink);
	font-family: var(--zen-maru);
	font-size: 1.18rem;
	font-weight: 700;
	letter-spacing: .02em;
}
body.thy2-member .brand-text .en {
	margin-top: .15em;
	color: var(--ink-soft);
	font-family: var(--display-en);
	font-size: .85rem;
	font-weight: 700;
	letter-spacing: .24em;
	text-transform: uppercase;
}
body.thy2-member .main-nav {
	display: flex;
	gap: .25rem;
	min-width: 0;
	margin-left: .5rem;
}
body.thy2-member .main-nav a {
	padding: .5rem .82rem;
	border-radius: 999px;
	color: var(--ink-soft);
	font-size: .92rem;
	font-weight: 500;
	white-space: nowrap;
	transition: background .2s, color .2s;
}
body.thy2-member .main-nav a:hover,
body.thy2-member .main-nav a.active {
	color: var(--ink);
	background: rgba(194, 217, 237, .4);
}
body.thy2-member .header-actions {
	display: flex;
	align-items: center;
	gap: .55rem;
	margin-left: auto;
}
body.thy2-member .cart-link,
body.thy2-member .profile-entry {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-height: 42px;
	padding: .55rem .95rem;
	border: 1px solid var(--line);
	border-radius: 999px;
	color: var(--ink);
	background: var(--white);
	box-shadow: var(--shadow-sm);
	font-size: .88rem;
	font-weight: 500;
	white-space: nowrap;
	transition: transform .2s, background .2s, border-color .2s;
}
body.thy2-member .cart-link:hover,
body.thy2-member .profile-entry:hover {
	border-color: var(--bg-soothing);
	background: var(--blue-soft);
	transform: translateY(-2px);
}
body.thy2-member .nav-inner > .cart-link {
	margin-left: auto;
}
body.thy2-member .auth {
	display: flex;
	align-items: center;
	margin-left: 0;
}
body.thy2-member .nav-inner > .meta + .auth {
	margin-left: auto;
}
body.thy2-member .profile-wrapper {
	position: relative;
}
body.thy2-member .profile-entry span {
	max-width: 9rem;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
body.thy2-member .profile-menu {
	position: absolute;
	top: calc(100% + 12px);
	right: 0;
	z-index: 120;
	width: 230px;
	padding: .6rem;
	border: 1px solid var(--line);
	border-radius: 20px;
	background: var(--white);
	box-shadow: var(--shadow-md);
	opacity: 0;
	visibility: hidden;
	transform: translateY(-8px);
	transition: opacity .22s ease, visibility .22s ease, transform .22s ease;
}
body.thy2-member .profile-menu.open {
	opacity: 1;
	visibility: visible;
	transform: translateY(0);
}
body.thy2-member .cart-link,
body.thy2-member .checkout-cart-link,
body.thy2-member .menu-item-with-count {
	gap: .45rem;
}
body.thy2-member .checkout-cart-link {
	display: inline-flex;
	align-items: center;
}
body.thy2-member .header-count-badge,
body.thy2-member .menu-count-badge {
	display: inline-grid;
	place-items: center;
	min-width: 1.55rem;
	height: 1.55rem;
	padding: 0 .4rem;
	border-radius: 999px;
	font-size: .74rem;
	font-weight: 700;
	line-height: 1;
}
body.thy2-member .header-count-badge {
	color: var(--white);
	background: var(--orange);
}
body.thy2-member .menu-count-badge {
	margin-left: auto;
	color: var(--orange-deep);
	background: var(--pink-soft);
}
body.thy2-member .menu-item {
	display: flex;
	align-items: center;
	width: 100%;
	padding: .7rem 1rem;
	border-radius: 13px;
	color: var(--ink);
	background: transparent;
	font-size: .9rem;
	text-align: left;
	transition: background .16s ease;
}
body.thy2-member .menu-item:hover {
	background: var(--bg-warm);
}
body.thy2-member .menu-item-form {
	margin: .3rem 0 0;
	padding-top: .3rem;
	border-top: 1px solid var(--line);
}
body.thy2-member .logout-btn {
	color: var(--orange-deep);
}
body.thy2-member .profile-entry-avatar {
	display: grid;
	place-items: center;
	width: 28px;
	height: 28px;
	margin-right: .4rem;
	border-radius: 50%;
	background: linear-gradient(135deg, var(--pink), var(--bg-soothing));
}
body.thy2-member .hero {
	position: relative;
	display: grid;
	grid-template-columns: minmax(0, 1.3fr) minmax(180px, .7fr);
	gap: 2rem;
	align-items: center;
	min-height: 260px;
	padding: clamp(2rem, 5vw, 3.7rem);
	border: 1px solid var(--line);
	border-radius: var(--radius-lg);
	background: var(--white);
	box-shadow: var(--shadow-sm);
	overflow: hidden;
}
body.thy2-member .hero::before {
	content: "";
	position: absolute;
	right: -70px;
	top: -90px;
	width: 260px;
	height: 260px;
	border-radius: 50%;
	background: var(--bg-soothing);
	opacity: .72;
}
body.thy2-member .hero-art {
	position: relative;
	z-index: 1;
	width: min(220px, 100%);
	aspect-ratio: 1;
	justify-self: center;
	border-radius: 46% 54% 58% 42%;
	background: linear-gradient(145deg, var(--pink-soft), var(--blue-soft));
}
body.thy2-member h1,
body.thy2-member h2,
body.thy2-member h3 {
	color: var(--ink);
	font-family: var(--serif);
}
body.thy2-member h1 {
	margin: .35rem 0 .65rem;
	font-size: clamp(2rem, 4vw, 2.8rem) !important;
	line-height: 1.3;
}
body.thy2-member h2 { line-height: 1.4; }
body.thy2-member .eyebrow {
	display: inline-block;
	margin: 0;
	color: var(--orange);
	font-size: .8rem;
	font-weight: 500;
	letter-spacing: .22em;
	text-transform: uppercase;
}
body.thy2-member .meta { color: var(--ink-soft); }
body.thy2-member .section-head,
body.thy2-member .healing-header {
	display: flex;
	align-items: flex-end;
	justify-content: space-between;
	gap: 1.5rem;
	margin-bottom: 1.8rem;
	padding-bottom: 1.35rem;
	border-bottom: 1px solid var(--line);
}
body.thy2-member .section-head p,
body.thy2-member .healing-header p { margin-bottom: 0; }
body.thy2-member .section-head-actions,
body.thy2-member .healing-header-actions {
	display: flex;
	align-items: center;
	justify-content: flex-end;
	gap: .75rem;
	flex-wrap: wrap;
}
body.thy2-member .panel,
body.thy2-member .review-item,
body.thy2-member .coupon-record {
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
	background: var(--white);
	box-shadow: var(--shadow-sm);
}
body.thy2-member .panel { padding: clamp(1.25rem, 3vw, 2rem); }
body.thy2-member .two-col {
	display: grid;
	grid-template-columns: minmax(0, 1.55fr) minmax(280px, .75fr);
	gap: 1.5rem;
	align-items: start;
}
body.thy2-member .stack {
	display: grid;
	gap: 1rem;
}
body.thy2-member .course-grid {
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
	gap: 1.35rem;
}
body.thy2-member .course-card {
	display: flex;
	min-width: 0;
	flex-direction: column;
	overflow: hidden;
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
	background: var(--white);
	box-shadow: var(--shadow-sm);
	transition: transform .25s, box-shadow .25s;
}
body.thy2-member .course-card:hover {
	box-shadow: var(--shadow-md);
	transform: translateY(-5px);
}
body.thy2-member .course-cover {
	position: relative;
	display: grid;
	place-items: center;
	min-height: 175px;
	overflow: hidden;
	color: var(--ink);
	background: var(--blue-soft);
}
body.thy2-member .course-cover video {
	width: 100%;
	height: 100%;
	min-height: 175px;
	object-fit: cover;
}
body.thy2-member .course-cover > span {
	position: absolute;
	left: 1rem;
	bottom: 1rem;
	padding: .35rem .75rem;
	border-radius: 999px;
	background: rgba(255, 255, 255, .9);
	font-size: .78rem;
}
body.thy2-member .course-body {
	display: flex;
	flex: 1;
	flex-direction: column;
	padding: 1.35rem;
}
body.thy2-member .tag,
body.thy2-member .status-chip {
	display: inline-flex;
	align-items: center;
	width: fit-content;
	padding: .3rem .7rem;
	border-radius: 999px;
	color: var(--ink);
	background: var(--pink-soft);
	font-size: .78rem;
	font-weight: 500;
}
body.thy2-member .status-chip.pending { background: var(--blue-soft); }
body.thy2-member .status-chip.expired,
body.thy2-member .status-chip.refunded { background: var(--bg-soothing); }
body.thy2-member .course-stats,
body.thy2-member .order-meta {
	display: flex;
	gap: .55rem 1rem;
	flex-wrap: wrap;
	color: var(--ink-soft);
	font-size: .84rem;
}
body.thy2-member .price-row,
body.thy2-member .summary-row {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 1rem;
	margin-top: 1rem;
	padding-top: 1rem;
	border-top: 1px solid var(--line);
}
body.thy2-member .price,
body.thy2-member .summary-row.total {
	color: var(--orange-deep);
	font-size: 1.15rem;
	font-weight: 700;
}
body.thy2-member .course-price-block {
	display: grid;
	gap: .55rem;
	margin: 1.2rem 0;
	padding: 1rem 1.1rem;
	border: 1px solid var(--line);
	border-radius: 16px;
	background: var(--bg-warm);
}
body.thy2-member .course-price-block > .price,
body.thy2-member .discount-price-panel p {
	margin: 0;
}
body.thy2-member .discount-price-panel {
	display: grid;
	gap: .45rem;
}
body.thy2-member .original-price {
	color: var(--ink-soft);
	font-size: .88rem;
}
body.thy2-member .original-price del {
	text-decoration-color: var(--orange-deep);
	text-decoration-thickness: 2px;
}
body.thy2-member .discount-price {
	display: flex;
	align-items: center;
	gap: .5rem;
	flex-wrap: wrap;
}
body.thy2-member .discount-badge {
	display: inline-flex;
	align-items: center;
	padding: .24rem .65rem;
	border-radius: 999px;
	color: var(--orange-deep);
	background: var(--pink-soft);
	font-size: .76rem;
	font-weight: 700;
	letter-spacing: .04em;
}
body.thy2-member .discount-period {
	display: flex;
	align-items: center;
	gap: .25rem;
	flex-wrap: wrap;
	color: var(--ink-soft);
	font-size: .8rem;
	line-height: 1.65;
}
body.thy2-member .discount-period time {
	color: var(--ink);
	font-weight: 500;
}
body.thy2-member .inline-actions,
body.thy2-member .course-actions {
	display: flex;
	align-items: center;
	gap: .65rem;
	flex-wrap: wrap;
}
body.thy2-member .inline-actions { margin-top: 1rem; }
body.thy2-member .inline-form { margin: 0; }
body.thy2-member .btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: .45rem;
	min-height: 42px;
	padding: .68rem 1.2rem;
	border: 1px solid transparent;
	border-radius: 999px;
	color: var(--white);
	background: var(--orange);
	box-shadow: 0 8px 20px rgba(245, 142, 107, .28);
	font-size: .9rem;
	font-weight: 500;
	transition: transform .2s, background .2s, box-shadow .2s;
}
body.thy2-member .btn:hover:not(:disabled) {
	background: var(--orange-deep);
	box-shadow: 0 12px 28px rgba(245, 142, 107, .38);
	transform: translateY(-2px);
}
body.thy2-member .btn.ghost,
body.thy2-member .btn.secondary {
	border-color: var(--line);
	color: var(--ink);
	background: var(--white);
	box-shadow: var(--shadow-sm);
}
body.thy2-member .btn.ghost:hover:not(:disabled),
body.thy2-member .btn.secondary:hover:not(:disabled) {
	color: var(--ink);
	background: var(--blue-soft);
}
body.thy2-member .btn.danger {
	color: var(--white);
	background: var(--orange-deep);
}
body.thy2-member .btn:disabled {
	opacity: .48;
	cursor: not-allowed;
	box-shadow: none;
}
body.thy2-member .toolbar,
body.thy2-member .course-filter-row {
	display: flex;
	align-items: center;
	gap: .8rem;
	flex-wrap: wrap;
	margin-top: 1.4rem;
	padding: 1rem;
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
	background: var(--white);
	box-shadow: var(--shadow-sm);
}
body.thy2-member .course-filter-row { justify-content: space-between; }
body.thy2-member .field {
	width: 100%;
	min-height: 44px;
	padding: .72rem .9rem;
	border: 1px solid var(--line);
	border-radius: 13px;
	color: var(--ink);
	background: var(--white);
	font: inherit;
}
body.thy2-member input.field,
body.thy2-member select.field { width: min(100%, 320px); }
body.thy2-member textarea.field {
	min-height: 130px;
	resize: vertical;
}
body.thy2-member .field:focus {
	border-color: var(--orange);
	outline: 2px solid rgba(245, 142, 107, .18);
	outline-offset: 1px;
}
body.thy2-member .tabs {
	display: flex;
	gap: .4rem;
	flex-wrap: wrap;
}
body.thy2-member .tabs button,
body.thy2-member .tabs a {
	padding: .6rem .95rem;
	border-radius: 999px;
	color: var(--ink-soft);
	background: transparent;
	font-size: .88rem;
}
body.thy2-member .tabs button:hover,
body.thy2-member .tabs a:hover,
body.thy2-member .tabs .active {
	color: var(--ink);
	background: var(--blue-soft);
}
body.thy2-member .toast {
	position: fixed; top: 94px; right: max(100px, calc((100vw - min(1160px, 92vw)) / 2)); z-index: 190;
	width: min(390px, calc(100vw - 116px)); margin: 0; padding: 1rem 1.2rem 1rem 3.4rem;
	border: 1px solid var(--line); border-left: 5px solid var(--orange); border-radius: 18px;
	color: var(--ink); background: var(--white); box-shadow: var(--shadow-md);
	font-size: .95rem; font-weight: 500; line-height: 1.6;
	opacity: 0; visibility: hidden; transform: translateY(-14px) scale(.98); pointer-events: none;
	transition: opacity .25s ease, visibility .25s ease, transform .25s ease;
}
body.thy2-member .toast::before {
	content: "✓"; position: absolute; left: 1rem; top: 50%; display: grid; place-items: center;
	width: 1.7rem; height: 1.7rem; border-radius: 50%; color: var(--orange-deep);
	background: var(--pink-soft); font-size: .9rem; font-weight: 700; transform: translateY(-50%);
}
body.thy2-member .toast.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); pointer-events: auto; }
body.thy2-member .favorite-heart {
	display: inline-grid; place-items: center; width: 1.35em; color: #D76686;
	font-size: 1.28em; line-height: 1; filter: drop-shadow(0 2px 4px rgba(215, 102, 134, .24));
	transition: color .2s ease, transform .2s ease, filter .2s ease;
}
body.thy2-member .btn:hover .favorite-heart { color: #C55276; filter: drop-shadow(0 3px 6px rgba(197, 82, 118, .32)); transform: scale(1.12); }
body.thy2-member .notice,
body.thy2-member .member-message {
	margin: 1rem 0;
	padding: .85rem 1rem;
	border-left: 4px solid var(--orange);
	border-radius: 12px;
	color: var(--ink);
	background: var(--pink-soft);
}
body.thy2-member .empty-state {
	padding: clamp(2rem, 5vw, 4rem);
	border: 1px dashed rgba(58, 75, 83, .24);
	border-radius: var(--radius-md);
	color: var(--ink-soft);
	background: var(--white);
	text-align: center;
}
body.thy2-member .table-wrap {
	overflow-x: auto;
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
	background: var(--white);
	box-shadow: var(--shadow-sm);
}
body.thy2-member table {
	width: 100%;
	border-collapse: collapse;
	color: var(--ink);
	font-size: .88rem;
}
body.thy2-member th,
body.thy2-member td {
	padding: .9rem 1rem;
	border-bottom: 1px solid var(--line);
	text-align: left;
	vertical-align: middle;
}

<body class="thy2-member"
	th:attr="data-member-unread-count=${countMemberUnread != null ? countMemberUnread : ''}">
	<div th:replace="~{fragments/header :: header}"></div>

<main class="container">
		<p class="meta">
			<a th:href="@{/member/course/select_course}">課程商城</a> ／ <span
				th:text="${course.courseCategories.courseCatName}">分類</span> ／ <span
				th:text="${course.courseName}">課程</span>
		</p>
		<div data-cart-message hidden th:if="${cartMsg != null}"
			th:text="${cartMsg}"></div>
		<section class="two-col">
			<div>
				<div class="detail-cover">
					<video id="courseVideo" controls preload="metadata"
						style="width: 100%; border-radius: 22px"
						th:if="${coursePermission}"
						th:attr="data-course-order-id=${orderDetail.courseOrder.courseOrderId},data-course-id=${course.courseId},data-playback-seconds=${orderDetail.playbackPosition != null ? orderDetail.playbackPosition.toSecondOfDay() : 0}">
						<source th:src="${course.videoSrc}" type="video/mp4">
					</video>
					<div class="playback-status" th:if="${coursePermission}">
						<span>上次播放位置：<strong
							th:text="${orderDetail.playbackPosition != null ? #temporals.format(orderDetail.playbackPosition, 'HH:mm:ss') : '尚未觀看'}">尚未觀看</strong></span><span>目前播放位置：<strong
							data-current-playback-time>00:00:00</strong></span><span>觀看進度：<strong
							data-playback-percentage>0%</strong></span>
					</div>
					<video id="coursePreviewVideo" controls preload="metadata"
						style="width: 100%; border-radius: 22px"
						th:if="${!coursePermission}">
						<source th:src="@{${course.videoSrcPre}}" type="video/mp4">
					</video>
				</div>
				<section class="panel" style="margin-top: 22px">
					<div class="tabs" data-tabs>
						<button class="active" data-tab="intro" type="button">課程介紹</button>
						<button data-tab="questions" type="button">課堂提問</button>
					</div>
					<div data-panel="intro">
						<h2 th:text="${course.courseName}">課程名稱</h2>
						<p th:text="${course.outline}">課程介紹</p>
						<p class="meta" th:if="${course.courseStatus == 4}">
							上架時間：<span
								th:text="${#temporals.format(course.listedAt, 'yyyy年MM月dd日 HH:mm')}">—</span>
						</p>
					</div>
					<div data-panel="questions" hidden>
						<h2>我的課堂提問</h2>
						<form th:action="@{/member/course/my_course_comment}"
							method="post">
							<input type="hidden" name="courseId"
								th:value="${course.courseId}"><input type="hidden"
								name="returnUrl">
							<textarea class="field" name="courseQuestion"
								th:placeholder="${courseQuestionMsg == null ? '寫下學習時遇到的疑問……' : courseQuestionMsg}"
								required></textarea>
							<button class="btn" type="submit" style="margin-top: 12px">送出提問</button>
						</form>
					</div>
				</section>
			</div>
			<aside class="panel">
				<span class="tag" th:text="${course.courseCategories.courseCatName}">分類</span>
				<h1 style="font-size: 36px" th:text="${course.courseName}">課程名稱</h1>
				<p class="meta">
					<span th:text="${course.psychologist.name}">心理師</span> 心理師
				</p>
				<div class="course-stats">
					<span>收藏 <b th:text="${course.saveCount}">0</b></span><span>評價
						<b th:text="${course.reviewCount}">0</b>
					</span><span>提問 <b th:text="${course.commentCount}">0</b></span>
				</div>
				<div class="course-price-block" th:if="${!coursePermission}">
					<div class="discount-price-panel"
						th:if="${course.isDiscountValid() == true}">
						<p class="original-price">
							原價
							<del>NT$ <span th:text="${course.price}">0</span></del>
						</p>
						<p class="price discount-price">
							<span class="discount-badge">限時優惠</span>
							<span>NT$ <span
								th:text="${course.price * course.psychDiscount}">0</span></span>
						</p>
						<p class="discount-period">
							<span>優惠期間：</span>
							<time th:datetime="${course.discountStart}"
								th:text="${#temporals.format(course.discountStart, 'yyyy年MM月dd日 HH:mm')}">開始時間</time>
							<span aria-hidden="true">－</span>
							<time th:datetime="${course.discountEnd}"
								th:text="${#temporals.format(course.discountEnd, 'yyyy年MM月dd日 HH:mm')}">結束時間</time>
						</p>
					</div>
					<p class="price" th:unless="${course.isDiscountValid() == true}">
						NT$ <span th:text="${course.price}">0</span>
					</p>
				</div>
				<div class="stack">
					<form method="post" th:action="@{/member/course/add_cart}"
						th:if="${!coursePermission}">
						<input type="hidden" name="courseId" th:value="${course.courseId}"><input
							type="hidden" name="returnUrl">
						<button class="btn" type="submit" style="width: 100%">加入購物車</button>
					</form>
					<a class="btn" th:if="${coursePermission}"
						th:href="@{/member/course/get_all_qa/{courseId}(courseId=${course.courseId})}">查看課程提問</a>
					<form method="post"
						th:action="@{/member/dashboard/favorite/toggle}">
						<input type="hidden" name="courseId" th:value="${course.courseId}"><input
							type="hidden" name="currentPage" th:value="${currentPage}"><input
							type="hidden" name="orderBy" th:value="${orderBy}"><input
							type="hidden" name="returnUrl">
						<button class="btn ghost" type="submit" style="width: 100%">
							<span class="favorite-heart" aria-hidden="true"
								th:text="${course.saved} ? '♥' : '♡'">♡</span><span
								th:text="${course.saved} ? '已收藏' : '收藏課程'">收藏課程</span>
						</button>
					</form>
				</div>
			</aside>
		</section>
		<section class="panel" style="margin-top: 24px"
			th:if="${comments != null}">
			<h2>課程提問紀錄</h2>
			<div class="stack">
				<article class="question-item" th:each="comment : ${comments}">
					<strong th:text="${comment.member.name} + '：'">會員：</strong>
					<p th:text="${comment.courseQuestion}">問題</p>
					<div class="answer-box" th:if="${comment.courseAnswer != null}">
						<strong th:text="${comment.course.psychologist.name} + ' 心理師回覆'">心理師回覆</strong>
						<p th:text="${comment.courseAnswer}">回答</p>
					</div>
				</article>
			</div>
		</section>
	</main>

	<a class="floating-cart" th:href="@{/member/course/shopping_cart}"
		aria-label="前往購物車" title="前往購物車">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
			stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
			aria-hidden="true">
			<circle cx="9" cy="20" r="1"></circle>
			<circle cx="18" cy="20" r="1"></circle>
			<path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.5h7.8a2 2 0 0 0 1.9-1.4L21 8H6"></path>
		</svg>
		<span class="floating-cart-count" data-cart-count
			th:text="${countMemberCartCount != null ? countMemberCartCount : 0}"
			th:hidden="${countMemberCartCount == null or countMemberCartCount <= 0}"
			th:attr="data-cart-count-value=${countMemberCartCount != null ? countMemberCartCount : ''},aria-label=${countMemberCartCount != null and countMemberCartCount > 0 ? '購物車內有 ' + countMemberCartCount + ' 門課程' : '購物車目前沒有課程'}"
			aria-live="polite" aria-atomic="true">0</span>
	</a>
	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script th:src="@{/js/nav.js}"></script>
	<script th:src="@{/js/course/member-js.js}"></script>
</body>
</html>
