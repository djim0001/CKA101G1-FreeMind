<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>課程訂單一覽</title>
<style>
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background-color: #f2f2f2; }
    .status-paid { color: green; font-weight: bold; }
    .status-unpaid { color: red; font-weight: bold; }
    .modal {
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background-color: white;
    padding: 20px;
    width: 700px;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 8px;
}
</style>
</head>
<body>
<a th:href="@{/member/dashboard/myLearning}">個人學習空間</a>
	<h1>課程訂單一覽</h1>
	
	<table>
		<thead>
			<tr>
				<th>訂單編號</th>
				<th>優惠券序號</th>
				<th>訂單總額</th>
				<th>折扣金額</th>
				<th>實付金額</th>
				<th>付款方式</th>
				<th>付款狀態</th>
				<th>訂單時間</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			<th:block th:if="${allMyCourseOrder != null}">
				<tr th:each="order : ${allMyCourseOrder}">
					<td>
					    <a th:href="@{/member/course/myOrder/detail/{orderId}(orderId=${order.courseOrderId})}"
					       th:text="${order.courseOrderId}">
					    </a>
					</td>
					<td th:text="${order.memberCoupon != null ? order.memberCoupon.couponSerialNo : '無使用優惠券'}"></td>
					<td th:text="${order.orderTotal}"></td>
					<td th:text="${order.discountAmount != null ? order.discountAmount : 0}"></td>
					<td th:text="${order.netAmount}"></td>
					<td th:text="${order.paymentMethod == 0 ? '信用卡支付' : '第三方支付'}"></td>
					<td>
						<span th:if="${order.paymentStatus == 2}" class="status-paid">已取消</span>
						<span th:if="${order.paymentStatus == 1}" class="status-paid">已付款</span>
						<span th:if="${order.paymentStatus == 0}" class="status-unpaid">未付款</span>
					</td>
					<td th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
					<td>
					<form th:action="@{/member/course/order/cancelOrder}" method="post">
						<input type="hidden" name="courseOrderId" th:value="${order.courseOrderId}" />
						<input type="hidden" name="returnUrl">
						<button type="submit">取消訂單</button>
					</form>
					</td>
				</tr>
			</th:block>
		</tbody>
	</table>
	<div th:replace="~{fragments/pagination :: paginationWithOrder(${currentPage}, ${totalPages}, '/member/course/my_course_order', ${orderBy})}"></div>	
	
	<div id="orderModal" class="modal" th:if="${detailsMsg == 'show'}">
	    <div class="modal-content">
	    		<table>
	    			<thead>
	    				<tr>
	    				<th>訂單編號</th>
	    				<th>課程名稱</th>
	    				<th>課程定價</th>
	    				<th>折扣後價格</th>
	    				<th>課程權限</th>
	    				</tr>
	    			</thead>
	    			<tbody>
	    				<tr th:each="orderDetail : ${details}">
	    				<td th:text="${orderDetail.courseOrder.courseOrderId}"></td>
	    				<td>
					    <a th:href="@{/member/course/one_my_course/{courseId}(courseId=${orderDetail.course.courseId})}"
					       th:text="${orderDetail.course.courseName}">
					    </a>
					</td>
	    				<td th:text="${orderDetail.price}"></td>
	    				<td th:text="${orderDetail.discountedPrice==null?'--':orderDetail.discountedPrice}"></td>
	    				<td th:text="${orderDetail.coursePermissionText}"></td>
	    				</tr>
	    			</tbody>
	    		</table><br>
	    		<button type="button" onclick="closeOrderModal()">關閉</button>
	    </div>
    </div>
	<script>
		function closeOrderModal() {
		    const modal = document.getElementById("orderModal");
		    if (modal) {
		        modal.style.display = "none";
		    }
		}
		document.querySelectorAll('input[name="returnUrl"]').forEach(input => {
		    input.value = window.location.pathname + window.location.search;
		});
	</script>
</body>
</html>
