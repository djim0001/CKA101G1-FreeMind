
<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>課程訂單紀錄｜諮由自在</title>
<link rel="stylesheet" th:href="@{/css/course/member-style.css}" />
</head>
<body class="thy2-member">
	<header class="site-header">
		<a class="brand" th:href="@{/member/course/select_course}">諮由自在
			Free Mind<small>MEMBER CENTER</small>
		</a>
		<nav class="main-nav">
			<a th:href="@{/member/course/select_course}">探索課程</a><a
				th:href="@{/member/dashboard/myLearning}">我的療癒足跡</a><a
				th:href="@{/member/dashboard/myCollection/course}">我的收藏</a><a
				th:href="@{/member/coupon/my_coupon}">我的優惠券</a><a
				th:href="@{/member/dashboard/my_review}">我的評價</a><a class="active"
				th:href="@{/member/course/my_course_order}">訂單紀錄</a>
		</nav>
		<a class="cart-link" th:href="@{/member/course/shopping_cart}">購物車</a>
	</header>
	<main class="container">
		<div class="section-head">
			<div>
				<p class="eyebrow">Course orders</p>
				<h1 style="font-size: 38px">課程訂單紀錄</h1>
			</div>
			<p>查詢付款狀態與課程明細</p>
		</div>
		<div class="notice member-message" th:if="${payMessage != null}"
			th:text="${payMessage}"></div>
		<div class="empty-state"
			th:if="${allMyCourseOrder == null || allMyCourseOrder.isEmpty()}">
			<h3>目前沒有課程訂單</h3>
			<a class="btn" th:href="@{/member/course/select_course}">探索課程</a>
		</div>
		<section class="stack">
			<article class="panel order-card"
				th:each="order : ${allMyCourseOrder}">
				<div class="order-head">
					<div>
						<strong>訂單 #<span th:text="${order.courseOrderId}">—</span></strong>
						<p class="meta"
							th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm:ss')}">—</p>
					</div>
					<span class="status-chip" th:if="${order.paymentStatus == 1}">付款完成</span><span
						class="status-chip pending" th:if="${order.paymentStatus == 0}">等待付款</span><span
						class="status-chip expired" th:if="${order.paymentStatus == 2}">已取消</span>
				</div>
				<div class="order-meta">
					<span>付款方式：<b
						th:text="${order.paymentMethod == 0 ? '信用卡支付' : '第三方支付'}">—</b></span><span>優惠券：<b
						th:text="${order.memberCoupon != null ? order.memberCoupon.couponSerialNo : '未使用'}">—</b></span><span>訂單總額：NT$
						<b th:text="${order.orderTotal}">0</b>
					</span><span>折扣：NT$ <b
						th:text="${order.discountAmount != null ? order.discountAmount : 0}">0</b></span>
				</div>
				<div class="price-row">
					<span>實付 <strong class="price">NT$ <span
							th:text="${order.netAmount}">0</span></strong></span>
					<div class="inline-actions">
						<a class="btn secondary"
							th:href="@{/member/course/myOrder/detail/{orderId}(orderId=${order.courseOrderId})}">查看明細</a>
						<form class="inline-actions" th:if="${order.paymentStatus == 0}"
							th:action="@{/member/course/order/pay_or_cancel}" method="post">
							<input type="hidden" name="courseOrderId"
								th:value="${order.courseOrderId}"><input type="hidden"
								name="returnUrl">
							<button class="btn" type="submit" name="pay" value="pay">付款</button>
							<button class="btn ghost" type="submit" name="pay" value="cancel">取消訂單</button>
						</form>
						<a class="btn secondary" th:if="${order.paymentStatus == 1}"
							th:href="@{/member/dashboard/myLearning}">前往上課</a>
					</div>
				</div>
			</article>
		</section>
		<div
			th:replace="~{fragments/pagination :: paginationWithOrder(${currentPage}, ${totalPages}, '/member/course/my_course_order', ${orderBy})}"></div>
	</main>
	<div class="modal-shell" th:if="${detailsMsg == 'show'}">
		<div class="modal-card">
			<div class="modal-head">
				<h2>訂單課程明細</h2>
				<button class="icon-button" type="button" data-close-modal>×</button>
			</div>
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>訂單編號</th>
							<th>課程名稱</th>
							<th>定價</th>
							<th>折扣後價格</th>
							<th>課程權限</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="orderDetail : ${details}">
							<td th:text="${orderDetail.courseOrder.courseOrderId}">—</td>
							<td><a
								th:href="@{/member/course/get_one_course/{courseId}(courseId=${orderDetail.course.courseId})}"
								th:text="${orderDetail.course.courseName}">課程</a></td>
							<td th:text="${orderDetail.price}">0</td>
							<td
								th:text="${orderDetail.discountedPrice == null ? '--' : orderDetail.discountedPrice}">—</td>
							<td th:text="${orderDetail.coursePermissionText}">—</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<footer class="site-footer">如需協助，請聯繫平台客服。</footer>
	<script th:src="@{/js/course/member-js.js}"></script>
</body>
</html>
