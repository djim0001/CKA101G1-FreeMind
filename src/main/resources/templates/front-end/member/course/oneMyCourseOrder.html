<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>課程訂單詳情｜諮由自在</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css"
	th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
	body.thy2-member [hidden] {
		display: none !important;
	}

	body.thy2-member .member-course-page {
		position: relative;
		min-height: calc(100vh - 74px);
		padding: clamp(2.6rem, 6vw, 4.5rem) 0 5rem;
		isolation: isolate;
	}

	body.thy2-member .member-course-page::before {
		position: absolute;
		z-index: -1;
		top: 1.25rem;
		right: -7vw;
		width: clamp(170px, 24vw, 320px);
		aspect-ratio: 1;
		border-radius: 50%;
		background: rgba(194, 217, 237, .38);
		content: "";
	}

	body.thy2-member .member-course-page h1,
	body.thy2-member .member-course-page h2,
	body.thy2-member .member-course-page h3,
	body.thy2-member .modal-card h2,
	body.thy2-member .modal-card h3 {
		font-family: var(--serif);
		color: var(--ink);
		line-height: 1.4;
	}

	body.thy2-member .member-course-page h1 {
		margin: .35rem 0 .7rem;
		font-family: var(--zen-maru);
		font-size: clamp(2rem, 4vw, 2.8rem);
	}

	body.thy2-member .member-course-page h2 {
		margin: 0 0 .85rem;
		font-size: clamp(1.35rem, 2.5vw, 1.8rem);
	}

	body.thy2-member .member-course-page h3 {
		margin: 0 0 .55rem;
		font-size: 1.15rem;
	}

	body.thy2-member .member-course-page p {
		margin-top: 0;
	}

	body.thy2-member .meta {
		color: var(--ink-soft);
		font-size: .88rem;
	}

	body.thy2-member .section-head,
	body.thy2-member .healing-header {
		display: flex;
		align-items: flex-end;
		justify-content: space-between;
		gap: 1.5rem;
		margin-bottom: 2rem;
		padding-bottom: 1.35rem;
		border-bottom: 1px solid var(--line);
	}

	body.thy2-member .section-head > p,
	body.thy2-member .healing-header p {
		margin-bottom: 0;
		color: var(--ink-soft);
	}

	body.thy2-member .section-head-actions,
	body.thy2-member .healing-header-actions {
		display: flex;
		align-items: center;
		justify-content: flex-end;
		gap: .7rem;
		flex-wrap: wrap;
	}

	body.thy2-member .member-breadcrumb {
		margin-bottom: 1.4rem;
		color: var(--ink-soft);
		font-size: .85rem;
	}

	body.thy2-member .member-breadcrumb ol {
		display: flex;
		gap: .35rem;
		flex-wrap: wrap;
		margin: 0;
		padding: 0;
		list-style: none;
	}

	body.thy2-member .member-breadcrumb li:not(:last-child)::after {
		margin-left: .35rem;
		color: var(--line);
		content: "／";
	}

	body.thy2-member .member-breadcrumb a:hover {
		color: var(--orange-deep);
	}

	body.thy2-member .panel,
	body.thy2-member .review-item,
	body.thy2-member .coupon-record {
		border: 1px solid var(--line);
		border-radius: var(--radius-md);
		background: var(--white);
		box-shadow: var(--shadow-sm);
	}

	body.thy2-member .panel {
		padding: clamp(1.25rem, 3vw, 2rem);
	}

	body.thy2-member .stack {
		display: grid;
		gap: 1rem;
	}

	body.thy2-member .two-col {
		display: grid;
		grid-template-columns: minmax(0, 1.55fr) minmax(280px, .75fr);
		gap: 1.4rem;
		align-items: start;
	}

	body.thy2-member .notice,
	body.thy2-member .member-message {
		margin-bottom: 1.25rem;
		padding: .9rem 1.1rem;
		border: 1px solid rgba(245, 142, 107, .35);
		border-radius: 14px;
		color: var(--ink);
		background: var(--pink-soft);
	}

	body.thy2-member .empty-state {
		padding: clamp(2rem, 6vw, 4rem);
		border: 1px dashed var(--line);
		border-radius: var(--radius-lg);
		background: var(--white);
		text-align: center;
	}

	body.thy2-member .empty-state p {
		margin-bottom: 1rem;
		color: var(--ink-soft);
	}

	body.thy2-member .tabs {
		display: flex;
		gap: .55rem;
		margin-bottom: 1.4rem;
		padding: .55rem;
		overflow-x: auto;
		border: 1px solid var(--line);
		border-radius: 999px;
		background: rgba(255, 255, 255, .72);
		box-shadow: var(--shadow-sm);
	}

	body.thy2-member .tabs button,
	body.thy2-member .tabs a {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-height: 40px;
		padding: .55rem 1rem;
		border-radius: 999px;
		color: var(--ink-soft);
		white-space: nowrap;
		font-size: .9rem;
		font-weight: 500;
		transition: color .18s, background .18s, transform .18s;
	}

	body.thy2-member .tabs button:hover,
	body.thy2-member .tabs a:hover,
	body.thy2-member .tabs .active {
		color: var(--white);
		background: var(--orange);
		transform: translateY(-1px);
	}

	body.thy2-member .course-grid {
		display: grid;
		grid-template-columns: repeat(3, minmax(0, 1fr));
		gap: 1.35rem;
	}

	body.thy2-member .course-card {
		display: flex;
		min-width: 0;
		overflow: hidden;
		flex-direction: column;
		border: 1px solid var(--line);
		border-radius: var(--radius-md);
		background: var(--white);
		box-shadow: var(--shadow-sm);
		transition: transform .25s, box-shadow .25s;
	}

	body.thy2-member .course-card:hover {
		box-shadow: var(--shadow-md);
		transform: translateY(-5px);
	}

	body.thy2-member .course-cover,
	body.thy2-member .learning-cover {
		position: relative;
		display: grid;
		overflow: hidden;
		min-height: 170px;
		place-items: center;
		background: linear-gradient(135deg, var(--blue-soft), var(--pink-soft));
	}

	body.thy2-member .course-cover video,
	body.thy2-member .learning-cover video {
		width: 100%;
		height: 100%;
		min-height: 170px;
		object-fit: cover;
	}

	body.thy2-member .course-cover > span,
	body.thy2-member .learning-cover > span {
		position: absolute;
		left: 1rem;
		bottom: 1rem;
		padding: .3rem .7rem;
		border-radius: 999px;
		color: var(--ink);
		background: rgba(255, 255, 255, .92);
		font-size: .76rem;
		font-weight: 500;
	}

	body.thy2-member .course-body {
		display: flex;
		flex: 1;
		flex-direction: column;
		padding: 1.3rem;
	}

	body.thy2-member .learning-card {
		display: grid;
		grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
		gap: 1.4rem;
		align-items: stretch;
	}

	body.thy2-member .learning-card > :last-child {
		padding: 1.3rem 1.3rem 1.3rem 0;
	}

	body.thy2-member .tag,
	body.thy2-member .status-chip {
		display: inline-flex;
		align-items: center;
		width: fit-content;
		padding: .28rem .68rem;
		border-radius: 999px;
		color: var(--orange-deep);
		background: var(--pink-soft);
		font-size: .76rem;
		font-weight: 700;
	}

	body.thy2-member .status-chip.pending {
		color: var(--ink);
		background: var(--blue-soft);
	}

	body.thy2-member .status-chip.expired,
	body.thy2-member .status-chip.refunded {
		color: var(--ink-soft);
		background: #F0ECE6;
	}

	body.thy2-member .order-head,
	body.thy2-member .price-row,
	body.thy2-member .summary-row,
	body.thy2-member .course-actions,
	body.thy2-member .inline-actions,
	body.thy2-member .modal-head {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: .8rem 1.2rem;
		flex-wrap: wrap;
	}

	body.thy2-member .order-head {
		margin-bottom: 1rem;
		padding-bottom: .85rem;
		border-bottom: 1px solid var(--line);
	}

	body.thy2-member .order-meta,
	body.thy2-member .course-stats {
		display: flex;
		gap: .45rem 1rem;
		flex-wrap: wrap;
		color: var(--ink-soft);
		font-size: .84rem;
	}

	body.thy2-member .price-row,
	body.thy2-member .summary-row {
		margin-top: .9rem;
		padding-top: .9rem;
		border-top: 1px solid var(--line);
	}

	body.thy2-member .summary-row.total {
		color: var(--orange-deep);
		font-size: 1.08rem;
		font-weight: 700;
	}

	body.thy2-member .price {
		color: var(--orange-deep);
		font-size: 1.12rem;
		font-weight: 700;
	}

	body.thy2-member .inline-actions {
		justify-content: flex-start;
		margin-top: 1rem;
	}

	body.thy2-member .inline-actions form {
		margin: 0;
	}

	body.thy2-member .member-course-page .btn,
	body.thy2-member .modal-card .btn {
		justify-content: center;
		color: var(--white);
		background: var(--orange);
	}

	body.thy2-member .member-course-page .btn:hover,
	body.thy2-member .modal-card .btn:hover {
		background: var(--orange-deep);
		transform: translateY(-2px);
	}

	body.thy2-member .btn.secondary {
		color: var(--ink);
		background: var(--bg-soothing);
		box-shadow: none;
	}

	body.thy2-member .btn.secondary:hover {
		color: var(--ink);
		background: #AECBE4;
	}

	body.thy2-member .btn.ghost {
		border: 1px solid var(--line);
		color: var(--ink);
		background: var(--white);
		box-shadow: none;
	}

	body.thy2-member .btn.ghost:hover {
		border-color: var(--orange);
		color: var(--orange-deep);
		background: var(--white);
	}

	body.thy2-member .btn.danger {
		color: var(--white);
		background: #D76686;
	}

	body.thy2-member .btn:disabled {
		opacity: .48;
		cursor: not-allowed;
		transform: none;
	}

	body.thy2-member .progress {
		height: 10px;
		overflow: hidden;
		margin: 1rem 0;
		border-radius: 999px;
		background: var(--blue-soft);
	}

	body.thy2-member .progress > span {
		display: block;
		height: 100%;
		border-radius: inherit;
		background: linear-gradient(90deg, var(--orange), var(--pink));
	}

	body.thy2-member .table-wrap {
		width: 100%;
		overflow-x: auto;
		border: 1px solid var(--line);
		border-radius: var(--radius-md);
		background: var(--white);
		box-shadow: var(--shadow-sm);
	}

	body.thy2-member .table-wrap table,
	body.thy2-member .modal-card table {
		width: 100%;
		border-collapse: collapse;
	}

	body.thy2-member .table-wrap th,
	body.thy2-member .table-wrap td,
	body.thy2-member .modal-card th,
	body.thy2-member .modal-card td {
		padding: .9rem 1rem;
		border-bottom: 1px solid var(--line);
		text-align: left;
		vertical-align: middle;
		white-space: nowrap;
	}

	body.thy2-member .table-wrap th,
	body.thy2-member .modal-card th {
		color: var(--ink);
		background: var(--blue-soft);
		font-size: .82rem;
		letter-spacing: .04em;
	}

	body.thy2-member .table-wrap td,
	body.thy2-member .modal-card td {
		font-size: .88rem;
	}

	body.thy2-member .table-wrap tbody tr:hover,
	body.thy2-member .modal-card tbody tr:hover {
		background: rgba(253, 230, 219, .35);
	}

	body.thy2-member .cart-item {
		display: grid;
		grid-template-columns: 82px minmax(0, 1fr) auto;
		gap: 1rem;
		align-items: center;
		padding: 1rem 0;
		border-bottom: 1px solid var(--line);
	}

	body.thy2-member .cart-item:last-child {
		border-bottom: 0;
	}

	body.thy2-member .thumb {
		display: grid;
		width: 82px;
		height: 82px;
		place-items: center;
		border-radius: 18px;
		color: var(--ink);
		background: linear-gradient(135deg, var(--blue-soft), var(--pink-soft));
		font-size: .8rem;
		font-weight: 700;
	}

	body.thy2-member .coupon-card-grid {
		display: grid;
		grid-template-columns: repeat(2, minmax(0, 1fr));
		gap: 1.2rem;
	}

	body.thy2-member .coupon-record {
		display: grid;
		grid-template-columns: minmax(135px, .55fr) minmax(0, 1.45fr);
		overflow: hidden;
	}

	body.thy2-member .coupon-value-panel {
		display: flex;
		align-items: center;
		justify-content: center;
		flex-direction: column;
		padding: 1.4rem;
		color: var(--ink);
		background: var(--bg-soothing);
		text-align: center;
	}

	body.thy2-member .coupon-value-panel strong {
		font-family: var(--serif);
		font-size: 2rem;
	}

	body.thy2-member .coupon-record-body {
		padding: 1.35rem;
	}

	body.thy2-member .coupon-record-body dl {
		display: grid;
		gap: .7rem;
		margin: 1rem 0;
	}

	body.thy2-member .coupon-record-body dl > div {
		display: flex;
		justify-content: space-between;
		gap: 1rem;
	}

	body.thy2-member .coupon-record-body dt {
		color: var(--ink-soft);
	}

	body.thy2-member .coupon-record-body dd {
		margin: 0;
		text-align: right;
	}

	body.thy2-member .review-item {
		padding: 1.35rem;
	}

	body.thy2-member .rating {
		color: var(--orange-deep);
		letter-spacing: .08em;
	}

	body.thy2-member .form-group {
		display: grid;
		gap: .45rem;
		margin-top: 1rem;
	}

	body.thy2-member .form-group label {
		font-weight: 700;
	}

	body.thy2-member .field {
		width: 100%;
		min-height: 46px;
		padding: .72rem .9rem;
		border: 1px solid var(--line);
		border-radius: 14px;
		outline: none;
		color: var(--ink);
		background: var(--bg-warm);
		font: inherit;
		transition: border-color .18s, box-shadow .18s, background .18s;
	}

	body.thy2-member textarea.field {
		min-height: 130px;
		resize: vertical;
	}

	body.thy2-member .field:focus {
		border-color: var(--orange);
		background: var(--white);
		box-shadow: 0 0 0 3px rgba(245, 142, 107, .14);
	}

	body.thy2-member .required,
	body.thy2-member .error {
		color: #C85870;
	}

	body.thy2-member .detail-cover {
		overflow: hidden;
		border-radius: var(--radius-md);
		background: var(--ink);
		box-shadow: var(--shadow-sm);
	}

	body.thy2-member .detail-cover video {
		display: block;
		width: 100%;
		max-height: 520px;
		background: #17252c;
	}

	body.thy2-member .playback-status {
		display: flex;
		gap: .45rem 1rem;
		padding: .8rem 1rem;
		flex-wrap: wrap;
		color: var(--white);
		background: rgba(58, 75, 83, .92);
		font-size: .82rem;
	}

	body.thy2-member .question-item {
		padding: 1rem 0;
		border-bottom: 1px solid var(--line);
	}

	body.thy2-member .question-item:last-child {
		border-bottom: 0;
	}

	body.thy2-member .answer-box {
		margin-top: .8rem;
		padding: .9rem 1rem;
		border-radius: 14px;
		background: var(--blue-soft);
	}

	body.thy2-member .course-price-block {
		margin: 1rem 0;
		padding: 1rem 0;
		border-top: 1px solid var(--line);
		border-bottom: 1px solid var(--line);
	}

	body.thy2-member .discount-price-panel {
		display: grid;
		grid-template-columns: max-content minmax(0, 1fr);
		align-items: center;
		gap: .45rem .7rem;
	}

	body.thy2-member .discount-price-panel p {
		margin: 0;
	}

	body.thy2-member .original-price {
		color: var(--ink-soft);
		font-size: .82rem;
		white-space: nowrap;
	}

	body.thy2-member .original-price del {
		text-decoration-color: var(--orange-deep);
		text-decoration-thickness: 2px;
	}

	body.thy2-member .discount-price {
		display: flex;
		align-items: center;
		gap: .42rem;
		white-space: nowrap;
	}

	body.thy2-member .discount-badge {
		padding: .2rem .5rem;
		border-radius: 999px;
		color: var(--orange-deep);
		background: var(--pink-soft);
		font-size: .7rem;
		font-weight: 700;
	}

	body.thy2-member .discount-period {
		grid-column: 1 / -1;
		color: var(--ink-soft);
		font-size: .75rem;
	}

	body.thy2-member .modal-shell {
		position: fixed;
		z-index: 200;
		inset: 0;
		display: grid;
		overflow-y: auto;
		padding: 2rem 1rem;
		place-items: center;
		background: rgba(33, 48, 55, .55);
		backdrop-filter: blur(5px);
	}

	body.thy2-member .modal-card {
		width: min(900px, 94vw);
		max-height: calc(100vh - 4rem);
		overflow-y: auto;
		padding: clamp(1.25rem, 3vw, 2rem);
		border: 1px solid var(--line);
		border-radius: var(--radius-lg);
		background: var(--white);
		box-shadow: var(--shadow-md);
	}

	body.thy2-member .modal-head {
		margin-bottom: 1rem;
		padding-bottom: .9rem;
		border-bottom: 1px solid var(--line);
	}

	body.thy2-member .icon-button {
		display: grid;
		width: 42px;
		height: 42px;
		place-items: center;
		border-radius: 50%;
		color: var(--ink);
		background: var(--bg-warm);
		font-size: 1.4rem;
		transition: color .18s, background .18s, transform .18s;
	}

	body.thy2-member .icon-button:hover {
		color: var(--white);
		background: var(--orange);
		transform: rotate(4deg);
	}

	body.thy2-member .floating-cart {
		position: fixed;
		z-index: 85;
		right: 24px;
		bottom: 88px;
		display: grid;
		width: 54px;
		height: 54px;
		place-items: center;
		border-radius: 50%;
		color: var(--white);
		background: var(--ink);
		box-shadow: var(--shadow-md);
		transition: transform .2s, background .2s;
	}

	body.thy2-member .floating-cart:hover {
		background: var(--orange-deep);
		transform: translateY(-3px);
	}

	body.thy2-member .floating-cart svg {
		width: 25px;
		height: 25px;
	}

	body.thy2-member .floating-cart-count {
		position: absolute;
		top: -5px;
		right: -4px;
		display: grid;
		min-width: 23px;
		height: 23px;
		padding: 0 5px;
		place-items: center;
		border: 2px solid var(--white);
		border-radius: 999px;
		color: var(--white);
		background: var(--orange);
		font-size: .7rem;
		font-weight: 700;
	}

	body.thy2-member .learning-card {
		overflow: hidden;
		padding: 0;
	}

	body.thy2-member .two-col > aside.panel {
		position: sticky;
		top: 92px;
	}

	body.thy2-member .panel > form + form {
		margin-top: .75rem;
	}

	body.thy2-member .panel form > label {
		display: flex;
		align-items: flex-start;
		gap: .55rem;
		margin: .7rem 0;
	}

	body.thy2-member .panel form > .btn {
		margin-top: .75rem;
	}

	body.thy2-member .table-wrap form {
		margin: 0;
	}

	body.thy2-member .member-order-status-table {
		min-width: 960px;
	}

	body.thy2-member .table-wrap td.empty-state {
		padding: 2rem;
		border: 0;
		border-radius: 0;
		box-shadow: none;
	}

	body.thy2-member .claim-coupon-card.is-unavailable {
		opacity: .68;
	}

	body.thy2-member .course-price-block + .stack .btn {
		width: 100%;
	}

	body.thy2-member .favorite-heart {
		color: var(--orange-deep);
		font-size: 1.05rem;
	}

	@media (max-width: 980px) {
		body.thy2-member .two-col > aside.panel {
			position: static;
		}
	}

	@media (max-width: 980px) {
		body.thy2-member .course-grid,
		body.thy2-member .coupon-card-grid {
			grid-template-columns: repeat(2, minmax(0, 1fr));
		}

		body.thy2-member .two-col {
			grid-template-columns: 1fr;
		}
	}

	@media (max-width: 760px) {
		body.thy2-member .section-head,
		body.thy2-member .healing-header {
			display: block;
		}

		body.thy2-member .section-head-actions,
		body.thy2-member .healing-header-actions {
			justify-content: flex-start;
			margin-top: 1rem;
		}

		body.thy2-member .course-grid,
		body.thy2-member .coupon-card-grid {
			grid-template-columns: 1fr;
		}

		body.thy2-member .learning-card,
		body.thy2-member .coupon-record {
			grid-template-columns: 1fr;
		}

		body.thy2-member .learning-card > :last-child {
			padding: 1.25rem;
		}

		body.thy2-member .cart-item {
			grid-template-columns: 64px minmax(0, 1fr);
		}

		body.thy2-member .thumb {
			width: 64px;
			height: 64px;
		}

		body.thy2-member .cart-item > :last-child {
			grid-column: 1 / -1;
		}

		body.thy2-member .table-wrap table {
			min-width: 780px;
		}
	}

	@media (max-width: 520px) {
		body.thy2-member .member-course-page {
			padding-top: 2.2rem;
		}

		body.thy2-member .tabs {
			border-radius: var(--radius-md);
		}

		body.thy2-member .tabs > * {
			flex: 1 1 auto;
		}

		body.thy2-member .inline-actions,
		body.thy2-member .inline-actions form,
		body.thy2-member .inline-actions .btn {
			width: 100%;
		}

		body.thy2-member .modal-shell {
			padding: .75rem;
		}

		body.thy2-member .modal-card {
			width: 100%;
			max-height: calc(100vh - 1.5rem);
			border-radius: var(--radius-md);
		}

		body.thy2-member .floating-cart {
			right: 16px;
			bottom: 72px;
			width: 48px;
			height: 48px;
		}
	}
</style>
</head>
<body class="thy2-member"
	th:attr="data-member-unread-count=${countMemberUnread != null ? countMemberUnread : ''}">
	<div th:replace="~{fragments/header :: header}"></div>

<main class="wrap member-course-page">
		<div class="section-head">
			<div>
				<p class="eyebrow">Order detail</p>
				<h1>課程訂單詳情</h1>
			</div>
			<a class="btn secondary" th:href="@{/member/course/my_course_order}">返回訂單紀錄</a>
		</div>
		<div class="empty-state" th:if="${orders == null || orders.isEmpty()}">找不到此訂單</div>
		<section class="stack" th:if="${orders != null}">
			<article class="panel order-card" th:each="order : ${orders}"
				th:if="${order != null}">
				<div class="order-head">
					<div>
						<strong>訂單 #<span th:text="${order.courseOrderId}">—</span></strong>
						<p class="meta"
							th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm:ss')}">—</p>
					</div>
					<span class="status-chip" th:if="${order.paymentStatus == 1}">已付款</span><span
						class="status-chip pending" th:if="${order.paymentStatus == 0}">未付款</span>
				</div>
				<div class="order-meta">
					<span>會員：<b th:text="${order.member.name}">會員</b></span><span>付款方式：<b
						th:text="${order.paymentMethod == 0 ? '信用卡支付' : '第三方支付'}">—</b></span><span>優惠券：<b
						th:text="${order.memberCoupon != null ? order.memberCoupon.couponSerialNo : '無使用優惠券'}">—</b></span>
				</div>
				<div class="summary-row">
					<span>訂單總額</span><strong>NT$ <span
						th:text="${order.orderTotal}">0</span></strong>
				</div>
				<div class="summary-row">
					<span>折扣金額</span><strong>− NT$ <span
						th:text="${order.discountAmount != null ? order.discountAmount : 0}">0</span></strong>
				</div>
				<div class="summary-row total">
					<span>實付金額</span><span class="price">NT$ <span
						th:text="${order.netAmount}">0</span></span>
				</div>
			</article>
		</section>
	</main>

	<a class="floating-cart" th:href="@{/member/course/shopping_cart}"
		aria-label="前往購物車" title="前往購物車">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
			stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
			aria-hidden="true">
			<circle cx="9" cy="20" r="1"></circle>
			<circle cx="18" cy="20" r="1"></circle>
			<path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.5h7.8a2 2 0 0 0 1.9-1.4L21 8H6"></path>
		</svg>
		<span class="floating-cart-count" data-cart-count
			th:text="${countMemberCartCount != null ? countMemberCartCount : 0}"
			th:hidden="${countMemberCartCount == null or countMemberCartCount <= 0}"
			th:attr="data-cart-count-value=${countMemberCartCount != null ? countMemberCartCount : ''},aria-label=${countMemberCartCount != null and countMemberCartCount > 0 ? '購物車內有 ' + countMemberCartCount + ' 門課程' : '購物車目前沒有課程'}"
			aria-live="polite" aria-atomic="true">0</span>
	</a>
	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script th:src="@{/js/nav.js}"></script>
	<script th:src="@{/js/course/member-js.js}"></script>
</body>
</html>
