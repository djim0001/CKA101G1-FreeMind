<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的評價｜我的療癒足跡</title>
<link rel="stylesheet" th:href="@{/css/course/member-style.css}" />
</head>
<body class="thy2-member healing-page coupon-tone-page">
	<header class="site-header">
		<a class="brand" th:href="@{/}">諮由自在 Free Mind<small>MY
				HEALING JOURNEY</small></a>
		<nav class="main-nav">
			<a th:href="@{/member/course/select_course}">探索課程</a><a
				th:href="@{/member/dashboard}">我的療癒足跡</a><a
				th:href="@{/member/dashboard/myCollection}">我的收藏</a><a
				th:href="@{/member/coupon/my_coupon}">我的優惠券</a><a class="active"
				th:href="@{/member/dashboard/my_review}">我的評價</a><a
				th:href="@{/member/course/my_course_order}">訂單紀錄</a>
		</nav>
		<a class="cart-link" th:href="@{/member/course/shopping_cart}">購物車</a>
	</header>
	<main class="container healing-shell">
		<div class="healing-header">
			<div>
				<p class="eyebrow">My reviews</p>
				<h1>我的療癒足跡／我的評價</h1>
				<p class="meta">每位會員對每堂課只能評價一次。</p>
			</div>
			<button class="btn" type="button" data-toggle-target="#reviewModal">＋
				新增評價</button>
		</div>
		<div class="empty-state"
			th:if="${myCourses == null || myCourses.isEmpty()}">
			<h3>尚未留下課程評價</h3>
			<p>完成學習後，歡迎分享你的感受。</p>
		</div>
		<section class="stack">
			<article class="review-item" th:each="item : ${myCourses}">
				<div class="order-head">
					<div>
						<span class="tag" th:text="${item.course.courseName}">課程名稱</span>
						<h3 class="rating" th:text="${item.rating} + '★'">★★★★★</h3>
						<p th:text="${item.reviewContent}">評價內容</p>
						<p class="meta"
							th:text="${'評價時間：' + #temporals.format(item.reviewedAt, 'yyyy年MM月dd日 HH:mm')}">—</p>
					</div>
					<span class="status-chip">已評價</span>
				</div>
				<button class="btn secondary" type="button" disabled>此課程已完成評價</button>
			</article>
		</section>
		<div
			th:replace="~{fragments/pagination :: pagination(${currentPage}, ${totalPages}, '/member/dashboard/my_review')}"></div>
	</main>
	<div class="modal-shell" id="reviewModal" hidden>
		<div class="modal-card">
			<div class="modal-head">
				<div>
					<p class="eyebrow">Course review</p>
					<h2>新增課程評價</h2>
				</div>
				<button class="icon-button" type="button" data-close-modal>×</button>
			</div>
			<form th:action="@{/member/course/review}" method="post"
				th:object="${review}">
				<div class="form-group">
					<label for="reviewCourse">選擇課程 <span class="required">＊</span></label><select
						class="field" id="reviewCourse" th:field="*{courseId}" required><option
							value=""
							th:if="${unreviewedCourses == null || #lists.isEmpty(unreviewedCourses)}">無可評價課程</option>
						<option th:each="item : ${unreviewedCourses}"
							th:value="${item.course.courseId}"
							th:text="${item.course.courseName}">課程</option></select>
				</div>
				<div class="form-group" style="margin-top: 14px">
					<label for="reviewContent">我的評價 <span class="required">＊</span></label>
					<textarea class="field" id="reviewContent"
						th:field="*{reviewContent}" maxlength="1000" required></textarea>
					<span class="error" th:if="${#fields.hasErrors('reviewContent')}"
						th:errors="*{reviewContent}"></span>
				</div>
				<div class="form-group" style="margin-top: 14px">
					<label for="rating">課程評分 <span class="required">＊</span></label><select
						class="field" id="rating" th:field="*{rating}" data-review-rating
						required><option value="5">★★★★★ 非常有幫助</option>
						<option value="4">★★★★ 有幫助</option>
						<option value="3">★★★ 普通</option>
						<option value="2">★★ 需要改善</option>
						<option value="1">★ 不符合期待</option></select><strong class="rating"
						data-rating-preview>★★★★★</strong>
				</div>
				<input type="hidden" name="returnUrl">
				<div class="inline-actions" style="margin-top: 18px">
					<button class="btn ghost" type="button" data-close-modal>取消</button>
					<button class="btn" type="submit"
						th:if="${!(unreviewedCourses == null || #lists.isEmpty(unreviewedCourses))}">送出評價</button>
				</div>
			</form>
		</div>
	</div>
	<footer class="site-footer">你的回饋能幫助課程持續變得更好。</footer>
	<script th:src="@{/js/course/member-js.js}"></script>
</body>
</html>
