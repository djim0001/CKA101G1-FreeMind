<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>課程訂單一覽</title>
<style>
table {
	width: 100%;
	border-collapse: collapse;
	margin-top: 20px;
}

th, td {
	border: 1px solid #ccc;
	padding: 10px;
	text-align: center;
}

th {
	background-color: #f2f2f2;
}

.status-paid {
	color: green;
	font-weight: bold;
}

.status-unpaid {
	color: red;
	font-weight: bold;
}

.modal {
	position: fixed;
	z-index: 999;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	background-color: rgba(0, 0, 0, 0.4);
	display: flex;
	justify-content: center;
	align-items: center;
}

.modal-content {
	background-color: white;
	padding: 20px;
	width: 700px;
	max-height: 80vh;
	overflow-y: auto;
	border-radius: 8px;
}
</style>
</head>
<body>
	<a th:href="@{/member/dashboard/myLearning}">個人學習空間</a>
	<h1>課程訂單一覽</h1>

	<table>
		<thead>
			<tr>
				<th>訂單編號</th>
				<th>優惠券序號</th>
				<th>訂單總額</th>
				<th>折扣金額</th>
				<th>實付金額</th>
				<th>付款方式</th>
				<th>付款狀態</th>
				<th>訂單時間</th>
				<th>退款申請</th>
			</tr>
		</thead>
		<tbody>
			<th:block th:if="${allMyCourseOrder != null}">
				<tr th:each="order : ${allMyCourseOrder}">
					<td><a
						th:href="@{/member/course/myOrder/detail/{orderId}(orderId=${order.courseOrderId})}"
						th:text="${order.courseOrderId}"> </a></td>
					<td
						th:text="${order.memberCoupon != null ? order.memberCoupon.couponSerialNo : '無使用優惠券'}"></td>
					<td th:text="${order.orderTotal}"></td>
					<td
						th:text="${order.discountAmount != null ? order.discountAmount : 0}"></td>
					<td th:text="${order.netAmount}"></td>
					<td th:text="${order.paymentMethod == 0 ? '信用卡支付' : '第三方支付'}"></td>
					<td><span th:if="${order.paymentStatus == 1}"
						class="status-paid">已付款</span> <span
						th:if="${order.paymentStatus == 0}" class="status-unpaid">未付款</span>
					</td>
					<td
						th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
					<td th:with="refundStatus=${refundStatusMap[order.courseOrderId]}">
						<th:block th:if="${order.paymentStatus == 1 && refundStatus == null}">

							<form th:action="@{/member/refund/detail}" method="get">

								<input type="hidden" name="courseOrderId"
									th:value="${order.courseOrderId}" />

								<button type="submit">申請退款</button>

							</form>

						</th:block>
						<span th:if="${refundStatus == 0}">退款審核中</span>
						<span th:if="${refundStatus == 1}">退款審核成功</span>
						<span th:if="${refundStatus == 2}">退款審核失敗</span>
						<span th:if="${refundStatus == 3}">已退款</span>
						<span th:if="${refundStatus == 4}">退款異常</span>
						<span th:if="${order.paymentStatus == 0}"> 尚未付款 </span>
					</td>
				</tr>
			</th:block>
		</tbody>
	</table>
	<div
		th:replace="~{fragments/pagination :: paginationWithOrder(${currentPage}, ${totalPages}, '/member/refund/orderlist', ${orderBy})}"></div>


	<div id="orderModal" class="modal" th:if="${detailsMsg == 'show'}">

		<div class="modal-content">

			<h2>退款申請</h2>

			<form th:action="@{/member/refund/apply}" method="post">

				<!-- 				<input type="hidden" name="courseOrderId" -->
				<!-- 					th:value="${details.get(0).courseOrder.courseOrderId}" /> -->

				<table>

					<thead>
						<tr>
							<th>訂單編號</th>
							<th>課程名稱</th>
							<th>課程原價</th>
							<th>折扣後價格</th>
							<th>課程權限</th>
						</tr>
					</thead>

					<tbody>

						<tr th:each="orderDetail : ${details}">

							<td th:text="${orderDetail.courseOrder.courseOrderId}"></td>

							<td><a
								th:href="@{/member/course/one_my_course/{courseId}(courseId=${orderDetail.course.courseId})}"
								th:text="${orderDetail.course.courseName}"> </a></td>

							<td th:text="${orderDetail.price}"></td>

							<td
								th:text="${orderDetail.discountedPrice == null ? '--' : orderDetail.discountedPrice}"></td>

							<td th:text="${orderDetail.coursePermissionText}"></td>

							<!-- <input type="hidden" name="courseOrderId" value="${orderDetail.courseOrder.courseOrderId}"> -->
							<input type="hidden" name="courseOrderId"
								th:value="${courseOrderId}">
						</tr>

					</tbody>

				</table>

				<br> <label><b>退款原因</b></label> <br> <br>

				<textarea name="refundReason" rows="6"
					style="width: 100%; resize: none;" maxlength="500"
					placeholder="請輸入退款原因..." required></textarea>

				<br> <br>
				<button type="submit">送出退款申請</button>

				<button type="button" onclick="closeOrderModal()">關閉</button>

			</form>
		</div>
	</div>



	<script>
		function closeOrderModal() {
		    const modal = document.getElementById("orderModal");
		    if (modal) {
		        modal.style.display = "none";
		    }
		}
		document.querySelectorAll('input[name="returnUrl"]').forEach(input => {
		    input.value = window.location.pathname + window.location.search;
		});
	</script>
</body>
</html>
