<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>編輯會員資料｜諮由自在</title>
<link rel="stylesheet" th:href="@{/css/login/common/member-base.css}" />
</head>
<body class="thy2-member">
	<header th:replace="~{fragments/member/memberHeader :: siteHeader('dashboard')}"></header>
	<main class="container">
		<div class="section-head">
			<div>
				<p class="eyebrow">Edit profile</p>
				<h2>編輯會員資料</h2>
			</div>
			<div class="section-head-actions">
				<a class="btn ghost" th:href="@{/member/profile}">取消，回會員資料</a>
			</div>
		</div>

		<div class="panel">
			<form class="form-grid" th:action="@{/member/update}" th:object="${member}"
				method="post" enctype="multipart/form-data">

				<div class="form-group full">
					<label for="profilePicFile">頭像</label>
					<input class="field" type="file" id="profilePicFile" name="profilePicFile"
						accept="image/*" data-pic-preview="#picPreview">
					<img class="avatar-photo" id="picPreview"
						th:src="${member.profilePic != null} ? @{/member/profilePic} : ''"
						th:hidden="${member.profilePic == null}" alt="頭像預覽">
				</div>

				<div class="form-group">
					<label for="name">姓名</label>
					<input class="field" type="text" th:field="*{name}">
					<span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
				</div>

				<div class="form-group">
					<label for="nickname">暱稱</label>
					<input class="field" type="text" th:field="*{nickname}">
					<span class="error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></span>
				</div>

				<div class="form-group">
					<label for="gender">性別</label>
					<select class="field" th:field="*{gender}">
						<option value="男">男</option>
						<option value="女">女</option>
					</select>
					<span class="error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
				</div>

				<div class="form-group">
					<label for="birthday">生日</label>
					<input class="field" type="date" th:field="*{birthday}">
					<span class="error" th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}"></span>
				</div>

				<div class="form-group">
					<label for="phoneNumber">手機號碼</label>
					<input class="field" type="text" th:field="*{phoneNumber}">
					<span class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>
				</div>

				<div class="form-group">
					<label for="email">信箱</label>
					<input class="field" type="text" th:field="*{email}">
					<span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
				</div>

				<div class="form-group">
					<label for="city">城市</label>
					<input class="field" type="text" th:field="*{city}">
					<span class="error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
				</div>

				<div class="form-group">
					<label for="dist">地區</label>
					<input class="field" type="text" th:field="*{dist}">
					<span class="error" th:if="${#fields.hasErrors('dist')}" th:errors="*{dist}"></span>
				</div>

				<div class="form-group full">
					<label for="address">地址</label>
					<input class="field" type="text" th:field="*{address}">
					<span class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
				</div>

				<div class="form-group full section-head-actions">
					<a class="btn ghost" th:href="@{/member/profile}">取消</a>
					<button class="btn" type="submit">儲存</button>
				</div>
			</form>
		</div>
	</main>
	<footer th:replace="~{fragments/member/memberFooter :: siteFooter}"></footer>
	<script th:src="@{/js/login/common/ui.js}"></script>
</body>
</html>
