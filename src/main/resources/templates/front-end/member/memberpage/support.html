<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>聯繫客服｜諮由自在 Free Mind</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />

<!-- ============================================================
     本頁專屬樣式（非共用）
     ============================================================ -->
<style>
.sp-main { padding: 4rem 0 5rem; }

.sp-card {
	max-width: 30rem; margin-inline: auto; text-align: center;
	background: #fff; border: 1px solid var(--line);
	border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
	padding: 3rem 2rem;
}
.sp-card .icon {
	width: 62px; height: 62px; margin: 0 auto 1.3rem;
	border-radius: 50%; display: grid; place-items: center;
	background: var(--pink-soft);
}
.sp-card .icon svg { width: 30px; height: 30px; stroke: var(--orange-deep); }
.sp-card h1 {
	font-family: var(--zen-maru); font-weight: 700;
	font-size: clamp(1.7rem, 3vw, 2.2rem); margin: 0 0 .5rem; line-height: 1.3;
}
.sp-card h1 em { font-style: normal; color: var(--orange); }
.sp-card .sp-label { font-size: .84rem; color: var(--ink-soft); letter-spacing: .12em; text-transform: uppercase; margin: 1.6rem 0 .5rem; }
.sp-mail {
	display: inline-block; font-family: var(--display-en);
	font-size: clamp(1.05rem, 2.4vw, 1.32rem); font-weight: 700;
	color: var(--orange-deep); word-break: break-all;
	border-bottom: 2px solid var(--pink); padding-bottom: .15rem;
	transition: color .2s, border-color .2s;
}
.sp-mail:hover { color: var(--orange); border-color: var(--orange); }

@media (max-width: 560px) { .sp-card { padding: 2.4rem 1.4rem; } }
</style>
</head>

<body>

	<!-- ================= 導覽列 ================= -->
	<div th:replace="~{fragments/header :: header}"></div>

	<!-- ================= 聯繫客服 ================= -->
	<section class="sp-main">
		<div class="wrap">
			<div class="sp-card">
				<span class="icon">
					<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
						<rect x="3" y="5" width="18" height="14" rx="3" />
						<path d="M3.5 7.5 12 13l8.5-5.5" /></svg>
				</span>
				<span class="script" style="font-size:1.3rem;">有任何問題，都可以說</span>
				<h1>聯繫<em>客服</em></h1>
				<p class="sp-label">客服信箱</p>
				<a class="sp-mail" href="mailto:100million@example.com">100million@example.com</a>
			</div>
		</div>
	</section>

	<!-- ================= Footer ================= -->
	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>

	<script th:src="@{/js/nav.js}" src="/js/nav.js"></script>
</body>
</html>
