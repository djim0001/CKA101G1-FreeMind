<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>我的收藏｜諮由自在 Free Mind</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Caveat:wght@500;600;700&amp;family=Noto+Sans+TC:wght@300;400;500;700;900&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
	<style>
		.collection-page {
			position: relative;
			min-height: 70vh;
			padding: clamp(2.2rem, 6vw, 4.8rem) 0 clamp(4rem, 8vw, 6.5rem);
			overflow: hidden;
			background:
				linear-gradient(180deg, rgba(253, 230, 219, .45), transparent 32%),
				var(--bg-warm);
		}

		.collection-page::before,
		.collection-page::after {
			position: absolute;
			border-radius: 50%;
			content: "";
			pointer-events: none;
		}

		.collection-page::before {
			top: 3rem;
			left: -95px;
			width: 260px;
			height: 260px;
			background: rgba(194, 217, 237, .46);
		}

		.collection-page::after {
			right: -80px;
			bottom: 2.5rem;
			width: 210px;
			height: 210px;
			border: 34px solid rgba(251, 208, 190, .46);
		}

		.collection-wrap {
			position: relative;
			z-index: 1;
			width: min(1080px, 92vw);
			margin-inline: auto;
		}

		.collection-hero {
			position: relative;
			display: grid;
			grid-template-columns: minmax(0, 1.2fr) minmax(240px, .8fr);
			gap: clamp(1.5rem, 5vw, 4rem);
			align-items: center;
			margin-bottom: clamp(2.5rem, 6vw, 4.6rem);
			padding: clamp(1.75rem, 3.4vw, 3rem) clamp(2rem, 5vw, 4rem) clamp(2rem, 5vw, 4rem);
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: var(--radius-lg);
			/* memberpage 共用 Hero 色調：溫柔米白 #FFFAEE */
			background: var(--bg-warm);
			box-shadow: var(--shadow-md);
		}

		.collection-hero::before {
			position: absolute;
			inset: auto -70px -110px auto;
			width: 270px;
			height: 270px;
			border-radius: 50%;
			background: var(--pink-soft);
			content: "";
		}

		.collection-hero-copy,
		.collection-illustration {
			position: relative;
			z-index: 1;
		}

		.collection-script {
			margin: 0 0 .55rem;
			color: var(--orange);
			font-family: var(--script);
			font-size: clamp(1.15rem, 2vw, 1.4rem);
			font-weight: 600;
		}

		.collection-hero h1 {
			margin: 0 0 .9rem;
			color: var(--ink);
			font-family: var(--zen-maru);
			font-size: clamp(2rem, 4.5vw, 3.35rem);
			font-weight: 700;
			line-height: 1.3;
		}

		.collection-hero h1 em {
			color: var(--orange-deep);
			font-style: normal;
		}

		.collection-hero p:last-child {
			max-width: 34rem;
			margin: 0;
			color: var(--ink-soft);
			line-height: 1.85;
		}

		.collection-illustration {
			display: grid;
			place-items: center;
			min-height: 230px;
		}

		.bookmark-art {
			position: relative;
			display: grid;
			place-items: center;
			width: 184px;
			height: 218px;
			border: 1px solid rgba(58, 75, 83, .12);
			border-radius: 92px 92px 25px 25px;
			background: var(--blue-soft);
			box-shadow: 18px 18px 0 rgba(194, 217, 237, .48);
		}

		.bookmark-art::before,
		.bookmark-art::after {
			position: absolute;
			border-radius: 50%;
			content: "";
		}

		.bookmark-art::before {
			top: 22px;
			right: 18px;
			width: 34px;
			height: 34px;
			background: var(--pink);
		}

		.bookmark-art::after {
			left: -17px;
			bottom: 28px;
			width: 45px;
			height: 45px;
			background: var(--orange);
			opacity: .78;
		}

		.bookmark-art svg {
			position: relative;
			z-index: 1;
			width: 88px;
			height: 88px;
			color: var(--ink);
		}

		.collection-section-head {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 1.5rem;
			margin-bottom: 1.4rem;
		}

		.collection-section-head .section-label {
			margin: 0 0 .25rem;
			color: var(--orange);
			font-size: .78rem;
			font-weight: 700;
			letter-spacing: .2em;
			text-transform: uppercase;
		}

		.collection-section-head h2 {
			margin: 0;
			color: var(--ink);
			font-family: var(--serif);
			font-size: clamp(1.55rem, 3vw, 2.2rem);
			font-weight: 700;
		}

		.collection-section-head > p {
			margin: 0;
			color: var(--ink-soft);
		}

		.collection-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 1.4rem;
		}

		.collection-card {
			position: relative;
			display: flex;
			flex-direction: column;
			min-height: 310px;
			padding: 1.75rem;
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
			transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
		}

		.collection-card::before {
			position: absolute;
			right: -44px;
			bottom: -52px;
			width: 150px;
			height: 150px;
			border-radius: 50%;
			background: var(--card-tint, var(--blue-soft));
			content: "";
			opacity: .75;
			transition: transform .3s ease;
		}

		.collection-card:nth-child(1) {
			--card-tint: var(--pink-soft);
		}

		.collection-card:nth-child(2) {
			--card-tint: var(--blue-soft);
		}

		.collection-card:nth-child(3) {
			--card-tint: rgba(194, 217, 237, .72);
		}

		.collection-card:hover {
			border-color: rgba(245, 142, 107, .42);
			box-shadow: var(--shadow-md);
			transform: translateY(-6px);
		}

		.collection-card:hover::before {
			transform: scale(1.16);
		}

		.collection-card-icon {
			display: grid;
			place-items: center;
			width: 64px;
			height: 64px;
			margin-bottom: 1.3rem;
			border-radius: 20px;
			color: var(--ink);
			background: var(--card-tint, var(--blue-soft));
		}

		.collection-card-icon svg {
			width: 31px;
			height: 31px;
		}

		.collection-card .card-type {
			margin: 0 0 .35rem;
			color: var(--orange-deep);
			font-size: .75rem;
			font-weight: 700;
			letter-spacing: .13em;
			text-transform: uppercase;
		}

		.collection-card h3 {
			margin: 0 0 .65rem;
			color: var(--ink);
			font-family: var(--serif);
			font-size: 1.3rem;
			font-weight: 700;
		}

		.collection-card .card-description {
			margin: 0 0 1.4rem;
			color: var(--ink-soft);
			font-size: .92rem;
			line-height: 1.75;
		}

		.collection-card-action {
			position: relative;
			z-index: 1;
			display: inline-flex;
			align-items: center;
			gap: .45rem;
			margin-top: auto;
			color: var(--orange-deep);
			font-size: .9rem;
			font-weight: 700;
		}

		.collection-card-action svg {
			width: 17px;
			height: 17px;
			transition: transform .2s ease;
		}

		.collection-card:hover .collection-card-action svg {
			transform: translateX(4px);
		}

		.collection-card:focus-visible {
			outline: 3px solid var(--orange);
			outline-offset: 4px;
		}

		@media (max-width: 840px) {
			.collection-hero {
				grid-template-columns: 1fr;
			}

			.collection-illustration {
				display: none;
			}

			.collection-grid {
				grid-template-columns: 1fr;
			}

			.collection-card {
				min-height: 250px;
			}
		}

		@media (max-width: 580px) {
			.collection-page {
				padding-top: 1.3rem;
			}

			.collection-hero {
				padding: 1.7rem;
				border-radius: var(--radius-md);
			}

			.collection-section-head {
				display: block;
			}

			.collection-section-head > p {
				margin-top: .5rem;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.collection-card,
			.collection-card::before,
			.collection-card-action svg {
				transition: none;
			}
		}
	</style>
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<main class="collection-page">
		<div class="collection-wrap">
			<section class="collection-hero" aria-labelledby="collection-title">
				<div class="collection-hero-copy">
					<p class="collection-script">Keep what moves you</p>
					<h1 id="collection-title">我的<em>收藏</em></h1>
					<p>把想再次閱讀、學習與參與的內容收在這裡。需要一點陪伴時，隨時回來看看曾經打動你的選擇。</p>
				</div>
				<div class="collection-illustration" aria-hidden="true">
					<div class="bookmark-art">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
							<path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"></path>
							<path d="M9 8h6M9 11h4"></path>
						</svg>
					</div>
				</div>
			</section>

			<section aria-labelledby="collection-category-title">
				<div class="collection-section-head">
					<div>
						<p class="section-label">Saved for later</p>
						<h2 id="collection-category-title">選擇收藏分類</h2>
					</div>
					<p>從想回顧的內容開始。</p>
				</div>

				<div class="collection-grid">
					<a class="collection-card" th:href="@{/member/dashboard/myCollection/course}">
						<span class="collection-card-icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
								<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22V5.5Z"></path>
								<path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22V5.5Z"></path>
							</svg>
						</span>
						<p class="card-type">Courses</p>
						<h3>收藏課程</h3>
						<p class="card-description">查看感興趣的心理課程，挑一堂適合現在步調的內容慢慢開始。</p>
						<span class="collection-card-action">
							查看收藏課程
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="2" stroke-linecap="round" aria-hidden="true">
								<path d="M5 12h14M13 6l6 6-6 6"></path>
							</svg>
						</span>
					</a>

					<a class="collection-card" th:href="@{/member/dashboard/myCollection/article}">
						<span class="collection-card-icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
								<path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path>
								<path d="M8 8h8M8 12h8M8 16h5"></path>
							</svg>
						</span>
						<p class="card-type">Articles</p>
						<h3>收藏文章</h3>
						<p class="card-description">重讀曾帶來共鳴的心理文章，讓理解自己的線索再次被看見。</p>
						<span class="collection-card-action">
							查看收藏文章
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="2" stroke-linecap="round" aria-hidden="true">
								<path d="M5 12h14M13 6l6 6-6 6"></path>
							</svg>
						</span>
					</a>

					<a class="collection-card" th:href="@{/member/dashboard/myCollection/activity}">
						<span class="collection-card-icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
								<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
								<circle cx="9" cy="7" r="4"></circle>
								<path d="M19 8v6M16 11h6"></path>
							</svg>
						</span>
						<p class="card-type">Activities</p>
						<h3>關注活動</h3>
						<p class="card-description">整理想參與的揪團活動，在合適的時間和同行的人一起出發。</p>
						<span class="collection-card-action">
							查看關注活動
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="2" stroke-linecap="round" aria-hidden="true">
								<path d="M5 12h14M13 6l6 6-6 6"></path>
							</svg>
						</span>
					</a>
				</div>
			</section>
		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script src="/js/nav.js"></script>
</body>
</html>
