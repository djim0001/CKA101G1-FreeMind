<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>重設密碼</title>
</head>
<body>

    <h1>重設密碼</h1>

    <p>驗證碼已寄至：<b th:text="${email}"></b>（5 分鐘內有效）</p>

    <p style="color:red;" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>

    <form th:action="@{/front-end/forgot/reset}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        <p>
            <label>驗證碼：<input type="text" name="otp" maxlength="6" autocomplete="one-time-code" autofocus></label>
        </p>
        <p>
            <label>新密碼：<input type="password" name="newPassword" maxlength="20"></label>
        </p>
        <p>
            <label>確認新密碼：<input type="password" name="confirmPassword" maxlength="20"></label>
        </p>
        <button type="submit">重設密碼</button>
    </form>

    <p>
        <a th:href="@{/front-end/login}">回登入頁</a>
    </p>

</body>
</html>
