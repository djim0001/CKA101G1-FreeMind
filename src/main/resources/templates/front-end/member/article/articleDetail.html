<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title th:text="${article.title} + '｜諮由自在 Free Mind'">文章詳情｜諮由自在 Free Mind</title>
<meta name="_csrf"        th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<style>
/* ---------- 頁面背景 ---------- */
.detail-page { background: var(--bg-warm); padding: 2.4rem 0 0; }

/* ---------- 麵包屑 ---------- */
.crumb { font-size: .84rem; color: var(--ink-soft); letter-spacing: .04em; margin-bottom: 1.6rem; }
.crumb a { transition: color .18s; }
.crumb a:hover { color: var(--orange); }
.crumb span { margin: 0 .45rem; opacity: .5; }

/* ---------- 文章主卡（置中） ---------- */
.art-detail-wrap { max-width: 820px; margin: 0 auto; padding: 0 1rem; }

.art-detail-card {
	background: #fff; border-radius: var(--radius-lg);
	box-shadow: var(--shadow-md); overflow: hidden;
}

/* 封面 */
.art-detail-cover { width: 100%; height: 280px; position: relative; overflow: hidden; }
.art-detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art-detail-cover::after { content: none; }
.art-detail-cover.photo-slot { height: 220px; }
.art-detail-cover.photo-slot::after { content: none; }

/* 文章主體 */
.art-detail-body { padding: 2.4rem 2.8rem 3rem; }

/* 分類 ＋ 發布日 */
.art-detail-meta-top {
	display: flex; align-items: center; flex-wrap: wrap; gap: .6rem;
	margin-bottom: 1rem; font-size: .82rem; color: var(--ink-soft);
}
.art-detail-meta-top .cat-tag {
	display: inline-block; padding: .28rem .9rem;
	background: var(--pink-soft); color: var(--orange-deep);
	border-radius: 999px; font-size: .78rem; font-weight: 500; letter-spacing: .06em;
}

/* 標題 */
.art-detail-body h1 {
	font-family: var(--zen-maru); font-weight: 700;
	font-size: clamp(1.6rem, 2.8vw, 2.2rem); line-height: 1.4;
	color: var(--ink); margin: .2rem 0 1.4rem;
}

/* ---------- 動作列 (like/save/share) ---------- */
.art-detail-actions {
	display: flex; align-items: center; gap: .15rem; flex-wrap: wrap;
	margin-bottom: 2rem; padding-bottom: 1rem;
	border-bottom: 1px solid var(--line);
}
.art-detail-actions .view-count {
	font-size: .82rem; color: var(--ink-soft); margin-left: auto;
	display: inline-flex; align-items: center; gap: .35rem;
	user-select: none;
}
.art-detail-actions .view-count svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ---- 按鈕共用 ---- */
.action-btn {
	display: inline-flex; align-items: center; gap: .4rem;
	height: 40px; padding: 0 1.1rem;
	background: transparent;
	color: #333333; /* 文字與數字改為質感深石墨灰 */
	border: none; border-radius: 999px;
	font-size: .88rem; font-family: inherit; cursor: pointer;
	transition: background .15s;
	position: relative; user-select: none;
	-webkit-tap-highlight-color: transparent;
}
.action-btn:hover { background: #f0f0f0; }
.action-btn:active { transform: scale(.92); }
.action-btn svg {
	width: 24px; height: 24px; flex-shrink: 0;
	transition: transform .2s cubic-bezier(.34,1.56,.64,1);
}
.action-btn .count {
	font-weight: 600; min-width: 10px; font-size: .88rem;
	color: #333333; transition: color .2s;
}

/* ---- Like：點擊後滿版紅，預設/未點擊外框為 #333333 ---- */
.action-btn.like-btn .heart-icon {
	fill: none; stroke: #333333;
	transition: fill .15s, stroke .15s;
}
.action-btn.like-btn.active .heart-icon { fill: #FF3040; stroke: #FF3040; }
.action-btn.like-btn.active .count      { color: #FF3040; }

/* ---- Bookmark：點擊後填滿莫蘭迪淺灰 (#e4e4e7)，外框保留 #333333 ---- */
.action-btn.bookmark-btn .bookmark-icon {
	fill: none; stroke: #333333;
	transition: fill .15s, stroke .15s;
}
.action-btn.bookmark-btn.active .bookmark-icon { fill: #e4e4e7; stroke: #333333; }

/* ---- Share：外框 #333333 ---- */
.action-btn.share-btn .share-icon {
	fill: none; stroke: #333333;
}
.action-btn.share-btn:active svg { transform: scale(.85) rotate(-10deg); }
.action-btn.disabled { opacity: .35; pointer-events: none; cursor: default; }

/* ---- 彈跳動畫（僅由 JS 觸發） ---- */
@keyframes actionPop {
	0%   { transform: scale(1); }
	25%  { transform: scale(1.28); }
	50%  { transform: scale(.88); }
	75%  { transform: scale(1.08); }
	100% { transform: scale(1); }
}

/* 文章內文（h2/h3 加 !important 蓋過 TinyMCE inline style） */
.art-detail-content {
	font-family: var(--sans); font-size: 1.02rem;
	color: var(--ink); line-height: 1.95;
}
.art-detail-content p { margin-bottom: .9rem; }
.art-detail-content p:empty,
.art-detail-content p.is-blank { margin-bottom: .15rem; line-height: .3; }
.art-detail-content img { display: inline-block; max-width: 100%; height: auto; border-radius: 12px; margin: .3rem; vertical-align: top; }
.art-detail-content h2 {
	font-family: var(--sans) !important;
	font-size: 1.15rem !important;
	font-weight: 700; margin: 2rem 0 .8rem; color: var(--ink);
}
.art-detail-content h3 {
	font-family: var(--sans) !important;
	font-size: 1.05rem !important;
	font-weight: 700; margin: 1.6rem 0 .6rem; color: var(--ink);
}
.art-detail-content blockquote {
	margin: 1.4rem 0; padding: .8rem 1.2rem;
	border-left: 4px solid var(--orange); background: var(--pink-soft);
	border-radius: 0 12px 12px 0; font-style: italic; color: var(--ink-soft);
}
.art-detail-content ul, .art-detail-content ol { padding-left: 1.5rem; margin-bottom: .9rem; }
.art-detail-content li { margin-bottom: .3rem; }

/* ---------- 推薦文章（米色底，在白卡外） ---------- */
.recommend-section { padding: 2.4rem 0 2rem; }
.recommend-head { margin-bottom: 1.2rem; }
.recommend-head .script { color: var(--orange); }
.recommend-title {
	font-family: var(--serif); font-weight: 700;
	font-size: 1.3rem; color: var(--ink); margin: .2rem 0 0;
}
.recommend-list {
	display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1.2rem;
}
.rec-card {
	display: flex; flex-direction: column;
	background: #fff; border: 1px solid var(--line);
	border-radius: var(--radius-md); overflow: hidden;
	text-decoration: none; color: inherit;
	box-shadow: var(--shadow-sm);
	transition: transform .25s, box-shadow .25s;
}
.rec-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.rec-cover {
	width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
}
.rec-card .photo-slot { width: 100%; aspect-ratio: 16/9; }
.rec-card .photo-slot::after { content: none; }
.rec-body { padding: .9rem 1rem 1.1rem; flex: 1; display: flex; flex-direction: column; }
.rec-meta {
	font-size: .72rem; letter-spacing: .08em; color: var(--orange);
	font-weight: 500; margin-bottom: .35rem;
}
.rec-body h3 {
	font-family: var(--serif); font-weight: 700; font-size: .98rem;
	line-height: 1.5; margin: 0 0 .4rem; color: var(--ink);
	display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.rec-body p {
	font-size: .8rem; color: var(--ink-soft); line-height: 1.7;
	margin: 0; flex: 1;
	display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.rec-foot {
	display: flex; align-items: center; justify-content: space-between;
	font-size: .74rem; color: var(--ink-soft); margin-top: .7rem;
	padding-top: .6rem; border-top: 1px solid var(--line);
}
.rec-foot .go { color: var(--orange); font-weight: 500; }

/* 骨架 shimmer */
.rec-skeleton {
	background: #fff; border: 1px solid var(--line);
	border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm);
}
.rec-skeleton .sk-img {
	width: 100%; height: 120px;
	background: linear-gradient(90deg, var(--line) 25%, #f0ece4 50%, var(--line) 75%);
	background-size: 200% 100%; animation: skShimmer 1.3s infinite;
}
.rec-skeleton .sk-body { padding: .9rem 1rem 1.1rem; }
.rec-skeleton .sk-line {
	height: 11px; border-radius: 6px; margin-bottom: .55rem;
	background: linear-gradient(90deg, var(--line) 25%, #f0ece4 50%, var(--line) 75%);
	background-size: 200% 100%; animation: skShimmer 1.3s infinite;
}
.rec-skeleton .sk-line.s  { width: 55%; }
.rec-skeleton .sk-line.xs { width: 35%; }
@keyframes skShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ---------- wave ---------- */
.detail-wave { display: block; width: 100%; height: 64px; margin-top: -1px; }

/* ---------- 側邊心理師 Tab ---------- */
.psych-side-tab {
	position: fixed; right: 0; top: 50%;
	transform: translateY(-50%); z-index: 200; font-family: var(--sans);
}
.psych-tab-collapsed {
	display: flex; flex-direction: column; align-items: center; gap: 6px;
	background: var(--bg-warm); border: 1px solid var(--line); border-right: none;
	padding: 16px 10px; border-radius: var(--radius-md) 0 0 var(--radius-md);
	cursor: pointer; box-shadow: var(--shadow-md);
	transition: padding .2s, background .2s;
}
.psych-tab-collapsed:hover { padding: 16px 15px; background: #fff; }
.psych-tab-collapsed .tab-avatar {
	width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
}
.psych-tab-collapsed .tab-label {
	font-size: .68rem; font-weight: 500; letter-spacing: .1em;
	color: var(--ink-soft); text-align: center;
}
.psych-tab-expanded {
	display: none; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
	width: 320px; background: #fff; border: 1px solid var(--line);
	border-right: none; border-radius: var(--radius-md) 0 0 var(--radius-md);
	box-shadow: var(--shadow-md); overflow: hidden;
}
.psych-side-tab.expanded .psych-tab-collapsed { display: none; }
.psych-side-tab.expanded .psych-tab-expanded  { display: block; }
.tab-header {
	position: relative;
	background: linear-gradient(135deg, var(--bg-soothing) 0%, var(--pink-soft) 100%);
	padding: 1.4rem 1.4rem 2.8rem; text-align: center;
}
.tab-close {
	position: absolute; top: 10px; right: 12px; border: none; background: none;
	font-size: 20px; line-height: 1; color: var(--ink-soft); cursor: pointer; padding: 4px;
	transition: color .18s;
}
.tab-close:hover { color: var(--ink); }
.tab-header-avatar {
	width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
	border: 3px solid #fff; box-shadow: var(--shadow-md);
	margin: 0 auto .6rem; display: block;
}
.tab-header h3 { font-family: var(--serif); font-weight: 700; font-size: 1.1rem; color: var(--ink); margin: 0; }
.tab-header .tab-cert { font-size: .76rem; color: var(--ink-soft); margin: .25rem 0 0; }
.tab-body {
	padding: .6rem 1.4rem 1.4rem; margin-top: -1.6rem;
	background: #fff; border-radius: var(--radius-md) var(--radius-md) 0 0; position: relative;
}
.tab-info-row {
	display: flex; align-items: baseline; gap: .5rem;
	font-size: .84rem; color: var(--ink-soft); margin-bottom: .5rem;
}
.tab-info-row .label { font-weight: 500; color: var(--ink); flex: 0 0 auto; }
.tab-fee {
	display: inline-flex; align-items: center; gap: .3rem;
	background: var(--pink-soft); color: var(--orange-deep);
	padding: .2rem .7rem; border-radius: 999px; font-size: .8rem; font-weight: 500;
}
.tab-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .2rem; }
.tab-tag {
	display: inline-block; background: var(--bg-warm); color: var(--ink-soft);
	border: 1px solid var(--line); padding: .22rem .7rem;
	border-radius: 999px; font-size: .74rem;
}
.tab-divider { height: 1px; background: var(--line); margin: .9rem 0; }
.tab-book-btn {
	display: flex; align-items: center; justify-content: center; gap: .5rem;
	width: 100%; padding: .72rem 1rem; border-radius: 999px;
	background: var(--orange); color: #fff; font-family: inherit;
	font-size: .92rem; font-weight: 500; border: none; cursor: pointer;
	box-shadow: 0 8px 20px rgba(245,142,107,.35);
	transition: background .2s, transform .2s;
}
.tab-book-btn:hover { background: var(--orange-deep); transform: translateY(-2px); }
.tab-detail-link {
	display: block; text-align: center; margin-top: .7rem;
	font-size: .82rem; color: var(--ink-soft); transition: color .18s;
}
.tab-detail-link:hover { color: var(--orange); }

/* ---------- 分享彈窗 (低飽和莫蘭迪風格) ---------- */
.share-modal-overlay {
	display: none; position: fixed; inset: 0;
	background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
	z-index: 500; align-items: center; justify-content: center;
	opacity: 0; transition: opacity .2s ease;
}
.share-modal-overlay.show { display: flex; opacity: 1; }
.share-modal-panel {
	background: #fff; border-radius: var(--radius-md, 20px);
	box-shadow: 0 10px 30px rgba(0,0,0,.08); width: 90%; max-width: 400px; padding: 1.6rem;
	transform: translateY(10px); transition: transform .2s ease;
}
.share-modal-overlay.show .share-modal-panel { transform: translateY(0); }
.share-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.3rem; }
.share-modal-header span { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: var(--ink, #262626); }
.share-modal-close {
	background: #f4f4f5; border: none; width: 30px; height: 30px; border-radius: 50%;
	font-size: 20px; color: var(--ink-soft, #666); cursor: pointer;
	display: inline-flex; align-items: center; justify-content: center; transition: all .15s;
}
.share-modal-close:hover { background: #e4e4e7; color: var(--ink, #262626); }
.share-modal-options { display: flex; justify-content: space-between; gap: .5rem; }
.share-option { display: flex; flex-direction: column; align-items: center; gap: .5rem; border: none; background: none; cursor: pointer; font-family: inherit; flex: 1; }

.share-icon {
	width: 50px; height: 50px; border-radius: 50%;
	display: flex; align-items: center; justify-content: center;
	font-size: 20px; transition: transform .15s ease, background-color .15s ease;
}
.share-option:hover .share-icon { transform: scale(1.08); }
.share-option:active .share-icon { transform: scale(.95); }
.share-label { font-size: .75rem; font-weight: 600; color: var(--ink-soft, #666); }

/* ---- 低飽和莫蘭迪配色設定 (Soft Colors) ---- */
.copy-icon      { background: #e4e4e7; color: #27272a; } /* 低飽和暖灰 */
.line-icon      { background: #d1f2dc; color: #156234; } /* 低飽和柔綠 */
.instagram-icon { background: #f8ded2; color: #8c3b28; } /* 低飽和粉奶茶 */
.facebook-icon  { background: #dce8fc; color: #164282; } /* 低飽和柔藍 */
.threads-icon   { background: #e0e0e0; color: #171717; } /* 低飽和黑灰 */

.share-toast { margin-top: 1rem; text-align: center; font-size: .78rem; color: var(--ink-soft, #666); min-height: 16px; }

/* ---------- RWD ---------- */
@media (max-width: 900px) {
	.art-detail-body { padding: 1.8rem 1.6rem 2.4rem; }
	.art-detail-cover { height: 240px; }
}
@media (max-width: 720px) {
	.recommend-list { grid-template-columns: 1fr 1fr; gap: .8rem; }
	.rec-cover, .rec-cover-empty { aspect-ratio: 16/9; }
}
@media (max-width: 640px) {
	.art-detail-wrap { padding: 0 .5rem; }
	.art-detail-body { padding: 1.4rem 1.2rem 2rem; }
	.art-detail-cover { height: 190px; }
	.art-detail-body h1 { font-size: 1.4rem; }
	.art-detail-actions .view-count { width: 100%; margin-left: 0; }
	.psych-side-tab { top: auto; bottom: 16px; transform: none; }
	.psych-tab-expanded { top: auto; bottom: 0; transform: none; width: 280px; }
	.recommend-list { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

	<!-- ================= 導覽列 ================= -->
	<div th:replace="~{fragments/header :: header}"></div>

	<!-- wave：header 下方，白色過渡到米色 -->
	<svg class="detail-wave" viewBox="0 0 1440 64" preserveAspectRatio="none"
			 aria-hidden="true" style="margin-top:-1px;">
			<path d="M0 34C180-8 360-8 540 20s360 44 540 8 360-40 360-40v40H0Z"
				  fill="#FFFFFF" /></svg>

	<!-- ================= 主體 ================= -->
	<section class="detail-page">
		<svg viewBox="0 0 1440 80" preserveAspectRatio="none"
	         aria-hidden="true"
	         style="display:block; width:100%; height:80px; margin-top:-80px; position:relative; z-index:1;">
	        <path d="M0,40 C240,80 480,0 720,40 C960,80 1200,0 1440,40 L1440,80 L0,80 Z"
	              fill="#FFFAEE" />
        </svg>
		<div class="wrap">
			<div class="crumb">
				<a th:href="@{/}" href="/">首頁</a><span>/</span>
				<a th:href="@{/article(page=${currentPage}, catId=${selectedCatId})}" href="#">專欄文章</a>
				<span>/</span>
				<span style="opacity:1;color:var(--ink)" th:text="${article.title}">文章標題</span>
			</div>
		</div>

		<!-- 文章主卡 -->
		<div class="art-detail-wrap">
			<div class="art-detail-card">

				<!-- 封面：只判 null，讓端點處理空陣列 -->
				<div class="art-detail-cover" th:if="${article.coverImage != null and article.coverImage.length > 0}">
					<img th:src="@{'/article/' + ${article.articleId} + '/cover'}"
						 th:alt="${article.title}" />
				</div>
				<div class="art-detail-cover photo-slot" th:if="${article.coverImage == null or article.coverImage.length == 0}">
					<div class="ps-inner">
						<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
							<rect x="3" y="6" width="18" height="14" rx="3" />
							<circle cx="12" cy="13" r="3.2" /></svg>
					</div>
				</div>

				<div class="art-detail-body">

					<!-- 分類 ＋ 發布日 -->
					<div class="art-detail-meta-top">
						<span class="cat-tag"
							  th:text="${article.articleCat != null ? article.articleCat.articleCatName : '未分類'}">情緒照顧</span>
						<span th:if="${article.publishedAt != null}"
							  th:text="${#temporals.format(article.publishedAt, 'yyyy-MM-dd HH:mm')}">2026-07-19 14:30</span>
					</div>

					<!-- 標題 -->
					<h1 th:text="${article.title}">文章標題</h1>

					<!--  動作列 (like/save/share) -->
					<div class="art-detail-actions">
						<!-- Like 按鈕 -->
						<button type="button" class="action-btn like-btn"
								th:classappend="${likedByMe} ? ' active' : ''"
								th:attr="data-article-id=${article.articleId}"
								onclick="toggleLike(this)">
							<svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
								<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
							</svg>
							<span class="count" th:text="${stats.likeCount}">0</span>
						</button>
					
						<!-- Bookmark 按鈕 -->
						<button type="button" class="action-btn bookmark-btn"
								th:classappend="${savedByMe} ? ' active' : ''"
								th:attr="data-article-id=${article.articleId}"
								onclick="toggleBookmark(this)">
							<svg class="bookmark-icon" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
								<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
							</svg>
							<span class="count" th:text="${stats.bookmarkCount}">0</span>
						</button>
					
						<!-- Share 按鈕 (小飛機) -->
						<button type="button" class="action-btn share-btn"
								th:attr="data-article-id=${article.articleId},data-article-status=${article.articleStatus}"
								onclick="openShareModal(this)">
							<svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M21.5 12 3.8 2.8c-.4-.2-.8.2-.6.6l2.3 5.4c.5 1.2.5 2.6 0 3.8l-2.3 5.4c-.2.4.2.8.6.6L21.5 12z"/>
								<line x1="6.1" y1="12" x2="21.5" y2="12"/>
							</svg>

	<script th:src="@{/js/nav.js}" src="/js/nav.js"></script>
	<script>
	/* 將 TinyMCE 產生的空段落（&nbsp; / <br>）標記為 is-blank 以縮小間距 */
	document.querySelectorAll('.art-detail-content p').forEach(function(p) {
		var t = p.textContent.replace(/ /g, '').trim();
		if (t === '' && !p.querySelector('img, video, iframe, table')) {
			p.classList.add('is-blank');
		}
	});

	/* ============================================================
	   CSRF
	   ============================================================ */
	function getCsrfHeaders() {
		var token  = document.querySelector('meta[name="_csrf"]').content;
		var header = document.querySelector('meta[name="_csrf_header"]').content;
		var h = {}; h[header] = token; return h;
	}

	/* ============================================================
	   按讚
	   ============================================================ */
	function popIcon(svg, duration) {
		svg.style.animation = 'none';
		void svg.offsetWidth;
		svg.style.animation = 'actionPop ' + duration + 's cubic-bezier(.34,1.56,.64,1)';
	}

	function toggleLike(btn) {
		var id  = btn.getAttribute('data-article-id');
		var svg = btn.querySelector('.heart-icon');
		fetch('/member/article/' + id + '/like', {
			method: 'POST',
			headers: Object.assign(getCsrfHeaders(), { 'X-Requested-With': 'XMLHttpRequest' }),
			redirect: 'manual'
		}).then(function(res) {
			if (res.type === 'opaqueredirect' || res.status === 0 || res.status === 401) {
				window.location.href = '/front-end/login?redirect=' + encodeURIComponent(location.pathname + location.search);
				return null;
			}
			return res.json();
		}).then(function(data) {
			if (!data) return;
			btn.querySelector('.count').textContent = data.likeCount;
			btn.classList.toggle('active', data.likedByMe);
			if (data.likedByMe) popIcon(svg, 0.4);
		});
	}

	/* ============================================================
	   收藏
	   ============================================================ */
	function toggleBookmark(btn) {
		var id  = btn.getAttribute('data-article-id');
		var svg = btn.querySelector('.bookmark-icon');
		fetch('/member/article/' + id + '/bookmark', {
			method: 'POST',
			headers: Object.assign(getCsrfHeaders(), { 'X-Requested-With': 'XMLHttpRequest' }),
			redirect: 'manual'
		}).then(function(res) {
			if (res.type === 'opaqueredirect' || res.status === 0 || res.status === 401) {
				window.location.href = '/front-end/login?redirect=' + encodeURIComponent(location.pathname + location.search);
				return null;
			}
			return res.json();
		}).then(function(data) {
			if (!data) return;
			btn.querySelector('.count').textContent = data.bookmarkCount;
			btn.classList.toggle('active', data.savedByMe);
			if (data.savedByMe) popIcon(svg, 0.35);
		});
	}

	/* ============================================================
	   分享
	   ============================================================ */
	var currentShareBtn = null;
	var currentShareArticleId = null;
	var currentArticleStatus = null;

	function openShareModal(btn) {
		currentShareBtn = btn;
		currentShareArticleId = btn.getAttribute('data-article-id');
		currentArticleStatus = parseInt(btn.getAttribute('data-article-status'), 10);
		document.getElementById('shareToast').textContent = '';
		document.getElementById('shareModal').classList.add('show');
	}
	function closeShareModal() { document.getElementById('shareModal').classList.remove('show'); }
	function closeShareModalOutside(e) { if (e.target.id === 'shareModal') closeShareModal(); }

	function isPublished() { return currentArticleStatus === 2; }

	function incrementShareCount() {
		if (!isPublished()) return Promise.resolve(null);
		return fetch('/article/' + currentShareArticleId + '/share', {
			method: 'POST', headers: getCsrfHeaders()
		}).then(function(r) { return r.json(); }).then(function(d) {
			if (currentShareBtn) currentShareBtn.querySelector('.count').textContent = d.shareCount;
			return d;
		}).catch(function() { return null; });
	}
	function copyLink() {
		var toast = document.getElementById('shareToast');
		toast.textContent = '';
		incrementShareCount().then(function() {
			return navigator.clipboard.writeText(location.href);
		}).then(function() {
			toast.textContent = '連結已複製！';
		}).catch(function() {
			toast.textContent = '複製失敗，請手動複製網址';
		});
	}
	function openSharePopup(url) {
		var w=600,h=500,l=(screen.width-w)/2,t=(screen.height-h)/2;
		window.open(url,'_blank','width='+w+',height='+h+',left='+l+',top='+t+',noopener,noreferrer');
	}
	function shareToLine() {
		document.getElementById('shareToast').textContent = '';
		incrementShareCount().then(function() {
			openSharePopup('https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title));
		});
	}
	function shareToInstagram() {
		var toast = document.getElementById('shareToast');
		toast.textContent = '';
		incrementShareCount().then(function() {
			return navigator.clipboard.writeText(location.href);
		}).then(function() {
			toast.textContent = 'Instagram 不支援直接分享，已複製連結，請至 Instagram App 貼上。';
		});
	}
	function shareToFacebook() {
		document.getElementById('shareToast').textContent = '';
		incrementShareCount().then(function() {
			openSharePopup('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href));
		});
	}
	function shareToThreads() {
		document.getElementById('shareToast').textContent = '';
		incrementShareCount().then(function() {
			openSharePopup('https://www.threads.net/intent/post?text='+encodeURIComponent(document.title+' '+location.href));
		});
	}

	/* ============================================================
	   心理師側邊 Tab
	   ============================================================ */
	function togglePsychTab() {
		var el = document.getElementById('psychSideTab');
		if (el) el.classList.toggle('expanded');
	}
	document.addEventListener('click', function(e) {
		var el = document.getElementById('psychSideTab');
		if (!el) return;
		if (el.classList.contains('expanded') && !el.contains(e.target)) {
			el.classList.remove('expanded');
		}
	});

	/* ============================================================
	   心理師 Tab 不超過 Footer
	   ============================================================ */
	(function () {
		var tab = document.getElementById('psychSideTab');
		var footer = document.getElementById('siteFooter');
		if (!tab || !footer) return;

		function clampTab() {
			var footerTop = footer.getBoundingClientRect().top;
			var tabH = tab.offsetHeight;
			var winH = window.innerHeight;
			var limit = footerTop - tabH / 2;

			if (limit < winH / 2) {
				tab.style.position = 'fixed';
				tab.style.top = limit + 'px';
				tab.style.transform = 'none';
			} else {
				tab.style.position = '';
				tab.style.top = '';
				tab.style.transform = '';
			}
		}

		window.addEventListener('scroll', clampTab, { passive: true });
		window.addEventListener('resize', clampTab, { passive: true });
		clampTab();
	})();

	/* ============================================================
	   推薦文章 AJAX
	   POST /article/{id}/recommend → { articleList: [...] }
	   articleId 從 data-article-id 屬性取得，不依賴 inline JS
	   ============================================================ */
	(function () {
		var section   = document.getElementById('recommendSection');
		var listEl    = document.getElementById('recommendList');
		var articleId = section.dataset.articleId;
		var DETAIL    = '/article/';

		function strip(html) {
			if (!html) return '';
			var plain = html
				.replace(/<[^>]*>/g, ' ')
				.replace(/&[a-zA-Z#0-9]+;/g, ' ')
				.replace(/\s+/g, ' ').trim();
			return plain.length > 52 ? plain.substring(0, 52) + '…' : plain;
		}

		function esc(s) {
			return String(s == null ? '' : s)
				.replace(/&/g,'&amp;').replace(/</g,'&lt;')
				.replace(/>/g,'&gt;').replace(/"/g,'&quot;');
		}

		function formatDate(raw) {
			if (!raw) return '';
			if (Array.isArray(raw)) {
				var y = raw[0], mo = String(raw[1]).padStart(2,'0'), d = String(raw[2]).padStart(2,'0');
				var h = raw.length > 3 ? String(raw[3]).padStart(2,'0') : '00';
				var mi = raw.length > 4 ? String(raw[4]).padStart(2,'0') : '00';
				return y + '-' + mo + '-' + d + ' ' + h + ':' + mi;
			}
			return String(raw).replace('T', ' ').substring(0, 16);
		}

		function skeleton() {
			var h = '';
			for (var i = 0; i < 3; i++) {
				h += '<div class="rec-skeleton">' +
				     '<div class="sk-img"></div>' +
				     '<div class="sk-body">' +
				     '<div class="sk-line xs"></div>' +
				     '<div class="sk-line"></div>' +
				     '<div class="sk-line s"></div>' +
				     '</div></div>';
			}
			return h;
		}

		window.__articleRecEmpty = false;
		function renderCards(list) {
			if (!list || !list.length) { section.style.display = 'none'; window.__articleRecEmpty = true; return; }
			var h = list.slice(0, 3).map(function (art) {
				var id      = art.articleId;
				var title   = esc(art.title || '');
				var summary = strip(art.content);
				var cat     = esc(art.articleCat || '');
				var date    = formatDate(art.publishedAt);
				var psych   = art.psych ? esc(art.psych) + ' 心理師' : '';
				var meta    = [cat, date].filter(Boolean).join(' ・ ');

				var coverHtml = art.hasCover
					? '<img class="rec-cover" src="' + DETAIL + id + '/cover" alt="' + title + '" loading="lazy" />'
					: '<div class="photo-slot"><div class="ps-inner"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.2"/></svg></div></div>';

				return '<a class="rec-card" href="' + DETAIL + id + '">' +
				       coverHtml +
				       '<div class="rec-body">' +
				       '<div class="rec-meta">' + meta + '</div>' +
				       '<h3>' + title + '</h3>' +
				       '<p>' + summary + '</p>' +
				       '<div class="rec-foot">' +
				       '<span>' + psych + '</span>' +
				       '<span class="go">閱讀 →</span>' +
				       '</div></div></a>';
			}).join('');
			listEl.innerHTML = h;
			section.style.display = '';
		}

		/* 骨架先顯示 */
		listEl.innerHTML = skeleton();
		section.style.display = '';

		var headers = Object.assign({ 'X-Requested-With': 'XMLHttpRequest' }, getCsrfHeaders());

		window.__articleRecDone = fetch(DETAIL + articleId + '/recommend/article', {
			method: 'POST', headers: headers, redirect: 'manual'
		})
		.then(function(res) {
			if (res.type === 'opaqueredirect' || res.status === 0) {
				section.style.display = 'none'; window.__articleRecEmpty = true; return null;
			}
			if (!res.ok) throw new Error('HTTP ' + res.status);
			return res.json();
		})
		.then(function(dto) {
			if (!dto) return;
			renderCards(dto.articleList);
		})
		.catch(function(err) {
			console.error('[recommend]', err);
			section.style.display = 'none';
			window.__articleRecEmpty = true;
		});
	})();

	/* ============================================================
	   推薦課程 AJAX
	   POST /article/{id}/recommend/course → { courseList: [...] }
	   ============================================================ */
	(function () {
		var section   = document.getElementById('courseRecommendSection');
		var listEl    = document.getElementById('courseRecommendList');
		var articleId = section.dataset.articleId;

		function esc(s) {
			return String(s == null ? '' : s)
				.replace(/&/g,'&amp;').replace(/</g,'&lt;')
				.replace(/>/g,'&gt;').replace(/"/g,'&quot;');
		}

		function strip(html) {
			if (!html) return '';
			var plain = html
				.replace(/<[^>]*>/g, ' ')
				.replace(/&[a-zA-Z#0-9]+;/g, ' ')
				.replace(/\s+/g, ' ').trim();
			return plain.length > 52 ? plain.substring(0, 52) + '…' : plain;
		}

		function skeleton() {
			var h = '';
			for (var i = 0; i < 3; i++) {
				h += '<div class="rec-skeleton">' +
				     '<div class="sk-img"></div>' +
				     '<div class="sk-body">' +
				     '<div class="sk-line xs"></div>' +
				     '<div class="sk-line"></div>' +
				     '<div class="sk-line s"></div>' +
				     '</div></div>';
			}
			return h;
		}

		function renderCourseCards(list) {
			if (!list || !list.length) { section.style.display = 'none'; return; }
			if (window.__articleRecEmpty) {
				document.getElementById('courseRecommendHead').style.display = '';
				section.style.paddingTop = '';
			}
			var h = list.slice(0, 3).map(function (c) {
				var id    = c.courseId;
				var name  = esc(c.courseName || '');
				var cat   = esc(c.courseCategory || '');
				var psych = c.psych ? esc(c.psych) + ' 心理師' : '';
				var desc  = strip(c.outline);
				var price = c.price != null ? 'NT$ ' + c.price.toLocaleString() : '';
				var videoUrl = c.videoSrcPre || c.videoSrc || '';
				var coverHtml = videoUrl
					? '<video class="rec-cover" muted playsinline preload="metadata" data-course-thumbnail src="' + esc(videoUrl) + '"></video>'
					: '<div class="photo-slot"><div class="ps-inner">' +
					  '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
					  '<polygon points="5 3 19 12 5 21 5 3"/></svg>' +
					  '</div></div>';
				return '<a class="rec-card" href="/member/course/get_one_course/' + id + '">' +
				       coverHtml +
				       '<div class="rec-body">' +
				       '<div class="rec-meta">' + cat + '</div>' +
				       '<h3>' + name + '</h3>' +
				       '<p>' + desc + '</p>' +
				       '<div class="rec-foot">' +
				       '<span>' + psych + '</span>' +
				       '<span class="go">' + price + ' →</span>' +
				       '</div></div></a>';
			}).join('');
			listEl.innerHTML = h;
			section.style.display = '';
			initThumbnails();
		}

		/* 與課程列表相同：跳到 duration/10 秒，避免停在開頭模糊的淡入畫格 */
		function initThumbnails() {
			listEl.querySelectorAll('[data-course-thumbnail]').forEach(function (video) {
				var showPreviewFrame = function () {
					if (!Number.isFinite(video.duration) || video.duration <= 0) return;
					video.currentTime = Math.min(1, Math.max(0.05, video.duration / 10));
				};
				if (video.readyState >= 1) showPreviewFrame();
				else video.addEventListener('loadedmetadata', showPreviewFrame, { once: true });
				video.addEventListener('seeked', function () { video.pause(); }, { once: true });
			});
		}

		listEl.innerHTML = skeleton();
		section.style.display = '';

		var headers = Object.assign({ 'X-Requested-With': 'XMLHttpRequest' }, getCsrfHeaders());

		var articleDone = window.__articleRecDone || Promise.resolve();
		var courseFetch = fetch('/article/' + articleId + '/recommend/course', {
			method: 'POST', headers: headers, redirect: 'manual'
		})
		.then(function(res) {
			if (res.type === 'opaqueredirect' || res.status === 0) {
				section.style.display = 'none'; return null;
			}
			if (!res.ok) throw new Error('HTTP ' + res.status);
			return res.json();
		});

		Promise.all([articleDone, courseFetch])
		.then(function(results) {
			var dto = results[1];
			if (!dto) return;
			renderCourseCards(dto.courseList);
		})
		.catch(function(err) {
			console.error('[course-recommend]', err);
			section.style.display = 'none';
		});
	})();

	/* ============================================================
	   非已上架文章：禁用 like / bookmark / share
	   ============================================================ */
	(function() {
		var shareBtn = document.querySelector('.share-btn');
		if (!shareBtn) return;
		var status = parseInt(shareBtn.getAttribute('data-article-status'), 10);
		if (status === 2) return;
		document.querySelectorAll('.like-btn, .bookmark-btn, .share-btn').forEach(function(btn) {
			btn.disabled = true;
			btn.classList.add('disabled');
			btn.onclick = null;
		});
	})();

	</script>
</body>
</html>
