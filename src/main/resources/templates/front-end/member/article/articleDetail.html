<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${article.title}">文章詳情</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC",
		sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.8;
}

.container {
	max-width: 860px;
	margin: 0 auto;
	padding: 30px 20px;
}

.back-link {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	margin-bottom: 24px;
	padding: 8px 20px;
	background-color: #fff;
	color: #7a6b6b;
	text-decoration: none;
	border-radius: 6px;
	font-size: 14px;
	border: 1px solid #f2dddd;
	transition: all 0.2s;
}

.back-link:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

.article-detail {
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	overflow: hidden;
	padding: 0;
}

.cover-image {
	width: 100%;
	height: 380px;
	overflow: hidden;
	background-color: #fbf2f2;
}

.cover-image img {
	width: 100%;
	height: 100%;
	object-fit: cover;
	display: block;
}

.article-body {
	padding: 36px 40px 48px;
}

.article-body h1 {
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
	margin-bottom: 16px;
	line-height: 1.4;
}

.article-meta {
	display: flex;
	align-items: center;
	gap: 16px;
	margin-bottom: 28px;
	padding-bottom: 20px;
	border-bottom: 1px solid #eee;
	font-size: 14px;
	color: #888;
}

.article-meta .cat-tag {
	display: inline-block;
	padding: 3px 14px;
	background-color: #fbf2f2;
	color: #7a6b6b;
	border-radius: 14px;
	font-size: 13px;
	font-weight: 500;
}

.article-content {
	font-size: 16px;
	color: #444;
	line-height: 1.4;
}

.article-content p {
	margin-bottom: 6px;
}

.article-content img {
	max-width: 100%;
	height: auto;
	border-radius: 8px;
	margin: 12px 0;
}

.article-content h2, .article-content h3 {
	margin-top: 28px;
	margin-bottom: 12px;
	color: #4a3e3e;
}

@media ( max-width : 640px) {
	.article-body {
		padding: 24px 20px 36px;
	}
	.cover-image {
		height: 220px;
	}
	.article-body h1 {
		font-size: 22px;
	}
	.article-meta {
		flex-direction: column;
		align-items: flex-start;
		gap: 8px;
	}
}

</style>
</head>
<body>
	<div class="container">

		<a class="back-link" th:href="@{/article/}">返回文章列表</a>

		<div class="article-detail">

			<div class="cover-image" th:if="${article.coverImage != null}">
				<img th:src="@{/article/{id}/cover(id=${article.articleId})}" />
			</div>

			<div class="article-body">
				<h1 th:text="${article.title}"></h1>

				<div class="article-meta">
					<span class="cat-tag"
						th:text="${article.articleCat != null ? article.articleCat.articleCatName : '未分類'}"></span>
					<span th:text="'發布時間：' + ${article.publishedAt}"></span>
				</div>

				<!-- 文章內文 (TinyMCE 存的是 HTML，用 utext 才能渲染) -->
				<div class="article-content" th:utext="${article.content}"></div>
			</div>

		</div>

	</div>
</body>
</html>
