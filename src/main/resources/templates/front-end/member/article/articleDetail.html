<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${article.title}">文章詳情</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC",
		sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.8;
}

.container {
	max-width: 860px;
	margin: 0 auto;
	padding: 30px 20px;
}

.back-link {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	margin-bottom: 24px;
	padding: 8px 20px;
	background-color: #fff;
	color: #7a6b6b;
	text-decoration: none;
	border-radius: 6px;
	font-size: 14px;
	border: 1px solid #f2dddd;
	transition: all 0.2s;
}

.back-link:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

.article-detail {
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	overflow: hidden;
	padding: 0;
}

.cover-image {
	width: 100%;
	height: 380px;
	overflow: hidden;
	background-color: #fbf2f2;
}

.cover-image img {
	width: 100%;
	height: 100%;
	object-fit: cover;
	display: block;
}

.article-body {
	padding: 36px 40px 48px;
}

.article-body h1 {
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
	margin-bottom: 16px;
	line-height: 1.4;
}

.article-meta {
	display: flex;
	align-items: center;
	gap: 16px;
	margin-bottom: 28px;
	padding-bottom: 20px;
	border-bottom: 1px solid #eee;
	font-size: 14px;
	color: #888;
}

.article-meta .cat-tag {
	display: inline-block;
	padding: 3px 14px;
	background-color: #fbf2f2;
	color: #7a6b6b;
	border-radius: 14px;
	font-size: 13px;
	font-weight: 500;
}

/* 互動列：靠 margin-left:auto 推到 meta 列最右邊 */
.article-actions {
	margin-left: auto;
	display: flex;
	align-items: center;
	gap: 8px;
}

.action-form {
	display: inline-flex;
	margin: 0;
}

.action-btn {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	height: 34px;
	padding: 0 14px;
	background-color: #fbf2f2;
	color: #7a6b6b;
	border: 1px solid #f2dddd;
	border-radius: 20px;
	font-size: 14px;
	font-family: inherit;
	line-height: 1;
	cursor: pointer;
	transition: all 0.2s;
}

.action-btn:hover {
	background-color: #f2dddd;
	color: #4a3e3e;
}

.action-btn i {
	font-size: 16px;
}

.action-btn .count {
	font-weight: 600;
	min-width: 10px;
}

/* 已按讚/已收藏的高亮狀態 */
.action-btn.active {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

.article-content {
	font-size: 16px;
	color: #444;
	line-height: 1.4;
}

.article-content p {
	margin-bottom: 6px;
}

.article-content img {
	max-width: 100%;
	height: auto;
	border-radius: 8px;
	margin: 12px 0;
}

.article-content h2, .article-content h3 {
	margin-top: 28px;
	margin-bottom: 12px;
	color: #4a3e3e;
}

@media ( max-width : 640px) {
	.article-body {
		padding: 24px 20px 36px;
	}
	.cover-image {
		height: 220px;
	}
	.article-body h1 {
		font-size: 22px;
	}
	.article-meta {
		flex-direction: column;
		align-items: flex-start;
		gap: 10px;
	}
	/* 手機時互動列不靠右，改靠左換行 */
	.article-actions {
		margin-left: 0;
		flex-wrap: wrap;
	}
}
</style>
</head>
<body>
	<div class="container">

		<a class="back-link"
			th:href="@{/article/(page=${currentPage}, catId=${selectedCatId})}">返回文章列表</a>

		<div class="article-detail">

			<div class="cover-image" th:if="${article.coverImage != null}">
				<img th:src="@{/article/{id}/cover(id=${article.articleId})}" />
			</div>

			<div class="article-body">
				<h1 th:text="${article.title}"></h1>

				<div class="article-meta">
					<span class="cat-tag"
						th:text="${article.articleCat != null ? article.articleCat.articleCatName : '未分類'}"></span>
					<span th:text="'發布時間：' + ${article.publishedAt}"></span>

					<!-- 互動列：按讚 / 收藏 / 分享（靠右） -->
					<div class="article-actions">

						<!-- 按讚 -->
						<form class="action-form" method="post"
							th:action="@{/member/article/{id}/like(id=${article.articleId})}">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<input type="hidden" name="page" th:value="${currentPage}" />
							<input type="hidden" name="catId" th:value="${selectedCatId}" />
							<button type="submit" class="action-btn like-btn"
								th:classappend="${likedByMe} ? 'active' : ''">
								<i class="fa-regular fa-heart"></i>
								<span class="count" th:text="${likeCount}">0</span>
							</button>
						</form>

						<!-- 收藏（後端尚未做，先放；點了會 404，可先註解此段） -->
						<form class="action-form" method="post"
							th:action="@{/member/article/{id}/bookmark(id=${article.articleId})}">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<input type="hidden" name="page" th:value="${currentPage}" />
							<input type="hidden" name="catId" th:value="${selectedCatId}" />
							<button type="submit" class="action-btn bookmark-btn"
								th:classappend="${bookmarkedByMe} ? 'active' : ''">
								<i class="fa-regular fa-bookmark"></i>
								<span class="count" th:text="${bookmarkCount != null ? bookmarkCount : 0}">0</span>
							</button>
						</form>

						<!-- 分享（純前端複製網址） -->
						<button type="button" class="action-btn share-btn"
							onclick="copyShareLink(this)">
							<i class="fa-regular fa-share-from-square"></i>
							<span class="count" th:text="${shareCount != null ? shareCount : 0}">0</span>
						</button>

					</div>
				</div>

				<!-- 文章內文 (TinyMCE 存的是 HTML，用 utext 才能渲染) -->
				<div class="article-content" th:utext="${article.content}"></div>
			</div>

		</div>

	</div>

	<script>
		function copyShareLink(btn) {
			navigator.clipboard.writeText(window.location.href).then(function() {
				var icon = btn.querySelector('i');
				var original = icon.className;
				icon.className = 'fa-regular fa-circle-check';
				setTimeout(function() {
					icon.className = original;
				}, 1500);
			});
		}
	</script>
</body>
</html>
