<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>收藏文章｜諮由自在 Free Mind</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />

<style>
/* ---------- 頁首標題區 ---------- */
.collect-head {
	background:
		linear-gradient(180deg, rgba(253, 230, 219, .45), transparent 32%),
		var(--bg-warm);
	padding: 2.6rem 0 1.6rem;
}
.collect-head .crumb { font-size: .84rem; color: var(--ink-soft); letter-spacing: .04em; }
.collect-head .crumb a:hover { color: var(--orange); }
.collect-head .crumb span { margin: 0 .45rem; opacity: .5; }
.collect-head h1 {
	font-family: var(--zen-maru); font-weight: 700;
	font-size: clamp(2rem, 3.6vw, 2.8rem); margin: .5rem 0 .4rem; line-height: 1.3;
}
.collect-head h1 em { font-style: normal; color: var(--orange); }
.collect-head p { color: var(--ink-soft); margin: 0; max-width: 34rem; }

/* ---------- 版面 ---------- */
.collect-page {
	position: relative;
	min-height: 70vh;
	padding: .6rem 0 clamp(4rem, 8vw, 6.5rem);
	overflow: hidden;
	background: var(--bg-warm);
}
.collect-page::before,
.collect-page::after {
	position: absolute;
	border-radius: 50%;
	content: "";
	pointer-events: none;
}
.collect-page::before {
	top: 3rem;
	left: -95px;
	width: 260px;
	height: 260px;
	background: rgba(194, 217, 237, .46);
}
.collect-page::after {
	right: -80px;
	bottom: 2.5rem;
	width: 210px;
	height: 210px;
	border: 34px solid rgba(251, 208, 190, .46);
}
.collect-page > .wrap {
	position: relative;
	z-index: 1;
}

/* ---------- 頂部動作列 ---------- */
.collect-toolbar {
	display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
	margin-bottom: 1.6rem;
}
.collect-toolbar .btn { padding: .68rem 1.4rem; font-size: .9rem; }

/* ---------- Tab 切換 ---------- */
.collect-tabs {
	display: flex; gap: .5rem; margin-bottom: 2rem;
	border-bottom: 2px solid var(--line); padding-bottom: 0;
}
.collect-tabs a {
	display: inline-flex; align-items: center; gap: .4rem;
	padding: .7rem 1.4rem; font-size: .92rem; font-weight: 500;
	color: var(--ink-soft); text-decoration: none;
	border-bottom: 2px solid transparent; margin-bottom: -2px;
	transition: color .2s, border-color .2s;
}
.collect-tabs a:hover { color: var(--orange); }
.collect-tabs a.active {
	color: var(--orange); border-bottom-color: var(--orange); font-weight: 600;
}
.collect-tabs a svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ---------- 文章卡片列表 ---------- */
.art-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1.2rem; }

.art-card {
	display: flex; flex-direction: column;
	background: #fff; border: 1px solid var(--line);
	border-radius: var(--radius-md); overflow: hidden;
	box-shadow: var(--shadow-sm); text-decoration: none; color: inherit;
	transition: transform .25s, box-shadow .25s;
}
.art-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }

.art-cover { height: 140px; position: relative; overflow: hidden; }
.art-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art-cover.photo-slot { height: 140px; }
.art-cover.photo-slot::after { content: none; }

.art-body { padding: .9rem 1rem 1.1rem; flex: 1; display: flex; flex-direction: column; }
.art-meta-top {
	font-size: .72rem; letter-spacing: .08em;
	color: var(--orange); font-weight: 500; margin-bottom: .35rem;
}
.art-body h3 {
	font-family: var(--serif); font-weight: 700; font-size: .98rem;
	line-height: 1.5; margin: 0 0 .4rem; color: var(--ink);
	display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.art-body p {
	font-size: .8rem; color: var(--ink-soft); line-height: 1.7;
	margin: 0; flex: 1;
	display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.art-foot {
	display: flex; align-items: center; justify-content: space-between;
	font-size: .74rem; color: var(--ink-soft); margin-top: .7rem;
	padding-top: .6rem; border-top: 1px solid var(--line);
}
.art-foot .go { color: var(--orange); font-weight: 500; }

/* ---------- 空白狀態 ---------- */
.empty-state {
	background: #fff; border: 1px dashed var(--line);
	border-radius: var(--radius-md); padding: 3.4rem 1.5rem; text-align: center;
}
.empty-state svg { width: 46px; height: 46px; stroke: var(--orange); margin: 0 auto 1rem; fill: none; }
.empty-state b { display: block; font-family: var(--serif); font-size: 1.15rem; margin-bottom: .3rem; }
.empty-state p { color: var(--ink-soft); font-size: .92rem; margin: 0; }

/* ---------- RWD ---------- */
@media (max-width: 640px) {
	.collect-tabs a { padding: .6rem .9rem; font-size: .84rem; flex: 1; justify-content: center; }
	.art-list { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<!-- ================= 導覽列 ================= -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- ================= 頁首標題 ================= -->
<section class="collect-head">
	<div class="wrap">
		<div class="crumb">
			<a th:href="@{/}" href="/">首頁</a><span>/</span>
			<a th:href="@{/member/dashboard}" href="#">我的療癒足跡</a><span>/</span>
			<a th:href="@{/member/dashboard/myCollection}" href="#">我的收藏</a><span>/</span>
			<span style="opacity:1;color:var(--ink)">收藏文章</span>
		</div>
		<span class="script" style="font-size:1.3rem;">那些觸動你的文字</span>
		<h1>收藏<em>文章</em></h1>
		<p>你按過讚、收藏過、讀過的文章，都在這裡等你回來。</p>
	</div>
</section>

<!-- ================= 主體 ================= -->
<section class="collect-page">
	<div class="wrap">

		<!-- 頂部動作列 -->
		<div class="collect-toolbar">
			<a class="btn btn-outline" th:href="@{/member/dashboard/myCollection}">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
				回我的收藏
			</a>
		</div>

		<!-- Tab 切換 -->
		<div class="collect-tabs">
			<a th:href="@{/member/dashboard/myCollection/article(type='bookmark')}"
			   th:classappend="${activeTab == 'bookmark'} ? 'active'">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
				已收藏
			</a>
			<a th:href="@{/member/dashboard/myCollection/article(type='like')}"
			   th:classappend="${activeTab == 'like'} ? 'active'">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
				已按讚
			</a>
			<a th:href="@{/member/dashboard/myCollection/article(type='history')}"
			   th:classappend="${activeTab == 'history'} ? 'active'">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
				瀏覽紀錄
			</a>
		</div>

		<!-- 文章卡片列表 -->
		<div class="art-list" th:if="${articlePage != null && !articlePage.content.isEmpty()}">
			<a class="art-card" th:each="article : ${articlePage.content}"
			   th:href="@{/article/{id}(id=${article.articleId})}" target="_blank">

				<div class="art-cover" th:if="${article.coverImage != null}">
					<img th:src="@{/article/{id}/cover(id=${article.articleId})}"
						 th:alt="${article.title}" loading="lazy" />
				</div>
				<div class="art-cover photo-slot" th:if="${article.coverImage == null}">
					<div class="ps-inner">
						<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
							<rect x="3" y="6" width="18" height="14" rx="3" />
							<circle cx="12" cy="13" r="3.2" /></svg>
					</div>
				</div>

				<div class="art-body">
					<div class="art-meta-top"
						 th:text="${article.articleCat != null ? article.articleCat.articleCatName : '未分類'}">情緒照顧</div>
					<h3 th:text="${article.title}">文章標題</h3>
					<div class="art-foot">
						<span th:if="${article.publishedAt != null}"
							  th:text="${#temporals.format(article.publishedAt, 'yyyy.MM.dd')}">2026.07.20</span>
						<span th:if="${article.publishedAt == null}"></span>
						<span class="go">閱讀 →</span>
					</div>
				</div>

			</a>
		</div>

		<!-- 空白狀態 -->
		<div th:if="${articlePage == null || articlePage.content.isEmpty()}" class="empty-state">
			<svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
				<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
			<b th:if="${activeTab == 'bookmark'}">尚無收藏文章</b>
			<b th:if="${activeTab == 'like'}">尚無按讚文章</b>
			<b th:if="${activeTab == 'history'}">尚無瀏覽紀錄</b>
			<p>去<a th:href="@{/article}" style="color:var(--orange); text-decoration:underline;">專欄文章</a>逛逛吧</p>
		</div>

		<!-- 分頁 -->
		<div th:if="${articlePage != null && articlePage.totalPages > 1}" style="margin-top: 2.4rem;">
			<div th:replace="~{fragments/pagination :: pagination(
				totalPages=${articlePage.totalPages},
				currentPage=${currentPage},
				baseUrl='/member/dashboard/myCollection/article',
				queryString=${'type=' + activeTab}
			)}"></div>
		</div>

	</div>
</section>

<!-- ================= Footer ================= -->
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: backToTop}"></div>

<script th:src="@{/js/nav.js}" src="/js/nav.js"></script>
</body>
</html>
