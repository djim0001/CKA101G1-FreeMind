<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>我的收藏-文章</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.6;
}

.container {
	max-width: 1100px;
	margin: 0 auto;
	padding: 30px 20px;
}

.page-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 28px;
	padding-bottom: 16px;
	border-bottom: 2px solid #e8b4b4;
}

.page-header h1 {
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
}

.page-header .btn-back {
	display: inline-block;
	padding: 8px 20px;
	background-color: #e8b4b4;
	color: #fff;
	text-decoration: none;
	border-radius: 6px;
	font-size: 14px;
	transition: background-color 0.2s;
}

.page-header .btn-back:hover {
	background-color: #d39393;
}

.tabs {
	display: flex;
	gap: 8px;
	margin-bottom: 28px;
	border-bottom: 1px solid #f2dddd;
	padding-bottom: 1px;
}

.tabs a {
	display: inline-block;
	padding: 10px 24px;
	color: #7a6b6b;
	text-decoration: none;
	font-size: 15px;
	font-weight: 500;
	border-radius: 8px 8px 0 0;
	transition: all 0.2s;
	border: 1px solid transparent;
	margin-bottom: -1px;
}

.tabs a:hover {
	color: #e8b4b4;
	background-color: #fbf2f2;
}

.tabs a.active {
	background-color: #fff;
	color: #e8b4b4;
	border-color: #f2dddd #f2dddd transparent #f2dddd;
	font-weight: 600;
}

.article-list {
	display: flex;
	flex-direction: column;
	gap: 16px;
	margin-bottom: 32px;
}

.article-card {
	display: flex;
	background: #fff;
	border-radius: 10px;
	box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
	overflow: hidden;
	transition: box-shadow 0.2s, transform 0.15s;
}

.article-card:hover {
	box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
	transform: translateY(-2px);
}

.article-cover {
	flex-shrink: 0;
	width: 200px;
	height: 150px;
	overflow: hidden;
	background-color: #fbf2f2;
	display: flex;
	align-items: center;
	justify-content: center;
}

.article-cover img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}

.article-cover .no-image {
	color: #ccbaba;
	font-size: 13px;
}

.article-info {
	flex: 1;
	padding: 20px 24px;
	display: flex;
	flex-direction: column;
	justify-content: center;
}

.article-info h2 {
	font-size: 20px;
	font-weight: 600;
	color: #4a3e3e;
	margin-bottom: 10px;
}

.article-meta {
	display: flex;
	align-items: center;
	gap: 16px;
	margin-bottom: 14px;
	font-size: 13px;
	color: #888;
}

.article-meta .cat-tag {
	display: inline-block;
	padding: 2px 12px;
	background-color: #fbf2f2;
	color: #7a6b6b;
	border-radius: 12px;
	font-size: 12px;
	font-weight: 500;
}

.article-action a {
	display: inline-block;
	padding: 7px 22px;
	background-color: #e8b4b4;
	color: #fff;
	text-decoration: none;
	border-radius: 6px;
	font-size: 14px;
	transition: background-color 0.2s;
}

.article-action a:hover {
	background-color: #d39393;
}

.empty-state {
	text-align: center;
	padding: 60px 20px;
	background: #fff;
	border-radius: 10px;
	box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
	color: #999;
	font-size: 16px;
}

.pagination {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 6px;
	flex-wrap: wrap;
}

.pagination a, .pagination span {
	display: inline-block;
	padding: 8px 14px;
	font-size: 14px;
	font-weight: 500;
	border-radius: 6px;
	text-decoration: none;
	border: 1px solid #f2dddd;
	background-color: #fbf2f2;
	color: #7a6b6b;
	transition: all 0.2s;
}

.pagination a:hover {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
}

.pagination .active {
	background-color: #e8b4b4;
	color: #fff;
	border-color: #e8b4b4;
	pointer-events: none;
}

.pagination .disabled {
	opacity: 0.4;
	pointer-events: none;
}

.pagination .page-info {
	font-size: 14px;
	color: #666;
	background: #fff;
	border: 1px solid #e0e0e0;
}

@media (max-width: 640px) {
	.tabs {
		gap: 4px;
	}
	.tabs a {
		padding: 8px 12px;
		font-size: 14px;
		flex: 1;
		text-align: center;
	}
	.article-card {
		flex-direction: column;
	}
	.article-cover {
		width: 100%;
		height: 180px;
	}
}
</style>
</head>
<body>
	<div class="container">

		<div class="page-header">
			<h1>我的收藏/文章</h1>
			<a th:href="@{/member/dashboard}" class="btn-back">我的療癒足跡</a>
		</div>

		<div class="tabs">
			<a th:href="@{/member/dashboard/myCollection/article(type='bookmark')}"
			   th:classappend="${activeTab == 'bookmark'} ? 'active'">已收藏文章</a>
			<a th:href="@{/member/dashboard/myCollection/article(type='like')}"
			   th:classappend="${activeTab == 'like'} ? 'active'">已按讚文章</a>
			<a th:href="@{/member/dashboard/myCollection/article(type='history')}"
			   th:classappend="${activeTab == 'history'} ? 'active'">瀏覽紀錄</a>
		</div>

		<div class="article-list" th:if="${articlePage != null && !articlePage.content.isEmpty()}">
			<div class="article-card" th:each="article : ${articlePage.content}">

				<div class="article-cover">
					<img th:if="${article.coverImage != null}"
						 th:src="@{/article/{id}/cover(id=${article.articleId})}" /> 
					<span class="no-image" th:if="${article.coverImage == null}">無封面</span>
				</div>

				<div class="article-info">
					<h2 th:text="${article.title}"></h2>
					<div class="article-meta">
						<span class="cat-tag"
							  th:text="${article.articleCat != null ? article.articleCat.articleCatName : '未分類'}"></span>
						<span th:text="${article.publishedAt}"></span>
					</div>
					<div class="article-action">
						<a th:href="@{/article/{id}(id=${article.articleId})}" target="_blank">查看詳情</a>
					</div>
				</div>

			</div>
		</div>

		<div th:if="${articlePage == null || articlePage.content.isEmpty()}">
			<div class="empty-state" th:if="${activeTab == 'bookmark'}">尚無收藏文章</div>
			<div class="empty-state" th:if="${activeTab == 'like'}">尚無按讚文章</div>
			<div class="empty-state" th:if="${activeTab == 'history'}">尚無瀏覽紀錄</div>
		</div>

		<div class="pagination" th:if="${articlePage != null && articlePage.totalPages > 1}">
			<a th:if="${currentPage > 1}"
			   th:href="@{/member/dashboard/myCollection/article(type=${activeTab}, page=${currentPage - 1})}">上一頁</a>
			<span th:if="${currentPage <= 1}" class="disabled">上一頁</span>

			<th:block th:each="i : ${#numbers.sequence(1, articlePage.totalPages)}">
				<a th:if="${i != currentPage}"
				   th:href="@{/member/dashboard/myCollection/article(type=${activeTab}, page=${i})}"
				   th:text="${i}"></a>
				<span th:if="${i == currentPage}" class="active" th:text="${i}"></span>
			</th:block>

			<a th:if="${currentPage < articlePage.totalPages}"
			   th:href="@{/member/dashboard/myCollection/article(type=${activeTab}, page=${currentPage + 1})}">下一頁</a>
			<span th:if="${currentPage >= articlePage.totalPages}" class="disabled">下一頁</span>
		</div>

	</div>
</body>
</html>
