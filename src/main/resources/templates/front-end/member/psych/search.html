<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>心理師搜尋</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/psych/member.css}" href="/css/psych/member.css" />

<style>
/* 本頁專屬:搜尋 */
.thy2-member .search-form {
	display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
	padding: 1.2rem; background: #fff; border: 1px solid var(--line);
	border-radius: var(--radius-md); box-shadow: var(--shadow-sm); margin-bottom: 1.2rem;
}
.thy2-member .search-form input,
.thy2-member .search-form select {
	padding: .55rem .8rem; border: 1px solid var(--line); border-radius: 10px;
	font-family: var(--sans); font-size: .9rem; color: var(--ink); background: var(--bg-warm);
	outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
}
.thy2-member .search-form input:focus,
.thy2-member .search-form select:focus { border-color: var(--orange); background: #fff; box-shadow: 0 0 0 3px rgba(245,142,107,.15); }
.thy2-member .search-form button {
	padding: .55rem 1.4rem; border: none; border-radius: 999px; cursor: pointer;
	font-family: var(--sans); font-size: .92rem; font-weight: 500; background: var(--orange); color: #fff;
	box-shadow: 0 8px 20px rgba(245,142,107,.4); transition: transform .2s, background .2s;
}
.thy2-member .search-form button:hover { transform: translateY(-2px); background: var(--orange-deep); }
.thy2-member .clear-btn {
	display: inline-flex; align-items: center; padding: .55rem 1.2rem; border: 1px solid var(--line);
	border-radius: 999px; color: var(--ink-soft); background: #fff; text-decoration: none;
	font-size: .9rem; transition: color .2s, border-color .2s;
}
.thy2-member .clear-btn:hover { color: var(--orange); border-color: var(--orange); }

.thy2-member .sort-bar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1.4rem; color: var(--ink-soft); font-size: .9rem; flex-wrap: wrap; }
.thy2-member .sort-bar a {
	padding: .4rem 1rem; border: 1px solid var(--line); border-radius: 999px; text-decoration: none;
	color: var(--ink); background: #fff; font-size: .88rem; transition: color .2s, border-color .2s, background .2s;
}
.thy2-member .sort-bar a:hover { border-color: var(--orange); color: var(--orange); }
.thy2-member .sort-bar a.active { background: var(--orange); color: #fff; border-color: var(--orange); }

.thy2-member .psych-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem; }
.thy2-member .psych-card {
	display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line);
	border-radius: var(--radius-md); padding: 1.2rem; box-shadow: var(--shadow-sm); transition: transform .2s, box-shadow .2s;
}
.thy2-member .psych-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.thy2-member .psych-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: var(--radius-md); margin-bottom: .8rem; }
.thy2-member .psych-card h3 { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; color: var(--ink); margin: 0 0 .4rem; }
.thy2-member .psych-card p { font-size: .88rem; color: var(--ink-soft); margin: .12rem 0; }
.thy2-member .psych-card > a {
	margin-top: .9rem; align-self: flex-start; display: inline-flex; align-items: center; gap: .3rem;
	padding: .5rem 1.1rem; border-radius: 999px; background: var(--orange); color: #fff;
	text-decoration: none; font-size: .88rem; font-weight: 500; box-shadow: 0 8px 20px rgba(245,142,107,.4);
	transition: transform .2s, background .2s;
}
.thy2-member .psych-card > a:hover { transform: translateY(-2px); background: var(--orange-deep); }
</style>
</head>

<body class="thy2-member">

	<div th:replace="~{fragments/header :: header}"></div>

	<main class="m-wrap">

		<div class="m-head">
			<span class="script">Find a therapist</span>
			<h1>心理師搜尋</h1>
		</div>
		<div class="error-message" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

		<form class="search-form" method="get" th:action="@{/search}">
			<input type="text" name="name" placeholder="姓名" th:value="${name}">

			<select name="gender">
				<option value="">性別(不限)</option>
				<option value="男" th:selected="${gender == '男'}">男</option>
				<option value="女" th:selected="${gender == '女'}">女</option>
			</select>

			<input type="text" name="psychLoc" placeholder="地點" th:value="${psychLoc}">
			<input type="number" name="minFee" placeholder="最低費用" th:value="${minFee}">
			<input type="number" name="maxFee" placeholder="最高費用" th:value="${maxFee}">

			<select name="expertiseName">
				<option value="">專長(不限)</option>
				<option th:each="e : ${expertiseOptions}"
						th:value="${e}" th:text="${e}" th:selected="${e == expertiseName}"></option>
			</select>

			<input type="date" name="slotDate" th:value="${slotDate}">

			<!-- 保留目前排序狀態,避免重新搜尋時被重置 -->
			<input type="hidden" name="orderBy" th:value="${orderBy}">

			<button type="submit">搜尋</button>
			<a th:href="@{/search}" class="clear-btn">清空條件</a>
		</form>

		<div class="sort-bar">
			排序:
			<a th:href="@{search(name=${name}, gender=${gender}, psychLoc=${psychLoc}, minFee=${minFee}, maxFee=${maxFee}, expertiseName=${expertiseName}, slotDate=${slotDate},
					orderBy=${orderBy == 'nameAsc' ? 'nameDesc' : 'nameAsc'})}"
			   th:classappend="${orderBy == 'nameAsc' || orderBy == 'nameDesc'} ? 'active'">
			   姓名 <span th:text="${orderBy == 'nameAsc' ? '▲' : (orderBy == 'nameDesc' ? '▼' : '')}"></span>
			</a>

			<a th:href="@{/search(name=${name}, gender=${gender}, psychLoc=${psychLoc}, minFee=${minFee}, maxFee=${maxFee}, expertiseName=${expertiseName}, slotDate=${slotDate},
					orderBy=${orderBy == 'genderAsc' ? 'genderDesc' : 'genderAsc'})}"
			   th:classappend="${orderBy == 'genderAsc' || orderBy == 'genderDesc'} ? 'active'">
			   性別 <span th:text="${orderBy == 'genderAsc' ? '▲' : (orderBy == 'genderDesc' ? '▼' : '')}"></span>
			</a>

			<a th:href="@{/search(name=${name}, gender=${gender}, psychLoc=${psychLoc}, minFee=${minFee}, maxFee=${maxFee}, expertiseName=${expertiseName}, slotDate=${slotDate},
					orderBy=${orderBy == 'feeAsc' ? 'feeDesc' : 'feeAsc'})}"
			   th:classappend="${orderBy == 'feeAsc' || orderBy == 'feeDesc'} ? 'active'">
			   費用 <span th:text="${orderBy == 'feeAsc' ? '▲' : (orderBy == 'feeDesc' ? '▼' : '')}"></span>
			</a>
		</div>

		<div class="psych-grid">
			<div class="psych-card" th:each="p : ${psychList}">
				<img th:src="${p.profilePic != null && !p.profilePic.isEmpty()}?
						@{'/psych-images/' + ${p.profilePic}} :  @{/psych-images/noPsychPic.png}" alt="大頭照">
				<h3 th:text="${p.name} + ' 心理師'"></h3>
				<p>
					性別:<span th:text="${p.gender}"></span>
					<span th:if="${p.hasPracticeLicense}"> | 已通過執業許可 ✓</span>
				</p>
				<p>證照:<span th:text="${p.psychCertificate}"></span></p>
				<p>地點:<span th:text="${p.psychLoc}"></span></p>
				<p>費用:$<span th:text="${p.psychFee}"></span> / 次</p>
				<p>
					專長:
					<span class="expertise-tag" th:each="e : ${p.expertiseList}" th:text="${e}"></span>
				</p>
				<a th:href="@{search/detail/{id}(id=${p.psychId})}">查看詳情 →</a>
			</div>
		</div>

		<p class="empty-hint" th:if="${psychList != null && psychList.isEmpty()}">找不到符合條件的心理師</p>

	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>
	<script src="/js/nav.js"></script>
</body>
</html>
