<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>修改活動</title>
</head>
<body>
	<h1>修改活動</h1>
	 
	<p th:if="${errorMessage}" th:utext="${errorMessage}" style="color:red;"></p>
	
	<form th:action="@{/member/activity/update}" th:object="${activity}" method="post" enctype="multipart/form-data">
	
	<input type="hidden" th:field="*{activityId}">
	  
        <p>
            活動名稱：
            <input type="text" th:field="*{activityName}">

        </p>

        <p>
            活動分類：

                <option th:each="cat : ${activityCatListData}"
                        th:value="${cat.activityCatId}"
                        th:text="${cat.activityCatName}">
                </option>
            </select>
        </p>

        <p>
            活動內容：
            <textarea th:field="*{activityContent}"></textarea>
            <span th:if="${#fields.hasErrors('activityContent')}" th:errors="*{activityContent}" style="color:red;"></span>
        </p>

		<p>
		    縣市：

		        <option value="新北市">新北市</option>
		        <option value="桃園市">桃園市</option>
		        <option value="新竹市">新竹市</option>
		        <option value="新竹縣">新竹縣</option>
		        <option value="苗栗縣">苗栗縣</option>
		        <option value="臺中市">臺中市</option>
		        <option value="彰化縣">彰化縣</option>
		        <option value="南投縣">南投縣</option>
		        <option value="雲林縣">雲林縣</option>
		        <option value="嘉義市">嘉義市</option>
		        <option value="嘉義縣">嘉義縣</option>
		        <option value="臺南市">臺南市</option>
		        <option value="高雄市">高雄市</option>
		        <option value="屏東縣">屏東縣</option>
		        <option value="宜蘭縣">宜蘭縣</option>
		        <option value="花蓮縣">花蓮縣</option>
		        <option value="臺東縣">臺東縣</option>
		        <option value="澎湖縣">澎湖縣</option>
		        <option value="金門縣">金門縣</option>
		        <option value="連江縣">連江縣</option>
		    </select>
		    <span th:if="${#fields.hasErrors('activityCity')}" th:errors="*{activityCity}" style="color:red;"></span>
		</p>
		
		<p>
		    區域：
		    <select th:field="*{activityDist}" id="activityDist">
		        <option value="">請先選擇縣市</option>
		    </select>
		    <span th:if="${#fields.hasErrors('activityDist')}" th:errors="*{activityDist}" style="color:red;"></span>
		</p>
		
		<!-- 保留原本的縣市、區域值給 JS -->
		<input type="hidden" id="originalCity" th:value="*{activityCity}">
		<input type="hidden" id="originalDist" th:value="*{activityDist}">

        <p>
            詳細地點：
            <input type="text" th:field="*{activityLoc}">
            <span th:if="${#fields.hasErrors('activityLoc')}" th:errors="*{activityLoc}" style="color:red;"></span>
        </p>

        <p>
            報名開始時間：
            <input type="datetime-local" th:field="*{regisStart}">
            <span th:if="${#fields.hasErrors('regisStart')}" th:errors="*{regisStart}" style="color:red;"></span>
        </p>

        <p>
            報名截止時間：
            <input type="datetime-local" th:field="*{regisEnd}">
            <span th:if="${#fields.hasErrors('regisEnd')}" th:errors="*{regisEnd}" style="color:red;"></span>
        </p>

        <p>
            活動開始時間：
            <input type="datetime-local" th:field="*{activityStart}">
            <span th:if="${#fields.hasErrors('activityStart')}" th:errors="*{activityStart}" style="color:red;"></span>
        </p>

        <p>
            活動結束時間：
            <input type="datetime-local" th:field="*{activityEnd}">
            <span th:if="${#fields.hasErrors('activityEnd')}" th:errors="*{activityEnd}" style="color:red;"></span>
        </p>

        <p>
            活動名額：
            <input type="number" th:field="*{capacity}">
            <span th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}" style="color:red;"></span>
        </p>

		<p>
		    活動圖片（選填，不選則維持原圖）：
		    <img th:if="*{picture != null}"
     		th:src="@{/member/activity/activityImage(activityId=*{activityId})}"
     		style="max-width:200px;">
		    <input type="file" name="pictureFile" onchange="previewImage(event)">
		    <br>
   		    <img id="preview" src="#" alt="圖片預覽" style="max-width: 200px; display: none;">
		</p>


        <button type="submit">送出申請</button>

    </form>
	<br>
	<a th:href="@{/member/activity/ownedActivities}">我發起的活動</a>

<script>
// 圖片預覽
function previewImage(event) {
    const preview = document.getElementById('preview');
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        }
        reader.readAsDataURL(file);
    } else {
        preview.style.display = 'none';
    }
}

function updateDistrictOptions(selectedDist) {
    const city = document.getElementById("activityCity").value;
    const distSelect = document.getElementById("activityDist");

    distSelect.innerHTML = '<option value="">請選擇區域</option>';

    if (cityDistrictMap[city]) {
        cityDistrictMap[city].forEach(function(dist) {
            const option = document.createElement("option");
            option.value = dist;
            option.textContent = dist;
            if (dist === selectedDist) {
                option.selected = true;
            }
            distSelect.appendChild(option);
        });
    }
}

// 載入原本填的縣市區域
window.onload = function() {
    const originalCity = document.getElementById("originalCity").value;
    const originalDist = document.getElementById("originalDist").value;

    if (originalCity) {
        document.getElementById("activityCity").value = originalCity;
        updateDistrictOptions(originalDist);
    }
};
</script>

</html>
