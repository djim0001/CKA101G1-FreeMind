<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>查看單一活動詳情</title>
    
    <style>
    
.status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 14px;
    border: 1px solid;
}
.status-pending {
    color: #b8860b;
    border-color: #b8860b;
    background-color: #fff8e6;
}
.status-confirmed {
    color: #2e7d32;
    border-color: #2e7d32;
    background-color: #e8f5e9;
}
    
    </style>
</head>
<body>
    <h1 th:text="${activity.activityName}"></h1>

	<p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
	<p th:if="${successMessage}" th:text="${successMessage}" style="color:blue;"></p>

    <img th:if="${activity.picture != null}" 
         th:src="@{'/activity-images/' + ${activity.picture}}" 
         style="max-width: 400px;">
    <img th:unless="${activity.picture != null}" 
         th:src="@{/images/no-image.jpg}" 
         style="max-width: 400px;">

    <p>活動分類：<span th:text="${activity.activityCat.activityCatName}"></span></p>
    <p>地點：<span th:text="${activity.activityCity} + ${activity.activityDist} + ${activity.activityLoc}"></span></p>

    <p>活動內容：</p>
    <p th:text="${activity.activityContent}" style="white-space: pre-wrap;"></p>

    <p>報名時間：
        <span th:text="${#temporals.format(activity.regisStart, 'yyyy/MM/dd(E) HH:mm')}"></span> ~ 
        <span th:text="${#temporals.format(activity.regisEnd, 'yyyy/MM/dd(E) HH:mm')}"></span>
    </p>
    <p>活動時間：
        <span th:text="${#temporals.format(activity.activityStart, 'yyyy/MM/dd(E) HH:mm')}"></span> ~ 
        <span th:text="${#temporals.format(activity.activityEnd, 'yyyy/MM/dd(E) HH:mm')}"></span>
    </p>
    <p>正取名額：<span th:text="${activity.regisCount} + ' / ' + ${activity.capacity}"></span></p>
	<p>備取名額：<span th:text="${activity.waitlistCount} + ' / ' + ${activity.waitlistCapacity}"></span></p>
    <p>已報名人數：<span th:text="${activity.regisCount + activity.waitlistCount + pendingCount} + ' / ' + ${activity.capacity + activity.waitlistCapacity}"></span></p>
    <p>報名狀態：<span th:text="${activity.registrationStatusText}"></span></p>

	<span th:if="${myRegisMap.get(activity.activityId) == 0}" class="status-badge status-pending">審核中</span>
	<span th:if="${myRegisMap.get(activity.activityId) == 1}" class="status-badge status-confirmed">已報名</span>
	<span th:if="${myRegisMap.get(activity.activityId) == 4}" class="status-badge status-confirmed">已候補</span>
						
	
	<!-- 報名功能 -->
	<th:block th:if="${myRegisMap.get(activity.activityId) == null}">
	    <!-- 已登入會員：顯示報名表單 -->
	    <form th:if="${activity.registrable}" sec:authorize="hasRole('MEMBER')"
	          th:action="@{/member/activity/registration/register}" method="post" style="display:inline;">
	        <th:block th:if="${activity.member.memberId != #authentication.principal.member.memberId}">
	            <input type="hidden" name="activityId" th:value="${activity.activityId}">
	            <input type="hidden" name="redirectUrl" th:value="@{/member/activity/listOneActivity(activityId=${activity.activityId})}">
	            <br>
	            <label>報名動機：</label><br>
	            <textarea name="motivation" required maxlength="200" placeholder="簡單說說你想參加這個活動的原因" style="width:300px; height:60px;"></textarea><br>
	            <button type="submit">報名</button>
	        </th:block>
	    </form>
	
	    <!-- 未登入：導去登入頁 -->
	    <a th:if="${activity.registrable}" sec:authorize="isAnonymous()"
	       th:href="@{/front-end/login(redirect='/member/activity/listOneActivity?activityId=' + ${activity.activityId})}">
	        <button type="button">報名</button>
	    </a>
	</th:block>
	
	<!-- 關注功能 -->
	<!-- 已登入會員：關注功能 -->
	<div sec:authorize="hasRole('MEMBER')" style="display:inline;">
	    <form th:if="${!isFollowing}"
	          th:action="@{/member/activity/follow/follow}" method="post" style="display:inline;">
	        <input type="hidden" name="activityId" th:value="${activity.activityId}">
	        <button type="submit">♡ 關注</button>
	    </form>
	
	    <form th:if="${isFollowing}"
	          th:action="@{/member/activity/follow/unfollow}" method="post" style="display:inline;">
	        <input type="hidden" name="activityId" th:value="${activity.activityId}">
	        <button type="submit">♥ 已關注</button>
	    </form>
	</div>
	
	<!-- 未登入：導去登入頁 -->
	<a sec:authorize="isAnonymous()"
	   th:href="@{/front-end/login(redirect='/member/activity/listOneActivity?activityId=' + ${activity.activityId})}">
	    <button type="button">♡ 關注</button>
	</a>
	
	<br>
	<h3>活動評價</h3>
		<div th:each="rv : ${reviewListData}">
		    <p>
		        <b th:text="${#strings.isEmpty(rv.member.nickname) ? rv.member.name : rv.member.nickname}"></b>
		        <span th:text="'★' + ${rv.rating}"></span>
		        <span th:text="${#temporals.format(rv.reviewedAt, 'yyyy/MM/dd')}" style="color:gray;"></span>
		    </p>
		    <p th:text="${rv.reviewContent}"></p>
		    <hr>
		</div>
	<p th:if="${#lists.isEmpty(reviewListData)}">尚無評價。</p>
	<br>
	<br>
 	<a th:href="@{/member/activity/listAllActivity}">返回活動列表</a>｜<a th:href="@{/member/activity/follow/myFollows}">我的關注</a>｜	<a th:href="@{/member/activity/registration/myRegistrations}">我的報名</a>


</body>
</html>
