<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>查看單一活動詳情</title>
    
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />  
<style>
    
.status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 14px;
    border: 1px solid;
}
.status-pending {
    color: #b8860b;
    border-color: #b8860b;
    background-color: #fff8e6;
}
.status-confirmed {
    color: #2e7d32;
    border-color: #2e7d32;
    background-color: #e8f5e9;
}

/* ---------- 分享彈窗 ---------- */
.share-modal-overlay {
	display: none; position: fixed; inset: 0;
	background: rgba(255,255,255,.55); backdrop-filter: blur(6px);
	z-index: 500; align-items: center; justify-content: center;
	opacity: 0; transition: opacity .2s;
}
.share-modal-overlay.show { display: flex; opacity: 1; }
.share-modal-panel {
	background: #fff; border-radius: 12px;
	box-shadow: 0 8px 24px rgba(0,0,0,.12); width: 90%; max-width: 400px; padding: 1.6rem;
	transform: translateY(10px); transition: transform .2s;
	font-family: 'Noto Sans TC', sans-serif;
}
.share-modal-overlay.show .share-modal-panel { transform: translateY(0); }
.share-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.3rem; }
.share-modal-header span { font-size: 1.05rem; font-weight: 700; color: #333; }
.share-modal-close { background: none; border: none; font-size: 22px; color: #888; cursor: pointer; line-height: 1; }
.share-modal-close:hover { color: #333; }
.share-modal-options { display: flex; justify-content: space-between; gap: .5rem; }
.share-option { display: flex; flex-direction: column; align-items: center; gap: .5rem; border: none; background: none; cursor: pointer; font-family: inherit; flex: 1; }
.share-icon {
	width: 52px; height: 52px; border-radius: 50%;
	display: flex; align-items: center; justify-content: center;
	font-size: 22px; color: #fff; transition: transform .15s;
}
.share-option:hover .share-icon { transform: scale(1.1); }
.share-label { font-size: .74rem; color: #888; }
.copy-icon      { background: #555; }
.line-icon      { background: #06C755; }
.instagram-icon { background: radial-gradient(circle at 30% 110%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
.facebook-icon  { background: #1877F2; }
.threads-icon   { background: #000; }
.share-toast { margin-top: 1rem; text-align: center; font-size: .78rem; color: #888; min-height: 16px; }
 
    
</style>
</head>
<body>
    <h1 th:text="${activity.activityName}"></h1>

	<p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
	<p th:if="${successMessage}" th:text="${successMessage}" style="color:blue;"></p>

    <img th:if="${activity.picture != null}" 
         th:src="@{'/activity-images/' + ${activity.picture}}" 
         style="max-width: 400px;">
    <img th:unless="${activity.picture != null}" 
         th:src="@{/images/no-image.jpg}" 
         style="max-width: 400px;">

    <p>活動分類：<span th:text="${activity.activityCat.activityCatName}"></span></p>
    <p>地點：<span th:text="${activity.activityCity} + ${activity.activityDist} + ${activity.activityLoc}"></span></p>

    <p>活動內容：</p>
    <p th:text="${activity.activityContent}" style="white-space: pre-wrap;"></p>

    <p>報名時間：
        <span th:text="${#temporals.format(activity.regisStart, 'yyyy/MM/dd(E) HH:mm')}"></span> ~ 
        <span th:text="${#temporals.format(activity.regisEnd, 'yyyy/MM/dd(E) HH:mm')}"></span>
    </p>
    <p>活動時間：
        <span th:text="${#temporals.format(activity.activityStart, 'yyyy/MM/dd(E) HH:mm')}"></span> ~ 
        <span th:text="${#temporals.format(activity.activityEnd, 'yyyy/MM/dd(E) HH:mm')}"></span>
    </p>
    <p>正取名額：<span id="confirmedCount" th:text="${activity.regisCount} + ' / ' + ${activity.capacity}"></span></p>
	<p>備取名額：<span id="waitlistCount" th:text="${activity.waitlistCount} + ' / ' + ${activity.waitlistCapacity}"></span></p>
	<p>已報名人數：<span id="totalRegisteredCount" th:text="${activity.regisCount + activity.waitlistCount + pendingCount} + ' / ' + ${activity.capacity + activity.waitlistCapacity}"></span></p>
    <p>報名狀態：<span th:text="${activity.registrationStatusText}"></span></p>

	<span th:if="${myRegisMap.get(activity.activityId) == 0}" class="status-badge status-pending">審核中</span>
	<span th:if="${myRegisMap.get(activity.activityId) == 1}" class="status-badge status-confirmed">已報名</span>
	<span th:if="${myRegisMap.get(activity.activityId) == 4}" class="status-badge status-confirmed">已候補</span>
						
	
	<!-- 報名功能 -->
	<th:block th:if="${myRegisMap.get(activity.activityId) == null}">
	    <!-- 已登入會員：顯示報名表單 -->
	    <form th:if="${activity.registrable}" sec:authorize="hasRole('MEMBER')"
	          th:action="@{/member/activity/registration/register}" method="post" style="display:inline;">
	        <th:block th:if="${activity.member.memberId != #authentication.principal.member.memberId}">
	            <input type="hidden" name="activityId" th:value="${activity.activityId}">
	            <input type="hidden" name="redirectUrl" th:value="@{/member/activity/listOneActivity(activityId=${activity.activityId})}">
	            <br>
	            <label>報名動機：</label><br>
	            <textarea name="motivation" required maxlength="200" placeholder="簡單說說你想參加這個活動的原因" style="width:300px; height:60px;"></textarea><br>
	            <button type="submit">報名</button>
	        </th:block>
	    </form>
	
	    <!-- 未登入：導去登入頁 -->
	    <a th:if="${activity.registrable}" sec:authorize="isAnonymous()"
	       th:href="@{/front-end/login(redirect='/member/activity/listOneActivity?activityId=' + ${activity.activityId})}">
	        <button type="button">報名</button>
	    </a>
	</th:block>
	
	<!-- 關注功能 -->
	<!-- 已登入會員：關注功能 -->
	<div sec:authorize="hasRole('MEMBER')" style="display:inline;">
	    <form th:if="${!isFollowing}"
	          th:action="@{/member/activity/follow/follow}" method="post" style="display:inline;">
	        <input type="hidden" name="activityId" th:value="${activity.activityId}">
	        <button type="submit">♡ 關注</button>
	    </form>
	
	    <form th:if="${isFollowing}"
	          th:action="@{/member/activity/follow/unfollow}" method="post" style="display:inline;">
	        <input type="hidden" name="activityId" th:value="${activity.activityId}">
	        <button type="submit">♥ 已關注</button>
	    </form>
	</div>
	
	<!-- 未登入：導去登入頁 -->
	<a sec:authorize="isAnonymous()"
	   th:href="@{/front-end/login(redirect='/member/activity/listOneActivity?activityId=' + ${activity.activityId})}">
	    <button type="button">♡ 關注</button>
	</a>
	
	<button type="button" onclick="openShareModal()">
	    <i class="fa-regular fa-share-from-square"></i> 分享
	</button>
	
	<br>
	<h3>活動評價</h3>
		<div th:each="rv : ${reviewListData}">
		    <p>
		        <b th:text="${#strings.isEmpty(rv.member.nickname) ? rv.member.name : rv.member.nickname}"></b>
		        <span th:text="'★' + ${rv.rating}"></span>
		        <span th:text="${#temporals.format(rv.reviewedAt, 'yyyy/MM/dd')}" style="color:gray;"></span>
		    </p>
		    <p th:text="${rv.reviewContent}"></p>
		    <hr>
		</div>
	<p th:if="${#lists.isEmpty(reviewListData)}">尚無評價。</p>
	<br>
	<br>
 	<a th:href="@{/member/activity/listActivities_ByCompositeQuery}">返回活動列表</a>｜<a th:href="@{/member/activity/follow/myFollows}">我的關注</a>｜	<a th:href="@{/member/activity/registration/myRegistrations}">我的報名</a>

<div id="activityData" 
     th:data-activity-id="${activity.activityId}"
     th:data-capacity="${activity.capacity}"
     th:data-waitlist-capacity="${activity.waitlistCapacity}"
     style="display:none;"></div>


<!-- 分享連結 -->
<div class="share-modal-overlay" id="shareModal" onclick="closeShareModalOutside(event)">
	<div class="share-modal-panel">
		<div class="share-modal-header">
			<span>分享活動</span>
			<button type="button" class="share-modal-close" onclick="closeShareModal()">&times;</button>
		</div>
		<div class="share-modal-options">
			<button type="button" class="share-option" onclick="copyLink()">
				<span class="share-icon copy-icon"><i class="fa-regular fa-copy"></i></span>
				<span class="share-label">複製連結</span>
			</button>
			<button type="button" class="share-option" onclick="shareToLine()">
				<span class="share-icon line-icon"><i class="fa-brands fa-line"></i></span>
				<span class="share-label">LINE</span>
			</button>
			<button type="button" class="share-option" onclick="shareToInstagram()">
				<span class="share-icon instagram-icon"><i class="fa-brands fa-instagram"></i></span>
				<span class="share-label">Instagram</span>
			</button>
			<button type="button" class="share-option" onclick="shareToFacebook()">
				<span class="share-icon facebook-icon"><i class="fa-brands fa-facebook"></i></span>
				<span class="share-label">Facebook</span>
			</button>
			<button type="button" class="share-option" onclick="shareToThreads()">
				<span class="share-icon threads-icon"><i class="fa-brands fa-at"></i></span>
				<span class="share-label">Threads</span>
			</button>
		</div>
		<div class="share-toast" id="shareToast"></div>
	</div>
</div>
<script>
(function() {
    var activityId = document.getElementById('activityData').getAttribute('data-activity-id');
    var wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/activity/' + activityId;
    var socket = new WebSocket(wsUrl);

    socket.onmessage = function(event) {
        var data = JSON.parse(event.data);
        var confirmedCap = document.getElementById('activityData').getAttribute('data-capacity');
        var waitlistCap = document.getElementById('activityData').getAttribute('data-waitlist-capacity');

        document.getElementById('confirmedCount').innerText = data['正取'] + ' / ' + confirmedCap;
        document.getElementById('waitlistCount').innerText = data['備取'] + ' / ' + waitlistCap;

        var total = data['正取'] + data['備取'] + data['未審核'];
        var totalCap = parseInt(confirmedCap) + parseInt(waitlistCap);
        document.getElementById('totalRegisteredCount').innerText = total + ' / ' + totalCap;
    };

    socket.onerror = function(e) {
        console.log('WebSocket錯誤:', e);
    };
})();
</script>

<script>
function openShareModal() {
	document.getElementById('shareToast').textContent = '';
	document.getElementById('shareModal').classList.add('show');
}
function closeShareModal() { document.getElementById('shareModal').classList.remove('show'); }
function closeShareModalOutside(e) { if (e.target.id === 'shareModal') closeShareModal(); }

function copyLink() {
	navigator.clipboard.writeText(location.href).then(function() {
		document.getElementById('shareToast').textContent = '連結已複製！';
	}).catch(function() {
		document.getElementById('shareToast').textContent = '複製失敗，請手動複製網址';
	});
}
function openSharePopup(url) {
	var w=600,h=500,l=(screen.width-w)/2,t=(screen.height-h)/2;
	window.open(url,'_blank','width='+w+',height='+h+',left='+l+',top='+t+',noopener,noreferrer');
}
function shareToLine() {
	openSharePopup('https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title));
}
function shareToInstagram() {
	navigator.clipboard.writeText(location.href).then(function() {
		document.getElementById('shareToast').textContent = 'Instagram 不支援直接分享，已複製連結，請至 Instagram App 貼上。';
	});
}
function shareToFacebook() {
	openSharePopup('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href));
}
function shareToThreads() {
	openSharePopup('https://www.threads.net/intent/post?text='+encodeURIComponent(document.title+' '+location.href));
}
</script>
</body>
</html>
