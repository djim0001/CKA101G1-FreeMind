<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>我的活動報名清單</title>
</head>
<body>

    <h1>我的活動報名清單</h1>
	
	<p>Hello, <span sec:authentication="principal.member.name"></span>!</p>
	
    <p th:if="${errorMessage}" th:utext="${errorMessage}" style="color:red;"></p>
	<p th:if="${successMessage}" th:utext="${successMessage}" style="color:blue;"></p>
	
    <table border="1">
        <tr>
            <th>活動名稱</th>
            <th>活動時間</th>
            <th>報名時間</th>
            <th>報名狀態</th>
            <th>活動狀態</th>
            <th>我的評價</th>
            <th>問題回報</th> 
            <th></th>
        </tr>
        <tr th:each="r : ${regisListData}" th:style="${r.regisStatus == 3} ? 'color:gray;' : ''">
            <td th:text="${r.activity.activityName}"></td>
            <td th:text="${#temporals.format(r.activity.activityStart, 'MM/dd(E) HH:mm')} + ' ~ ' + ${#temporals.format(r.activity.activityEnd, 'MM/dd(E) HH:mm')}"></td>
            <td th:text="${#temporals.format(r.regisAt, 'yyyy/MM/dd HH:mm')}"></td>
            <td th:text="${r.regisStatusText}"></td>
            <td th:text="${r.activity.memberViewStatusText}"></td>
            <td>   
		        <span th:if="${r.reviewedAt != null}"
		              th:text="'★' + ${r.rating}"
		              th:title="${r.reviewContent}"></span>
		        <span th:if="${r.reviewedAt == null}">—</span>
		    </td>
		    <td>
			    <span th:if="${r.regisStatus == 1 && r.activity.ended && #maps.containsKey(reportedActivityMap, r.activity.activityId)}"
			          th:title="${reportedActivityMap.get(r.activity.activityId)}">已回報問題</span>
			    <span th:unless="${r.regisStatus == 1 && r.activity.ended}">—</span>
		    </td>
            <td> 
			    <div th:if="${r.cancellable}" style="display:inline;">
			        <button type="button" th:id="'cancelBtn' + ${r.regisId}"
			                th:onclick="'toggleCancelForm(' + ${r.regisId} + ')'">取消報名</button>
			
			        <div th:id="'cancelForm' + ${r.regisId}" style="display:none;">
			            <form th:action="@{/member/activity/registration/cancel}" method="post"
			                  onsubmit="return confirm('確定要取消報名嗎？')">
			                <input type="hidden" name="regisId" th:value="${r.regisId}">
			                <select name="cancelReason">
			                        <option value="0">行程衝突</option>
								    <option value="1">身體不適</option>
								    <option value="2">其他</option>
			                </select>
			                <input type="text" name="cancelNote" placeholder="補充說明(選填)">
			                <button type="submit">確認取消</button>
			            </form>
			        </div>
			    </div>
			    
			    <div th:if="${r.regisStatus == 1 && r.activity.ended && r.reviewedAt == null}" style="display:inline;">
			        <button type="button" th:id="'reviewBtn' + ${r.regisId}"
			                th:onclick="'toggleReviewForm(' + ${r.regisId} + ')'">填寫心得評論</button>
			
			        <div th:id="'reviewForm' + ${r.regisId}" style="display:none;">
			            <form th:action="@{/member/activity/registration/review}" method="post"
			                  onsubmit="return confirm('確定要送出評論嗎？')">
			                <input type="hidden" name="regisId" th:value="${r.regisId}">
			                
			                評分(滿分5分):
			                <select name="rating">
			                        <option value="1">1</option>
								    <option value="2">2</option>
								    <option value="3">3</option>
								    <option value="4">4</option>
								    <option value="5">5</option>
			                </select>
			                <br>
			                <textarea name="reviewContent" rows="8" style="width: 100%; 
			                		box-sizing: border-box;" placeholder="分享活動心得" required></textarea>
			                <button type="submit">送出評論</button>
			            </form>
			        </div>
			    </div>
			    
			    <div th:if="${r.regisStatus == 1 && r.activity.ended && !#maps.containsKey(reportedActivityMap, r.activity.activityId)}" 
				     style="display:inline;">
				    <button type="button" th:id="'reportBtn' + ${r.regisId}"
				            th:onclick="'toggleReportForm(' + ${r.regisId} + ')'">回報問題</button>
				
				    <div th:id="'reportForm' + ${r.regisId}" style="display:none;">
				        <form th:action="@{/member/activity/report/submit}" method="post"
				              onsubmit="return confirm('確定要送出問題回報嗎？')">
				            <input type="hidden" name="activityId" th:value="${r.activity.activityId}">
				            <textarea name="reportContent" rows="4" cols="40" placeholder="請描述遇到的問題" required></textarea>
				            <button type="submit">送出回報</button>
				        </form>
				    </div>
				</div>
			    
			</td>
        </tr>
    </table>

    <p th:if="${#lists.isEmpty(regisListData)}">目前沒有任何報名紀錄。</p>

	<br>
    <a th:href="@{/}">回首頁</a>｜<a th:href="@{/member/dashboard}">我的療癒足跡</a>｜<a th:href="@{/member/activity/report/myReports}">我的問題回報</a>｜<a th:href="@{/member/activity/listAllActivity}">查看全部活動列表</a>


<script>
function toggleCancelForm(regisId) {
    const form = document.getElementById('cancelForm' + regisId);
    const button = document.getElementById('cancelBtn' + regisId);
    
    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        button.style.backgroundColor = 'black';
        button.style.color = 'white';
    } else {
        form.style.display = 'none';
        button.style.backgroundColor = '';
        button.style.color = '';
    }
}

function toggleReviewForm(regisId) {
    const form = document.getElementById('reviewForm' + regisId);
    const button = document.getElementById('reviewBtn' + regisId);
    
    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        button.style.backgroundColor = 'black';
        button.style.color = 'white';
    } else {
        form.style.display = 'none';
        button.style.backgroundColor = '';
        button.style.color = '';
    }
}

function toggleReportForm(regisId) {
    const form = document.getElementById('reportForm' + regisId);
    const button = document.getElementById('reportBtn' + regisId);

    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        button.style.backgroundColor = 'black';
        button.style.color = 'white';
    } else {
        form.style.display = 'none';
        button.style.backgroundColor = '';
        button.style.color = '';
    }
}
</script>
</body>
</html>
