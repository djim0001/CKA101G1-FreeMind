<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>我的活動報名清單</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
        background-color: #f5f5f5;
        color: #333;
        line-height: 1.6;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px 20px;
    }

    .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 16px;
        border-bottom: 2px solid #e8b4b4;
    }

    .page-header h1 {
        font-size: 28px;
        font-weight: 700;
        color: #4a3e3e;
    }

    .hello-text {
        margin-bottom: 20px;
        color: #7a6b6b;
        font-size: 14px;
    }

    .msg-error {
        color: #c0392b;
        background-color: #fdecea;
        padding: 10px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
    }

    .msg-success {
        color: #2e7d32;
        background-color: #e8f5e9;
        padding: 10px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
    }

    /* 分頁籤 */
    .tab-nav {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
    }

    .tab-nav a {
        text-decoration: none;
    }

    .tab-btn {
        display: inline-block;
        padding: 8px 22px;
        background-color: #fff;
        color: #7a6b6b;
        border: 1px solid #e8d5d5;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
    }

    .tab-btn:hover {
        background-color: #fbf2f2;
    }

    .tab-btn.active {
        background-color: #e8b4b4;
        color: #fff;
        border-color: #e8b4b4;
        font-weight: 700;
    }

    /* 表格卡片 */
    .table-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        overflow: hidden;
        margin-bottom: 24px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead th {
        background-color: #fbf2f2;
        color: #4a3e3e;
        font-size: 15px;
        font-weight: 600;
        padding: 18px 10px;
        text-align: center;
        white-space: nowrap;
        border-bottom: 2px solid #f2dddd;
    }

    tbody td {
        padding: 14px 10px;
        font-size: 14px;
        text-align: center;
        border-bottom: 1px solid #f2eeee;
        vertical-align: middle;
    }

    tbody tr:hover {
        background-color: #fdf7f7;
    }

    /* 動作按鈕（取消報名/填寫評論/回報問題） */
	.btn-action {
	    display: inline-block;
	    padding: 6px 14px;
	    margin: 3px 0;
	    background-color: #fff;
	    border-radius: 20px;
	    font-size: 13px;
	    white-space: nowrap;
	    cursor: pointer;
	    transition: all 0.2s;
	    border: 1px solid;
	}
	
	.btn-cancel {
	    color: #a67c7c;
	    border-color: #e8b4b4;
	}
	.btn-cancel:hover,
	.btn-cancel.is-open {
	    background-color: #e8b4b4;
	    border-color: #e8b4b4;
	    color: #fff;
	}
	
	.btn-review {
	    color: #a67c7c;
	    border-color: #d9a876;
	}
	.btn-review:hover,
	.btn-review.is-open {
	    background-color: #f0c29a;
	    border-color: #f0c29a;
	    color: #fff;
	}
	
	.btn-report {
	    color: #a67c7c;
	    border-color: #c3aed6;
	}
	.btn-report:hover,
	.btn-report.is-open {
	    background-color: #c3aed6;
	    border-color: #c3aed6;
	    color: #fff;
	}
	
	.action-stack {
	    display: flex;
	    flex-direction: column;
	    align-items: center;
	    gap: 4px;
	}

    /* 展開的小表單 */
    .inline-form {
        margin-top: 10px;
        padding: 14px;
        background-color: #fbf2f2;
        border-radius: 8px;
        text-align: left;
        font-size: 13px;
    }

    .inline-form select,
    .inline-form input[type="text"],
    .inline-form textarea {
        padding: 6px 10px;
        border: 1px solid #e8d5d5;
        border-radius: 6px;
        font-size: 13px;
        outline: none;
        margin: 4px 0;
    }

    .inline-form select:focus,
    .inline-form input:focus,
    .inline-form textarea:focus {
        border-color: #e8b4b4;
    }

    .inline-form textarea {
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
    }

    .inline-form button[type="submit"] {
        display: inline-block;
        padding: 6px 18px;
        margin-top: 6px;
        background-color: #e8b4b4;
        color: #fff;
        border: none;
        border-radius: 20px;
        font-size: 13px;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .inline-form button[type="submit"]:hover {
        background-color: #d39393;
    }

    /* 已回報問題 / 無評價 等狀態文字 */
    .status-badge {
        display: inline-block;
        width: 90px;
        text-align: center;
        padding: 4px 0;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid;
    }
    .status-reported {
        color: #7a6b6b;
        border-color: #d9c4c4;
        background-color: #fbf2f2;
    }
    .status-none {
        color: #bbb;
    }

    .empty-state {
        text-align: center;
        padding: 60px 20px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        color: #999;
        font-size: 16px;
    }

    .footer-links {
        text-align: center;
        font-size: 14px;
    }

    .footer-links a {
        color: #7a6b6b;
        text-decoration: none;
    }

    .footer-links a:hover {
        color: #e8b4b4;
        text-decoration: underline;
    }
    
	/*頁碼 */
	.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 24px;
	}
	
	.pagination a {
	    display: inline-block;
	    padding: 8px 14px;
	    font-size: 14px;
	    font-weight: 500;
	    border-radius: 6px;
	    border: 1px solid #f2dddd;
	    background-color: #fbf2f2;
	    color: #7a6b6b;
	    text-decoration: none;
	    transition: all 0.2s;
	}
	
	.pagination a:hover {
	    background-color: #e8b4b4;
	    color: #fff;
	    border-color: #e8b4b4;
	}
	
	.pagination a.active {
	    font-weight: bold;
	    background-color: #e8b4b4;
	    color: #fff;
	    border-color: #e8b4b4;
	}
    </style>
</head>
<body>
<div class="container">

    <div class="page-header">
        <h1>我的活動報名清單</h1>
    </div>

    <p class="hello-text">Hello, <span sec:authentication="principal.member.name"></span>!</p>

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="msg-error"></p>
    <p th:if="${successMessage}" th:text="${successMessage}" class="msg-success"></p>

    <!-- 分頁籤 -->
    <div class="tab-nav">
        <a th:href="@{/member/activity/registration/myRegistrations(tab='upcoming')}">
            <button type="button" class="tab-btn" th:classappend="${currentTab == 'upcoming'} ? ' active' : ''">即將參加</button>
        </a>
        <a th:href="@{/member/activity/registration/myRegistrations(tab='pending')}">
            <button type="button" class="tab-btn" th:classappend="${currentTab == 'pending'} ? ' active' : ''">待審核</button>
        </a>
        <a th:href="@{/member/activity/registration/myRegistrations(tab='history')}">
            <button type="button" class="tab-btn" th:classappend="${currentTab == 'history'} ? ' active' : ''">歷史紀錄</button>
        </a>
    </div>

    <div class="table-card" th:if="${!#lists.isEmpty(regisListData)}">
        <table>
            <thead>
                <tr>
                    <th>活動名稱</th>
                    <th>活動時間</th>
                    <th>報名時間</th>
                    <th>報名動機</th>
                    <th>報名狀態</th>
                    <th>活動狀態</th>
                    <th>我的評價</th>
                    <th>問題回報</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
			  <tr th:each="r : ${regisListData}">
			        <td th:text="${r.activity.activityName}"></td>
			        <td th:text="${#temporals.format(r.activity.activityStart, 'MM/dd(E) HH:mm')} + ' ~ ' + ${#temporals.format(r.activity.activityEnd, 'MM/dd(E) HH:mm')}"></td>
			        <td th:text="${#temporals.format(r.regisAt, 'yyyy/MM/dd HH:mm')}"></td>
			        <td th:text="${r.motivation}"></td>
			        <td>
			            <span th:text="${r.regisStatusText}"></span>
			            <span th:if="${r.regisStatus == 2 && r.rejectReason != null}">
			                <br><small>（<span th:text="${r.rejectReasonText}"></span><span th:if="${!#strings.isEmpty(r.rejectNote)}">：<span th:text="${r.rejectNote}"></span></span>）</small>
			            </span>
			        </td>
			        <td th:text="${r.activity.memberViewStatusText}"></td>
                    <td>
                        <span th:if="${r.reviewedAt != null}"
                              th:text="'★' + ${r.rating}"
                              th:title="${r.reviewContent}"></span>
                        <span th:if="${r.reviewedAt == null}" class="status-none">—</span>
                    </td>
                    <td>
                        <span th:if="${r.regisStatus == 1 && r.activity.ended && #maps.containsKey(reportedActivityMap, r.activity.activityId)}"
                              th:title="${reportedActivityMap.get(r.activity.activityId)}"
                              class="status-badge status-reported">已回報問題</span>
                        <span th:unless="${r.regisStatus == 1 && r.activity.ended}" class="status-none">—</span>
                    </td>
                    <td>
					    <div class="action-stack">
					        <div th:if="${r.cancellable}">
					            <button type="button" class="btn-action btn-cancel" th:id="'cancelBtn' + ${r.regisId}"
					                    th:onclick="'toggleCancelForm(' + ${r.regisId} + ')'">取消報名</button>
					
					            <div class="inline-form" th:id="'cancelForm' + ${r.regisId}" style="display:none;">
					                <form th:action="@{/member/activity/registration/cancel}" method="post"
					                      onsubmit="return confirm('確定要取消報名嗎？')">
					                    <input type="hidden" name="regisId" th:value="${r.regisId}">
					                    <select name="cancelReason">
					                        <option value="0">行程衝突</option>
					                        <option value="1">身體不適</option>
					                        <option value="2">其他</option>
					                    </select>
					                    <input type="text" name="cancelNote" placeholder="補充說明(選填)">
					                    <br>
					                    <button type="submit">確認取消</button>
					                </form>
					            </div>
					        </div>
					
					        <div th:if="${r.regisStatus == 1 && r.activity.ended && r.reviewedAt == null}">
					            <button type="button" class="btn-action btn-review" th:id="'reviewBtn' + ${r.regisId}"
					                    th:onclick="'toggleReviewForm(' + ${r.regisId} + ')'">填寫評論</button>
					
					            <div class="inline-form" th:id="'reviewForm' + ${r.regisId}" style="display:none;">
					                <form th:action="@{/member/activity/registration/review}" method="post"
					                      onsubmit="return confirm('確定要送出評論嗎？')">
					                    <input type="hidden" name="regisId" th:value="${r.regisId}">
					
					                    評分(滿分5分):
					                    <select name="rating">
					                        <option value="1">1</option>
					                        <option value="2">2</option>
					                        <option value="3">3</option>
					                        <option value="4">4</option>
					                        <option value="5">5</option>
					                    </select>
					                    <br>
					                    <textarea name="reviewContent" rows="6" placeholder="分享活動心得" required></textarea>
					                    <br>
					                    <button type="submit">送出評論</button>
					                </form>
					            </div>
					        </div>
					
					        <div th:if="${r.regisStatus == 1 && r.activity.ended && !#maps.containsKey(reportedActivityMap, r.activity.activityId)}">
					            <button type="button" class="btn-action btn-report" th:id="'reportBtn' + ${r.regisId}"
					                    th:onclick="'toggleReportForm(' + ${r.regisId} + ')'">回報問題</button>
					
					            <div class="inline-form" th:id="'reportForm' + ${r.regisId}" style="display:none;">
					                <form th:action="@{/member/activity/report/submit}" method="post"
					                      onsubmit="return confirm('確定要送出問題回報嗎？')">
					                    <input type="hidden" name="activityId" th:value="${r.activity.activityId}">
					                    <textarea name="reportContent" rows="4" placeholder="請描述遇到的問題" required></textarea>
					                    <br>
					                    <button type="submit">送出回報</button>
					                </form>
					            </div>
					        </div>
					    </div>
					</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- 分頁按鈕列 -->
	<div th:if="${totalPages > 1}" class="pagination">
	    <a th:each="i : ${#numbers.sequence(1, totalPages)}"
	       th:href="@{/member/activity/registration/myRegistrations(tab=${currentTab}, currentPage=${i})}"
	       th:text="${i}"
	       th:classappend="${i == currentPage} ? ' active' : ''">
	    </a>
	</div>

    <div class="empty-state" th:if="${#lists.isEmpty(regisListData)}">
        <span th:if="${currentTab == 'upcoming'}">目前沒有即將參加的活動。</span>
        <span th:if="${currentTab == 'pending'}">目前沒有待審核的報名。</span>
        <span th:if="${currentTab == 'history'}">目前沒有歷史紀錄。</span>
    </div>

    <div class="footer-links">
        <a th:href="@{/}">回首頁</a>｜<a th:href="@{/member/dashboard}">我的療癒足跡</a>｜<a th:href="@{/member/activity/report/myReports}">我的問題回報</a>｜<a th:href="@{/member/activity/listAllActivity}">查看全部活動列表</a>
    </div>

</div>

<script>
function toggleCancelForm(regisId) {
    const form = document.getElementById('cancelForm' + regisId);
    const button = document.getElementById('cancelBtn' + regisId);
    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        button.classList.add('is-open');
    } else {
        form.style.display = 'none';
        button.classList.remove('is-open');
    }
}

function toggleReviewForm(regisId) {
    const form = document.getElementById('reviewForm' + regisId);
    const button = document.getElementById('reviewBtn' + regisId);
    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        button.classList.add('is-open');
    } else {
        form.style.display = 'none';
        button.classList.remove('is-open');
    }
}

function toggleReportForm(regisId) {
    const form = document.getElementById('reportForm' + regisId);
    const button = document.getElementById('reportBtn' + regisId);
    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        button.classList.add('is-open');
    } else {
        form.style.display = 'none';
        button.classList.remove('is-open');
    }
}
</script>
</body>
</html>
