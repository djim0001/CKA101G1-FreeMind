<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的報名紀錄｜諮由自在 Free Mind</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />

<style>
/* ---------- 頁首標題區 ---------- */
.act-head { background: var(--bg-warm); padding: 2.2rem 0 1.4rem; }
.act-head .crumb { font-size: .84rem; color: var(--ink-soft); letter-spacing: .04em; }
.act-head .crumb a:hover { color: var(--orange); }
.act-head .crumb span { margin: 0 .45rem; opacity: .5; }
.act-head h1 {
	font-family: var(--zen-maru); font-weight: 700;
	font-size: clamp(1.9rem, 3.2vw, 2.5rem); margin: .5rem 0 .4rem; line-height: 1.3;
}
.act-head p { color: var(--ink-soft); margin: 0; max-width: 36rem; }

.act-page { background: var(--bg-warm); padding: .4rem 0 3.4rem; }
.act-wide { width: min(1320px, 92vw) !important; }

.msg-error { color: #c0392b; background-color: #fdecea; padding: .7rem 1.3rem; border-radius: 10px; margin-bottom: 1.2rem; font-size: .92rem; display: inline-block; }
.msg-success { color: #4F7B96; background-color: var(--blue-soft); padding: .7rem 1.3rem; border-radius: 10px; margin-bottom: 1.2rem; font-size: .92rem; display: inline-block; }

/* ---------- 分頁籤 ---------- */
.tab-nav { display: flex; gap: .6rem; margin-bottom: 1.6rem; flex-wrap: wrap; }
.tab-nav a { text-decoration: none; }
.tab-btn {
	display: inline-flex; align-items: center; padding: .6rem 1.5rem;
	background-color: #fff; color: var(--ink-soft); border: 1px solid var(--line);
	border-radius: 999px; font-size: .9rem; font-weight: 500; cursor: pointer;
	transition: all .18s; box-shadow: var(--shadow-sm);
}
.tab-btn:hover { border-color: var(--orange); color: var(--orange-deep); }
.tab-btn.active { background-color: var(--orange); color: #fff; border-color: var(--orange); font-weight: 700; }

/* ---------- 表格 ---------- */
.table-card {
	background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
	border: 1px solid var(--line); overflow: hidden; margin-bottom: 1.6rem;
}
table { width: 100%; border-collapse: collapse; }
th:nth-child(1) { width: 13%; }  /* 活動名稱 */
th:nth-child(2) { width: 12%; }  /* 活動時間 */
th:nth-child(3) { width: 10%; }  /* 報名時間 */
th:nth-child(4) { width: 16%; }  /* 報名動機 */
th:nth-child(5) { width: 11%; }  /* 報名狀態 */
th:nth-child(6) { width: 8%; }   /* 活動狀態 */
th:nth-child(7) { width: 8%; }   /* 我的評價 */
th:nth-child(8) { width: 8%; }   /* 問題回報 */
th:nth-child(9) { width: 9%; }   /* 操作按鈕 */

thead th {
	background-color: var(--bg-warm); color: var(--ink); font-family: var(--serif);
	font-size: .92rem; font-weight: 700; padding: 1rem .5rem; text-align: center;
	white-space: nowrap; border-bottom: 2px solid var(--line);
}
tbody td {
	padding: .8rem .5rem; font-size: .85rem; color: var(--ink);
	border-bottom: 1px solid var(--line); vertical-align: middle; text-align: center;
}
tbody tr:hover { background-color: var(--bg-warm); }
.text-left { text-align: left; }
.no-wrap { white-space: nowrap; }

.activity-link { color: var(--ink); transition: color .18s; }
.activity-link:hover { color: var(--orange-deep); text-decoration: underline; }

.status-badge {
	display: inline-block; padding: .3rem .8rem; border-radius: 999px;
	font-size: .78rem; font-weight: 500; border: 1px solid; white-space: nowrap;
}
.status-reported { color: var(--ink-soft); border-color: var(--line); background-color: var(--bg-warm); }
.status-none { color: var(--ink-soft); opacity: .5; }

/* ---------- 操作按鈕群組 ---------- */
.action-stack { display: flex; flex-direction: column; align-items: stretch; gap: .4rem; }
.btn-mini {
	display: block; width: 100%; padding: .45rem .6rem; border-radius: 8px; font-size: .78rem;
	white-space: nowrap; cursor: pointer; transition: all .18s; font-family: var(--sans);
	background: #fff; color: var(--ink-soft); border: 1px solid var(--line); text-align: center;
}
.btn-mini:hover { background-color: var(--ink); color: #fff; border-color: var(--ink); }
.btn-mini.danger:hover { background-color: #c0392b; border-color: #c0392b; }
.btn-mini.accent:hover { background-color: var(--orange); border-color: var(--orange); }
.btn-mini.info:hover { background-color: #4F7B96; border-color: #4F7B96; }

.empty-state {
	background: #fff; border: 1px dashed var(--line);
	border-radius: var(--radius-md); padding: 3.4rem 1.5rem; text-align: center;
}
.empty-state b { display: block; font-family: var(--serif); font-size: 1.15rem; color: var(--ink); }

/* ---------- 操作彈窗 ---------- */
.op-modal-overlay {
	display: none; position: fixed; inset: 0;
	background: rgba(58,75,83,.35); backdrop-filter: blur(6px);
	z-index: 500; align-items: center; justify-content: center;
	opacity: 0; transition: opacity .2s;
}
.op-modal-overlay.show { display: flex; opacity: 1; }
.op-modal-panel {
	background: #fff; border-radius: var(--radius-md);
	box-shadow: var(--shadow-md); width: 90%; max-width: 420px; padding: 1.8rem;
	transform: translateY(10px); transition: transform .2s;
	text-align: left; font-family: var(--sans);
}
.op-modal-overlay.show .op-modal-panel { transform: translateY(0); }
.op-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.op-modal-header span { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: var(--ink); }
.op-modal-close { background: none; border: none; font-size: 22px; color: var(--ink-soft); cursor: pointer; line-height: 1; }
.op-modal-close:hover { color: var(--ink); }
.op-modal-panel select, .op-modal-panel input[type="text"], .op-modal-panel textarea {
	width: 100%; padding: .7rem 1rem; border: 1px solid var(--line); border-radius: 12px;
	background: #f6f1e8; font-family: inherit; font-size: .88rem; color: var(--ink); margin-bottom: .9rem;
}
.op-modal-panel textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
.op-modal-panel select:focus, .op-modal-panel input:focus, .op-modal-panel textarea:focus { outline: none; border-color: var(--orange); background: #fff; }
.op-modal-panel p.field-label { font-size: .84rem; color: var(--ink); margin: 0 0 .4rem; }
.op-modal-submit { width: 100%; height: 46px; display: inline-flex; align-items: center; justify-content: center; font-size: .92rem; border: none; cursor: pointer; border-radius: 999px; font-family: inherit; }

/* ---------- 底部連結 ---------- */
.bottom-links { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; margin-top: 2rem; }
.bottom-links a {
	display: inline-flex; align-items: center; gap: .4rem;
	padding: .6rem 1.3rem; border-radius: 999px; border: 1px solid var(--line);
	background: #fff; font-size: .88rem; color: var(--ink-soft); transition: all .18s;
}
.bottom-links a:hover { border-color: var(--orange); color: var(--orange-deep); background: var(--pink-soft); }

@media (max-width: 1000px) {
	.table-card { overflow-x: auto; }
	table { min-width: 1100px; }
}
</style>
</head>
<body>

	<!-- ================= 導覽列 ================= -->
	<div th:replace="~{fragments/header :: header}"></div>

	<!-- ================= 頁首標題 ================= -->
	<section class="act-head">
		<div class="wrap">
			<div class="crumb">
				<a th:href="@{/}" href="/">首頁</a><span>/</span>
				<a th:href="@{/member/activity/listActivities_ByCompositeQuery}">揪團活動</a><span>/</span>
				<span style="opacity:1;color:var(--ink)">我的報名紀錄</span>
			</div>
			<h1>我的報名紀錄</h1>
			<p>看看有哪些活動在等你，管理報名狀態、留下評價，或回報問題。</p>
		</div>
	</section>


	<!-- ================= 主體 ================= -->
	<section class="act-page">
		<div class="wrap act-wide">

			<p th:if="${errorMessage}" th:text="${errorMessage}" class="msg-error"></p>
			<p th:if="${successMessage}" th:text="${successMessage}" class="msg-success"></p>

			<!-- 分頁籤 -->
			<div class="tab-nav">
				<a th:href="@{/member/activity/registration/myRegistrations(tab='upcoming')}">
					<button type="button" class="tab-btn" th:classappend="${currentTab == 'upcoming'} ? ' active' : ''">即將參加</button>
				</a>
				<a th:href="@{/member/activity/registration/myRegistrations(tab='pending')}">
					<button type="button" class="tab-btn" th:classappend="${currentTab == 'pending'} ? ' active' : ''">待審核</button>
				</a>
				<a th:href="@{/member/activity/registration/myRegistrations(tab='history')}">
					<button type="button" class="tab-btn" th:classappend="${currentTab == 'history'} ? ' active' : ''">歷史紀錄</button>
				</a>
			</div>

			<!-- 表格 -->
			<div class="table-card" th:if="${!#lists.isEmpty(regisListData)}">
				<table>
					<thead>
						<tr>
							<th>活動名稱</th>
							<th>活動時間</th>
							<th>報名時間</th>
							<th>報名動機</th>
							<th>報名狀態</th>
							<th>活動狀態</th>
							<th>我的評價</th>
							<th>問題回報</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="r : ${regisListData}">
							<td>
								<a class="activity-link" th:href="@{/member/activity/listOneActivity(activityId=${r.activity.activityId})}" th:text="${r.activity.activityName}"></a>
							</td>
							<td th:text="${#temporals.format(r.activity.activityStart, 'MM/dd(E) HH:mm')} + ' ~ ' + ${#temporals.format(r.activity.activityEnd, 'MM/dd(E) HH:mm')}"></td>
							<td th:text="${#temporals.format(r.regisAt, 'yyyy/MM/dd HH:mm')}"></td>
							<td class="text-left" th:text="${r.motivation}"></td>
							<td>
								<span th:text="${r.regisStatusText}"></span>
								<span th:if="${r.regisStatus == 2 && r.rejectReason != null}">
									<br><small>（<span th:text="${r.rejectReasonText}"></span><span th:if="${!#strings.isEmpty(r.rejectNote)}">：<span th:text="${r.rejectNote}"></span></span>）</small>
								</span>
							</td>
							<td th:text="${r.activity.memberViewStatusText}"></td>
							<td>
								<span th:if="${r.reviewedAt != null}"
									  th:text="'★' + ${r.rating}"
									  th:title="${r.reviewContent}"></span>
								<span th:if="${r.reviewedAt == null}" class="status-none">—</span>
							</td>
							<td>
								<span th:if="${r.regisStatus == 1 && r.activity.ended && #maps.containsKey(reportedActivityMap, r.activity.activityId)}"
									  th:title="${reportedActivityMap.get(r.activity.activityId)}"
									  class="status-badge status-reported">已回報問題</span>
								<span th:unless="${r.regisStatus == 1 && r.activity.ended}" class="status-none">—</span>
							</td>
							<td>
								<div class="action-stack">
									<button th:if="${r.cancellable}" type="button" class="btn-mini danger"
											th:onclick="'openOpModal(\'cancelModal' + ${r.regisId} + '\')'">取消報名</button>

									<button th:if="${r.regisStatus == 1 && r.activity.ended && r.reviewedAt == null}"
											type="button" class="btn-mini accent"
											th:onclick="'openOpModal(\'reviewModal' + ${r.regisId} + '\')'">填寫評論</button>

									<button th:if="${r.regisStatus == 1 && r.activity.ended && !#maps.containsKey(reportedActivityMap, r.activity.activityId)}"
											type="button" class="btn-mini info"
											th:onclick="'openOpModal(\'reportModal' + ${r.regisId} + '\')'">回報問題</button>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- 查無結果 -->
			<div class="empty-state" th:if="${#lists.isEmpty(regisListData)}">
				<b th:if="${currentTab == 'upcoming'}">目前沒有即將參加的活動</b>
				<b th:if="${currentTab == 'pending'}">目前沒有待審核的報名</b>
				<b th:if="${currentTab == 'history'}">目前沒有歷史紀錄</b>
			</div>

			<!-- 分頁 -->
			<div th:if="${!#lists.isEmpty(regisListData)}"
				 th:replace="~{fragments/pagination :: pagination(${currentPage}, ${totalPages}, @{/member/activity/registration/myRegistrations}, ${qs})}"></div>

			<!-- 底部連結 -->
			<div class="bottom-links">
				<a th:href="@{/member/dashboard}">
					<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
					我的療癒足跡
				</a>
				<a th:href="@{/member/activity/report/myReports}">
					<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
					我的問題回報
				</a>
				<a th:href="@{/member/activity/listActivities_ByCompositeQuery}">
					<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 22V12h6v10M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
					查看全部活動列表
				</a>
			</div>

		</div>
	</section>

	<!-- ================= 操作彈窗（每筆報名各一組） ================= -->
	<th:block th:each="r : ${regisListData}">
		<!-- 取消報名彈窗 -->
		<div class="op-modal-overlay" th:id="'cancelModal' + ${r.regisId}" onclick="closeOpModalOutside(event, this)">
			<div class="op-modal-panel">
				<div class="op-modal-header">
					<span>取消報名</span>
					<button type="button" class="op-modal-close" th:onclick="'closeOpModal(\'cancelModal' + ${r.regisId} + '\')'">&times;</button>
				</div>
				<form th:action="@{/member/activity/registration/cancel}" method="post"
					  onsubmit="return confirm('確定要取消報名嗎？')">
					<input type="hidden" name="regisId" th:value="${r.regisId}">
					<input type="hidden" name="tab" th:value="${currentTab}">
					<input type="hidden" name="page" th:value="${currentPage}">
					<p class="field-label">取消原因</p>
					<select name="cancelReason">
						<option value="0">行程衝突</option>
						<option value="1">身體不適</option>
						<option value="2">其他</option>
					</select>
					<p class="field-label">補充說明（選填）</p>
					<input type="text" name="cancelNote" placeholder="補充說明">
					<button type="submit" class="op-modal-submit" style="background:#c0392b;color:#fff;">確認取消</button>
				</form>
			</div>
		</div>

		<!-- 填寫評論彈窗 -->
		<div class="op-modal-overlay" th:id="'reviewModal' + ${r.regisId}" onclick="closeOpModalOutside(event, this)">
			<div class="op-modal-panel">
				<div class="op-modal-header">
					<span>填寫評論</span>
					<button type="button" class="op-modal-close" th:onclick="'closeOpModal(\'reviewModal' + ${r.regisId} + '\')'">&times;</button>
				</div>
				<form th:action="@{/member/activity/registration/review}" method="post"
					  onsubmit="return confirm('確定要送出評論嗎？')">
					<input type="hidden" name="regisId" th:value="${r.regisId}">
					<input type="hidden" name="tab" th:value="${currentTab}">
					<input type="hidden" name="page" th:value="${currentPage}">
					<p class="field-label">評分（滿分 5 分）</p>
					<select name="rating">
						<option value="1">1</option>
						<option value="2">2</option>
						<option value="3">3</option>
						<option value="4">4</option>
						<option value="5">5</option>
					</select>
					<p class="field-label">活動心得</p>
					<textarea name="reviewContent" placeholder="分享活動心得" required></textarea>
					<button type="submit" class="op-modal-submit" style="background:var(--orange);color:#fff;">送出評論</button>
				</form>
			</div>
		</div>

		<!-- 回報問題彈窗 -->
		<div class="op-modal-overlay" th:id="'reportModal' + ${r.regisId}" onclick="closeOpModalOutside(event, this)">
			<div class="op-modal-panel">
				<div class="op-modal-header">
					<span>回報問題</span>
					<button type="button" class="op-modal-close" th:onclick="'closeOpModal(\'reportModal' + ${r.regisId} + '\')'">&times;</button>
				</div>
				<form th:action="@{/member/activity/report/submit}" method="post"
					  onsubmit="return confirm('確定要送出問題回報嗎？')">
					<input type="hidden" name="activityId" th:value="${r.activity.activityId}">
					<input type="hidden" name="tab" th:value="${currentTab}">
					<input type="hidden" name="page" th:value="${currentPage}">
					<p class="field-label">問題描述</p>
					<textarea name="reportContent" placeholder="請描述遇到的問題" required></textarea>
					<button type="submit" class="op-modal-submit" style="background:#4F7B96;color:#fff;">送出回報</button>
				</form>
			</div>
		</div>
	</th:block>

	<!-- ================= Footer ================= -->
	<div th:replace="~{fragments/footer :: footer}"></div>
	<div th:replace="~{fragments/footer :: backToTop}"></div>

	<script src="/js/nav.js"></script>
	<script>
	function openOpModal(id) {
		document.getElementById(id).classList.add('show');
	}
	function closeOpModal(id) {
		document.getElementById(id).classList.remove('show');
	}
	function closeOpModalOutside(e, overlay) {
		if (e.target === overlay) overlay.classList.remove('show');
	}
	</script>
</body>
</html>
