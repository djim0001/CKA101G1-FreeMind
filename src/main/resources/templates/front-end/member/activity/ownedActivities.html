<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>我發起的活動</title>
    <style>
  /* =================================================================== */
  /* 分配寬度比例 (100%) */
  /* =================================================================== */
  th:nth-child(1) { width: 9%; }  /* 活動圖片 */
  th:nth-child(2) { width: 4%; }  /* 編號 */
  th:nth-child(3) { width: 17%; } /* 活動名稱 */
  th:nth-child(4) { width: 7%; } /* 活動狀態 */
  th:nth-child(5) { width: 12%; } /* 活動時間 */
  th:nth-child(6) { width: 11%; }  /* 已報名/名額 */
  th:nth-child(7) { width: 12%; } /* 報名時間 */
  th:nth-child(8) { width: 6%; }  /* 報名狀態狀態 */
  th:nth-child(9) { width: 9%; } /* 查看詳情按鈕欄位 */	
  th:nth-child(10) { width: 9%; } /* 其他操作按鈕欄位 */	
  
  td:nth-child(9) {
    white-space: nowrap; 
  }
  td:nth-child(10) {
    white-space: nowrap; 
  }
  .action-block {
    display: inline-block;
  }
  
    </style>
</head>
<body>
	<p>Hello, <span sec:authentication="principal.member.name"></span>!</p>
    <h1>我發起的活動</h1>

    <p th:if="${errorMessage}" th:utext="${errorMessage}" style="color:red;"></p>
	<p th:if="${success}" th:utext="${success}" style="color:blue;"></p>

	<h3><a th:href="@{/member/activity/select_page}">回活動首頁</a></h3>
	    
	<form th:action="@{/member/activity/ownedActivities_search}" method="post">
        <p>
            活動狀態：
            <select name="activityStatus">
                <option value="">全部</option>
                <option value="0">待審核</option>
                <option value="1">已審核</option>
                <option value="2">已發布</option>
                <option value="3">已退回</option>
                <option value="4">取消</option>
                <option value="5">延期</option>
            </select>
        <button type="submit">篩選</button>
        </p>
    </form>

    <table border="1">
        <tr>
            <th>圖片</th>
            <th>編號</th>
            <th>活動名稱</th>
            <th>活動狀態</th>
            <th>活動時間</th>
			<th>名額</th>
			<th>報名時間</th>
			<th>報名狀態</th>
			<th></th>
			<th></th>
        </tr>
        <tr th:each="a : ${activityListData}">
		    <td>
		        <img th:if="${a.picture != null}" 
		             th:src="@{'/activity-images/' + ${a.picture}}" 
		             style="max-width: 100px;">
		        <img th:unless="${a.picture != null}" 
		             th:src="@{/images/no-image.jpg}" 
		             style="max-width: 100px;">
		    </td>
		    <td th:text="${a.activityId}"></td>
		    <td th:text="${a.activityName}"></td>
		    <td th:text="${a.activityStatusText}"></td>
		    <td th:text="${#temporals.format(a.activityStart, 'MM/dd(E) HH:mm')} + ' ~ ' + ${#temporals.format(a.activityEnd, 'MM/dd(E) HH:mm')}"></td>
		    <td th:attr="data-activity-id=${a.activityId},data-capacity=${a.capacity},data-waitlist-capacity=${a.waitlistCapacity}">
			    正取 <span th:id="'confirmed-' + ${a.activityId}" th:text="${a.regisCount} + '/' + ${a.capacity}"></span><br>
			    備取 <span th:id="'waitlist-' + ${a.activityId}" th:text="${a.waitlistCount} + '/' + ${a.waitlistCapacity}"></span><br>
			    已報名 <span th:id="'total-' + ${a.activityId}" th:text="${a.regisCount + a.waitlistCount + (pendingCountMap.get(a.activityId) ?: 0)} + '/' + ${a.capacity + a.waitlistCapacity}"></span>
			</td>
		    <td th:text="${#temporals.format(a.regisStart, 'MM/dd(E) HH:mm')} + ' ~ ' + ${#temporals.format(a.regisEnd, 'MM/dd(E) HH:mm')}"></td>
		    <td th:text="${a.registrationStatusText}"></td>
		    <td>
		        <form class="action-block" th:action="@{/member/activity/registration/activityRegistrations}" method="get" style="display:inline;">
				    <input type="hidden" name="activityId" th:value="${a.activityId}">
				    <button type="submit">報名名單</button>
				</form>
		        <form class="action-block" th:action="@{/member/activity/listOneActivity}" method="get" style="display:inline;">
		            <input type="hidden" name="activityId" th:value="${a.activityId}">
		            <button type="submit">查看詳情</button>
		        </form>
		    </td>
		    
			<td>
			    <div class="action-block" th:if="${a.activityStatus == 0 || a.activityStatus == 3}">
			        <form th:action="@{/member/activity/getOne_For_Update}" method="get" style="display:inline;">
			            <input type="hidden" name="activityId" th:value="${a.activityId}">
			            <button type="submit">修改</button>
			        </form>
			    </div>
			
				<div class="action-block" th:if="${(a.activityStatus == 0 || a.activityStatus == 1 || a.activityStatus == 2 || a.activityStatus == 5) && !a.ended}">
				    <button type="button" th:id="'cancelBtn' + ${a.activityId}"
				            th:onclick="'toggleCancelForm(' + ${a.activityId} + ')'">取消活動</button>
				
				    <div th:id="'cancelForm' + ${a.activityId}" style="display:none;">
				        <form th:action="@{/member/activity/cancel}" method="post"
				              onsubmit="return confirm('確定要取消這個活動嗎？')">
				            <input type="hidden" name="activityId" th:value="${a.activityId}">
				            <input type="text" name="cancelNote" placeholder="請填取消原因" required>
				            <button type="submit">確認取消</button>
				        </form>
				    </div>
				</div>
			    
			    <div class="action-block" th:if="${a.activityStatus == 2 && !a.ended}">
			        <button type="button"  th:id="'postponeBtn' + ${a.activityId}"
			                th:onclick="'togglePostponeForm(' + ${a.activityId} + ')'">延期</button>
			
			        <div th:id="'postponeForm' + ${a.activityId}" style="display:none;">
			            <form th:action="@{/member/activity/postpone}" method="post"
			                  onsubmit="return confirm('確定要延期這個活動嗎？')">
			                <input type="hidden" name="activityId" th:value="${a.activityId}">
			                <input type="text" name="postponeNote" placeholder="請填延期原因" required>
			                <button type="submit">確認延期</button>
			            </form>
			        </div>
			    </div>
			    
			    <div class="action-block" th:if="${a.activityStatus == 5}">
			        <button type="button"  th:id="'scheduleBtn' + ${a.activityId}"
			        			th:onclick="'toggleScheduleForm(' + ${a.activityId} + ')'">確認新時間</button>
			
			        <div th:id="'scheduleForm' + ${a.activityId}" style="display:none;">
			            <form th:action="@{/member/activity/confirmNewSchedule}" method="post"
			                  onsubmit="return confirm('確定要送出新的活動時間嗎？')">
			                <input type="hidden" name="activityId" th:value="${a.activityId}">
			                <p>新活動開始時間：<input type="datetime-local" name="activityStart" required></p>
			                <p>新活動結束時間：<input type="datetime-local" name="activityEnd" required></p>
			                <p>新報名開始時間（選填）：<input type="datetime-local" name="regisStart"></p>
			                <p>新報名截止時間（選填）：<input type="datetime-local" name="regisEnd"></p>
			                <button type="submit">確認送出</button>
			            </form>
			        </div>
			    </div>
			</td>
        </tr>
    </table>
    <div>
	    <form th:action="@{/member/activity/ownedActivities_search}" method="post" th:each="i : ${#numbers.sequence(1, totalPages)}" style="display:inline;">
	        <input type="hidden" name="currentPage" th:value="${i}">
	        <input type="hidden" name="activityStatus" th:value="${param.activityStatus}">
	        <button type="submit" th:text="${i}" 
	                th:style="${i == currentPage} ? 'font-weight:bold;' : ''"></button>
	    </form>
	</div>


<script>
function toggleCancelForm(activityId) {
    const form = document.getElementById('cancelForm' + activityId);
    const button = document.getElementById('cancelBtn' + activityId);
    
    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        button.style.backgroundColor = 'black';
        button.style.color = 'white';
    } else {
        form.style.display = 'none';
        button.style.backgroundColor = '';
        button.style.color = '';
    }
}

function togglePostponeForm(activityId) {
    const form = document.getElementById('postponeForm' + activityId);
    const button = document.getElementById('postponeBtn' + activityId);
    
    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        button.style.backgroundColor = 'black';
        button.style.color = 'white';
    } else {
        form.style.display = 'none';
        button.style.backgroundColor = '';
        button.style.color = '';
    }
}

function toggleScheduleForm(activityId) {
    const form = document.getElementById('scheduleForm' + activityId);
    const button = document.getElementById('scheduleBtn' + activityId);
    
    if (form.style.display === 'none' || form.style.display === '') {
        form.style.display = 'block';
        button.style.backgroundColor = 'black';
        button.style.color = 'white';
    } else {
        form.style.display = 'none';
        button.style.backgroundColor = '';
        button.style.color = '';
    }
}



(function() {
    var rows = document.querySelectorAll('[data-activity-id]');
    rows.forEach(function(row) {
        var activityId = row.getAttribute('data-activity-id');
        var confirmedCap = row.getAttribute('data-capacity');
        var waitlistCap = row.getAttribute('data-waitlist-capacity');

        var wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/activity/' + activityId;
        var socket = new WebSocket(wsUrl);

        socket.onmessage = function(event) {
            var data = JSON.parse(event.data);

            document.getElementById('confirmed-' + activityId).innerText = data['正取'] + '/' + confirmedCap;
            document.getElementById('waitlist-' + activityId).innerText = data['備取'] + '/' + waitlistCap;

            var total = data['正取'] + data['備取'] + data['未審核'];
            var totalCap = parseInt(confirmedCap) + parseInt(waitlistCap);
            document.getElementById('total-' + activityId).innerText = total + '/' + totalCap;
        };

        socket.onerror = function(e) {
            console.log('WebSocket錯誤(活動' + activityId + '):', e);
        };
    });
})();
</script>
</body>
</html>
