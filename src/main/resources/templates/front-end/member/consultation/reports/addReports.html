<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新增諮商問題回報</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
        color: #333;
    }

    .card {
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        padding: 36px 40px;
    }

    h3 {
        font-size: 22px;
        color: #4a3e3e;
        margin: 0 0 20px;
        padding-bottom: 14px;
        border-bottom: 2px solid #e8b4b4;
    }

    .field {
        margin-bottom: 18px;
    }
    .field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #7a6b6b;
        margin-bottom: 6px;
    }

    textarea {
        width: 100%;
        height: 140px;
        resize: none;
        padding: 10px;
        border: 1px solid #e0d5d5;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
    }
    textarea:focus {
        outline: none;
        border-color: #e8b4b4;
    }

    .error {
        color: #c62828;
        font-size: 13px;
        margin-left: 8px;
    }

    input[type="submit"] {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 12px 0;
        background-color: #e8b4b4;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    input[type="submit"]:hover {
        background-color: #d39393;
    }
</style>
</head>
<body>
	<div class="card">
		<h3>新增諮商問題回報</h3>

		<span class="error" th:if="${errorMessage != null}" th:utext="${errorMessage}"></span>

		<form method="post" th:action="@{/member/reports/frontInsert}" th:object="${reports}">

			<input type="hidden" th:field="*{member.memberId}">
			<input type="hidden" th:field="*{orders}">

			<div class="field">
				<label>問題描述</label>
				<textarea th:field="*{issueDesc}"></textarea>
				<span class="error" th:if="${#fields.hasErrors('issueDesc')}" th:errors="*{issueDesc}"></span>
			</div>

			<input type="submit" value="送出回報">
		</form>
	</div>
</body>
</html>
