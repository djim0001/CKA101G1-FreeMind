<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新增諮商問題回報</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
    .report-section { padding: 3.5rem 0 6rem; }

    .report-card {
        max-width: 560px; margin: 0 auto;
        background: var(--white); border: 1px solid var(--line);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
        padding: 2.6rem 2.4rem;
    }
    .report-card h3 {
        font-family: var(--serif); font-size: 1.5rem; color: var(--ink);
        margin: 0 0 1.4rem; padding-bottom: 1rem; border-bottom: 2px solid var(--pink);
    }

    .field { margin-bottom: 1.3rem; }
    .field label {
        display: block; font-size: .85rem; font-weight: 500;
        color: var(--ink-soft); margin-bottom: .5rem;
    }
    textarea {
        width: 100%; height: 150px; resize: none;
        padding: .8rem 1rem; border: 1.6px solid var(--line); border-radius: var(--radius-md);
        font-family: var(--sans); font-size: .95rem; color: var(--ink); background: var(--bg-warm);
        transition: border-color .2s;
    }
    textarea:focus { outline: none; border-color: var(--orange); }

    .error { color: var(--orange-deep); font-size: .82rem; margin-left: .4rem; display: inline-block; margin-top: .35rem; }

    .report-submit { width: 100%; justify-content: center; border: none; margin-top: .4rem; }
</style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="report-section">
    <div class="wrap">
        <div class="report-card">
            <h3>新增諮商問題回報</h3>

            <span class="error" th:if="${errorMessage != null}" th:utext="${errorMessage}"></span>

            <form method="post" th:action="@{/member/reports/frontInsert}" th:object="${reports}">

                <input type="hidden" th:field="*{member.memberId}">
                <input type="hidden" th:field="*{orders}">

                <div class="field">
                    <label>問題描述</label>
                    <textarea th:field="*{issueDesc}"></textarea>
                    <span class="error" th:if="${#fields.hasErrors('issueDesc')}" th:errors="*{issueDesc}"></span>
                </div>

                <button type="submit" class="btn btn-primary report-submit">送出回報</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: backToTop}"></div>
<script src="/js/nav.js"></script>
</body>
</html>
