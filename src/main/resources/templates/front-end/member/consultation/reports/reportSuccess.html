<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>回報成功</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
        color: #333;
    }

    .card {
        max-width: 480px;
        margin: 60px auto 0;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        padding: 48px 40px;
        text-align: center;
    }

    .check {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #eaf6ec;
        color: #2e7d43;
        font-size: 34px;
        line-height: 64px;
    }

    h3 {
        font-size: 20px;
        color: #4a3e3e;
        margin: 0 0 28px;
    }

    .home-link {
        display: inline-block;
        padding: 11px 28px;
        background-color: #e8b4b4;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 600;
        transition: background-color 0.2s;
    }
    .home-link:hover {
        background-color: #d39393;
    }
</style>
</head>
<body>
	<div class="card">
		<div class="check">✓</div>
		<h3 th:text="${success}">問題回報已送出，我們會盡快處理！</h3>
		<a class="home-link" th:href="@{/}">回首頁</a>
	</div>
</body>
</html>
