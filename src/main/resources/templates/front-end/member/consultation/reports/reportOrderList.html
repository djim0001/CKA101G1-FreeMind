<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>選擇要回報的訂單</title>
</head>
<body>
	<h3>會員編號 <span th:text="${memberId}"></span> 的諮商紀錄</h3>

	<table border="1">
		<tr>
			<th>訂單編號</th>
			<th>心理師編號</th>
			<th>諮商時間</th>
			<th>訂單狀態</th>
			<th>操作</th>
		</tr>
		<tr th:each="order : ${ordersListData}">
			<td th:text="${order.orderId}"></td>
			<td th:text="${order.psychologist.psychId}"></td>
			<td th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
			<td th:switch="${order.orderStatus}">
				<span th:case="1">已確認</span>
				<span th:case="4">已完成</span>
			</td>
			<td>
				<form method="post" th:action="@{/reports/reportSelect}">
					<input type="hidden" name="orderId" th:value="${order.orderId}">
					<input type="hidden" name="memberId" th:value="${memberId}">
					<input type="submit" value="回報這筆諮商">
				</form>
			</td>
		</tr>
	</table>

	<a th:href="@{/reports/reportLookupForm}">重新查詢</a>

</body>
</html>
