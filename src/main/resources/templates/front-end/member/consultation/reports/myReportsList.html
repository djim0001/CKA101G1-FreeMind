<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>我的問題回報</title>
</head>
<body>
	<h3>會員編號 <span th:text="${memberId}"></span> 的問題回報</h3>

	<table border="1">
		<tr>
			<th>回報編號</th>
			<th>問題描述</th>
			<th>回報日期</th>
			<th>處理狀態</th>
			<th>處理備註</th>
		</tr>
		<tr th:each="report : ${reportsListData}">
			<td th:text="${report.reportId}"></td>
			<td th:text="${report.issueDesc}"></td>
			<td th:text="${#temporals.format(report.reportDate, 'yyyy-MM-dd HH:mm')}"></td>
			<td th:switch="${report.reportStatus}">
				<span th:case="0">待處理</span>
				<span th:case="1">處理中</span>
				<span th:case="2">已解決</span>
			</td>
			<td th:text="${report.reportNote != null ? report.reportNote : '尚無回覆'}"></td>
		</tr>
	</table>

	<a th:href="@{/reports/myReportsForm}">重新查詢</a>

</body>
</html>
