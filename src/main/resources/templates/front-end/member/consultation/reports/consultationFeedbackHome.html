<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>諮商服務反饋</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
        color: #333;
    }

    .card {
        max-width: 480px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        padding: 36px 40px;
    }

    h3 {
        font-size: 22px;
        color: #4a3e3e;
        margin: 0 0 24px;
        padding-bottom: 14px;
        border-bottom: 2px solid #e8b4b4;
    }

    .menu {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .menu a {
        display: block;
        padding: 16px 20px;
        background-color: #fbf2f2;
        border: 1px solid #f2dddd;
        border-radius: 8px;
        text-decoration: none;
        color: #4a3e3e;
        font-size: 15px;
        transition: background-color 0.2s, color 0.2s;
    }
    .menu a:hover {
        background-color: #e8b4b4;
        color: #fff;
    }
</style>
</head>
<body>
	<div class="card">
		<h3>諮商服務反饋</h3>

		<div class="menu">
			<a th:href="@{/member/orders/reviewForm}">心得評論</a>
			<a th:href="@{/member/reports/reportLookupForm}">問題回報</a>
			<a th:href="@{/member/reports/myReportsForm}">查看問題回報處理進度</a>
		</div>
	</div>
</body>
</html>
