<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新增諮商問題回報</title>
<style>
    body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        margin: 30px;
        color: #333;
    }
    h3 {
        margin-bottom: 20px;
    }
    table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: center;
        vertical-align: middle;
    }
    th {
        background-color: #f2f2f2;
    }
</style>
</head>
<body>
	<h3>新增諮商問題回報</h3>

	<span style="color:red;" th:if="${errorMessage != null}" th:text="${errorMessage}"></span><br>

	<form method="post" th:action="@{/member/reports/reportLookup}">
		會員編號：<input type="text" name="memberId" th:value="${memberId}"><br>
		<input type="submit" value="查看我的諮商紀錄">
	</form>

	<div th:if="${ordersListData != null}">
		<h3>會員編號 <span th:text="${memberId}"></span> 的諮商紀錄</h3>

		<table>
			<tr>
				<th>訂單編號</th>
				<th>心理師編號</th>
				<th>姓名</th>
				<th>諮商時間</th>
				<th>訂單狀態</th>
				<th>操作</th>
			</tr>
			<tr th:each="order : ${ordersListData}">
				<td th:text="${order.orderId}"></td>
				<td th:text="${order.psychologist.psychId}"></td>
				<td th:text="${order.psychologist.name}"></td>
				<td th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
				<td th:switch="${order.orderStatus}">
					<span th:case="1">已確認</span>
					<span th:case="4">已完成</span>
				</td>
				<td>
					<form method="post" th:action="@{/member/reports/reportSelect}">
						<input type="hidden" name="orderId" th:value="${order.orderId}">
						<input type="hidden" name="memberId" th:value="${memberId}">
						<input type="submit" value="回報這筆諮商">
					</form>
				</td>
			</tr>
		</table>
	</div>

</body>
</html>
