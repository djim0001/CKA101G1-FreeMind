<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新增諮商問題回報</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
    .lookup-list-section { padding: 3.2rem 0 6rem; }

    .lookup-list-card {
        max-width: 900px; margin: 0 auto;
        background: var(--white); border: 1px solid var(--line);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
        padding: 2.4rem 2.2rem;
    }
    .lookup-list-card h3 {
        font-family: var(--serif); font-size: 1.5rem; color: var(--ink);
        margin: 0 0 1.3rem; padding-bottom: 1rem; border-bottom: 2px solid var(--pink);
    }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin-top: .6rem; }
    th, td { border: 1px solid var(--line); padding: .75rem .6rem; text-align: center; vertical-align: middle; font-size: .85rem; }
    th { background: var(--bg-warm); color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
    tr:nth-child(even) td { background: #fffdf8; }

    .nowrap { white-space: nowrap; }
    .status-confirmed { color: #1A7A1A; font-weight: 700; }
    .status-completed { color: var(--ink); font-weight: 700; }

    .report-btn {
        display: inline-block; padding: .5rem 1.1rem;
        background: var(--orange); color: #fff; border: none; border-radius: var(--radius-md);
        font-size: .8rem; font-family: inherit; cursor: pointer; white-space: nowrap;
        transition: background .2s;
    }
    .report-btn:hover { background: var(--orange-deep); }

    .empty-hint { font-size: .9rem; color: var(--ink-soft); margin-top: .8rem; }
</style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="lookup-list-section">
    <div class="wrap">
        <div class="lookup-list-card">
            <h3>新增諮商問題回報</h3>

            <p class="empty-hint" th:if="${#lists.isEmpty(ordersListData)}">查無可回報的諮商紀錄（可能都已經回報過了）。</p>

            <div class="table-wrap">
                <table th:unless="${#lists.isEmpty(ordersListData)}">
                    <tr>
                        <th>訂單編號</th>
                        <th>心理師編號</th>
                        <th>姓名</th>
                        <th>諮商時間</th>
                        <th>訂單狀態</th>
                        <th>操作</th>
                    </tr>
                    <tr th:each="order : ${ordersListData}">
                        <td th:text="${order.orderId}"></td>
                        <td th:text="${order.psychologist.psychId}"></td>
                        <td class="nowrap" th:text="${order.psychologist.name}"></td>
                        <td class="nowrap" th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:switch="${order.orderStatus}">
                            <span th:case="1" class="status-confirmed">已確認</span>
                            <span th:case="4" class="status-completed">已完成</span>
                        </td>
                        <td>
                            <form method="post" th:action="@{/member/reports/reportSelect}">
                                <input type="hidden" name="orderId" th:value="${order.orderId}">
                                <button type="submit" class="report-btn">回報這筆諮商</button>
                            </form>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: backToTop}"></div>
<script src="/js/nav.js"></script>
</body>
</html>
