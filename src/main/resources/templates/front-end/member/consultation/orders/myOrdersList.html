<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>我的預約紀錄</title>
</head>
<body>
	<h3>會員編號 <span th:text="${memberId}"></span> 的預約紀錄</h3>

	<table border="1">
		<tr>
			<th>訂單編號</th>
			<th>心理師編號</th>
			<th>開始時間</th>
			<th>結束時間</th>
			<th>訂單狀態</th>
			<th>評分</th>
			<th>心得內容</th>
		</tr>
		<tr th:each="order : ${ordersListData}">
			<td th:text="${order.orderId}"></td>
			<td th:text="${order.psychologist.psychId}"></td>
			<td th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm')}"></td>
			<td th:text="${#temporals.format(order.consEnd, 'yyyy-MM-dd HH:mm')}"></td>
			<td th:switch="${order.orderStatus}">
				<span th:case="0">待確認</span>
				<span th:case="1">已確認</span>
				<span th:case="2">已取消</span>
				<span th:case="3">未出席</span>
				<span th:case="4">已完成</span>
			</td>
			<td th:text="${order.rating != null ? order.rating : '尚未評論'}"></td>
			<td th:text="${order.reviewContent != null ? order.reviewContent : '-'}"></td>
		</tr>
	</table>

	<a th:href="@{/orders/myOrdersForm}">重新查詢</a>

</body>
</html>
