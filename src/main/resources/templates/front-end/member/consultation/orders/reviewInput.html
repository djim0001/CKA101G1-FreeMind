<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>撰寫心得評論</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
    .review-section { padding: 3.5rem 0 6rem; }

    .review-card {
        max-width: 560px; margin: 0 auto;
        background: var(--white); border: 1px solid var(--line);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
        padding: 2.6rem 2.4rem;
    }
    .review-card h3 {
        font-family: var(--serif); font-size: 1.5rem; color: var(--ink);
        margin: 0 0 1.2rem; padding-bottom: 1rem; border-bottom: 2px solid var(--pink);
    }

    .info-row { margin-bottom: .4rem; font-size: .92rem; color: var(--ink); }
    .info-row .label { font-weight: 700; color: var(--ink-soft); margin-right: .4rem; }

    .field { margin: 1.4rem 0; }
    .field > label {
        display: block; font-size: .85rem; font-weight: 500;
        color: var(--ink-soft); margin-bottom: .6rem;
    }

    .star-rating { display: inline-flex; flex-direction: row-reverse; justify-content: flex-end; }
    .star-rating input[type="radio"] { display: none; }
    .star-rating label {
        font-size: 2.1rem; line-height: 1; color: var(--line);
        cursor: pointer; padding: 0 .12rem; transition: color .15s;
    }
    .star-rating input[type="radio"]:checked ~ label,
    .star-rating label:hover,
    .star-rating label:hover ~ label { color: #F2B01E; }

    textarea {
        width: 100%; height: 130px; resize: none;
        padding: .8rem 1rem; border: 1.6px solid var(--line); border-radius: var(--radius-md);
        font-family: var(--sans); font-size: .95rem; color: var(--ink); background: var(--bg-warm);
    }
    textarea:focus { outline: none; border-color: var(--orange); }

    .review-submit { width: 100%; justify-content: center; border: none; margin-top: .4rem; }
</style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="review-section">
    <div class="wrap">
        <div class="review-card">
            <h3>撰寫心得評論</h3>

            <div class="info-row">
                <span class="label">心理師：</span><span th:text="${orders.psychologist.name}"></span>
            </div>
            <div class="info-row">
                <span class="label">諮商時間：</span>
                <span th:text="${#temporals.format(orders.consStart, 'yyyy-MM-dd HH:mm')}"></span>
            </div>

            <form method="post" th:action="@{/member/orders/submitReview}">
                <input type="hidden" name="orderId" th:value="${orders.orderId}">

                <div class="field">
                    <label>評分</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5"
                               th:checked="${orders.rating != null ? orders.rating == 5 : true}"><label for="star5">★</label>
                        <input type="radio" id="star4" name="rating" value="4"
                               th:checked="${orders.rating != null and orders.rating == 4}"><label for="star4">★</label>
                        <input type="radio" id="star3" name="rating" value="3"
                               th:checked="${orders.rating != null and orders.rating == 3}"><label for="star3">★</label>
                        <input type="radio" id="star2" name="rating" value="2"
                               th:checked="${orders.rating != null and orders.rating == 2}"><label for="star2">★</label>
                        <input type="radio" id="star1" name="rating" value="1"
                               th:checked="${orders.rating != null and orders.rating == 1}"><label for="star1">★</label>
                    </div>
                </div>

                <div class="field">
                    <label>心得內容</label>
                    <textarea name="reviewContent" th:text="${orders.reviewContent}"></textarea>
                </div>

                <button type="submit" class="btn btn-primary review-submit">送出評論</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: backToTop}"></div>
<script src="/js/nav.js"></script>
</body>
</html>
