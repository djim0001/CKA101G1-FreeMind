<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>預約諮商</title>
</head>
<body>
	<h3>查詢可預約時段</h3>

	<span style="color: red;" th:if="${errorMessage != null}"
		th:text="${errorMessage}"></span>
	<br>

	<form method="post" th:action="@{/member/orders/bookLookup}">
		心理師： <select name="psychId">
			<option value="">請選擇心理師</option>
			<option th:each="p : ${psychologistsList}" th:value="${p.psychId}"
				th:text="${p.psychId} + ' - ' + ${p.name}"
				th:selected="${selectedPsychId != null and selectedPsychId == #strings.toString(p.psychId)}"></option>
		</select><br> 預約日期：<input type="date" name="slotDate"
			th:min="${todayDate}"><br> <input type="submit"
			value="查詢可預約時段">
	</form>

</body>
</html>
