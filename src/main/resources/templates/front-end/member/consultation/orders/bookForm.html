<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>預約諮商</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
    .book-section { padding: 3.5rem 0 6rem; }
    .book-head { text-align: center; margin-bottom: 2.2rem; }
    .book-head .eyebrow { display: block; margin-bottom: .6rem; }
    .book-head h1 { font-family: var(--serif); font-size: 1.9rem; color: var(--ink); margin: 0; }
    .book-head p { color: var(--ink-soft); margin: .5rem 0 0; font-size: .95rem; }

    .book-card {
        max-width: 560px; margin: 0 auto;
        background: var(--white); border: 1px solid var(--line);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
        padding: 2.6rem 2.4rem;
    }

    .book-error {
        background: var(--pink-soft); color: var(--orange-deep);
        font-size: .88rem; padding: .75rem 1.1rem; border-radius: var(--radius-md);
        margin-bottom: 1.3rem;
    }

    .book-field { margin-bottom: 1.4rem; }
    .book-field label {
        display: block; font-size: .85rem; font-weight: 500;
        color: var(--ink-soft); margin-bottom: .5rem;
    }
    .book-field select, .book-field input[type="date"] {
        width: 100%; padding: .8rem 1rem;
        border: 1.6px solid var(--line); border-radius: var(--radius-md);
        font-family: var(--sans); font-size: .95rem; color: var(--ink);
        background: var(--bg-warm);
        transition: border-color .2s;
    }
    .book-field select:focus, .book-field input[type="date"]:focus {
        outline: none; border-color: var(--orange);
    }

    .book-submit { width: 100%; justify-content: center; margin-top: .4rem; border: none; }
</style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="book-section">
    <div class="wrap">
        <div class="book-head">
            <span class="eyebrow">Consultation Booking</span>
            <h1>查詢可預約時段</h1>
            <p>選擇心理師與日期，找到最適合你的時間</p>
        </div>

        <div class="book-card">
            <div class="book-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

            <form method="post" th:action="@{/member/orders/bookLookup}">
                <div class="book-field">
                    <label>心理師</label>
                    <select name="psychId">
                        <option value="">請選擇心理師</option>
                        <option th:each="p : ${psychologistsList}" th:value="${p.psychId}"
                            th:text="${p.psychId} + ' - ' + ${p.name}"
                            th:selected="${selectedPsychId != null and selectedPsychId == #strings.toString(p.psychId)}"></option>
                    </select>
                </div>

                <div class="book-field">
                    <label>預約日期</label>
                    <input type="date" name="slotDate" th:min="${todayDate}">
                </div>

                <button type="submit" class="btn btn-primary book-submit">查詢可預約時段</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: backToTop}"></div>
<script src="/js/nav.js"></script>
</body>
</html>
