<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>選擇時段並填寫預約資料</title>
<style>
* {
	box-sizing: border-box;
}

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
	background-color: #f5f5f5;
	margin: 0;
	padding: 40px 20px;
	color: #333;
}

.card {
	max-width: 560px;
	margin: 0 auto;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	padding: 36px 40px;
}

h3 {
	font-size: 22px;
	color: #4a3e3e;
	margin: 0 0 20px;
	padding-bottom: 14px;
	border-bottom: 2px solid #e8b4b4;
}

.error-msg {
	background: #fbeaea;
	color: #c62828;
	font-size: 14px;
	padding: 10px 14px;
	border-radius: 6px;
	margin-bottom: 16px;
}

.info-row {
	margin-bottom: 8px;
	font-size: 14px;
}

.info-row .label {
	font-weight: 600;
	color: #7a6b6b;
	margin-right: 6px;
}

form {
	margin-top: 20px;
}

.field {
	margin-bottom: 18px;
}

.field label {
	display: block;
	font-size: 13px;
	font-weight: 600;
	color: #7a6b6b;
	margin-bottom: 6px;
}

select, textarea {
	width: 100%;
	padding: 8px 10px;
	border: 1px solid #e0d5d5;
	border-radius: 6px;
	font-family: inherit;
	font-size: 14px;
	color: #333;
}

textarea {
	height: 90px;
	resize: none;
}

select:focus, textarea:focus {
	outline: none;
	border-color: #e8b4b4;
}

input[type="submit"] {
	display: block;
	width: 100%;
	margin-top: 8px;
	padding: 12px 0;
	background-color: #e8b4b4;
	color: #fff;
	border: none;
	border-radius: 6px;
	font-size: 15px;
	font-weight: 600;
	cursor: pointer;
	transition: background-color 0.2s;
}

input[type="submit"]:hover {
	background-color: #d39393;
}
</style>
</head>
<body>
	<div class="card">
		<h3>選擇時段並填寫預約資料</h3>

		<div class="error-msg" th:if="${errorMessage != null}"
			th:text="${errorMessage}"></div>

		<div class="info-row">
			<span class="label">心理師編號：</span><span
				th:text="${slots.psychologist.psychId}"></span>
		</div>
		<div class="info-row">
			<span class="label">心理師姓名：</span><span th:text="${psychologist.name}"></span>
		</div>
		<div class="info-row">
			<span class="label">日期：</span><span th:text="${slots.slotDate}"></span>
		</div>
		<div class="info-row">
			<span class="label">心理師工作地點：</span><span
				th:text="${psychologist.psychLoc}"></span>
		</div>
		<div class="info-row">
			<span class="label">諮詢費：</span><span
				th:text="'NT$ ' + ${psychologist.psychFee}"></span>
		</div>

		<form method="post" th:action="@{/member/orders/bookSubmit}">
			<input type="hidden" name="timeslotId" th:value="${slots.timeslotId}">
			<input type="hidden" name="psychId"
				th:value="${slots.psychologist.psychId}"> <input
				type="hidden" name="psychLoc" th:value="${psychologist.psychLoc}">
			<input type="hidden" name="psychFee"
				th:value="${psychologist.psychFee}">

			<div class="field">
				<label>可預約時段</label> <select name="hour">
					<option th:each="h : ${availableHours}" th:value="${h}"
						th:text="${h} + ':00 - ' + ${h + 1} + ':00'"></option>
				</select>
			</div>

			<div class="field">
				<label>來訪目的</label> <select name="visitPurpose">
					<option value="emotion">情緒困擾</option>
					<option value="stress">壓力調適</option>
					<option value="relationship">人際關係</option>
					<option value="family">家庭問題</option>
					<option value="career">職涯困惑</option>
					<option value="academic">課業壓力</option>
					<option value="self_growth">自我探索</option>
					<option value="sleep">睡眠問題</option>
					<option value="anxiety">焦慮傾向</option>
					<option value="other">其他</option>
				</select>
			</div>

			<div class="field">
				<label>來訪目的備註</label>
				<textarea name="visitPurposeNote"></textarea>
			</div>

			<div class="field">
				<label>諮商參與形式</label> <select name="sessionType">
					<option value="0">單人諮商</option>
					<option value="1">伴侶諮商</option>
					<option value="2">家庭諮商</option>
					<option value="3">團體諮商</option>
				</select>
			</div>

			<input type="submit" value="送出預約"
				th:if="${not #lists.isEmpty(availableHours)}">
			<p th:if="${#lists.isEmpty(availableHours)}"
				style="text-align: center; color: #c62828; font-size: 14px; margin-top: 8px;">
				此日已無可預約時段，請返回重新選擇其他日期。</p>
		</form>
	</div>
</body>
</html>
