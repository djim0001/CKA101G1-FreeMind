<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選擇時段並填寫預約資料</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
    .booking-section { padding: 3.5rem 0 6rem; }

    .booking-card {
        max-width: 600px; margin: 0 auto;
        background: var(--white); border: 1px solid var(--line);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
        padding: 2.6rem 2.4rem;
    }

    .booking-card h3 {
        font-family: var(--serif); font-size: 1.5rem; color: var(--ink);
        margin: 0 0 1.4rem; padding-bottom: 1rem; border-bottom: 2px solid var(--pink);
    }

    .booking-error {
        background: var(--pink-soft); color: var(--orange-deep);
        font-size: .88rem; padding: .75rem 1.1rem; border-radius: var(--radius-md);
        margin-bottom: 1.2rem;
    }

    .booking-info { background: var(--bg-warm); border-radius: var(--radius-md); padding: 1.2rem 1.4rem; margin-bottom: 1.6rem; }
    .info-row { margin-bottom: .45rem; font-size: .92rem; color: var(--ink); }
    .info-row:last-child { margin-bottom: 0; }
    .info-row .label { font-weight: 700; color: var(--ink-soft); margin-right: .4rem; }

    .field { margin-bottom: 1.3rem; }
    .field label {
        display: block; font-size: .85rem; font-weight: 500;
        color: var(--ink-soft); margin-bottom: .5rem;
    }
    .field select, .field textarea {
        width: 100%; padding: .8rem 1rem;
        border: 1.6px solid var(--line); border-radius: var(--radius-md);
        font-family: var(--sans); font-size: .95rem; color: var(--ink);
        background: var(--bg-warm);
        transition: border-color .2s;
    }
    .field textarea { height: 100px; resize: none; }
    .field select:focus, .field textarea:focus { outline: none; border-color: var(--orange); }

    .booking-submit { width: 100%; justify-content: center; border: none; margin-top: .4rem; }
    .booking-empty { text-align: center; color: var(--orange-deep); font-size: .9rem; margin-top: 1rem; }
</style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="booking-section">
    <div class="wrap">
        <div class="booking-card">
            <h3>選擇時段並填寫預約資料</h3>

            <div class="booking-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

            <div class="booking-info">
                <div class="info-row"><span class="label">心理師編號：</span><span th:text="${slots.psychologist.psychId}"></span></div>
                <div class="info-row"><span class="label">心理師姓名：</span><span th:text="${psychologist.name}"></span></div>
                <div class="info-row"><span class="label">日期：</span><span th:text="${slots.slotDate}"></span></div>
                <div class="info-row"><span class="label">心理師工作地點：</span><span th:text="${psychologist.psychLoc}"></span></div>
                <div class="info-row"><span class="label">諮詢費：</span><span th:text="'NT$ ' + ${psychologist.psychFee}"></span></div>
            </div>

            <form method="post" th:action="@{/member/orders/bookSubmit}">
                <input type="hidden" name="timeslotId" th:value="${slots.timeslotId}">
                <input type="hidden" name="psychId" th:value="${slots.psychologist.psychId}">
                <input type="hidden" name="psychLoc" th:value="${psychologist.psychLoc}">
                <input type="hidden" name="psychFee" th:value="${psychologist.psychFee}">

                <div class="field">
                    <label>可預約時段</label>
                    <select name="hour">
                        <option th:each="h : ${availableHours}" th:value="${h}"
                            th:text="${h} + ':00 - ' + ${h + 1} + ':00'"></option>
                    </select>
                </div>

                <div class="field">
                    <label>來訪目的</label>
                    <select name="visitPurpose">
                        <option value="emotion">情緒困擾</option>
                        <option value="stress">壓力調適</option>
                        <option value="relationship">人際關係</option>
                        <option value="family">家庭問題</option>
                        <option value="career">職涯困惑</option>
                        <option value="academic">課業壓力</option>
                        <option value="self_growth">自我探索</option>
                        <option value="sleep">睡眠問題</option>
                        <option value="anxiety">焦慮傾向</option>
                        <option value="other">其他</option>
                    </select>
                </div>

                <div class="field">
                    <label>來訪目的備註</label>
                    <textarea name="visitPurposeNote"></textarea>
                </div>

                <div class="field">
                    <label>諮商參與形式</label>
                    <select name="sessionType">
                        <option value="0">單人諮商</option>
                        <option value="1">伴侶諮商</option>
                        <option value="2">家庭諮商</option>
                        <option value="3">團體諮商</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary booking-submit" th:if="${not #lists.isEmpty(availableHours)}">送出預約</button>
                <p class="booking-empty" th:if="${#lists.isEmpty(availableHours)}">此日已無可預約時段，請返回重新選擇其他日期。</p>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: backToTop}"></div>
<script src="/js/nav.js"></script>
</body>
</html>
