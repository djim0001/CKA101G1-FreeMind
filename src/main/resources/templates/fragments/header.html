<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="nav" th:fragment="header">
	<div class="wrap nav-inner">
		<a class="brand" th:href="@{/}" href="/">
			<span class="logo-mind" aria-hidden="true">
				<span class="word">
					<span class="m">m</span><span class="i">i</span><span class="n">n</span><span class="d">d</span>
				</span>
				<span class="faces">
					<svg class="fm" viewBox="0 0 24 11"><g stroke="#B8813A" stroke-width="1.6" stroke-linecap="round" fill="none"><circle cx="8" cy="3.5" r="1" fill="#B8813A" stroke="none"/><circle cx="16" cy="3.5" r="1" fill="#B8813A" stroke="none"/><path d="M8 7 c2.4 2.4 5.6 2.4 8 0"/></g></svg>
					<svg class="fi" viewBox="0 0 9 11"><g stroke="#A85974" stroke-width="1.5" stroke-linecap="round" fill="none"><circle cx="4.5" cy="8" r="1.6"/></g></svg>
					<svg class="fn" viewBox="0 0 17 11"><g stroke="#4F7B96" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M5.5 7.5 l6 0"/></g></svg>
					<svg class="fd" viewBox="0 0 17 11"><g stroke="#5A7A57" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M4 4 c1 -1.6 2.6 -1.6 3.6 0"/><path d="M9.4 4 c1 -1.6 2.6 -1.6 3.6 0"/></g></svg>
				</span>
			</span>
			<span class="brand-text">
				<span class="logo">諮由自在</span>
				<span class="en">Free&nbsp;Mind</span>
			</span>
		</a>

		<nav class="nav-menu" aria-label="主選單">
			<a th:href="@{/search}" href="#">諮商預約</a>
			<a th:href="@{/member/course/select_course}" href="#">課程商城</a>
			<a th:href="@{/article}" href="#">專欄文章</a>
			<a th:href="@{/member/activity/listActivities_ByCompositeQuery}" href="#">揪團活動</a>
		</nav>

		<div class="nav-right">
			<!-- 未登入：鈴鐺直接連到通知頁，Spring Security 導向登入頁 -->
			<a class="icon-btn" sec:authorize="isAnonymous()"
				th:href="@{/member/notice}" href="#" aria-label="會員通知">
				<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
					<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
					<path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg>
			</a>

			<!-- 已登入（會員或心理師）：鈴鐺展開下拉通知 -->
			<div class="pop-holder" sec:authorize="isAuthenticated()">
				<button class="icon-btn" id="bellBtn" aria-label="會員通知" aria-haspopup="true" aria-expanded="false">
					<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
						<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
						<path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg>
					<span class="dot" th:if="${unreadCount != null and unreadCount > 0}" aria-hidden="true"></span>
				</button>
				<div class="pop" id="bellPop" role="menu">
					<div class="pop-head">
						<b>通知</b>
						<p th:if="${unreadCount != null}"
						   th:text="${unreadCount > 0} ? '你有 ' + ${unreadCount} + ' 則未讀訊息' : '目前沒有未讀訊息'">你有 2 則新的訊息</p>
						<p th:unless="${unreadCount != null}">查看你的最新通知</p>
					</div>
					<div class="pop-divider"></div>

					<!-- 只有在該頁的 Controller 有放 notices 進 model 時才顯示清單（例如 /member/notice、/psych/notice） -->
					<div class="noti-item" role="menuitem" th:if="${recentNotices != null}" th:each="n : ${recentNotices}">
						<b th:text="${n.noticeTypeMsg}">預約通知</b>
						<p th:text="${n.noticeContent}">通知內容</p>
						<time th:text="${#dates.format(n.createdAt, 'yyyy/MM/dd HH:mm')}">2 小時前</time>
					</div>
					<div class="noti-item" th:if="${recentNotices == null}">
						<p>點擊下方查看你的通知</p>
					</div>
					<div class="noti-item" th:if="${recentNotices != null and #lists.isEmpty(recentNotices)}">
						<p>目前沒有新通知</p>
					</div>

					<div class="pop-divider"></div>
					<a class="pop-item" sec:authorize="hasRole('ROLE_PSYCH')" th:href="@{/psych/notice}" href="#"
						style="justify-content: center; color: var(--orange); font-weight: 500;">查看全部通知</a>
					<a class="pop-item" sec:authorize="hasRole('ROLE_MEMBER')" th:href="@{/member/notice}" href="#"
						style="justify-content: center; color: var(--orange); font-weight: 500;">查看全部通知</a>
				</div>
			</div>

			<!-- 頭貼：登入 / 會員面板 -->
			<div class="pop-holder">
				<button class="avatar-btn" id="avatarBtn" aria-label="會員選單" aria-haspopup="true" aria-expanded="false">
					<svg viewBox="0 0 24 24" fill="none">
						<circle cx="12" cy="9" r="3.4" fill="#3A4B53" />
						<path d="M5.5 19c.7-3.2 3.3-4.6 6.5-4.6S17.8 15.8 18.5 19"
							stroke="#3A4B53" stroke-width="1.8" stroke-linecap="round" /></svg>
				</button>
				<div class="pop" id="avatarPop" role="menu">
					<div class="pop-head">
						<b>歡迎回來！</b>
						<p>登入後，開始你的療癒足跡</p>
					</div>

					<!-- 未登入：只顯示登入入口 -->
					<div class="pop-login" sec:authorize="isAnonymous()">
						<a class="m" th:href="@{/front-end/login}" href="#">會員登入</a>
						<a class="p" th:href="@{/psych/psychologistLogin}" href="#">心理師登入</a>
					</div>

					<!-- 登入後顯示：我的專區 + 聯繫客服 -->
					<div sec:authorize="isAuthenticated()">
						<div class="pop-divider"></div>
						<div class="pop-label">我的專區</div>

						<!-- 個人檔案 / 專業檔案 -->
						<a class="pop-item" sec:authorize="hasRole('ROLE_MEMBER')" th:href="@{/member/profile}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
								<circle cx="12" cy="8" r="3.2" />
								<path d="M6 19c.6-3 3-4.5 6-4.5S17.4 16 18 19" /></svg>個人檔案</a>
						<a class="pop-item" sec:authorize="hasRole('ROLE_PSYCH')" th:href="@{/psych/profile}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
								<circle cx="12" cy="8" r="3.2" />
								<path d="M6 19c.6-3 3-4.5 6-4.5S17.4 16 18 19" /></svg>專業檔案</a>

						<!-- 我的通知 -->
						<a class="pop-item" sec:authorize="hasRole('ROLE_PSYCH')" th:href="@{/psych/notice}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
								<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
								<path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg>我的通知</a>
						<a class="pop-item" sec:authorize="hasRole('ROLE_MEMBER')" th:href="@{/member/notice}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
								<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
								<path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg>我的通知</a>

						<!-- 會員：我的療癒足跡 / 心理師：預約管理 -->
						<a class="pop-item" sec:authorize="hasRole('ROLE_MEMBER')" th:href="@{/member/dashboard}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
								<path d="M12 20c-1-3.5-5.5-4.5-5.5-9a5.5 5.5 0 0 1 11 0c0 4.5-4.5 5.5-5.5 9Z" /></svg>我的療癒足跡</a>
						<a class="pop-item" sec:authorize="hasRole('ROLE_PSYCH')" th:href="@{/psych/orders/home}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
								<path d="M12 20c-1-3.5-5.5-4.5-5.5-9a5.5 5.5 0 0 1 11 0c0 4.5-4.5 5.5-5.5 9Z" /></svg>預約管理</a>

						<!-- 會員：課程訂單紀錄 / 心理師：課程管理 -->
						<a class="pop-item" sec:authorize="hasRole('ROLE_MEMBER')" th:href="@{/member/course/my_course_order}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
								<path d="M6 4h12l-1 4H7L6 4Z" />
								<path d="M5 8h14v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8Z" /></svg>課程訂單紀錄</a>
						<a class="pop-item" sec:authorize="hasRole('ROLE_PSYCH')" th:href="@{/psych/course/select_course}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
								<path d="M6 4h12l-1 4H7L6 4Z" />
								<path d="M5 8h14v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8Z" /></svg>課程管理</a>

						<!-- 會員：我的優惠券 / 心理師：文章管理 -->
						<a class="pop-item" sec:authorize="hasRole('ROLE_MEMBER')" th:href="@{/member/coupon/my_coupon}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
								<path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 2 2 0 0 0 0-4Z" />
								<path d="M14 6v12" stroke-dasharray="2 2" /></svg>我的優惠券</a>
						<a class="pop-item" sec:authorize="hasRole('ROLE_PSYCH')" th:href="@{/psych/article/myArticles}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
								<path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 2 2 0 0 0 0-4Z" />
								<path d="M14 6v12" stroke-dasharray="2 2" /></svg>文章管理</a>

						<div class="pop-divider"></div>
						<a class="pop-item" th:href="@{/support}" href="#" role="menuitem">
							<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
								<path d="M21 12a9 9 0 1 0-3.6 7.2L21 20l-.8-3.4A8.9 8.9 0 0 0 21 12Z" /></svg>聯繫客服</a>

						<!-- 登出：依角色送到各自的 logoutUrl（POST，Thymeleaf 會自動帶 CSRF） -->
						<div class="pop-divider"></div>
						<form sec:authorize="hasRole('ROLE_MEMBER')" th:action="@{/front-end/logout}" method="post">
							<button class="pop-item pop-logout" type="submit" role="menuitem">
								<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
									<path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3" />
									<path d="M16 17l5-5-5-5" />
									<path d="M21 12H9" /></svg>登出</button>
						</form>
						<form sec:authorize="hasRole('ROLE_PSYCH')" th:action="@{/psych/logout}" method="post">
							<button class="pop-item pop-logout" type="submit" role="menuitem">
								<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
									<path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3" />
									<path d="M16 17l5-5-5-5" />
									<path d="M21 12H9" /></svg>登出</button>
						</form>
					</div>
				</div>
			</div>

			<button class="icon-btn hamburger" id="hambBtn" aria-label="開啟選單">
				<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
					<path d="M4 7h16M4 12h16M4 17h16" /></svg>
			</button>
		</div>
	</div>

	<nav class="mobile-menu" id="mobileMenu" aria-label="行動選單">
		<a th:href="@{/search}" href="#">諮商預約</a>
		<a th:href="@{/member/course/select_course}" href="#">課程商城</a>
		<a th:href="@{/article}" href="#">專欄文章</a>
		<a th:href="@{/member/activity/activityIndex}" href="#">揪團活動</a>
	</nav>
</header>

</body>
</html>
