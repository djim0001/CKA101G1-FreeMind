<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<body>

	<!--
		管理員共用頁首。
		用法：<div th:replace="~{fragments/adminHeader :: header}"></div>
		「系統管理後台」為 admin_home.html 專屬文字，不放入共用 Fragment。
	-->
	<th:block th:fragment="header">
		<style data-admin-fragment-styles="header">
			@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

			@font-face {
				font-family: 'OpenHuninn';
				src:
					url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff') format('woff'),
					url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf') format('truetype');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}

			.admin-skip-link,
			.admin-site-header,
			.admin-site-header *,
			.admin-site-header *::before,
			.admin-site-header *::after {
				box-sizing: border-box;
			}

			.admin-skip-link {
				position: fixed;
				top: .75rem;
				left: .75rem;
				z-index: 999;
				padding: .65rem 1rem;
				border-radius: 999px;
				color: #FFFFFF;
				background: #F58E6B;
				font-family: "Noto Sans TC", system-ui, sans-serif;
				font-size: 1rem;
				line-height: 1.78;
				text-decoration: none;
				transform: translateY(-160%);
			}

			.admin-skip-link:focus {
				transform: translateY(0);
			}

			header.admin-site-header {
				--admin-bg-soothing: #C2D9ED;
				--admin-blue-soft: #DCEAF5;
				--admin-orange: #F58E6B;
				--admin-orange-deep: #E5764F;
				--admin-pink: #FBD0BE;
				--admin-ink: #3A4B53;
				--admin-ink-soft: #6b7981;
				--admin-white: #FFFFFF;
				--admin-line: #ecdfce;
				--admin-shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
				--admin-zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
				--admin-sans: "Noto Sans TC", system-ui, sans-serif;
				--admin-display-en: "Baloo 2", sans-serif;
				position: sticky;
				top: 0;
				z-index: 100;
				width: 100%;
				margin: 0;
				padding: 0;
				border-bottom: 1px solid rgba(236, 223, 206, .7);
				color: var(--admin-ink);
				background: rgba(253, 246, 237, .85);
				font-family: var(--admin-sans);
				line-height: 1.78;
				-webkit-font-smoothing: antialiased;
				backdrop-filter: blur(12px);
			}

			.admin-site-header a {
				color: inherit;
				text-decoration: none;
			}

			.admin-site-header button {
				margin: 0;
				border: 0;
				background: none;
				font-family: inherit;
				cursor: pointer;
			}

			.admin-site-header img,
			.admin-site-header svg {
				display: block;
				max-width: 100%;
			}

			.admin-site-header .admin-header-inner {
				display: flex;
				align-items: center;
				gap: 1.4rem;
				width: min(1160px, 92vw);
				height: 74px;
				margin-inline: auto;
			}

			.admin-site-header .admin-header-brand {
				display: flex;
				align-items: center;
				gap: .8rem;
				flex: 0 0 auto;
				margin: 0;
				padding: 0;
			}

			.admin-site-header .admin-header-logo-mind {
				display: flex;
				flex: 0 0 auto;
				flex-direction: column;
				align-items: flex-start;
				line-height: 1;
				user-select: none;
			}

			.admin-site-header .admin-header-logo-mind .word {
				display: flex;
				align-items: flex-end;
			}

			.admin-site-header .admin-header-logo-mind .word span {
				display: inline-block;
				font-family: var(--admin-display-en);
				font-size: 1.5rem;
				font-weight: 700;
				letter-spacing: -.03em;
				text-align: center;
			}

			.admin-site-header .admin-header-logo-mind .word .m {
				width: 24px;
				color: #EFB65E;
			}

			.admin-site-header .admin-header-logo-mind .word .i {
				width: 9px;
				color: #DB93A9;
			}

			.admin-site-header .admin-header-logo-mind .word .n {
				width: 17px;
				color: #8FB2C9;
			}

			.admin-site-header .admin-header-logo-mind .word .d {
				width: 17px;
				color: #9BB893;
			}

			.admin-site-header .admin-header-logo-mind .faces {
				display: flex;
				align-items: flex-start;
				margin-top: -1px;
			}

			.admin-site-header .admin-header-logo-mind .faces svg {
				display: block;
			}

			.admin-site-header .admin-header-logo-mind .faces .fm {
				width: 24px;
				height: 11px;
			}

			.admin-site-header .admin-header-logo-mind .faces .fi {
				width: 9px;
				height: 11px;
			}

			.admin-site-header .admin-header-logo-mind .faces .fn {
				width: 17px;
				height: 11px;
			}

			.admin-site-header .admin-header-logo-mind .faces .fd {
				width: 17px;
				height: 11px;
			}

			.admin-site-header .admin-header-brand-text {
				display: flex;
				flex-direction: column;
				line-height: 1.15;
			}

			.admin-site-header .admin-header-brand-text .logo {
				color: var(--admin-ink);
				font-family: var(--admin-zen-maru);
				font-size: 1.18rem;
				font-weight: 700;
				letter-spacing: .02em;
			}

			.admin-site-header .admin-header-brand-text .en {
				margin-top: .15em;
				color: var(--admin-ink-soft);
				font-family: var(--admin-display-en);
				font-size: .85rem;
				font-weight: 700;
				letter-spacing: .24em;
				text-transform: uppercase;
			}

			.admin-site-header .admin-header-actions {
				display: flex;
				align-items: center;
				gap: .55rem;
				margin-left: auto;
			}

			.admin-site-header .admin-profile-entry {
				display: flex;
				align-items: center;
				gap: .65rem;
				min-height: 46px;
				margin: 0;
				padding: .3rem .75rem .3rem .35rem;
				border: 1px solid var(--admin-line);
				border-radius: 999px;
				background: var(--admin-white);
				box-shadow: var(--admin-shadow-sm);
				transition: border-color .16s ease, background .16s ease, transform .16s ease;
			}

			.admin-site-header .admin-profile-entry:hover {
				border-color: var(--admin-bg-soothing);
				background: var(--admin-blue-soft);
				transform: translateY(-2px);
			}

			.admin-site-header .admin-profile-photo {
				display: grid;
				place-items: center;
				width: 36px;
				height: 36px;
				flex: 0 0 auto;
				overflow: hidden;
				border-radius: 50%;
				color: var(--admin-ink);
				background: linear-gradient(135deg, var(--admin-pink), var(--admin-bg-soothing));
			}

			.admin-site-header .admin-profile-photo svg {
				width: 21px;
				height: 21px;
				stroke: currentColor;
			}

			.admin-site-header .admin-profile-photo img {
				display: block;
				width: 100%;
				height: 100%;
				border-radius: inherit;
				object-fit: cover;
			}

			.admin-site-header .admin-profile-copy {
				display: flex;
				min-width: 0;
				flex-direction: column;
				line-height: 1.25;
			}

			.admin-site-header .admin-profile-copy small {
				color: var(--admin-ink-soft);
				font-size: .68rem;
			}

			.admin-site-header .admin-profile-copy strong {
				max-width: 9.5rem;
				overflow: hidden;
				color: var(--admin-ink);
				font-size: .82rem;
				font-weight: 500;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.admin-site-header .admin-logout-form {
				margin: 0;
			}

			.admin-site-header .admin-logout-button {
				display: inline-flex;
				align-items: center;
				gap: .4rem;
				min-height: 46px;
				padding: .6rem .8rem;
				border: 1px solid var(--admin-line);
				border-radius: 999px;
				color: var(--admin-ink);
				background: var(--admin-white);
				box-shadow: var(--admin-shadow-sm);
				cursor: pointer;
				transition: border-color .16s ease, background .16s ease, color .16s ease, transform .16s ease;
			}

			.admin-site-header .admin-logout-button:hover {
				border-color: var(--admin-orange);
				color: var(--admin-white);
				background: var(--admin-orange-deep);
				transform: translateY(-2px);
			}

			.admin-site-header .admin-logout-button svg {
				width: 17px;
				height: 17px;
				stroke: currentColor;
			}

			.admin-site-header :focus-visible {
				outline: 3px solid var(--admin-orange);
				outline-offset: 3px;
			}

			@media (max-width: 940px) {
				.admin-site-header .admin-profile-copy {
					display: none;
				}

				.admin-site-header .admin-profile-entry {
					padding: .28rem;
				}
			}

			@media (max-width: 640px) {
				.admin-site-header .admin-header-inner {
					gap: .55rem;
					height: 64px;
				}

				.admin-site-header .admin-logout-button span {
					display: none;
				}

				.admin-site-header .admin-logout-button {
					display: grid;
					place-items: center;
					width: 42px;
					min-height: 42px;
					padding: 0;
				}

				.admin-site-header .admin-profile-photo {
					width: 34px;
					height: 34px;
				}
			}

			@media (max-width: 430px) {
				.admin-site-header .admin-profile-entry {
					display: none;
				}

				.admin-site-header .admin-header-actions {
					gap: .35rem;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.admin-skip-link,
				.admin-site-header,
				.admin-site-header * {
					transition: none !important;
				}
			}
		</style>

		<a class="skip-link admin-skip-link" href="#main-content">跳至主要內容</a>

		<header class="nav site-header admin-site-header">
			<div class="wrap nav-inner admin-header-inner">
				<a class="brand admin-header-brand" th:href="@{/admin/home}" href="#main-content"
					aria-label="諮由自在後台管理首頁">
					<span class="logo-mind admin-header-logo-mind" aria-hidden="true">
						<span class="word">
							<span class="m">m</span><span class="i">i</span><span class="n">n</span><span class="d">d</span>
						</span>
						<span class="faces">
							<svg class="fm" viewBox="0 0 24 11">
								<g stroke="#B8813A" stroke-width="1.6" stroke-linecap="round" fill="none">
									<circle cx="8" cy="3.5" r="1" fill="#B8813A" stroke="none" />
									<circle cx="16" cy="3.5" r="1" fill="#B8813A" stroke="none" />
									<path d="M8 7 c2.4 2.4 5.6 2.4 8 0" />
								</g>
							</svg>
							<svg class="fi" viewBox="0 0 9 11">
								<g stroke="#A85974" stroke-width="1.5" stroke-linecap="round" fill="none">
									<circle cx="4.5" cy="8" r="1.6" />
								</g>
							</svg>
							<svg class="fn" viewBox="0 0 17 11">
								<g stroke="#4F7B96" stroke-width="1.6" stroke-linecap="round" fill="none">
									<path d="M5.5 7.5 l6 0" />
								</g>
							</svg>
							<svg class="fd" viewBox="0 0 17 11">
								<g stroke="#5A7A57" stroke-width="1.6" stroke-linecap="round" fill="none">
									<path d="M4 4 c1 -1.6 2.6 -1.6 3.6 0" />
									<path d="M9.4 4 c1 -1.6 2.6 -1.6 3.6 0" />
								</g>
							</svg>
						</span>
					</span>
					<span class="brand-text admin-header-brand-text">
						<span class="logo">諮由自在</span>
						<span class="en">Free&nbsp;Mind</span>
					</span>
				</a>

				<div class="nav-actions admin-header-actions">
					<a class="profile-entry admin-profile-entry" th:href="@{/admin/select_page}"
						aria-label="前往管理員檔案">
						<span class="profile-photo admin-profile-photo" aria-hidden="true" th:if="admin!=null">
<!-- 							<img class="photo-thumb" -->
<!-- 								th:src="@{/admin/DBGifReader} + '?adminId=' + ${admin.adminId}" -->
<!-- 								alt="管理員照片" /> -->
						</span>
						<span class="profile-copy admin-profile-copy">
							<small
								th:text="${admin != null ? admin.adminAccount : '管理員帳號'}">管理員帳號</small>
							<strong
								th:text="${admin != null ? admin.name : '尚未登入'}">尚未登入</strong>
						</span>
					</a>

					<form class="logout-form admin-logout-form" th:action="@{/back-end/logout}"
						method="post">
						<button class="logout-button admin-logout-button" type="submit"
							aria-label="登出後台">
							<svg viewBox="0 0 24 24" fill="none"
								aria-hidden="true">
								<path
									d="M14 8l4 4-4 4M18 12H8M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"
									stroke-width="1.8" stroke-linecap="round"
									stroke-linejoin="round" />
							</svg>
							<span>登出</span>
						</button>
					</form>
				</div>
			</div>
		</header>
	</th:block>

</body>
</html>
