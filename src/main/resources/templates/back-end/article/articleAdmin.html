<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>專欄文章管理｜管理後台</title>
<link rel="stylesheet" th:href="@{/css/course/style.css}" />
<link rel="stylesheet" th:href="@{/css/course/admin.css}" />
<style>
.tab-panel .toolbar {
	display: flex;
	align-items: center;
	flex-wrap: nowrap;
	gap: 12px;
	width: 100%;
}
.tab-panel .toolbar input.field,
.tab-panel .toolbar select.field {
	width: auto !important;
}
.tab-panel .toolbar input[type="search"] {
	flex: 1 1 auto;
	min-width: 0;
}
.tab-panel .toolbar select.field {
	flex: 0 0 150px;
}
.tab-panel .toolbar button {
	flex: 0 0 auto;
	white-space: nowrap;
}
</style>
</head>
<body class="thy2-page">
	<div class="layout">
		<aside class="sidebar">
			<a class="brand" th:href="@{/}">諮由自在 Free Mind<small>ADMIN
					CONSOLE</small></a>
			<p class="nav-label">專欄文章管理</p>
			<nav class="nav">
				<a class="active" th:href="@{/admin/article}">文章總覽</a>
				<a th:href="@{/admin/article/pending}">待審核文章</a>
				<a th:href="@{/admin/article/reviewed}">已審核文章</a>
				<a th:href="@{/admin/article/categories}">文章分類管理</a>
				<a th:href="@{/}">返回後台管理</a>
			</nav>
		</aside>
		<div class="main">
			<header class="topbar">
				<span>後台管理／專欄文章</span>
				<div class="admin-id">
					<span class="avatar">管</span><b
						th:text="${admin != null ? admin.name : '系統管理員'}">系統管理員</b>
				</div>
			</header>
			<main class="content">
				<div class="page-head">
					<div>
						<h1>專欄文章管理</h1>
					</div>
				</div>
				<section class="tab-panel">
					<div class="toolbar">
						<input class="field" type="search" placeholder="搜尋文章或心理師……">
						<select class="field">
							<option>全部分類</option>
							<option th:each="cat : ${articleCats}"
								th:value="${cat.articleCatId}" th:text="${cat.articleCatName}"></option>
						</select>
						<select class="field">
							<option>全部狀態</option>
							<option th:each="entry : ${articleStatuses}"
								th:value="${entry.key}" th:text="${entry.value}"></option>
						</select>
						<select class="field">
							<option>申請時間新至舊</option>
							<option>申請時間舊至新</option>
						</select>
						<button class="btn secondary" type="button" data-toast="篩選功能開發中">篩選</button>
					</div>
					<div class="table-wrap">
						<table class="compact-table">
							<thead>
								<tr>
									<th>文章標題／心理師</th>
									<th>申請時間</th>
									<th>狀態</th>
									<th>審核操作</th>
								</tr>
							</thead>
							<tbody>
								<tr
									th:if="${articlePage == null || articlePage.content.isEmpty()}">
									<td class="empty-state" colspan="4">目前沒有文章資料</td>
								</tr>
								<tr th:each="article : ${articlePage.content}">
									<td><div class="course-summary">
											<strong th:text="${article.title}">文章標題</strong><span
												class="meta"> / <span
												th:text="${article.psychologist.name}">心理師</span></span>
										</div></td>
									<td><span th:if="${article.submittedAt != null}"
										th:text="${#temporals.format(article.submittedAt,'yyyy/MM/dd HH:mm')}">申請時間</span><span
										th:unless="${article.submittedAt != null}">—</span></td>
									<td>
										<span class="status" th:switch="${article.articleStatus}">
											<span th:case="1">待審核</span>
											<span th:case="2">已上架</span>
											<span th:case="3">已退回</span>
											<span th:case="4">已下架</span>
											<span th:case="*">未知狀態</span>
										</span>
									</td>
									<td>
										<div class="inline-actions" th:switch="${article.articleStatus}">
											<form th:case="1" class="inline-form" method="get"
												th:action="@{/admin/article/{id}/review(id=${article.articleId})}">
												<button class="btn secondary" type="submit">審核</button>
											</form>
											<form th:case="2" class="inline-form" method="post"
												th:action="@{/admin/article/{id}/unpublish(id=${article.articleId})}"
												data-confirm-form="確定下架此文章？">
												<button class="btn danger" type="submit">下架</button>
											</form>
											<span th:case="*">—</span>
										</div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
					<div
						th:replace="~{fragments/pagination :: pagination(${currentPage}, ${articlePage.totalPages}, '/admin/article')}"></div>
				</section>
			</main>
		</div>
	</div>
</body>
</html>
