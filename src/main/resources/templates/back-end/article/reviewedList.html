<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="諮由自在 Free Mind 已審核文章列表" />
	<title>已審核文章｜諮由自在後台</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Caveat:wght@500;600;700&amp;family=Noto+Sans+TC:wght@300;400;500;700;900&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/index.css}" href="/css/index.css" />
<style>
		html { min-width: 320px; }
		body.admin-article-page {
			display: flex;
			min-width: 320px;
			min-height: 100vh;
			flex-direction: column;
			background: var(--bg-warm);
		}
		.skip-link {
			position: fixed;
			top: .75rem;
			left: .75rem;
			z-index: 999;
			padding: .65rem 1rem;
			border-radius: 999px;
			color: var(--white);
			background: var(--orange);
			transform: translateY(-160%);
		}
		.skip-link:focus { transform: translateY(0); }
		.site-header {
			position: sticky;
			top: 0;
			z-index: 100;
			border-bottom: 1px solid rgba(236, 223, 206, .7);
			color: var(--ink);
			background: rgba(253, 246, 237, .85);
			backdrop-filter: blur(12px);
		}
		.nav-inner {
			display: flex;
			align-items: center;
			gap: 1.4rem;
			height: 74px;
		}
		.brand {
			display: flex;
			align-items: center;
			gap: .8rem;
			flex: 0 0 auto;
		}
		.nav-actions {
			display: flex;
			align-items: center;
			gap: .55rem;
			margin-left: auto;
		}
		.profile-entry {
			display: flex;
			align-items: center;
			gap: .65rem;
			min-height: 46px;
			padding: .3rem .75rem .3rem .35rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: var(--white);
			box-shadow: var(--shadow-sm);
			transition: border-color .16s ease, background .16s ease, transform .16s ease;
		}
		.profile-entry:hover {
			border-color: var(--bg-soothing);
			background: var(--blue-soft);
			transform: translateY(-2px);
		}
		.profile-photo {
			display: grid;
			place-items: center;
			width: 36px;
			height: 36px;
			flex: 0 0 auto;
			border-radius: 50%;
			color: var(--ink);
			background: linear-gradient(135deg, var(--pink), var(--bg-soothing));
		}
		.profile-photo img { width: 100%; height: 100%; object-fit: cover; }
		.profile-photo svg { width: 21px; height: 21px; stroke: currentColor; }
		.profile-copy { display: flex; min-width: 0; flex-direction: column; line-height: 1.25; }
		.profile-copy small { color: var(--ink-soft); font-size: .68rem; }
		.profile-copy strong {
			max-width: 9.5rem;
			overflow: hidden;
			color: var(--ink);
			font-size: .82rem;
			font-weight: 500;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.logout-form { margin: 0; }
		.logout-button {
			display: inline-flex;
			align-items: center;
			gap: .4rem;
			min-height: 46px;
			padding: .6rem .8rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--ink);
			background: var(--white);
			box-shadow: var(--shadow-sm);
			cursor: pointer;
			transition: border-color .16s ease, background .16s ease, color .16s ease, transform .16s ease;
		}
		.logout-button:hover {
			border-color: var(--orange);
			color: var(--white);
			background: var(--orange-deep);
			transform: translateY(-2px);
		}
		.logout-button svg { width: 17px; height: 17px; stroke: currentColor; }
		.crumb { font-size: .84rem; color: var(--ink-soft); letter-spacing: .04em; margin-bottom: 1rem; }
		.crumb a:hover { color: var(--orange); }
		.crumb span { margin: 0 .45rem; opacity: .5; }
		.crumb .current { opacity: 1; color: var(--ink); }
		.admin-main {
			width: 100%;
			flex: 1;
			padding: clamp(1.5rem, 3vw, 2.5rem) 0 clamp(3.5rem, 6vw, 5rem);
		}
		.admin-wrap { width: min(1160px, 92vw); margin-inline: auto; }
		.admin-page-header {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 2rem;
			margin-bottom: 1.35rem;
			padding-bottom: 1.25rem;
			border-bottom: 1px solid var(--line);
		}
		.admin-kicker {
			display: block;
			margin-bottom: .3rem;
			color: var(--orange);
			font-size: .75rem;
			font-weight: 700;
			letter-spacing: .16em;
			text-transform: uppercase;
		}
		.admin-page-header h1 {
			margin: 0;
			color: var(--ink);
			font-family: var(--serif);
			font-size: clamp(1.75rem, 3vw, 2.35rem);
			line-height: 1.3;
		}
		.admin-page-header p {
			max-width: 32rem;
			margin: 0;
			color: var(--ink-soft);
			font-size: .92rem;
			text-align: right;
		}
		.admin-page-header-nav {
			display: flex;
			gap: .5rem;
			align-items: center;
		}
		.admin-page-header-nav a {
			display: inline-flex;
			align-items: center;
			padding: .45rem .95rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--ink-soft);
			background: var(--white);
			box-shadow: var(--shadow-sm);
			font-size: .85rem;
			font-weight: 700;
			transition: border-color .18s ease, color .18s ease, background .18s ease;
			white-space: nowrap;
		}
		.admin-page-header-nav a:hover {
			color: var(--orange);
			border-color: var(--orange);
		}
		.article-admin-nav {
			display: flex;
			gap: .55rem;
			margin-bottom: 1.35rem;
			overflow-x: auto;
			padding: .2rem .1rem .45rem;
			scrollbar-width: thin;
		}
		.article-admin-nav a {
			display: inline-flex;
			align-items: center;
			min-height: 42px;
			flex: 0 0 auto;
			padding: .55rem 1rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--ink-soft);
			background: var(--white);
			box-shadow: var(--shadow-sm);
			font-size: .88rem;
			font-weight: 700;
			transition: border-color .18s ease, color .18s ease, background .18s ease;
		}
		.article-admin-nav a:hover,
		.article-admin-nav a.active {
			border-color: var(--orange);
			color: var(--white);
			background: var(--orange);
		}
		.status-tabs {
			display: flex;
			gap: .45rem;
			margin-bottom: 1.25rem;
			overflow-x: auto;
			padding: .1rem .1rem .35rem;
			scrollbar-width: thin;
		}
		.status-tabs a {
			display: inline-flex;
			align-items: center;
			min-height: 38px;
			flex: 0 0 auto;
			padding: .45rem .85rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--ink-soft);
			background: var(--white);
			box-shadow: var(--shadow-sm);
			font-size: .84rem;
			font-weight: 600;
			transition: border-color .18s ease, color .18s ease, background .18s ease;
		}
		.status-tabs a:hover,
		.status-tabs a.active {
			border-color: var(--orange);
			color: var(--white);
			background: var(--orange);
		}
		.admin-panel {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-md);
		}
		.admin-panel-heading {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			min-height: 64px;
			padding: 1rem 1.25rem;
			border-bottom: 1px solid var(--line);
			background: linear-gradient(90deg, var(--pink-soft), var(--white) 48%, var(--blue-soft));
		}
		.admin-panel-heading h2 {
			margin: 0;
			color: var(--ink);
			font-family: var(--serif);
			font-size: 1.08rem;
		}
		.admin-panel-heading p { margin: 0; color: var(--ink-soft); font-size: .82rem; }
		.admin-panel-body { padding: 1.25rem; }
		.admin-toolbar {
			display: grid;
			grid-template-columns: minmax(220px, 1fr) repeat(3, minmax(130px, 170px)) auto;
			gap: .75rem;
			align-items: end;
			margin-bottom: 1.25rem;
		}
		.admin-field {
			width: 100%;
			min-height: 44px;
			padding: .7rem .85rem;
			border: 1px solid var(--line);
			border-radius: 12px;
			color: var(--ink);
			background: var(--white);
			font: inherit;
			font-size: .9rem;
		}
		.admin-field:focus { border-color: var(--orange); outline: 0; box-shadow: 0 0 0 3px rgba(245, 142, 107, .14); }
		.admin-btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: .4rem;
			min-height: 42px;
			padding: .58rem 1rem;
			border: 1px solid transparent;
			border-radius: 999px;
			color: var(--white);
			background: var(--orange);
			font-size: .86rem;
			font-weight: 700;
			line-height: 1;
			white-space: nowrap;
			transition: background .18s ease, box-shadow .18s ease, transform .18s ease;
		}
		.admin-btn:hover { color: var(--white); background: var(--orange-deep); transform: translateY(-2px); }
		.admin-btn.secondary { border-color: var(--bg-soothing); color: var(--ink); background: var(--blue-soft); }
		.admin-btn.secondary:hover { color: var(--ink); background: var(--bg-soothing); }
		.admin-btn.danger { border-color: rgba(229, 118, 79, .28); color: var(--orange-deep); background: var(--pink-soft); }
		.admin-btn.danger:hover { color: var(--white); background: var(--orange-deep); }
		.table-scroll { width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; }
		.admin-table { width: 100%; min-width: 760px; border-collapse: collapse; }
		.admin-table th,
		.admin-table td { padding: .9rem 1rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
		.admin-table th {
			color: var(--ink);
			background: rgba(220, 234, 245, .62);
			font-size: .8rem;
			font-weight: 700;
			letter-spacing: .04em;
		}
		.admin-table td { color: var(--ink-soft); font-size: .88rem; }
		.admin-table tbody tr:last-child td { border-bottom: 0; }
		.admin-table tbody tr:hover td { background: rgba(255, 250, 238, .72); }
		.article-summary strong { display: block; color: var(--ink); font-family: var(--serif); font-size: .98rem; }
		.article-summary span { font-size: .8rem; }
		.status-pill {
			display: inline-flex;
			align-items: center;
			min-height: 30px;
			padding: .25rem .7rem;
			border-radius: 999px;
			color: var(--ink);
			background: var(--blue-soft);
			font-size: .78rem;
			font-weight: 700;
		}
		.inline-actions { display: flex; align-items: center; gap: .5rem; }
		.inline-form { margin: 0; }
		.empty-state { padding: 2.4rem 1rem !important; color: var(--ink-soft); text-align: center !important; }
		.modal-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0,0,0,0.4);
			z-index: 200;
			justify-content: center;
			align-items: center;
		}
		.modal-overlay.active { display: flex; }
		.modal-box {
			background: var(--white);
			border-radius: var(--radius-md);
			padding: 1.5rem;
			max-width: 400px;
			width: 90%;
			box-shadow: var(--shadow-md);
		}
		.modal-box h3 {
			margin: 0 0 1rem;
			color: var(--ink);
			font-family: var(--serif);
			font-size: 1.08rem;
		}
		.stats-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: .65rem;
			margin-bottom: 1rem;
		}
		.stats-item {
			border: 1px solid var(--line);
			border-radius: 12px;
			padding: .85rem;
			text-align: center;
			background: var(--bg-warm);
		}
		.stats-item .stats-label {
			font-size: .78rem;
			color: var(--ink-soft);
			margin-bottom: .3rem;
		}
		.stats-item .stats-value {
			font-size: 1.35rem;
			font-weight: 700;
			color: var(--ink);
		}
		.modal-close {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 38px;
			padding: .5rem 1rem;
			border: 1px solid transparent;
			border-radius: 999px;
			color: var(--white);
			background: var(--orange);
			font-size: .86rem;
			font-weight: 700;
			cursor: pointer;
			transition: background .18s ease, transform .18s ease;
		}
		.modal-close:hover { background: var(--orange-deep); transform: translateY(-2px); }
		.site-footer {
			margin-top: 0;
			padding: 1.35rem 0;
			border-top: 1px solid var(--line);
			color: var(--ink-soft);
			background: var(--white);
			font-size: .78rem;
		}
		.footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
		.footer-inner strong { color: var(--ink); font-weight: 700; }
		:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
		@media (max-width: 940px) {
			.profile-copy { display: none; }
			.profile-entry { padding: .28rem; }
		}
		@media (max-width: 980px) {
			.admin-toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
			.admin-toolbar > :first-child { grid-column: 1 / -1; }
		}
		@media (max-width: 700px) {
			.profile-copy { display: none; }
			.profile-entry { padding: .28rem; }
			.admin-page-header { display: block; }
			.admin-page-header p { margin-top: .5rem; text-align: left; }
			.admin-panel-heading { display: block; }
			.admin-panel-heading p { margin-top: .25rem; }
		}
		@media (max-width: 640px) {
			.nav-inner {
				gap: .55rem;
				height: 64px;
			}
			.logout-button span { display: none; }
			.logout-button {
				display: grid;
				place-items: center;
				width: 42px;
				min-height: 42px;
				padding: 0;
			}
			.profile-photo {
				width: 34px;
				height: 34px;
			}
		}
		@media (max-width: 540px) {
			.logout-button { display: grid; place-items: center; width: 42px; min-height: 42px; padding: 0; }
			.logout-button span { display: none; }
			.admin-panel-body { padding: .85rem; }
			.admin-toolbar { grid-template-columns: 1fr; }
			.admin-toolbar > :first-child { grid-column: auto; }
		}
		@media (max-width: 430px) {
			.profile-entry { display: none; }
			.nav-actions { gap: .35rem; }
		}
		@media (prefers-reduced-motion: reduce) {
			* { transition: none !important; scroll-behavior: auto !important; }
		}
	</style>
</head>
<body class="admin-article-page">
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<main id="main-content" class="admin-main">
		<div class="admin-wrap">

			<div class="crumb">
				<a th:href="@{/admin/home}">管理後台</a><span>/</span><a th:href="@{/admin/article}">文章總覽</a><span>/</span><span class="current">已審核文章</span>
			</div>

			<section class="admin-page-header" aria-labelledby="page-title">
				<div>
					<span class="admin-kicker">Reviewed Articles</span>
					<h1 id="page-title">已審核文章</h1>
				</div>
				<nav class="admin-page-header-nav">
					<a th:href="@{/admin/article}">文章管理</a>
					<a th:href="@{/admin/article/categories}">文章分類</a>
				</nav>
			</section>

			<nav class="article-admin-nav" aria-label="專欄文章管理功能">
				<a th:href="@{/admin/article}">文章總覽</a>
				<a th:href="@{/admin/article/pending}">待審核文章</a>
				<a th:href="@{/admin/article/reviewed}" class="active">已審核文章</a>
			</nav>

			<div class="status-tabs">
				<a th:href="@{/admin/article/reviewed}"
					th:classappend="${currentStatus == null} ? ' active' : ''">全部</a>
				<a th:href="@{/admin/article/reviewed(status=2)}"
					th:classappend="${currentStatus == 2} ? ' active' : ''">已上架</a>
				<a th:href="@{/admin/article/reviewed(status=3)}"
					th:classappend="${currentStatus == 3} ? ' active' : ''">已退回</a>
				<a th:href="@{/admin/article/reviewed(status=4)}"
					th:classappend="${currentStatus == 4} ? ' active' : ''">已下架</a>
			</div>

			<section class="admin-panel" aria-labelledby="reviewed-list-title">
				<div class="admin-panel-heading">
					<h2 id="reviewed-list-title">已審核清單</h2>
				</div>
				<div class="admin-panel-body">
					<div class="table-scroll" th:if="${articlePage.totalElements > 0}">
						<table class="admin-table">
							<thead>
								<tr>
									<th scope="col">文章編號</th>
									<th scope="col">文章標題</th>
									<th scope="col">分類</th>
									<th scope="col">狀態</th>
									<th scope="col">審核時間</th>
									<th scope="col" th:if="${currentStatus != 3 and currentStatus != 4}">操作</th>
									<th scope="col" th:if="${currentStatus != 3}">互動數據</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="item : ${articleList}">
									<td th:text="${item.article.articleId}"></td>
									<td>
										<strong class="article-title" th:text="${item.article.title}"></strong>
									</td>
									<td th:text="${item.article.articleCat.articleCatName}"></td>
									<td>
										<span class="status-pill" th:if="${item.article.articleStatus == 2}">已上架</span>
										<span class="status-pill" th:if="${item.article.articleStatus == 3}">已退回</span>
										<span class="status-pill" th:if="${item.article.articleStatus == 4}">已下架</span>
									</td>
									<td th:text="${#temporals.format(item.article.reviewedAt,'yyyy-MM-dd HH:mm')}"></td>
									<td th:if="${currentStatus != 3 and currentStatus != 4}">
										<form th:if="${item.article.articleStatus == 2}"
											class="inline-form"
											th:action="@{/admin/article/{id}/unpublish(id=${item.article.articleId})}"
											method="post" onsubmit="return confirm('確定要下架這篇文章嗎？');">
											<button type="submit" class="admin-btn danger">下架</button>
										</form>
									</td>
									<td th:if="${currentStatus != 3}">
										<button class="admin-btn secondary"
											th:if="${item.article.articleStatus == 2 or item.article.articleStatus == 4}"
											th:data-view="${item.viewCount}"
											th:data-like="${item.likeCount}"
											th:data-favorite="${item.bookmarkCount}"
											th:data-share="${item.shareCount}"
											onclick="showStatsDetail(this)">查看</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
					<div th:if="${articlePage.totalElements == 0}" class="empty-state">
						<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:.8rem;">
							<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 15h6"/></svg>
						<div style="font-family:var(--serif); font-size:1.05rem; font-weight:600; color:var(--ink); margin-bottom:.35rem;">查無文章</div>
						<div style="font-size:.88rem;">目前此分類下沒有已審核的文章。</div>
					</div>

					<div th:replace="~{fragments/pagination :: pagination(${currentPage}, ${articlePage.totalPages}, '/admin/article/reviewed', ${currentStatus != null ? 'status=' + currentStatus : ''})}"></div>
				</div>
			</section>
		</div>
	</main>

	<div th:replace="~{fragments/adminFooter :: footer}"></div>

	<div id="statsModal" class="modal-overlay" onclick="closeStatsModal(event)">
		<div class="modal-box">
			<h3>互動數據</h3>
			<div class="stats-grid">
				<div class="stats-item">
					<div class="stats-label">觀看次數</div>
					<div class="stats-value" id="statView">0</div>
				</div>
				<div class="stats-item">
					<div class="stats-label">按讚次數</div>
					<div class="stats-value" id="statLike">0</div>
				</div>
				<div class="stats-item">
					<div class="stats-label">收藏次數</div>
					<div class="stats-value" id="statFavorite">0</div>
				</div>
				<div class="stats-item">
					<div class="stats-label">分享次數</div>
					<div class="stats-value" id="statShare">0</div>
				</div>
			</div>
			<button class="modal-close" onclick="closeStatsModal()">關閉</button>
		</div>
	</div>

	<script th:if="${alertMessage}">
		window.addEventListener('load', function () {
			alert('[[${alertMessage}]]');
		});
	</script>
	<script>
		function showStatsDetail(btn) {
			document.getElementById('statView').textContent = btn.getAttribute('data-view') || 0;
			document.getElementById('statLike').textContent = btn.getAttribute('data-like') || 0;
			document.getElementById('statFavorite').textContent = btn.getAttribute('data-favorite') || 0;
			document.getElementById('statShare').textContent = btn.getAttribute('data-share') || 0;
			document.getElementById('statsModal').classList.add('active');
		}
		function closeStatsModal(event) {
			if (!event || event.target === document.getElementById('statsModal') || event.target.classList.contains('modal-close')) {
				document.getElementById('statsModal').classList.remove('active');
			}
		}
	</script>
</body>
</html>
