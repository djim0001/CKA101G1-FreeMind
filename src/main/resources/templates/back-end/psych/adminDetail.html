<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>心理師審核</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
	font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
	background-color: #f5f5f5;
	color: #333;
	line-height: 1.6;
	padding: 40px 20px;
}

h1 {
	max-width: 860px;
	margin: 0 auto 28px;
	font-size: 28px;
	font-weight: 700;
	color: #4a3e3e;
	padding-bottom: 16px;
	border-bottom: 2px solid #e8b4b4;
	display: flex;
	align-items: center;
	justify-content: space-between;
}
h1 a {
	display: inline-block;
	padding: 8px 20px;
	background-color: #e8b4b4;
	color: #fff;
	text-decoration: none;
	border-radius: 6px;
	font-size: 14px;
	font-weight: 500;
}
h1 a:hover { background-color: #d39393; }

.alert {
	max-width: 860px;
	margin: 0 auto 16px;
	padding: 12px 16px;
	background-color: #eaf6ec;
	color: #2e7d43;
	border: 1px solid #cdead4;
	border-radius: 6px;
	font-size: 14px;
}

.card {
	max-width: 860px;
	margin: 0 auto 24px;
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
	padding: 40px;
}

.profile-top { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 20px; }
.avatar {
	width: 110px; height: 110px; border-radius: 50%;
	object-fit: cover; border: 3px solid #f2dddd; flex-shrink: 0;
}
.avatar-placeholder {
	width: 110px; height: 110px; border-radius: 50%;
	background: #fbf2f2; color: #d3b6b6;
	display: flex; align-items: center; justify-content: center;
	font-size: 12px; border: 3px dashed #f2dddd; flex-shrink: 0;
}
.name-block h2 { font-size: 22px; color: #4a3e3e; }
.name-block .account { font-size: 13px; color: #999; }

.badge {
	display: inline-block; padding: 3px 12px; border-radius: 999px;
	font-size: 13px; margin: 6px 6px 0 0;
}
.badge.ok { background: #eaf6ec; color: #2e7d43; }
.badge.warn { background: #fdf3e7; color: #b26a00; }
.badge.bad { background: #fdecea; color: #c0392b; }

.info-grid {
	display: grid; grid-template-columns: 1fr 1fr; gap: 14px 32px;
}
.info-item .label { font-size: 13px; font-weight: 600; color: #7a6b6b; }
.info-item .value { font-size: 15px; color: #444; word-break: break-all; }

.section-title {
	font-size: 16px; font-weight: 700; color: #4a3e3e;
	margin: 8px 0 14px; padding-left: 10px; border-left: 4px solid #e8b4b4;
}

.action-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.action-row form { display: inline; }

button {
	padding: 9px 20px; font-size: 14px; font-weight: 500;
	border: none; border-radius: 6px; cursor: pointer;
	transition: background-color 0.2s, color 0.2s;
}
button.primary { background-color: #e8b4b4; color: #fff; }
button.primary:hover { background-color: #d39393; }
button.danger { background-color: #fdecea; color: #c0392b; border: 1px solid #f5c6c1; }
button.danger:hover { background-color: #c0392b; color: #fff; }
button.soft { background-color: #fbf2f2; color: #7a6b6b; border: 1px solid #f2dddd; }
button.soft:hover { background-color: #e8b4b4; color: #fff; }

.hint { font-size: 13px; color: #999; margin-top: 8px; }

@media ( max-width : 640px) {
	.card { padding: 24px 20px; }
	.info-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
	<h1>
		<span>心理師審核</span> <a th:href="@{/admin/psych}">返回列表</a>
	</h1>

	<p class="alert" th:if="${alertMessage}" th:text="${alertMessage}"></p>

	<!-- 基本資料 -->
	<div class="card">
		<div class="profile-top">
			<img class="avatar" th:if="${psych.profilePic != null && !psych.profilePic.isEmpty()}"
				th:src="@{'/psych-images/' + ${psych.profilePic}}" alt="大頭照" />
			<div class="avatar-placeholder"
				th:if="${psych.profilePic == null || psych.profilePic.isEmpty()}">無照片</div>

			<div class="name-block">
				<h2 th:text="${psych.name}">王小明</h2>
				<p class="account" th:text="'帳號:' + ${psych.psychAccount} + '(編號 ' + ${psych.psychId} + ')'">帳號:psych01</p>

				<span class="badge ok" th:if="${psych.accountStatus == 1}">帳號已啟用</span>
				<span class="badge warn" th:if="${psych.accountStatus == 0}">帳號未啟用</span>
				<span class="badge bad" th:if="${psych.accountStatus == 2}">帳號停權中</span>
				<span class="badge ok" th:if="${psych.hasPracticeLicense}">執業許可:已通過</span>
				<span class="badge warn" th:unless="${psych.hasPracticeLicense}">執業許可:審核中/未通過</span>
			</div>
		</div>

		<div class="info-grid">
			<div class="info-item"><p class="label">性別</p><p class="value" th:text="${psych.gender}">男</p></div>
			<div class="info-item"><p class="label">手機</p><p class="value" th:text="${psych.phoneNumber}">0912345678</p></div>
			<div class="info-item"><p class="label">信箱</p><p class="value" th:text="${psych.email}">a@b.c</p></div>
			<div class="info-item"><p class="label">心理師證照</p><p class="value" th:text="${psych.psychCertificate}">心證字第000號</p></div>
			<div class="info-item"><p class="label">工作地點</p><p class="value" th:text="${psych.psychLoc}">台北市</p></div>
			<div class="info-item"><p class="label">諮詢費(每次)</p><p class="value" th:text="'NT$ ' + ${psych.psychFee}">NT$ 1800</p></div>
			<div class="info-item"><p class="label">銀行帳號(撥款)</p>
				<p class="value" th:text="${psych.bankAccount != null && !psych.bankAccount.isEmpty() ? psych.bankAccount : '未填寫'}">未填寫</p></div>
			<div class="info-item"><p class="label">加入時間</p>
				<p class="value" th:text="${psych.regisAt != null ? #dates.format(psych.regisAt, 'yyyy-MM-dd') : '-'}">2026-01-01</p></div>
		</div>
	</div>

	<!-- 執業許可審核 -->
	<div class="card">
		<p class="section-title">執業許可審核</p>
		<div class="action-row">
			<form th:action="@{/admin/psych/{id}/license(id=${psych.psychId})}" method="post"
				th:if="${!psych.hasPracticeLicense}">
				<input type="hidden" name="approved" value="true" />
				<button type="submit" class="primary">通過執業許可</button>
			</form>

			<form th:action="@{/admin/psych/{id}/license(id=${psych.psychId})}" method="post"
				th:if="${psych.hasPracticeLicense}"
				onsubmit="return confirm('撤銷執業許可後,此心理師「未來所有預約將被取消」,已同意的預約會通知會員。確定撤銷?');">
				<input type="hidden" name="approved" value="false" />
				<button type="submit" class="danger">撤銷執業許可</button>
			</form>
		</div>
		<p class="hint">撤銷許可:會員將搜尋不到此心理師,未來的預約全數取消(已同意的通知會員)。</p>
	</div>

	<!-- 帳號狀態 -->
	<div class="card">
		<p class="section-title">帳號狀態管理</p>
		<div class="action-row">
			<form th:action="@{/admin/psych/{id}/status(id=${psych.psychId})}" method="post"
				th:if="${psych.accountStatus != 1}">
				<input type="hidden" name="status" value="1" />
				<button type="submit" class="primary">啟用帳號</button>
			</form>

			<form th:action="@{/admin/psych/{id}/status(id=${psych.psychId})}" method="post"
				th:if="${psych.accountStatus == 1}"
				onsubmit="return confirm('停權後,此心理師無法登入,「未來所有預約將被取消」,已同意的預約會通知會員。確定停權?');">
				<input type="hidden" name="status" value="2" />
				<button type="submit" class="danger">停權</button>
			</form>
		</div>
		<p class="hint">停權:該帳號無法登入、會員搜尋不到,未來的預約全數取消(已同意的通知會員)。</p>
	</div>
</body>
</html>
