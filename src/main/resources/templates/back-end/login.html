<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員登入系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/login/login.css}" rel="stylesheet">
    <script th:src="@{/js/login/login.js}" defer></script>
</head>
<body class="login-page theme-admin">

    <div class="login-card">

        <!-- 左欄：大標題 + 測試帳號 -->
        <div class="panel-brand">
            <div class="title-area">
                <h2>⚙️ 管理員登入系統</h2>
                <p class="subtitle">FreeMind 後台管理</p>
            </div>

            <!-- 測試提示區 -->
            <div class="test-info">
                <strong>💡 測試管理員帳號 (開發使用)</strong>
                帳號：<code>admin01</code> 密碼：<code>p@ss1234</code> 👉 超級管理員<br>
                帳號：<code>admin02</code> 密碼：<code>p@ss5678</code> 👉 諮商、文章、活動管理<br>
                帳號：<code>admin03</code> 密碼：<code>p@ss9012</code> 👉 課程商城權限<br>
                帳號：<code>admin04</code> 密碼：<code>p@ss3456</code> 👉 文章管理權限 (已停用)<br>
                帳號：<code>admin05</code> 密碼：<code>p@ss6656</code> 👉 活動管理權限 (未啟用)
            </div>
        </div>

        <!-- 右欄：登入表單 -->
        <div class="panel-form">

        <!-- 未授權 -->
        <div th:if="${param.unauthorized}" class="alert alert-error">
            <svg viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <span>沒有權限</span>
        </div>

        <!-- 錯誤訊息 -->
        <div th:if="${param.error}" class="alert alert-error">
            <svg viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <span>帳號或密碼錯誤，請稍後再試。</span>
        </div>

        <!-- 登出訊息（JS 會在數秒後自動淡出） -->
        <div th:if="${param.logout}" class="alert alert-success">
            ✓ 已成功登出
        </div>

        <!-- 登入表單 -->
        <form th:action="@{/back-end/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="adminAccount">帳號</label>
                <input type="text" id="adminAccount" name="adminAccount" required class="form-control" placeholder="請輸入管理員帳號" autofocus>
            </div>

            <div class="form-group">
                <label for="adminPassword">密碼</label>
                <div class="pw-wrap">
                    <input type="password" id="adminPassword" name="adminPassword" required class="form-control" placeholder="••••••••">
                    <button type="button" class="pw-toggle" aria-label="顯示密碼">
                        <svg class="icon-eye" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember-me" id="remember-me">
                    <span>記住我</span>
                </label>
                
            </div>

            <button type="submit" class="btn-submit">
                <span class="spinner"></span>
                <span class="btn-label">立即登入</span>
            </button>
        </form>

        </div><!-- /panel-form -->
    </div>

</body>
</html>
