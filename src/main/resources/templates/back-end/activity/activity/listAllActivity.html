<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>後台活動列表</title>
    <style>
  /* =================================================================== */
  /* 分配寬度比例 (100%) */
  /* =================================================================== */
  th:nth-child(1) { width: 10%; }  /* 圖片 */
  th:nth-child(2) { width: 4%; }  /* 編號 */
  th:nth-child(3) { width: 20%; } /* 活動名稱 */
  th:nth-child(4) { width: 6%; } /* 縣市 */
  th:nth-child(5) { width: 6%; } /* 區域 */
  th:nth-child(6) { width: 13%; } /* 活動時間 */
  th:nth-child(7) { width: 7%; }  /* 已報名/名額 */
  th:nth-child(8) { width: 13%; } /* 報名時間 */
  th:nth-child(9) { width: 7%; }  /* 報名狀態 */
  th:nth-child(10) { width: 7%; } /* 活動狀態 */
  th:nth-child(11) { width: 7%; } /* 查看詳情按鈕 */	

    </style>
</head>
<body>
    <h1>後台活動列表</h1>
    
    <p th:if="${errorMessage}" th:utext="${errorMessage}" style="color:red;"></p>

    <form th:action="@{/admin/activity/listActivities_ByCompositeQuery}" method="post">
        <p>
            縣市：<input type="text" name="activityCity">
        </p>
        <p>
            區域：<input type="text" name="activityDist">
        </p>
        <p>
            活動名稱關鍵字：<input type="text" name="activityName">
        </p>
        <p>
            活動狀態：
            <select name="activityStatus">
                <option value="">全部</option>
                <option value="0">待審核</option>
                <option value="1">已審核</option>
                <option value="2">已發布</option>
                <option value="3">已退回</option>
                <option value="4">取消</option>
                <option value="5">延期</option>
            </select>
        </p>
        <button type="submit">查詢</button>
    </form>

    <table border="1">
        <tr>
            <th>圖片</th>
            <th>編號</th>
            <th>活動名稱</th>
            <th>縣市</th>
            <th>區域</th>
		    <th>活動時間</th>
		    <th>名額</th>
		    <th>報名時間</th>
		    <th>報名狀態</th>
		    <th>活動狀態</th>
		    <th></th>
		</tr>
		
        <tr th:each="a : ${activityListData}">
             <td>
		        <img th:if="${a.picture != null}" 
		             th:src="@{'/activity-images/' + ${a.picture}}"
		             style="max-width: 100px;">
		        <img th:unless="${a.picture != null}" 
		             th:src="@{/images/no-image.jpg}" 
		             style="max-width: 100px;">
		    </td>
		    <td th:text="${a.activityId}"></td>
		    <td th:text="${a.activityName}"></td>
		    <td th:text="${a.activityCity}"></td>
		    <td th:text="${a.activityDist}"></td>
		    <td th:text="${#temporals.format(a.activityStart, 'MM/dd(E) HH:mm')} + ' ~ ' + ${#temporals.format(a.activityEnd, 'MM/dd(E) HH:mm')}"></td>
		    <td th:attr="data-activity-id=${a.activityId},data-capacity=${a.capacity},data-waitlist-capacity=${a.waitlistCapacity}">
			    正取 <span th:id="'confirmed-' + ${a.activityId}" th:text="${a.regisCount} + '/' + ${a.capacity}"></span><br>
			    備取 <span th:id="'waitlist-' + ${a.activityId}" th:text="${a.waitlistCount} + '/' + ${a.waitlistCapacity}"></span><br>
			    已報名 <span th:id="'total-' + ${a.activityId}" th:text="${a.regisCount + a.waitlistCount + (pendingCountMap.get(a.activityId) ?: 0)} + '/' + ${a.capacity + a.waitlistCapacity}"></span>
			</td>
		    <td th:text="${#temporals.format(a.regisStart, 'MM/dd(E) HH:mm')} + ' ~ ' + ${#temporals.format(a.regisEnd, 'MM/dd(E) HH:mm')}"></td>
		    <td th:text="${a.registrationStatusText}"></td>
		    	<td th:text="${a.activityStatusText}"></td>
		    <td>
		        <form th:action="@{/admin/activity/listOneActivity}" method="get" style="display:inline;">
		            <input type="hidden" name="activityId" th:value="${a.activityId}">
		            <button type="submit">查看詳情</button>
		        </form>
		    </td>
            
        </tr>
    </table>
    <div>
	    <form th:action="@{/admin/activity/listActivities_ByCompositeQuery}" method="post" th:each="i : ${#numbers.sequence(1, totalPages)}" style="display:inline;">
	        <input type="hidden" name="currentPage" th:value="${i}">
	        <input type="hidden" name="activityCity" th:value="${param.activityCity}">
	        <input type="hidden" name="activityDist" th:value="${param.activityDist}">
	        <input type="hidden" name="activityName" th:value="${param.activityName}">
	        <input type="hidden" name="activityStatus" th:value="${param.activityStatus}">
	        <button type="submit" th:text="${i}" 
	                th:style="${i == currentPage} ? 'font-weight:bold;' : ''"></button>
	    </form>
	</div>
	<br>
	<a th:href="@{/admin/activity/activityAdminIndex}">回後台活動導覽頁</a>

<script>
(function() {
    var rows = document.querySelectorAll('[data-activity-id]');
    rows.forEach(function(row) {
        var activityId = row.getAttribute('data-activity-id');
        var confirmedCap = row.getAttribute('data-capacity');
        var waitlistCap = row.getAttribute('data-waitlist-capacity');

        var wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/activity/' + activityId;
        var socket = new WebSocket(wsUrl);

        socket.onmessage = function(event) {
            var data = JSON.parse(event.data);

            document.getElementById('confirmed-' + activityId).innerText = data['正取'] + '/' + confirmedCap;
            document.getElementById('waitlist-' + activityId).innerText = data['備取'] + '/' + waitlistCap;

            var total = data['正取'] + data['備取'] + data['未審核'];
            var totalCap = parseInt(confirmedCap) + parseInt(waitlistCap);
            document.getElementById('total-' + activityId).innerText = total + '/' + totalCap;
        };

        socket.onerror = function(e) {
            console.log('WebSocket錯誤(活動' + activityId + '):', e);
        };
    });
})();
</script>
</body>
</html>
