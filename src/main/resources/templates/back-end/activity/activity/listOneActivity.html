<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>活動詳情｜諮由自在 Free Mind</title>

<style>
*, *::before, *::after {
	box-sizing: border-box;
}
:root {
	--bg-warm: #FFFAEE;
	--bg-soothing: #C2D9ED;
	--blue-soft: #DCEAF5;
	--orange: #F58E6B;
	--orange-deep: #E5764F;
	--pink: #FBD0BE;
	--pink-soft: #FDE6DB;
	--ink: #3A4B53;
	--ink-soft: #6b7981;
	--white: #FFFFFF;
	--line: #ecdfce;
	--shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
	--shadow-md: 0 16px 44px rgba(58, 75, 83, .13);
	--radius-lg: 34px;
	--radius-md: 22px;
	--serif: "OpenHuninn", "Noto Sans TC", sans-serif;
	--zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
	--sans: "Noto Sans TC", system-ui, sans-serif;
	--script: "Caveat", "OpenHuninn", cursive;
	--display-en: "Baloo 2", sans-serif;
}

.admin-wide { width: min(1080px, 92vw) !important; max-width: 1080px; margin-inline: auto; }

.page-head {
	display: flex; align-items: flex-end; justify-content: space-between;
	gap: 2rem; margin-bottom: 1.75rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--line);
	flex-wrap: wrap;
}
.page-kicker {
	display: block; margin-bottom: .35rem; color: var(--orange);
	font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
}
.page-head h1 {
	margin: 0; color: var(--ink); font-family: var(--serif);
	font-size: clamp(1.5rem, 2.6vw, 2rem); line-height: 1.35; letter-spacing: -.02em;
}

.page-function-nav { display: flex; gap: .35rem; flex-wrap: wrap; }
.page-function-nav a {
	display: inline-flex; align-items: center; justify-content: center;
	min-height: 44px; padding: .55rem 1.2rem;
	border: 1px solid transparent; border-radius: 999px;
	color: var(--ink-soft); background: transparent;
	font-size: .88rem; font-weight: 500; white-space: nowrap;
	transition: all .16s ease;
	text-decoration: none;
}
.page-function-nav a:hover { color: var(--ink); background: var(--bg-warm); }
.page-function-nav a.active { border-color: rgba(194, 217, 237, .9); color: var(--ink); background: var(--blue-soft); font-weight: 700; }

.msg-error { color: #c0392b; background-color: #fdecea; padding: .7rem 1.3rem; border-radius: 10px; margin-bottom: 1.2rem; font-size: .92rem; display: inline-block; }
.msg-success { color: #4F7B96; background-color: var(--blue-soft); padding: .7rem 1.3rem; border-radius: 10px; margin-bottom: 1.2rem; font-size: .92rem; display: inline-block; }

.crumb { font-size: .84rem; color: var(--ink-soft); margin-bottom: .6rem; }
.crumb a {text-decoration: none; color: var(--ink-soft);}
.crumb a:hover { color: var(--orange); }
.crumb span { margin: 0 .4rem; opacity: .5; }

/* ---------- 上半部：圖片 + 資訊卡 ---------- */
.detail-top { display: grid; grid-template-columns: 1fr 1.1fr; gap: 1.8rem; align-items: stretch; margin-bottom: 1.8rem; }
.detail-cover { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); height: 100%; min-height: 340px; }
.detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

.info-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 1.6rem 1.8rem; box-shadow: var(--shadow-sm); height: 100%; }
.info-cat { font-size: .78rem; letter-spacing: .1em; color: var(--orange); font-weight: 600; text-transform: uppercase; }
.info-card h2 { font-family: var(--serif); font-weight: 700; font-size: 1.4rem; color: var(--ink); margin: .5rem 0 1rem; line-height: 1.35; }
.info-row { display: flex; gap: .6rem; align-items: flex-start; font-size: .88rem; color: var(--ink); margin-bottom: .65rem; }
.info-row .label { color: var(--ink-soft); flex: 0 0 auto; }

.capacity-box { background: var(--bg-warm); border-radius: 12px; padding: .9rem 1.1rem; margin: 1rem 0; font-size: .86rem; color: var(--ink); line-height: 1.8; }
.capacity-box b { color: var(--ink); }

.status-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .3rem; flex-wrap: wrap; }
.status-badge { display: inline-flex; align-items: center; padding: .3rem .85rem; border-radius: 999px; font-size: .8rem; font-weight: 500; border: 1px solid; }
.status-pending { color: #b8860b; border-color: #b8860b; background-color: #fff8e6; }
.status-approved { color: #4F7B96; border-color: #8FB2C9; background-color: var(--blue-soft); }
.status-published { color: #5A7A57; border-color: #5A7A57; background-color: #eef4ec; }
.status-rejected { color: #c0392b; border-color: #c0392b; background-color: #fdecea; }
.status-cancel { color: var(--ink-soft); border-color: var(--line); background-color: var(--bg-warm); }
.status-postpone { color: var(--orange-deep); border-color: var(--orange); background-color: var(--pink-soft); }

.scheduled-note { font-size: .8rem; color: #4F7B96; margin-top: .3rem; }

/* ---------- 審核操作區 ---------- */
.mod-card {
	background: #fff; border: 1px solid var(--line); border-radius: var(--radius-md);
	padding: 1.6rem 1.8rem; box-shadow: var(--shadow-sm); margin-bottom: 1.6rem;
}
.mod-card h3 { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; color: var(--ink); margin: 0 0 1.1rem; display: flex; align-items: center; gap: .5rem; }
.mod-card h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex: 0 0 auto; }
.mod-actions { display: flex; flex-wrap: wrap; gap: .8rem; }
.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
	height: 44px; padding: 0 1.6rem; border-radius: 999px; font-weight: 500; font-size: .9rem;
	transition: all .18s; border: none; cursor: pointer; font-family: inherit; text-decoration: none;
}
.btn-approve { background: #5A7A57; color: #fff; }
.btn-approve:hover { background: #4a6748; }
.btn-reject { background: #fff; color: #c0392b; border: 1px solid #c0392b; }
.btn-reject:hover { background: #c0392b; color: #fff; }
.btn-publish { background: var(--orange); color: #fff; }
.btn-publish:hover { background: var(--orange-deep); }
.btn-schedule { background: #fff; color: #4F7B96; border: 1px solid #8FB2C9; }
.btn-schedule:hover { background: #4F7B96; color: #fff; }
.btn-back { background: #fff; color: var(--ink-soft); border: 1px solid var(--line); }
.btn-back:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ---------- 內容卡片 ---------- */
.content-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 1.6rem 1.8rem; box-shadow: var(--shadow-sm); margin-bottom: 1.6rem; }
.content-card h3 { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; color: var(--ink); margin: 0 0 1rem; display: flex; align-items: center; gap: .5rem; }
.content-card h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex: 0 0 auto; }
.content-body { white-space: pre-wrap; font-size: .9rem; color: var(--ink); line-height: 1.85; }

.note-box { background: #fdecea; border-radius: 12px; padding: .9rem 1.1rem; font-size: .86rem; color: #c0392b; line-height: 1.8; margin-top: .8rem; }
.note-box b { color: #c0392b; }


/* ---------- 彈窗 ---------- */
.op-modal-overlay {
	display: none; position: fixed; inset: 0;
	background: rgba(58,75,83,.35); backdrop-filter: blur(6px);
	z-index: 500; align-items: center; justify-content: center;
	opacity: 0; transition: opacity .2s;
}
.op-modal-overlay.show { display: flex; opacity: 1; }
.op-modal-panel {
	background: #fff; border-radius: var(--radius-md);
	box-shadow: var(--shadow-md); width: 90%; max-width: 440px; padding: 1.8rem;
	transform: translateY(10px); transition: transform .2s;
	text-align: left; font-family: var(--sans);
}
.op-modal-overlay.show .op-modal-panel { transform: translateY(0); }
.op-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.op-modal-header span { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: var(--ink); }
.op-modal-close { background: none; border: none; font-size: 22px; color: var(--ink-soft); cursor: pointer; line-height: 1; }
.op-modal-close:hover { color: var(--ink); }
.op-modal-panel select, .op-modal-panel input[type="text"], .op-modal-panel input[type="datetime-local"] {
	width: 100%; padding: .7rem 1rem; border: 1px solid var(--line); border-radius: 12px;
	background: #f6f1e8; font-family: inherit; font-size: .88rem; color: var(--ink); margin-bottom: .9rem;
}
.op-modal-panel select:focus, .op-modal-panel input:focus { outline: none; border-color: var(--orange); background: #fff; }
.op-modal-panel p.field-label { font-size: .84rem; color: var(--ink); margin: 0 0 .4rem; }
.op-modal-submit { width: 100%; height: 46px; display: inline-flex; align-items: center; justify-content: center; font-size: .92rem; border: none; cursor: pointer; border-radius: 999px; font-family: inherit; }

@media (max-width: 900px) { .detail-top { grid-template-columns: 1fr; } .detail-cover { min-height: 240px; } }
</style>
</head>
<body>

	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<main id="main-content">
		<div class="wrap admin-wide" style="padding-top: clamp(1.25rem, 2vw, 1.75rem); padding-bottom: 4rem;">

			<div class="page-head">
				<div>
					<div class="crumb">
						<a th:href="@{/admin/activity/activityAdminIndex}">活動管理</a><span>/</span>
						<a th:href="@{/admin/activity/listActivities_ByCompositeQuery}">後台活動列表</a><span>/</span>
						<span style="opacity:1;color:var(--ink)" th:text="${activity.activityName}">活動詳情</span>
					</div>
					<span class="page-kicker">Activity Management</span>
					<h1 th:text="${activity.activityName}">活動詳情</h1>
				</div>
				<nav class="page-function-nav" aria-label="活動管理">
					<a class="active" th:href="@{/admin/activity/listActivities_ByCompositeQuery}">活動列表</a>
					<a th:href="@{/admin/activityCat/listAllActivityCat}">活動分類</a>
					<a th:href="@{/admin/activity/report/list}">問題回報</a>
				</nav>
			</div>

			<p th:if="${errorMessage}" th:utext="${errorMessage}" class="msg-error"></p>
			<p th:if="${successMessage}" th:utext="${successMessage}" class="msg-success"></p>

			<!-- 上半部：封面圖 + 資訊卡 -->
			<div class="detail-top">
				<div class="detail-cover">
					<img th:if="${activity.picture != null}"
						 th:src="@{'/activity-images/' + ${activity.picture}}"
						 th:alt="${activity.activityName}" />
					<img th:unless="${activity.picture != null}"
						 th:src="@{/images/no-image.jpg}"
						 th:alt="${activity.activityName}" />
				</div>

				<div class="info-card">
					<span class="info-cat" th:text="${activity.activityCat.activityCatName}">活動分類</span>
					<h2 th:text="${activity.activityName}">活動名稱</h2>

					<div class="info-row">
						<span class="label">發起人：</span>
						<span th:text="${#strings.isEmpty(activity.member.nickname) ? activity.member.name : activity.member.nickname}"></span>
					</div>
					<div class="info-row">
						<span class="label">地點：</span>
						<span th:text="${activity.activityCity} + ${activity.activityDist} + ${activity.activityLoc}"></span>
					</div>
					<div class="info-row">
						<span class="label">活動時間：</span>
						<span th:text="${#temporals.format(activity.activityStart, 'yyyy/MM/dd(E) HH:mm')} + ' ~ ' + ${#temporals.format(activity.activityEnd, 'yyyy/MM/dd(E) HH:mm')}"></span>
					</div>
					<div class="info-row">
						<span class="label">報名時間：</span>
						<span th:text="${#temporals.format(activity.regisStart, 'yyyy/MM/dd(E) HH:mm')} + ' ~ ' + ${#temporals.format(activity.regisEnd, 'yyyy/MM/dd(E) HH:mm')}"></span>
					</div>

					<div class="capacity-box">
						正取名額：<b th:text="${activity.regisCount} + ' / ' + ${activity.capacity}"></b><br>
						備取名額：<b th:text="${activity.waitlistCount} + ' / ' + ${activity.waitlistCapacity}"></b><br>
						待審核報名：<b th:text="${pendingCount}"></b>
					</div>

					<div class="status-row">
						<span class="status-badge status-pending" th:if="${activity.activityStatus == 0}">待審核</span>
						<span class="status-badge status-approved" th:if="${activity.activityStatus == 1}">已審核（待發布）</span>
						<span class="status-badge status-published" th:if="${activity.activityStatus == 2}">已發布</span>
						<span class="status-badge status-rejected" th:if="${activity.activityStatus == 3}">已退回</span>
						<span class="status-badge status-cancel" th:if="${activity.activityStatus == 4}">已取消</span>
						<span class="status-badge status-postpone" th:if="${activity.activityStatus == 5}">延期中</span>
					</div>
					<p class="scheduled-note" th:if="${activity.scheduledPublishAt != null}"
					   th:text="'已排程於 ' + ${#temporals.format(activity.scheduledPublishAt, 'yyyy/MM/dd HH:mm')} + ' 自動發布'"></p>
				</div>
			</div>

			<!-- 審核操作區 -->
			<div class="mod-card">
				<h3>審核操作</h3>
				<div class="mod-actions">
					<form th:if="${activity.activityStatus == 0}" th:action="@{/admin/activity/approve}" method="post"
						  onsubmit="return confirm('確定要通過此活動的審核嗎？')">
						<input type="hidden" name="activityId" th:value="${activity.activityId}">
						<button type="submit" class="btn btn-approve">通過審核</button>
					</form>

					<button th:if="${activity.activityStatus == 0}" type="button" class="btn btn-reject"
							onclick="openOpModal('rejectModal')">退回申請</button>

					<form th:if="${activity.activityStatus == 1}" th:action="@{/admin/activity/publish}" method="post"
						  onsubmit="return confirm('確定要立即發布此活動嗎？')">
						<input type="hidden" name="activityId" th:value="${activity.activityId}">
						<button type="submit" class="btn btn-publish">立即發布</button>
					</form>

					<button th:if="${activity.activityStatus == 1}" type="button" class="btn btn-schedule"
							onclick="openOpModal('scheduleModal')">排程發布</button>

					<a class="btn btn-back" th:href="@{/admin/activity/listActivities_ByCompositeQuery}" href="#">返回列表</a>
				</div>

				<div class="note-box" th:if="${activity.activityStatus == 3 and activity.rejectNote != null}">
					<b>退回原因：</b><span th:text="${activity.rejectReasonText}"></span>
					<span th:if="${!#strings.isEmpty(activity.rejectNote)}"> — <span th:text="${activity.rejectNote}"></span></span>
				</div>
			</div>

			<!-- 活動內容 -->
			<div class="content-card">
				<h3>活動內容</h3>
				<div class="content-body" th:text="${activity.activityContent}"></div>
			</div>			
		</div>
	</main>

	<!-- 退回申請彈窗 -->
	<div class="op-modal-overlay" id="rejectModal" onclick="closeOpModalOutside(event, this)">
		<div class="op-modal-panel">
			<div class="op-modal-header">
				<span>退回申請</span>
				<button type="button" class="op-modal-close" onclick="closeOpModal('rejectModal')">&times;</button>
			</div>
			<form th:action="@{/admin/activity/reject}" method="post"
				  onsubmit="return confirm('確定要退回此活動申請嗎？')">
				<input type="hidden" name="activityId" th:value="${activity.activityId}">
				<p class="field-label">退回原因</p>
					<select name="rejectReason" required>
						<option value="0">資訊不完整</option>
						<option value="1">內容不當</option>
						<option value="2">名額設定異常</option>
						<option value="3">其他</option>
					</select>
				<p class="field-label">補充說明（選填）</p>
				<input type="text" name="rejectNote" placeholder="補充說明" maxlength="200">
				<button type="submit" class="op-modal-submit" style="background:#c0392b;color:#fff;">確認退回</button>
			</form>
		</div>
	</div>

	<!-- 排程發布彈窗 -->
	<div class="op-modal-overlay" id="scheduleModal" onclick="closeOpModalOutside(event, this)">
		<div class="op-modal-panel">
			<div class="op-modal-header">
				<span>排程發布</span>
				<button type="button" class="op-modal-close" onclick="closeOpModal('scheduleModal')">&times;</button>
			</div>
			<form th:action="@{/admin/activity/schedulePublish}" method="post"
				  onsubmit="return confirm('確定要設定排程發布嗎？')">
				<input type="hidden" name="activityId" th:value="${activity.activityId}">
				<p class="field-label">預定發布時間</p>
				<input type="datetime-local" name="scheduledPublishAt" required>
				<button type="submit" class="op-modal-submit" style="background:#4F7B96;color:#fff;">確認排程</button>
			</form>
		</div>
	</div>

	<div th:replace="~{fragments/adminFooter :: footer}"></div>

	<script>
	function openOpModal(id) {
		document.getElementById(id).classList.add('show');
	}
	function closeOpModal(id) {
		document.getElementById(id).classList.remove('show');
	}
	function closeOpModalOutside(e, overlay) {
		if (e.target === overlay) overlay.classList.remove('show');
	}
	</script>
</body>
</html>
