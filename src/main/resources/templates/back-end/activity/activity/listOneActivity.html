<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>查看單一活動詳情</title>
</head>
<body>
    <h1 th:text="${activity.activityName}"></h1>
	
	<p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
	<p th:if="${successMessage}" th:text="${successMessage}" style="color:blue;"></p>

    <img th:if="${activity.picture != null}" 
         th:src="@{'/activity-images/' + ${activity.picture}}"
         style="max-width: 400px;">
    <img th:unless="${activity.picture != null}" 
         th:src="@{/images/no-image.jpg}" 
         style="max-width: 400px;">

    <p>活動分類：<span th:text="${activity.activityCat.activityCatName}"></span></p>
    <p>地點：<span th:text="${activity.activityCity} + ${activity.activityDist} + ${activity.activityLoc}"></span></p>

    <p>活動內容：</p>
    <p th:text="${activity.activityContent}" style="white-space: pre-wrap;"></p>

    <p>報名時間：
        <span th:text="${#temporals.format(activity.regisStart, 'yyyy/MM/dd(E) HH:mm')}"></span> ~ 
        <span th:text="${#temporals.format(activity.regisEnd, 'yyyy/MM/dd(E) HH:mm')}"></span>
    </p>
    <p>活動時間：
        <span th:text="${#temporals.format(activity.activityStart, 'yyyy/MM/dd(E) HH:mm')}"></span> ~ 
        <span th:text="${#temporals.format(activity.activityEnd, 'yyyy/MM/dd(E) HH:mm')}"></span>
    </p>
    <p>正取名額：<span id="confirmedCount" th:text="${activity.regisCount} + ' / ' + ${activity.capacity}"></span></p>
	<p>備取名額：<span id="waitlistCount" th:text="${activity.waitlistCount} + ' / ' + ${activity.waitlistCapacity}"></span></p>
	<p>已報名人數：<span id="totalRegisteredCount" th:text="${activity.regisCount + activity.waitlistCount + pendingCount} + ' / ' + ${activity.capacity + activity.waitlistCapacity}"></span></p>
    <p>報名狀態：<span th:text="${activity.registrationStatusText}"></span></p>
	<div class="admin-actions">
        <div class="action-block" th:if="${activity.activityStatus == 0}" >
	    <form th:action="@{/admin/activity/approve}" method="post"
	          onsubmit="return confirm('確定審核通過嗎？')" style="display:inline;">
	        <input type="hidden" name="activityId" th:value="${activity.activityId}">
	        <button type="submit">審核通過</button>
	    </form>
	
	    <button type="button" onclick="toggleRejectForm()">退回</button>
	
		    <div class="action-block" id="rejectForm" style="display:none;">
		        <form th:action="@{/admin/activity/reject}" method="post"
		              onsubmit="return confirm('確定要退回這個活動嗎？')">
		            <input type="hidden" name="activityId" th:value="${activity.activityId}">
		            <select name="rejectReason">
		                <option value="0">資訊不完整</option>
		                <option value="1">內容不當</option>
		                <option value="2">名額設定異常</option>
		                <option value="3">其他</option>
		            </select>
		            <input type="text" name="rejectNote" placeholder="退回原因說明">
		            <button type="submit">確認退回</button>
		        </form>
		    	</div>
	    </div>
	    
	    <div class="action-block" th:if="${activity.activityStatus == 1}">
	        <form th:action="@{/admin/activity/publish}" method="post"
	              onsubmit="return confirm('確定要發布這個活動嗎？')">
	            <input type="hidden" name="activityId" th:value="${activity.activityId}">
	            <button type="submit">發布</button>
	        </form>
	    </div>
	</div>
	
    <a th:href="@{/admin/activity/listAllActivity}">返回活動列表</a>

<div id="activityData" 
     th:data-activity-id="${activity.activityId}"
     th:data-capacity="${activity.capacity}"
     th:data-waitlist-capacity="${activity.waitlistCapacity}"
     style="display:none;"></div>
<script>
function toggleRejectForm() {
    const form = document.getElementById('rejectForm');
    form.style.display = (form.style.display === 'none') ? 'block' : 'none';
}

(function() {
    var activityId = document.getElementById('activityData').getAttribute('data-activity-id');
    var wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/activity/' + activityId;
    var socket = new WebSocket(wsUrl);

    socket.onmessage = function(event) {
        var data = JSON.parse(event.data);
        var confirmedCap = document.getElementById('activityData').getAttribute('data-capacity');
        var waitlistCap = document.getElementById('activityData').getAttribute('data-waitlist-capacity');

        document.getElementById('confirmedCount').innerText = data['正取'] + ' / ' + confirmedCap;
        document.getElementById('waitlistCount').innerText = data['備取'] + ' / ' + waitlistCap;

        var total = data['正取'] + data['備取'] + data['未審核'];
        var totalCap = parseInt(confirmedCap) + parseInt(waitlistCap);
        document.getElementById('totalRegisteredCount').innerText = total + ' / ' + totalCap;
    };

    socket.onerror = function(e) {
        console.log('WebSocket錯誤:', e);
    };
})();
</script>
</body>
</html>
