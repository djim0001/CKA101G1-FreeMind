<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title th:text="${permission != null} ? '編輯權限｜諮由自在後台' : '新增權限｜諮由自在後台'">新增權限｜諮由自在後台</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/admin-page.css}" href="/css/admin-page.css" />
</head>

<body>

	<!-- ================= 頁首 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<div class="admin-shell">

		<!-- ================= 側欄 ================= -->
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('permission-list')}"></aside>

		<!-- ================= 主內容 ================= -->
		<main id="main-content" class="admin-main">

			<div class="crumb">
				<a th:href="@{/admin/home}" href="#">管理後台</a><span>/</span>
				<a th:href="@{/admin/permissions}" href="#">權限清單</a><span>/</span>
				<span class="current" th:text="${permission != null} ? '編輯權限' : '新增權限'">新增權限</span>
			</div>

			<div class="page-head">
				<div>
					<h1 th:text="${permission != null} ? '編輯權限' : '新增權限'">新增權限</h1>
					<p>設定權限名稱與說明。</p>
				</div>
				<div class="page-actions">
					<a class="btn btn-ghost" th:href="@{/admin/permissions}" href="#">回權限清單</a>
				</div>
			</div>

			<div class="panel">
				<form class="form-grid" method="post" th:action="@{/admin/permissions/save}">

					<!-- 編輯模式才帶 permId，save() 依此分流新增/更新 -->
					<input type="hidden" name="permId" th:if="${permission != null}" th:value="${permission.permId}">

					<div class="form-group full">
						<label class="required" for="permName">權限名稱</label>
						<input class="field" type="text" id="permName" name="permName" required
							placeholder="例如：VIEW_ADMIN, EDIT_COURSE"
							th:value="${permission != null} ? ${permission.permName} : ''" autofocus>
					</div>

					<div class="form-group full">
						<label class="required" for="permDetail">權限說明</label>
						<textarea class="field" id="permDetail" name="permDetail" required
							placeholder="例如：查看管理面板，編輯課程等"
							th:text="${permission != null} ? ${permission.permDetail} : ''"></textarea>
					</div>

					<div class="form-group full page-actions">
						<a class="btn btn-ghost" th:href="@{/admin/permissions}" href="#">取消</a>
						<button class="btn btn-primary" type="submit">保存</button>
					</div>
				</form>
			</div>

		</main>
	</div>

	<!-- ================= 頁尾 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>
</body>
</html>
