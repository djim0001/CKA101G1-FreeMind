<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理員權限設定｜諮由自在後台</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/admin-page.css}" href="/css/admin-page.css" />

<style>
/* 本頁專屬：權限勾選清單 */
.perm-item {
	display: flex; align-items: flex-start; gap: .75rem;
	padding: .9rem 1.1rem; margin-bottom: .7rem; cursor: pointer;
	background: var(--bg-warm); border: 1px solid var(--line);
	border-radius: 14px; transition: border-color .16s, background .16s;
}
.perm-item:hover { border-color: var(--pink); background: var(--pink-soft); }
.perm-item input[type="checkbox"] { margin-top: .25rem; width: 1rem; height: 1rem; accent-color: var(--orange); }
.perm-name { display: block; font-weight: 500; color: var(--ink); }
.perm-detail { margin: .1rem 0 0; font-size: .85rem; color: var(--ink-soft); }
</style>
</head>

<body>

	<!-- ================= 頁首 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<div class="admin-shell">

		<!-- ================= 側欄 ================= -->
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('permission-list')}"></aside>

		<!-- ================= 主內容 ================= -->
		<main id="main-content" class="admin-main">

			<div class="crumb">
				<a th:href="@{/admin/home}" href="#">管理後台</a><span>/</span>
				<a th:href="@{/admin/listAllAdmin}" href="#">管理員列表</a><span>/</span>
				<span class="current">權限設定</span>
			</div>

			<div class="page-head">
				<div>
					<h1>權限<em>設定</em></h1>
					<p>
						管理員：<span th:text="${adminVO.name}"></span>
						（帳號 <span th:text="${adminVO.adminAccount}"></span>，編號 <span th:text="${adminVO.adminId}"></span>）
					</p>
				</div>
				<div class="page-actions">
					<a class="btn btn-ghost" th:href="@{/admin/listAllAdmin}" href="#">回管理員列表</a>
				</div>
			</div>

			<div class="panel">
				<form method="post" th:action="@{/admin/permissions/assign}">
					<input type="hidden" name="adminId" th:value="${adminVO.adminId}">

					<!-- Permission 沒覆寫 equals，勾選判斷用 permId 投影比對 -->
					<label class="perm-item" th:each="perm : ${allPermissions}">
						<input type="checkbox" name="permIds" th:value="${perm.permId}"
							th:checked="${#lists.contains(adminVO.permissions.![permId], perm.permId)}">
						<span>
							<span class="perm-name" th:text="${perm.permName}"></span>
							<span class="perm-detail" th:text="${perm.permDetail}"></span>
						</span>
					</label>

					<div class="empty-state" th:if="${allPermissions.isEmpty()}">
						<h3>尚無可指派的權限</h3>
						<p>請先到「權限清單」新增權限。</p>
					</div>

					<div class="page-actions" style="margin-top: 1.4rem;">
						<a class="btn btn-ghost" th:href="@{/admin/listAllAdmin}" href="#">取消</a>
						<button class="btn btn-primary" type="submit">保存</button>
					</div>
				</form>
			</div>

		</main>
	</div>

	<!-- ================= 頁尾 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>
</body>
</html>
