<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>修改管理員｜諮由自在後台</title>
<link rel="stylesheet" th:href="@{/css/login/common/admin-base.css}" />
<link rel="stylesheet" th:href="@{/css/login/common/admin-profile-theme.css}" />
</head>
<body class="thy2-page thy2-profile">
	<div class="layout">
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('admin-list')}"></aside>
		<div class="main">
			<div th:replace="~{fragments/admin/adminTopbar :: topbar('帳號與權限')}"></div>
			<main class="content">
				<div class="page-head">
					<div>
						<h1>修改管理員</h1>
						<p>編號 <span th:text="${adminVO.adminId}"></span>：更新帳號資料與照片。</p>
					</div>
					<div class="page-actions">
						<a class="btn ghost" th:href="@{/admin/listAllAdmin}">回管理員列表</a>
					</div>
				</div>

				<div class="notice" th:if="${errorMessage != null}" th:utext="${errorMessage}"></div>

				<div class="panel">
					<form class="form-grid" method="post" th:action="@{/admin/update}"
						th:object="${adminVO}" enctype="multipart/form-data">

						<input type="hidden" th:field="*{adminId}">

						<div class="form-group">
							<label for="adminAccount">帳號 <span class="required">*</span></label>
							<input class="field" type="text" th:field="*{adminAccount}">
							<span class="error" th:if="${#fields.hasErrors('adminAccount')}" th:errors="*{adminAccount}"></span>
						</div>

						<div class="form-group">
							<label for="adminPassword">密碼 <span class="required">*</span></label>
							<input class="field" type="password" th:field="*{adminPassword}">
							<span class="error" th:if="${#fields.hasErrors('adminPassword')}" th:errors="*{adminPassword}"></span>
						</div>

						<div class="form-group">
							<label for="name">姓名 <span class="required">*</span></label>
							<input class="field" type="text" th:field="*{name}">
							<span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
						</div>

						<div class="form-group">
							<label for="phoneNumber">手機號碼 <span class="required">*</span></label>
							<input class="field" type="text" th:field="*{phoneNumber}">
							<span class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>
						</div>

						<div class="form-group">
							<label for="accountStatus">帳號狀態</label>
							<select class="field" th:field="*{accountStatus}">
								<option th:each="entry : ${accountStatusMap}" th:value="${entry.key}" th:text="${entry.value}"></option>
							</select>
							<span class="error" th:if="${#fields.hasErrors('accountStatus')}" th:errors="*{accountStatus}"></span>
						</div>

						<div class="form-group">
							<label for="hiredate">入職日期</label>
							<input class="field" type="datetime-local" th:field="*{hiredate}">
							<span class="error" th:if="${#fields.hasErrors('hiredate')}" th:errors="*{hiredate}"></span>
						</div>

						<div class="form-group full">
							<label for="profilePic">照片</label>
							<input class="field" type="file" th:field="*{profilePic}" accept="image/*" data-pic-preview="#picPreview">
							<span class="form-note">不選擇新照片則保留原本的照片；選擇後會立即在下方預覽。</span>
							<img class="photo-preview" id="picPreview"
								th:src="@{/admin/DBGifReader} + '?adminId=' + ${adminVO.adminId}" alt="管理員照片">
						</div>

						<div class="form-group full page-actions">
							<a class="btn ghost" th:href="@{/admin/listAllAdmin}">取消</a>
							<button class="btn" type="submit">儲存修改</button>
						</div>
					</form>
				</div>
			</main>
		</div>
	</div>
	<script th:src="@{/js/login/common/ui.js}"></script>
</body>
</html>
