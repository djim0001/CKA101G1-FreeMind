<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理員列表｜諮由自在後台</title>
<link rel="stylesheet" th:href="@{/css/login/common/admin-base.css}" />
</head>
<body class="thy2-page">
	<div class="layout">
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('admin-list')}"></aside>
		<div class="main">
			<div th:replace="~{fragments/admin/adminTopbar :: topbar('帳號與權限')}"></div>
			<main class="content">
				<div class="page-head">
					<div>
						<h1>管理員列表</h1>
						<p>檢視與維護後台管理員帳號。</p>
					</div>
					<div class="page-actions">
						<a class="btn secondary" th:href="@{/admin/select_page}">依條件查詢</a>
						<a class="btn" th:href="@{/admin/addAdmin}">新增管理員</a>
					</div>
				</div>

				<div class="notice" th:if="${success != null}" th:text="${success}" data-flash-message></div>

				<div class="table-wrap">
					<table class="compact-table">
						<thead>
							<tr>
								<th>編號</th>
								<th>帳號</th>
								<th>狀態</th>
								<th>姓名</th>
								<th>手機</th>
								<th>入職日期</th>
								<th>照片</th>
								<th>操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="adminVO : ${adminListData}">
								<td th:text="${adminVO.adminId}"></td>
								<td th:text="${adminVO.adminAccount}"></td>
								<td>
									<span class="status"
										th:classappend="${adminVO.accountStatus == 1} ? 'green' : (${adminVO.accountStatus == 2} ? 'red' : 'amber')"
										th:text="${accountStatusMap.get(adminVO.accountStatus)}"></span>
								</td>
								<td th:text="${adminVO.name}"></td>
								<td th:text="${adminVO.phoneNumber}"></td>
								<td class="nowrap" th:text="${adminVO.hiredate}"></td>
								<td>
									<img class="photo-thumb" th:src="@{/admin/DBGifReader} + '?adminId=' + ${adminVO.adminId}" alt="管理員照片">
								</td>
								<td>
									<div class="actions">
										<form class="inline-form" method="post" th:action="@{/admin/getOne_For_Update}">
											<input type="hidden" name="adminId" th:value="${adminVO.adminId}">
											<button class="btn ghost" type="submit">修改</button>
										</form>
										<form class="inline-form" method="post" th:action="@{/admin/delete}"
											data-confirm-form="確定要刪除這位管理員嗎？此操作無法復原。">
											<input type="hidden" name="adminId" th:value="${adminVO.adminId}">
											<button class="btn danger" type="submit">刪除</button>
										</form>
										<a class="btn secondary" th:href="@{/admin/permissions/assign(adminId=${adminVO.adminId})}">權限設定</a>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="empty-state" th:if="${adminListData == null || adminListData.isEmpty()}">
					<h3>目前沒有管理員資料</h3>
					<p>點擊右上角「新增管理員」建立第一筆帳號。</p>
				</div>
			</main>
		</div>
	</div>
	<script th:src="@{/js/login/common/ui.js}"></script>
</body>
</html>
