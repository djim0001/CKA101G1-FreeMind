<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理員列表｜諮由自在後台</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/admin-page.css}" href="/css/admin-page.css" />
</head>

<body>

	<!-- ================= 頁首 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<div class="admin-shell">

		<!-- ================= 側欄 ================= -->
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('admin-list')}"></aside>

		<!-- ================= 主內容 ================= -->
		<main id="main-content" class="admin-main">

			<div class="crumb">
				<a th:href="@{/admin/home}" href="#">管理後台</a><span>/</span>
				<span class="current">管理員列表</span>
			</div>

			<div class="page-head">
				<div>
					<h1>管理員<em>列表</em></h1>
					<p>檢視與維護後台管理員帳號。</p>
				</div>
				<div class="page-actions">
					<a class="btn btn-ghost" th:href="@{/admin/select_page}" href="#">依條件查詢</a>
					<a class="btn btn-primary" th:href="@{/admin/addAdmin}" href="#">新增管理員</a>
				</div>
			</div>

			<div class="notice" th:if="${success != null}" th:text="${success}"></div>

			<div class="table-wrap" th:if="${adminListData != null and !adminListData.isEmpty()}">
				<table>
					<thead>
						<tr>
							<th>編號</th>
							<th>帳號</th>
							<th>狀態</th>
							<th>姓名</th>
							<th>手機</th>
							<th>入職日期</th>
							<th>照片</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="adminVO : ${adminListData}">
							<td th:text="${adminVO.adminId}"></td>
							<td th:text="${adminVO.adminAccount}"></td>
							<td>
								<span class="status"
									th:classappend="${adminVO.accountStatus == 1} ? 'green' : (${adminVO.accountStatus == 2} ? 'red' : 'amber')"
									th:text="${accountStatusMap.get(adminVO.accountStatus)}"></span>
							</td>
							<td th:text="${adminVO.name}"></td>
							<td th:text="${adminVO.phoneNumber}"></td>
							<td class="nowrap" th:text="${adminVO.hiredate}"></td>
							<td>
								<img class="photo-thumb" th:src="@{/admin/DBGifReader} + '?adminId=' + ${adminVO.adminId}" alt="管理員照片">
							</td>
							<td>
								<div class="actions">
									<form class="inline-form" method="post" th:action="@{/admin/getOne_For_Update}">
										<input type="hidden" name="adminId" th:value="${adminVO.adminId}">
										<button class="btn btn-ghost btn-sm" type="submit">修改</button>
									</form>
									<form class="inline-form" method="post" th:action="@{/admin/delete}"
										data-confirm-form="確定要刪除這位管理員嗎？此操作無法復原。">
										<input type="hidden" name="adminId" th:value="${adminVO.adminId}">
										<button class="btn btn-danger btn-sm" type="submit">刪除</button>
									</form>
									<a class="btn btn-ghost btn-sm" th:href="@{/admin/permissions/assign(adminId=${adminVO.adminId})}" href="#">權限設定</a>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="empty-state" th:if="${adminListData == null or adminListData.isEmpty()}">
				<h3>目前沒有管理員資料</h3>
				<p>點擊右上角「新增管理員」建立第一筆帳號。</p>
			</div>

		</main>
	</div>

	<!-- ================= 頁尾 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>

	<!-- 刪除前確認 -->
	<script>
	document.querySelectorAll('[data-confirm-form]').forEach(function (form) {
		form.addEventListener('submit', function (e) {
			if (!window.confirm(form.dataset.confirmForm)) e.preventDefault();
		});
	});
	</script>
</body>
</html>
