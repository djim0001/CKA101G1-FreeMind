	<p style="color:green;" th:if="${success != null}" th:text="${success}"></p>

	<a th:href="@{/admin/addAdmin}">add</a>
	<a th:href="@{/admin/select_page}">select_page</a>

	<table border="1">
		<tr>
			<th>編號</th><th>帳號</th><th>密碼</th><th>狀態</th><th>姓名</th><th>手機</th><th>入職日期</th><th>照片</th><th>操作</th>
		</tr>
		<tr th:each="adminVO : ${adminListData}">
			<td th:text="${adminVO.adminId}"></td>
			<td th:text="${adminVO.adminAccount}"></td>
			<td th:text="${adminVO.adminPassword}"></td>
			<td th:text="${accountStatusMap.get(adminVO.accountStatus)}"></td>
			<td th:text="${adminVO.name}"></td>
			<td th:text="${adminVO.phoneNumber}"></td>
			<td th:text="${adminVO.hiredate}"></td>
			<td><img th:src="@{/admin/DBGifReader} + '?adminId=' + ${adminVO.adminId}" width="150px"></td>
			<td>
				<form method="post" th:action="@{/admin/getOne_For_Update}" style="display:inline;">
					<input type="hidden" name="adminId" th:value="${adminVO.adminId}">
					<input type="submit" value="修改">
				</form>
				<form method="post" th:action="@{/admin/delete}" style="display:inline;">
					<input type="hidden" name="adminId" th:value="${adminVO.adminId}">
					<input type="submit" value="刪除">
				</form>
			</td>
		</tr>
	</table>
</body>
