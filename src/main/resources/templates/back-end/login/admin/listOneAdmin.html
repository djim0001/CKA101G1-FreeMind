<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理員詳細資料｜諮由自在後台</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/admin-page.css}" href="/css/admin-page.css" />
</head>

<body>

	<!-- ================= 頁首 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<div class="admin-shell">

		<!-- ================= 側欄 ================= -->
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('admin-list')}"></aside>

		<!-- ================= 主內容 ================= -->
		<main id="main-content" class="admin-main">

			<div class="crumb">
				<a th:href="@{/admin/home}" href="#">管理後台</a><span>/</span>
				<a th:href="@{/admin/listAllAdmin}" href="#">管理員列表</a><span>/</span>
				<span class="current">詳細資料</span>
			</div>

			<div class="page-head">
				<div>
					<h1>管理員<em>詳細資料</em></h1>
					<p>編號 <span th:text="${adminVO.adminId}"></span> 的帳號資訊。</p>
				</div>
				<div class="page-actions">
					<a class="btn btn-ghost" th:href="@{/admin/permissions/assign(adminId=${adminVO.adminId})}" href="#">權限設定</a>
					<a class="btn btn-ghost" th:href="@{/admin/listAllAdmin}" href="#">回管理員列表</a>
				</div>
			</div>

			<div class="notice" th:if="${success != null}" th:text="${success}"></div>

			<div class="grid-2">
				<div class="panel">
					<h2>基本資料</h2>
					<dl class="summary-list">
						<div>
							<dt>編號</dt>
							<dd th:text="${adminVO.adminId}"></dd>
						</div>
						<div>
							<dt>帳號</dt>
							<dd th:text="${adminVO.adminAccount}"></dd>
						</div>
						<div>
							<dt>帳號狀態</dt>
							<dd>
								<span class="status"
									th:classappend="${adminVO.accountStatus == 1} ? 'green' : (${adminVO.accountStatus == 2} ? 'red' : 'amber')"
									th:text="${accountStatusMap.get(adminVO.accountStatus)}"></span>
							</dd>
						</div>
						<div>
							<dt>姓名</dt>
							<dd th:text="${adminVO.name}"></dd>
						</div>
						<div>
							<dt>手機號碼</dt>
							<dd th:text="${adminVO.phoneNumber}"></dd>
						</div>
						<div>
							<dt>入職日期</dt>
							<dd th:text="${adminVO.hiredate}"></dd>
						</div>
					</dl>
				</div>
				<div class="panel">
					<h2>照片</h2>
					<img class="photo-preview" th:src="@{/admin/DBGifReader} + '?adminId=' + ${adminVO.adminId}" alt="管理員照片">
				</div>
			</div>

		</main>
	</div>

	<!-- ================= 頁尾 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>
</body>
</html>
