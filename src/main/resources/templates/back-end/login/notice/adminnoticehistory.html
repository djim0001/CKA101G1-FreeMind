<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>諮由自在｜通知歷史</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
	@font-face {
		font-family: 'OpenHuninn';
		src:
			url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff') format('woff'),
			url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf') format('truetype');
		font-weight: 400;
		font-style: normal;
		font-display: swap;
	}

	:root {
		--bg-warm: #FFFAEE;
		--bg-soothing: #C2D9ED;
		--blue-soft: #DCEAF5;
		--orange: #F58E6B;
		--orange-deep: #E5764F;
		--pink: #FBD0BE;
		--pink-soft: #FDE6DB;
		--ink: #3A4B53;
		--ink-soft: #6b7981;
		--white: #FFFFFF;
		--line: #ecdfce;
		--shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
		--shadow-md: 0 16px 44px rgba(58, 75, 83, .13);
		--radius-lg: 34px;
		--radius-md: 22px;
		--serif: "OpenHuninn", "Noto Sans TC", sans-serif;
		--zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
		--sans: "Noto Sans TC", system-ui, sans-serif;
		--script: "Caveat", "OpenHuninn", cursive;
		--display-en: "Baloo 2", sans-serif;
	}

	* { box-sizing: border-box; }
	html { min-width: 320px; }

	body {
		display: flex;
		min-width: 320px;
		min-height: 100vh;
		flex-direction: column;
		margin: 0;
		color: var(--ink);
		background: var(--bg-warm);
		font-family: var(--sans);
		line-height: 1.78;
		-webkit-font-smoothing: antialiased;
		overflow-x: hidden;
	}

	a { color: inherit; text-decoration: none; }
	img, svg { display: block; max-width: 100%; }

	.wrap { width: min(780px, 92vw); margin-inline: auto; }

	main {
		width: 100%;
		flex: 1;
		padding: clamp(1.25rem, 2vw, 1.75rem) 0 4rem;
	}

	.page-header {
		display: flex;
		align-items: flex-end;
		justify-content: space-between;
		gap: 1.5rem;
		margin-bottom: .9rem;
		padding-bottom: 1.4rem;
		border-bottom: 1px solid var(--line);
	}

	.page-kicker {
		display: block;
		margin-bottom: .35rem;
		color: var(--orange);
		font-size: .75rem;
		font-weight: 700;
		letter-spacing: .16em;
		text-transform: uppercase;
	}

	h1 {
		margin: 0;
		color: var(--ink);
		font-family: var(--serif);
		font-size: clamp(1.5rem, 3vw, 2rem);
		line-height: 1.3;
		letter-spacing: -.02em;
	}

	.header-action {
		flex: 0 0 auto;
		padding: .55rem 1.3rem;
		border: 1px solid var(--line);
		border-radius: 999px;
		background: var(--white);
		color: var(--ink);
		font-size: .85rem;
		font-weight: 700;
		box-shadow: var(--shadow-sm);
		transition: border-color .16s ease, background .16s ease, color .16s ease, transform .16s ease;
	}

	.header-action:hover {
		border-color: var(--orange);
		background: var(--orange-deep);
		color: var(--white);
		transform: translateY(-2px);
	}

	.person-line {
		margin: 0 0 1.5rem;
		font-size: .9rem;
		color: var(--ink-soft);
	}

	.toolbar {
		display: flex;
		gap: .5rem;
		flex-wrap: wrap;
		margin-bottom: 1.25rem;
	}

	.toolbar a {
		padding: .4rem 1.05rem;
		border: 1px solid var(--line);
		border-radius: 999px;
		background: var(--white);
		color: var(--ink-soft);
		font-size: .85rem;
		font-weight: 700;
		transition: background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
	}

	.toolbar a.active,
	.toolbar a:hover {
		border-color: var(--orange);
		background: var(--orange);
		color: var(--white);
		transform: translateY(-1px);
	}

	.notice-list { display: flex; flex-direction: column; gap: .85rem; }

	.notice-card {
		padding: 1.1rem 1.35rem;
		border: 1px solid var(--line);
		border-radius: var(--radius-md);
		background: var(--white);
		box-shadow: var(--shadow-sm);
	}

	.notice-head {
		display: flex;
		align-items: center;
		gap: .5rem;
		margin-bottom: .5rem;
		flex-wrap: wrap;
	}

	.type-badge {
		padding: .15rem .75rem;
		border-radius: 999px;
		background: var(--blue-soft);
		color: #4d7ea0;
		font-size: .76rem;
		font-weight: 700;
	}

	.sender { font-size: .76rem; color: var(--ink-soft); }

	.read-tag {
		padding: .1rem .6rem;
		border-radius: 999px;
		font-size: .74rem;
		font-weight: 700;
	}

	.read-tag.yes { background: #eaf6ec; color: #2e7d43; }
	.read-tag.no { background: #fdf1e6; color: #b26a00; }

	.time { margin-left: auto; font-size: .76rem; color: var(--ink-soft); }

	.content {
		margin: 0;
		font-size: .92rem;
		color: var(--ink);
		white-space: pre-wrap;
		word-break: break-all;
	}

	.empty-hint { text-align: center; color: var(--ink-soft); padding: 2.25rem 0; }

	:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

	@media (max-width: 640px) {
		.page-header { display: block; }
		.header-action { display: inline-block; margin-top: .8rem; }
	}

	@media (prefers-reduced-motion: reduce) {
		* { transition: none !important; }
	}
</style>
</head>
<body>
	<!-- ================= 導覽列 放在 body 內的最上方 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<main id="main-content">
		<div class="wrap">
			<section class="page-header">
				<div>
					<span class="page-kicker">Notification History</span>
					<h1>通知歷史</h1>
				</div>
				<a class="header-action" th:href="@{/admin/notice(role=${role})}">返回查詢</a>
			</section>

			<p class="person-line"
				th:text="'對象:' + ${person.name} + '(' + ${person.account} + ',編號 ' + ${person.id} + ')'">
				對象:王小明(psych01,編號 1)</p>

			<!-- 種類篩選(字典依身分不同) -->
			<div class="toolbar">
				<a th:classappend="${type == null} ? 'active'"
					th:href="@{/admin/notice/history(role=${role}, id=${person.id})}">全部</a>
				<th:block th:if="${role == 'psych'}">
					<a th:classappend="${type != null && type == 0} ? 'active'"
						th:href="@{/admin/notice/history(role=${role}, id=${person.id}, type=0)}">文章審核</a>
					<a th:classappend="${type != null && type == 1} ? 'active'"
						th:href="@{/admin/notice/history(role=${role}, id=${person.id}, type=1)}">預約</a>
					<a th:classappend="${type != null && type == 2} ? 'active'"
						th:href="@{/admin/notice/history(role=${role}, id=${person.id}, type=2)}">課程</a>
				</th:block>
				<th:block th:if="${role == 'member'}">
					<a th:classappend="${type != null && type == 0} ? 'active'"
						th:href="@{/admin/notice/history(role=${role}, id=${person.id}, type=0)}">預約</a>
					<a th:classappend="${type != null && type == 1} ? 'active'"
						th:href="@{/admin/notice/history(role=${role}, id=${person.id}, type=1)}">課程</a>
					<a th:classappend="${type != null && type == 2} ? 'active'"
						th:href="@{/admin/notice/history(role=${role}, id=${person.id}, type=2)}">活動</a>
				</th:block>
			</div>

			<!-- 心理師的通知 -->
			<div class="notice-list" th:if="${role == 'psych'}">
				<div class="notice-card" th:each="n : ${psychNotices}">
					<div class="notice-head">
						<span class="type-badge" th:text="${n.noticeTypeMsg}">預約通知</span>
						<span class="sender"
							th:text="${n.adminId == 0 ? '發送者:系統' : '發送者:管理員(編號' + n.adminId + ')'}">發送者:系統</span>
						<span class="read-tag yes" th:if="${n.isRead}">已讀</span>
						<span class="read-tag no" th:unless="${n.isRead}">未讀</span>
						<span class="time" th:text="${#dates.format(n.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-17 10:00</span>
					</div>
					<p class="content" th:text="${n.noticeContent}">內容</p>
				</div>
				<p class="empty-hint" th:if="${#lists.isEmpty(psychNotices)}">此對象沒有符合的通知</p>
			</div>

			<!-- 會員的通知 -->
			<div class="notice-list" th:if="${role == 'member'}">
				<div class="notice-card" th:each="n : ${memberNotices}">
					<div class="notice-head">
						<span class="type-badge" th:text="${n.noticeTypeMsg}">預約通知</span>
						<span class="sender"
							th:text="${n.adminId == 0 ? '發送者:系統' : '發送者:管理員(編號' + n.adminId + ')'}">發送者:系統</span>
						<span class="read-tag yes" th:if="${n.isRead}">已讀</span>
						<span class="read-tag no" th:unless="${n.isRead}">未讀</span>
						<span class="time" th:text="${#dates.format(n.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-17 10:00</span>
					</div>
					<p class="content" th:text="${n.noticeContent}">內容</p>
				</div>
				<p class="empty-hint" th:if="${#lists.isEmpty(memberNotices)}">此對象沒有符合的通知</p>
			</div>
		</div>
	</main>

	<!-- ================= Footer 放在 body 結束前 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>
</body>
</html>
