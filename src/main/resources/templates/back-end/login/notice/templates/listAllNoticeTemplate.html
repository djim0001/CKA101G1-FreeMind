<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>通知範本列表｜諮由自在後台</title>
<link rel="stylesheet" th:href="@{/css/login/common/admin-base.css}" />
<link rel="stylesheet" th:href="@{/css/login/common/admin-profile-theme.css}" />
</head>
<body class="thy2-page thy2-profile">
	<div class="layout">
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('notice-template')}"></aside>
		<div class="main">
			<div th:replace="~{fragments/admin/adminTopbar :: topbar('訊息與公告')}"></div>
			<main class="content">
				<div class="page-head">
					<div>
						<h1>通知範本列表</h1>
						<p>維護寄送通知時可套用的內容範本。</p>
					</div>
					<div class="page-actions">
						<a class="btn" th:href="@{/admin/notice/addNoticeTemplate}">新增範本</a>
					</div>
				</div>

				<div class="notice" th:if="${success != null}" th:text="${success}" data-flash-message></div>

				<div class="table-wrap">
					<table class="compact-table">
						<thead>
							<tr>
								<th>範本編號</th>
								<th>員工編號</th>
								<th>範本內容</th>
								<th>操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="noticeTemplate : ${noticeTemplateListData}">
								<td th:text="${noticeTemplate.templateId}"></td>
								<td th:text="${noticeTemplate.adminId}"></td>
								<td th:text="${noticeTemplate.templateContent}"></td>
								<td>
									<div class="actions">
										<form class="inline-form" method="post" th:action="@{/admin/notice/getOne_For_Update}">
											<input type="hidden" name="templateId" th:value="${noticeTemplate.templateId}">
											<button class="btn ghost" type="submit">修改</button>
										</form>
										<form class="inline-form" method="post" th:action="@{/admin/notice/delete}"
											data-confirm-form="確定要刪除這個範本嗎？此操作無法復原。">
											<input type="hidden" name="templateId" th:value="${noticeTemplate.templateId}">
											<button class="btn danger" type="submit">刪除</button>
										</form>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="empty-state" th:if="${noticeTemplateListData == null || noticeTemplateListData.isEmpty()}">
					<h3>目前沒有通知範本</h3>
					<p>點擊右上角「新增範本」建立第一筆範本。</p>
				</div>
			</main>
		</div>
	</div>
	<script th:src="@{/js/login/common/ui.js}"></script>
</body>
</html>
