<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>通知範本列表｜諮由自在後台</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/admin-page.css}" href="/css/admin-page.css" />
</head>

<body>

	<!-- ================= 頁首 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<div class="admin-shell">

		<!-- ================= 側欄 ================= -->
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('notice-template')}"></aside>

		<!-- ================= 主內容 ================= -->
		<main id="main-content" class="admin-main">

			<div class="crumb">
				<a th:href="@{/admin/home}" href="#">管理後台</a><span>/</span>
				<span class="current">通知範本</span>
			</div>

			<div class="page-head">
				<div>
					<h1>通知<em>範本</em></h1>
					<p>維護寄送通知時可套用的內容範本。</p>
				</div>
				<div class="page-actions">
					<a class="btn btn-primary" th:href="@{/admin/notice/addNoticeTemplate}" href="#">新增範本</a>
				</div>
			</div>

			<div class="notice" th:if="${success != null}" th:text="${success}"></div>

			<div class="table-wrap" th:if="${noticeTemplateListData != null and !noticeTemplateListData.isEmpty()}">
				<table>
					<thead>
						<tr>
							<th>範本編號</th>
							<th>員工編號</th>
							<th>範本內容</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="noticeTemplate : ${noticeTemplateListData}">
							<td th:text="${noticeTemplate.templateId}"></td>
							<td th:text="${noticeTemplate.adminId}"></td>
							<td th:text="${noticeTemplate.templateContent}"></td>
							<td>
								<div class="actions">
									<form class="inline-form" method="post" th:action="@{/admin/notice/getOne_For_Update}">
										<input type="hidden" name="templateId" th:value="${noticeTemplate.templateId}">
										<button class="btn btn-ghost btn-sm" type="submit">修改</button>
									</form>
									<form class="inline-form" method="post" th:action="@{/admin/notice/delete}"
										data-confirm-form="確定要刪除這個範本嗎？此操作無法復原。">
										<input type="hidden" name="templateId" th:value="${noticeTemplate.templateId}">
										<button class="btn btn-danger btn-sm" type="submit">刪除</button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="empty-state" th:if="${noticeTemplateListData == null or noticeTemplateListData.isEmpty()}">
				<h3>目前沒有通知範本</h3>
				<p>點擊右上角「新增範本」建立第一筆範本。</p>
			</div>

		</main>
	</div>

	<!-- ================= 頁尾 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>

	<!-- 刪除前確認 -->
	<script>
	document.querySelectorAll('[data-confirm-form]').forEach(function (form) {
		form.addEventListener('submit', function (e) {
			if (!window.confirm(form.dataset.confirmForm)) e.preventDefault();
		});
	});
	</script>
</body>
</html>
