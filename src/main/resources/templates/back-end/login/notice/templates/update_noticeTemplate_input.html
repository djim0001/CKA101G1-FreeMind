<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>修改通知範本｜諮由自在後台</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/admin-page.css}" href="/css/admin-page.css" />
</head>

<body>

	<!-- ================= 頁首 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<div class="admin-shell">

		<!-- ================= 側欄 ================= -->
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('notice-template')}"></aside>

		<!-- ================= 主內容 ================= -->
		<main id="main-content" class="admin-main">

			<div class="crumb">
				<a th:href="@{/admin/home}" href="#">管理後台</a><span>/</span>
				<a th:href="@{/admin/notice/listAllNoticeTemplate}" href="#">通知範本</a><span>/</span>
				<span class="current">修改範本</span>
			</div>

			<div class="page-head">
				<div>
					<h1>修改<em>通知範本</em></h1>
					<p>調整範本內容。</p>
				</div>
				<div class="page-actions">
					<a class="btn btn-ghost" th:href="@{/admin/notice/listAllNoticeTemplate}" href="#">回範本列表</a>
				</div>
			</div>

			<div class="panel">
				<form class="form-grid" method="post" th:action="@{/admin/notice/update}" th:object="${noticeTemplate}">

					<input type="hidden" th:field="*{templateId}">

					<dl class="summary-list full">
						<div>
							<dt>範本編號</dt>
							<dd th:text="*{templateId}"></dd>
						</div>
					</dl>

					<div class="form-group full">
						<label for="templateContent">範本內容</label>
						<textarea class="field" id="templateContent" th:field="*{templateContent}" maxlength="1000"></textarea>
						<span class="error" th:if="${#fields.hasErrors('templateContent')}" th:errors="*{templateContent}"></span>
					</div>

					<div class="form-group full page-actions">
						<a class="btn btn-ghost" th:href="@{/admin/notice/listAllNoticeTemplate}" href="#">取消</a>
						<button class="btn btn-primary" type="submit">修改</button>
					</div>
				</form>
			</div>

		</main>
	</div>

	<!-- ================= 頁尾 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>
</body>
</html>
