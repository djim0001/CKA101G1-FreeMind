<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>新增通知範本｜諮由自在後台</title>
<link rel="stylesheet" th:href="@{/css/login/common/admin-base.css}" />
<link rel="stylesheet" th:href="@{/css/login/common/admin-profile-theme.css}" />
</head>
<body class="thy2-page thy2-profile">
	<div class="layout">
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('notice-template')}"></aside>
		<div class="main">
			<div th:replace="~{fragments/admin/adminTopbar :: topbar('訊息與公告')}"></div>
			<main class="content">
				<div class="page-head">
					<div>
						<h1>新增通知範本</h1>
						<p>建立可重複套用的通知內容範本。</p>
					</div>
					<div class="page-actions">
						<a class="btn ghost" th:href="@{/admin/notice/listAllNoticeTemplate}">回範本列表</a>
					</div>
				</div>

				<div class="panel">
					<form class="form-grid" method="post" th:action="@{/admin/notice/insert}" th:object="${noticeTemplate}">
						<div class="form-group full">
							<label for="templateContent">範本內容</label>
							<textarea class="field" id="templateContent" th:field="*{templateContent}" maxlength="1000" placeholder="輸入範本內容…"></textarea>
							<span class="error" th:if="${#fields.hasErrors('templateContent')}" th:errors="*{templateContent}"></span>
						</div>

						<div class="form-group full page-actions">
							<a class="btn ghost" th:href="@{/admin/notice/listAllNoticeTemplate}">取消</a>
							<button class="btn" type="submit">新增</button>
						</div>
					</form>
				</div>
			</main>
		</div>
	</div>
	<script th:src="@{/js/login/common/ui.js}"></script>
</body>
</html>
