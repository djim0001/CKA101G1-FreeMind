<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>諮由自在｜通知管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<style>
	@font-face {
		font-family: 'OpenHuninn';
		src:
			url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff') format('woff'),
			url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf') format('truetype');
		font-weight: 400;
		font-style: normal;
		font-display: swap;
	}

	:root {
		--bg-warm: #FFFAEE;
		--bg-soothing: #C2D9ED;
		--blue-soft: #DCEAF5;
		--orange: #F58E6B;
		--orange-deep: #E5764F;
		--pink: #FBD0BE;
		--pink-soft: #FDE6DB;
		--ink: #3A4B53;
		--ink-soft: #6b7981;
		--white: #FFFFFF;
		--line: #ecdfce;
		--shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
		--shadow-md: 0 16px 44px rgba(58, 75, 83, .13);
		--radius-lg: 34px;
		--radius-md: 22px;
		--serif: "OpenHuninn", "Noto Sans TC", sans-serif;
		--zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
		--sans: "Noto Sans TC", system-ui, sans-serif;
		--script: "Caveat", "OpenHuninn", cursive;
		--display-en: "Baloo 2", sans-serif;
	}

	* { box-sizing: border-box; }
	html { min-width: 320px; }

	body {
		display: flex;
		min-width: 320px;
		min-height: 100vh;
		flex-direction: column;
		margin: 0;
		color: var(--ink);
		background: var(--bg-warm);
		font-family: var(--sans);
		line-height: 1.78;
		-webkit-font-smoothing: antialiased;
		overflow-x: hidden;
	}

	a { color: inherit; text-decoration: none; }
	button { border: 0; background: none; font-family: inherit; cursor: pointer; }
	img, svg { display: block; max-width: 100%; }

	.wrap { width: min(880px, 92vw); margin-inline: auto; }

	main {
		width: 100%;
		flex: 1;
		padding: clamp(1.25rem, 2vw, 1.75rem) 0 4rem;
	}

	.page-header {
		display: flex;
		align-items: flex-end;
		justify-content: space-between;
		gap: 1.5rem;
		margin-bottom: 1.75rem;
		padding-bottom: 1.4rem;
		border-bottom: 1px solid var(--line);
	}

	.page-kicker {
		display: block;
		margin-bottom: .35rem;
		color: var(--orange);
		font-size: .75rem;
		font-weight: 700;
		letter-spacing: .16em;
		text-transform: uppercase;
	}

	h1 {
		margin: 0;
		color: var(--ink);
		font-family: var(--serif);
		font-size: clamp(1.6rem, 3vw, 2.15rem);
		line-height: 1.3;
		letter-spacing: -.02em;
	}

	.header-action {
		flex: 0 0 auto;
		padding: .55rem 1.3rem;
		border-radius: 999px;
		background: var(--orange);
		color: var(--white);
		font-size: .85rem;
		font-weight: 700;
		box-shadow: var(--shadow-sm);
		transition: background .16s ease, transform .16s ease;
	}

	.header-action:hover { background: var(--orange-deep); transform: translateY(-2px); }

	.alert {
		margin: 0 0 1.25rem;
		padding: .85rem 1.15rem;
		border: 1px solid #cfe6d3;
		border-radius: 14px;
		background: #eef8f0;
		color: #2e7d43;
		font-size: .9rem;
	}

	.card {
		margin-bottom: 1.25rem;
		padding: 1.5rem;
		border: 1px solid var(--line);
		border-radius: var(--radius-md);
		background: var(--white);
		box-shadow: var(--shadow-sm);
	}

	.card.table-card { overflow-x: auto; box-shadow: var(--shadow-md); }

	.filter-form {
		display: flex;
		flex-wrap: wrap;
		gap: .65rem;
		align-items: center;
	}

	.filter-form select,
	.filter-form input[type="text"] {
		padding: .6rem .85rem;
		border: 1px solid var(--line);
		border-radius: 12px;
		background: var(--bg-warm);
		font-size: .9rem;
		font-family: inherit;
		color: var(--ink);
		outline: none;
		transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
	}

	.filter-form input[type="text"] { flex: 1; min-width: 180px; }

	.filter-form select:focus,
	.filter-form input:focus {
		border-color: var(--orange);
		background: var(--white);
		box-shadow: 0 0 0 3px rgba(245, 142, 107, .18);
	}

	.btn-primary {
		padding: .6rem 1.4rem;
		border-radius: 999px;
		background: var(--orange);
		color: var(--white);
		font-size: .9rem;
		font-weight: 700;
		font-family: inherit;
		cursor: pointer;
		transition: background .16s ease, transform .16s ease;
	}

	.btn-primary:hover { background: var(--orange-deep); transform: translateY(-2px); }

	table { width: 100%; border-collapse: collapse; font-size: .9rem; }

	th, td {
		padding: .8rem .85rem;
		text-align: left;
		border-bottom: 1px solid var(--line);
	}

	th {
		color: var(--ink-soft);
		font-weight: 700;
		background: var(--pink-soft);
		white-space: nowrap;
	}

	thead th:first-child { border-top-left-radius: 12px; }
	thead th:last-child { border-top-right-radius: 12px; }
	tr:hover td { background: var(--bg-warm); }

	.history-link {
		display: inline-block;
		padding: .4rem 1rem;
		border: 1px solid var(--line);
		border-radius: 999px;
		background: var(--pink-soft);
		color: var(--ink-soft);
		font-size: .8rem;
		font-weight: 700;
		white-space: nowrap;
		transition: background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
	}

	.history-link:hover {
		border-color: var(--orange);
		background: var(--orange);
		color: var(--white);
		transform: translateY(-1px);
	}

	.empty-hint { color: var(--ink-soft); text-align: center; padding: 1.75rem 0; }

	:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

	@media (max-width: 640px) {
		.page-header { display: block; }
		.header-action { display: inline-block; margin-top: .8rem; }
	}

	@media (prefers-reduced-motion: reduce) {
		* { transition: none !important; }
	}
</style>
</head>
<body>
	<!-- ================= 導覽列 放在 body 內的最上方 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<main id="main-content">
		<div class="wrap">
			<section class="page-header">
				<div>
					<span class="page-kicker">Notifications</span>
					<h1>通知管理</h1>
				</div>
				<a class="header-action" th:href="@{/admin/notice/send}">發送通知</a>
			</section>

			<p class="alert" th:if="${alertMessage}" th:text="${alertMessage}"></p>

			<!-- 查人:身分 + 帳號/姓名關鍵字 -->
			<div class="card">
				<form th:action="@{/admin/notice}" method="get" class="filter-form">
					<select name="role">
						<option value="member" th:selected="${role == 'member'}">會員</option>
						<option value="psych" th:selected="${role == 'psych'}">心理師</option>
					</select>
					<input type="text" name="keyword" placeholder="帳號或姓名(空白=列出全部)"
						th:value="${keyword}" />
					<button type="submit" class="btn-primary">查詢</button>
				</form>
			</div>

			<!-- 人員清單:點「查看通知」進該人的通知歷史 -->
			<div class="card table-card">
				<table>
					<thead>
						<tr>
							<th>編號</th>
							<th>帳號</th>
							<th>姓名</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="p : ${people}">
							<td th:text="${p.id}">1</td>
							<td th:text="${p.account}">account01</td>
							<td th:text="${p.name}">王小明</td>
							<td>
								<a class="history-link"
									th:href="@{/admin/notice/history(role=${role}, id=${p.id})}">查看通知</a>
							</td>
						</tr>
					</tbody>
				</table>
				<p class="empty-hint" th:if="${#lists.isEmpty(people)}">查無符合的人員</p>
			</div>
		</div>
	</main>

	<!-- ================= Footer 放在 body 結束前 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>
</body>
</html>
