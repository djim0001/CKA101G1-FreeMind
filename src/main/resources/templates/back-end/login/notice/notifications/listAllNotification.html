<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>系統公告列表｜諮由自在後台</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/admin-page.css}" href="/css/admin-page.css" />
</head>

<body>

	<!-- ================= 頁首 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<div class="admin-shell">

		<!-- ================= 側欄 ================= -->
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('notification')}"></aside>

		<!-- ================= 主內容 ================= -->
		<main id="main-content" class="admin-main">

			<div class="crumb">
				<a th:href="@{/admin/home}" href="#">管理後台</a><span>/</span>
				<span class="current">系統公告</span>
			</div>

			<div class="page-head">
				<div>
					<h1>系統<em>公告</em></h1>
					<p>建立、發布與維護顯示於首頁的系統公告。</p>
				</div>
				<div class="page-actions">
					<a class="btn btn-primary" th:href="@{/admin/notifications/addNotification}" href="#">新增公告</a>
				</div>
			</div>

			<div class="notice" th:if="${success != null}" th:text="${success}"></div>

			<div class="table-wrap" th:if="${notificationListData != null and !notificationListData.isEmpty()}">
				<table>
					<thead>
						<tr>
							<th>公告編號</th>
							<th>員工編號</th>
							<th>內容</th>
							<th>建立時間</th>
							<th>狀態</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="notification : ${notificationListData}">
							<td th:text="${notification.noticeId}"></td>
							<td th:text="${notification.adminId}"></td>
							<td th:text="${notification.systemContent}"></td>
							<td class="nowrap" th:text="${#dates.format(notification.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
							<td>
								<span class="status"
									th:classappend="${notification.noticeStatus == 1} ? 'green' : ''"
									th:text="${noticeStatusMap.get(notification.noticeStatus)}"></span>
							</td>
							<td>
								<div class="actions">
									<form class="inline-form" th:if="${notification.noticeStatus == 0}"
										method="post" th:action="@{/admin/notifications/publish}">
										<input type="hidden" name="noticeId" th:value="${notification.noticeId}">
										<button class="btn btn-primary btn-sm" type="submit">發布</button>
									</form>
									<form class="inline-form" th:if="${notification.noticeStatus == 1}"
										method="post" th:action="@{/admin/notifications/unpublish}">
										<input type="hidden" name="noticeId" th:value="${notification.noticeId}">
										<button class="btn btn-ghost btn-sm" type="submit">撤下</button>
									</form>
									<form class="inline-form" method="post" th:action="@{/admin/notifications/getOne_For_Update}">
										<input type="hidden" name="noticeId" th:value="${notification.noticeId}">
										<button class="btn btn-ghost btn-sm" type="submit">修改</button>
									</form>
									<form class="inline-form" method="post" th:action="@{/admin/notifications/delete}"
										data-confirm-form="確定要刪除這則公告嗎？此操作無法復原。">
										<input type="hidden" name="noticeId" th:value="${notification.noticeId}">
										<button class="btn btn-danger btn-sm" type="submit">刪除</button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="empty-state" th:if="${notificationListData == null or notificationListData.isEmpty()}">
				<h3>目前沒有系統公告</h3>
				<p>點擊右上角「新增公告」建立第一則公告。</p>
			</div>

		</main>
	</div>

	<!-- ================= 頁尾 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>

	<!-- 刪除前確認 -->
	<script>
	document.querySelectorAll('[data-confirm-form]').forEach(function (form) {
		form.addEventListener('submit', function (e) {
			if (!window.confirm(form.dataset.confirmForm)) e.preventDefault();
		});
	});
	</script>
</body>
</html>
