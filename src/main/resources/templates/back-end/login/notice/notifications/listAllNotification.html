<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>系統公告列表｜諮由自在後台</title>
<link rel="stylesheet" th:href="@{/css/login/common/admin-base.css}" />
<link rel="stylesheet" th:href="@{/css/login/common/admin-profile-theme.css}" />
</head>
<body class="thy2-page thy2-profile">
	<div class="layout">
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('notification')}"></aside>
		<div class="main">
			<div th:replace="~{fragments/admin/adminTopbar :: topbar('訊息與公告')}"></div>
			<main class="content">
				<div class="page-head">
					<div>
						<h1>系統公告列表</h1>
						<p>建立、發布與維護顯示於首頁的系統公告。</p>
					</div>
					<div class="page-actions">
						<a class="btn" th:href="@{/admin/notifications/addNotification}">新增公告</a>
					</div>
				</div>

				<div class="notice" th:if="${success != null}" th:text="${success}" data-flash-message></div>

				<div class="table-wrap">
					<table class="compact-table">
						<thead>
							<tr>
								<th>公告編號</th>
								<th>員工編號</th>
								<th>內容</th>
								<th>建立時間</th>
								<th>狀態</th>
								<th>操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="notification : ${notificationListData}">
								<td th:text="${notification.noticeId}"></td>
								<td th:text="${notification.adminId}"></td>
								<td th:text="${notification.systemContent}"></td>
								<td class="nowrap" th:text="${#dates.format(notification.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
								<td>
									<span class="status"
										th:classappend="${notification.noticeStatus == 1} ? 'green' : ''"
										th:text="${noticeStatusMap.get(notification.noticeStatus)}"></span>
								</td>
								<td>
									<div class="actions">
										<form class="inline-form" th:if="${notification.noticeStatus == 0}" method="post" th:action="@{/admin/notifications/publish}">
											<input type="hidden" name="noticeId" th:value="${notification.noticeId}">
											<button class="btn" type="submit">發布</button>
										</form>
										<form class="inline-form" th:if="${notification.noticeStatus == 1}" method="post" th:action="@{/admin/notifications/unpublish}">
											<input type="hidden" name="noticeId" th:value="${notification.noticeId}">
											<button class="btn secondary" type="submit">撤下</button>
										</form>
										<form class="inline-form" method="post" th:action="@{/admin/notifications/getOne_For_Update}">
											<input type="hidden" name="noticeId" th:value="${notification.noticeId}">
											<button class="btn ghost" type="submit">修改</button>
										</form>
										<form class="inline-form" method="post" th:action="@{/admin/notifications/delete}"
											data-confirm-form="確定要刪除這則公告嗎？此操作無法復原。">
											<input type="hidden" name="noticeId" th:value="${notification.noticeId}">
											<button class="btn danger" type="submit">刪除</button>
										</form>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="empty-state" th:if="${notificationListData == null || notificationListData.isEmpty()}">
					<h3>目前沒有系統公告</h3>
					<p>點擊右上角「新增公告」建立第一則公告。</p>
				</div>
			</main>
		</div>
	</div>
	<script th:src="@{/js/login/common/ui.js}"></script>
</body>
</html>
