<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>修改系統公告｜諮由自在後台</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
<link rel="stylesheet" type="text/css" th:href="@{/css/admin-page.css}" href="/css/admin-page.css" />
</head>

<body>

	<!-- ================= 頁首 ================= -->
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<div class="admin-shell">

		<!-- ================= 側欄 ================= -->
		<aside th:replace="~{fragments/admin/adminSidebar :: sidebar('notification')}"></aside>

		<!-- ================= 主內容 ================= -->
		<main id="main-content" class="admin-main">

			<div class="crumb">
				<a th:href="@{/admin/home}" href="#">管理後台</a><span>/</span>
				<a th:href="@{/admin/notifications/listAllNotification}" href="#">系統公告</a><span>/</span>
				<span class="current">修改公告</span>
			</div>

			<div class="page-head">
				<div>
					<h1>修改<em>系統公告</em></h1>
					<p>調整公告內容與顯示狀態。</p>
				</div>
				<div class="page-actions">
					<a class="btn btn-ghost" th:href="@{/admin/notifications/listAllNotification}" href="#">回公告列表</a>
				</div>
			</div>

			<div class="panel">
				<form class="form-grid" method="post" th:action="@{/admin/notifications/update}" th:object="${notification}">

					<input type="hidden" th:field="*{noticeId}">

					<dl class="summary-list full">
						<div>
							<dt>公告編號</dt>
							<dd th:text="*{noticeId}"></dd>
						</div>
						<div>
							<dt>建立時間</dt>
							<dd th:text="${notification.createdAt != null ? #dates.format(notification.createdAt, 'yyyy-MM-dd HH:mm') : ''}"></dd>
						</div>
					</dl>

					<div class="form-group full">
						<label for="systemContent">公告內容</label>
						<textarea class="field" id="systemContent" th:field="*{systemContent}" maxlength="1000"></textarea>
						<span class="error" th:if="${#fields.hasErrors('systemContent')}" th:errors="*{systemContent}"></span>
					</div>

					<div class="form-group">
						<label for="noticeStatus">公告狀態</label>
						<select class="field" id="noticeStatus" th:field="*{noticeStatus}">
							<option th:each="entry : ${noticeStatusMap}" th:value="${entry.key}" th:text="${entry.value}"></option>
						</select>
						<span class="error" th:if="${#fields.hasErrors('noticeStatus')}" th:errors="*{noticeStatus}"></span>
					</div>

					<div class="form-group full page-actions">
						<a class="btn btn-ghost" th:href="@{/admin/notifications/listAllNotification}" href="#">取消</a>
						<button class="btn btn-primary" type="submit">修改</button>
					</div>
				</form>
			</div>

		</main>
	</div>

	<!-- ================= 頁尾 ================= -->
	<div th:replace="~{fragments/adminFooter :: footer}"></div>
</body>
</html>
