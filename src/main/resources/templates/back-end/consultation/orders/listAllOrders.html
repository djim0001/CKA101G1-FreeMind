<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>諮商訂單列表</title>
</head>
<body>
    <h3>諮商訂單列表</h3>

    <span style="color:green;" th:if="${success != null}" th:text="${success}"></span>

    <table border="1">
        <tr>
            <th>訂單編號</th>
            <th>會員編號</th>
            <th>心理師編號</th>
            <th>開始時間</th>
            <th>結束時間</th>
            <th>訂單狀態</th>
            <th>諮詢費</th>
            <th>來訪目的</th>
            <th>操作</th>
        </tr>
        <tr th:each="order : ${ordersListData}">
            <td th:text="${order.orderId}"></td>
            <td th:text="${order.member.memberId}"></td>
            <td th:text="${order.psychologist.psychId}"></td>
            <td th:text="${#temporals.format(order.consStart, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${#temporals.format(order.consEnd, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:switch="${order.orderStatus}">
                <span th:case="0">待確認</span>
                <span th:case="1">已確認</span>
                <span th:case="2">已取消</span>
                <span th:case="3">未出席</span>
                <span th:case="4">已完成</span>
            </td>
            <td th:text="${order.psychFee}"></td>
            <td th:switch="${order.visitPurpose}">
                <span th:case="'emotion'">情緒困擾</span>
                <span th:case="'stress'">壓力調適</span>
                <span th:case="'relationship'">人際關係</span>
                <span th:case="'family'">家庭問題</span>
                <span th:case="'career'">職涯困惑</span>
                <span th:case="'academic'">課業壓力</span>
                <span th:case="'self_growth'">自我探索</span>
                <span th:case="'sleep'">睡眠問題</span>
                <span th:case="'anxiety'">焦慮傾向</span>
                <span th:case="'other'">其他</span>
            </td>
            <td>
                <form method="post" th:action="@{/orders/viewDetail}">
					<input type="hidden" name="orderId" th:value="${order.orderId}">
					<input type="submit" value="查看詳情">
				</form>
                <form method="post" th:action="@{/orders/getOne_For_Update}">
                    <input type="hidden" name="orderId" th:value="${order.orderId}">
                    <input type="submit" value="修改">
                </form>
                <form method="post" th:action="@{/orders/delete}">
                    <input type="hidden" name="orderId" th:value="${order.orderId}">
                    <input type="submit" value="刪除"
                           onclick="return confirm('確定要刪除此筆訂單嗎？')">
                </form>
            </td>
        </tr>
    </table>

    <a th:href="@{/orders/addOrders}">新增訂單</a>
    <a th:href="@{/orders/select_Page}">查詢</a>

</body>
</html>
