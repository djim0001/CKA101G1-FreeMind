<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>諮商訂單詳細</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
        color: #333;
    }

    .card {
        max-width: 640px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        padding: 36px 40px;
    }

    h3 {
        font-size: 22px;
        color: #4a3e3e;
        margin: 0 0 20px;
        padding-bottom: 14px;
        border-bottom: 2px solid #e8b4b4;
    }

    .success {
        color: #2e7d43;
        font-size: 14px;
        margin-bottom: 12px;
    }

    table {
        border-collapse: collapse;
        width: 100%;
    }
    th, td {
        border: 1px solid #f2dddd;
        padding: 12px 14px;
        font-size: 14px;
        vertical-align: middle;
    }
    th {
        background-color: #fbf2f2;
        color: #7a6b6b;
        font-weight: 600;
        text-align: left;
        white-space: nowrap;
        width: 40%;
    }
    td {
        text-align: left;
    }

    .back-link {
        display: inline-block;
        margin-top: 20px;
        padding: 9px 22px;
        background-color: #e8b4b4;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
        transition: background-color 0.2s;
    }
    .back-link:hover {
        background-color: #d39393;
    }
</style>
</head>
<body>
    <div class="card">
        <h3>諮商訂單詳細</h3>

        <span class="success" th:if="${success != null}" th:text="${success}"></span>

        <table>
            <tr><th>訂單編號</th><td th:text="${orders.orderId}"></td></tr>
            <tr><th>開始時間</th><td th:text="${#temporals.format(orders.consStart, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
            <tr><th>結束時間</th><td th:text="${#temporals.format(orders.consEnd, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
            <tr><th>建立時間</th><td th:text="${#temporals.format(orders.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
            <tr><th>心理師工作地點</th><td th:text="${orders.psychLoc}"></td></tr>
            <tr><th>是否為政府補助</th><td th:text="${orders.govSubsidy ? '是' : '否'}"></td></tr>
            <tr><th>心理師諮詢費</th><td th:text="${orders.psychFee}"></td></tr>
            <tr><th>訂單狀態</th>
                <td th:switch="${orders.orderStatus}">
                    <span th:case="0">待確認</span>
                    <span th:case="1">已確認</span>
                    <span th:case="2">已取消</span>
                    <span th:case="3">未出席</span>
                    <span th:case="4">已完成</span>
                </td>
            </tr>
            <tr><th>來訪目的</th>
                <td th:switch="${orders.visitPurpose}">
                    <span th:case="'emotion'">情緒困擾</span>
                    <span th:case="'stress'">壓力調適</span>
                    <span th:case="'relationship'">人際關係</span>
                    <span th:case="'family'">家庭問題</span>
                    <span th:case="'career'">職涯困惑</span>
                    <span th:case="'academic'">課業壓力</span>
                    <span th:case="'self_growth'">自我探索</span>
                    <span th:case="'sleep'">睡眠問題</span>
                    <span th:case="'anxiety'">焦慮傾向</span>
                    <span th:case="'other'">其他</span>
                    <span th:case="*" th:text="${orders.visitPurpose}"></span>
                </td>
            </tr>
            <tr><th>來訪目的備註</th><td th:text="${orders.visitPurposeNote}"></td></tr>
            <tr><th>諮商參與形式</th>
                <td th:switch="${orders.sessionType}">
                    <span th:case="0">單人諮商</span>
                    <span th:case="1">伴侶諮商</span>
                    <span th:case="2">家庭諮商</span>
                    <span th:case="3">團體諮商</span>
                </td>
            </tr>
            <tr><th>心理師晤談筆記</th><td th:text="${orders.psychNote != null ? orders.psychNote : '尚無筆記'}"></td></tr>
            <tr><th>會員評分</th><td th:text="${orders.rating != null ? orders.rating : '尚未評論'}"></td></tr>
            <tr><th>評論內容</th><td th:text="${orders.reviewContent != null ? orders.reviewContent : '-'}"></td></tr>
            <tr><th>評論時間</th><td th:text="${orders.reviewedAt != null ? #temporals.format(orders.reviewedAt, 'yyyy-MM-dd HH:mm:ss') : '-'}"></td></tr>
        </table>

        <a class="back-link" th:href="@{/admin/orders/listAllOrders}">回列表</a>
    </div>
</body>
</html>
