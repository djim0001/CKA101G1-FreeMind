<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>查詢諮商問題回報</title>
    <style>
        .search-field {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-right: 24px;
            margin-bottom: 16px;
        }
        .search-form-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
    </style>
</head>
<body>
    <h3>查詢諮商問題回報</h3>

    <span style="color:red;" th:if="${errorMessage != null}" th:text="${errorMessage}"></span><br>

    <form method="post" th:action="@{/admin/reports/search}">
        <div class="search-form-wrap">
            <span class="search-field">諮商問題編號：<input type="text" name="reportId"></span>
            <span class="search-field">會員編號：<input type="text" name="memberId"></span>
            <span class="search-field">
                處理狀態：
                <select name="reportStatus">
                    <option value="">請選擇</option>
                    <option value="0">待處理</option>
                    <option value="1">處理中</option>
                    <option value="2">已解決</option>
                </select>
            </span>
        </div>
        <input type="submit" value="查詢">
    </form>

    <!-- 單筆查詢結果 -->
    <div th:if="${reports != null}">
       
        <table border="1">
            <tr><th>編號</th><td th:text="${reports.reportId}"></td></tr>
            <tr><th>會員編號</th><td th:text="${reports.member.memberId}"></td></tr>
            <tr><th>問題描述</th><td th:text="${reports.issueDesc}"></td></tr>
            <tr><th>回報日期</th><td th:text="${#temporals.format(reports.reportDate, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
            <tr><th>處理狀態</th>
                <td th:switch="${reports.reportStatus}">
                    <span th:case="0">待處理</span>
                    <span th:case="1">處理中</span>
                    <span th:case="2">已解決</span>
                </td>
            </tr>
            <tr><th>處理備註</th><td th:text="${reports.reportNote}"></td></tr>
        </table>
    </div>

    <!-- 多筆查詢結果 -->
    <div th:if="${reportsListData != null}">
       
        <table border="1">
            <tr>
                <th>編號</th>
                <th>會員編號</th>
                <th>問題描述</th>
                <th>回報日期</th>
                <th>處理狀態</th>
            </tr>
            <tr th:each="report : ${reportsListData}">
                <td th:text="${report.reportId}"></td>
                <td th:text="${report.member.memberId}"></td>
                <td th:text="${report.issueDesc}"></td>
                <td th:text="${#temporals.format(report.reportDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:switch="${report.reportStatus}">
                    <span th:case="0">待處理</span>
                    <span th:case="1">處理中</span>
                    <span th:case="2">已解決</span>
                </td>
            </tr>
        </table>
    </div>

    <a th:href="@{/admin/reports/listAllReports}">回列表</a>

</body>
</html>
