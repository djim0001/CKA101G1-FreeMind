<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>諮商問題回報｜諮由自在後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<style>
@font-face {
	font-family: 'OpenHuninn';
	src:
		url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff')
		format('woff'),
		url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf')
		format('truetype');
	font-weight: 400;
	font-style: normal;
	font-display: swap;
}

:root {
	--bg-warm: #FFFAEE;
	--bg-soothing: #C2D9ED;
	--blue-soft: #DCEAF5;
	--orange: #F58E6B;
	--orange-deep: #E5764F;
	--pink: #FBD0BE;
	--pink-soft: #FDE6DB;
	--ink: #3A4B53;
	--ink-soft: #6b7981;
	--white: #FFFFFF;
	--line: #ecdfce;
	--shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
	--shadow-md: 0 16px 44px rgba(58, 75, 83, .13);
	--radius-lg: 34px;
	--radius-md: 22px;
	--serif: "OpenHuninn", "Noto Sans TC", sans-serif;
	--zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
	--sans: "Noto Sans TC", system-ui, sans-serif;
	--display-en: "Baloo 2", sans-serif;
}

* { box-sizing: border-box; }
html { min-width: 320px; }
body {
	display: flex; min-width: 320px; min-height: 100vh; flex-direction: column;
	margin: 0; color: var(--ink); background: var(--bg-warm); font-family: var(--sans);
	line-height: 1.78; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { border: 0; background: none; cursor: pointer; }
img, svg { display: block; max-width: 100%; }
.wrap { width: min(1240px, 94vw); margin-inline: auto; }

main { width: 100%; flex: 1; padding: clamp(1.25rem, 2vw, 1.75rem) 0 4rem; }
.page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; margin-bottom: 1.4rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--line); }
.page-kicker { display: block; margin-bottom: .35rem; color: var(--orange); font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
h1 { margin: 0; color: var(--ink); font-family: var(--serif); font-size: clamp(1.6rem, 3vw, 2.1rem); line-height: 1.3; letter-spacing: -.02em; }
.back-link { display: inline-flex; align-items: center; gap: .4rem; color: var(--ink-soft); font-size: .88rem; }
.back-link:hover { color: var(--orange-deep); }
.success { display: block; margin-bottom: 1rem; padding: .8rem 1rem; border-radius: 12px; color: #1a7a1a; background: #e7f4e9; font-size: .86rem; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.4rem; }
.stat { padding: 1.1rem 1.2rem; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--white); box-shadow: var(--shadow-sm); }
.stat span { display: block; color: var(--ink-soft); font-size: .78rem; }
.stat strong { display: block; margin-top: .2rem; font-family: var(--serif); font-size: 1.7rem; }

.tabs { display: flex; gap: .45rem; margin-bottom: 1rem; overflow-x: auto; }
.tabs button { display: flex; align-items: center; gap: .5rem; padding: .65rem 1.1rem; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-soft); background: var(--white); white-space: nowrap; }
.tabs button.active { border-color: var(--bg-soothing); color: var(--ink); background: var(--blue-soft); font-weight: 700; }
.tabs .count { padding: .05rem .55rem; border-radius: 999px; background: var(--pink-soft); color: var(--orange-deep); font-size: .74rem; font-weight: 700; }
.tabs button.active .count { background: var(--orange); color: #fff; }

.panel { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--white); box-shadow: var(--shadow-sm); padding: 1.25rem; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; min-width: 980px; border-collapse: collapse; font-size: .84rem; }
th, td { padding: .78rem .85rem; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
th { color: var(--ink); background: var(--bg-warm); font-size: .76rem; font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(220, 234, 245, .28); }
.nowrap { white-space: nowrap; }
.desc { text-align: left; word-break: break-word; }

.status { display: inline-flex; padding: .22rem .7rem; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
.status.pending { background: #fdf3e2; color: #b8860b; }
.status.processing { background: var(--blue-soft); color: var(--ink); }
.status.resolved { background: #e7f4e9; color: #1a7a1a; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: .5rem 1.1rem; border: 1px solid var(--orange); border-radius: 999px; color: var(--white); background: var(--orange); font-size: .82rem; font-weight: 700; white-space: nowrap; transition: background .16s ease, transform .16s ease; }
.btn:hover { background: var(--orange-deep); transform: translateY(-1px); }
.empty-state { padding: 3rem 1rem; color: var(--ink-soft); text-align: center; }

.site-footer { padding: 1.35rem 0; border-top: 1px solid var(--line); color: var(--ink-soft); background: var(--white); font-size: .78rem; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.footer-inner strong { color: var(--ink); font-weight: 700; }

@media (max-width: 940px) { .stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .page-header { display: block; } .back-link { margin-top: .4rem; } .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<main>
		<div class="wrap">
			<section class="page-header">
				<div>
					<span class="page-kicker">後台管理</span>
					<h1>諮商問題回報</h1>
				</div>
				<a class="back-link" th:href="@{/admin/orders/home}">← 回諮商預約管理</a>
			</section>

			<span class="success" th:if="${success != null}" th:text="${success}"></span>

			<section class="stats" aria-label="回報統計">
				<article class="stat">
					<span>待處理</span> <strong
						th:text="${#lists.size(reportsListData.?[reportStatus == 0])}">0</strong>
				</article>
				<article class="stat">
					<span>處理中</span> <strong
						th:text="${#lists.size(reportsListData.?[reportStatus == 1])}">0</strong>
				</article>
				<article class="stat">
					<span>已解決</span> <strong
						th:text="${#lists.size(reportsListData.?[reportStatus == 2])}">0</strong>
				</article>
			</section>

			<div class="tabs">
				<button class="active" type="button"
					onclick="showTab('pending', this)">
					待處理中 <span class="count"
						th:text="${#lists.size(reportsListData.?[reportStatus != 2])}"></span>
				</button>
				<button type="button" onclick="showTab('resolved', this)">
					已解決 <span class="count"
						th:text="${#lists.size(reportsListData.?[reportStatus == 2])}"></span>
				</button>
			</div>

			<div class="panel">
				<!-- 待處理中 -->
				<div id="pending" class="tab-content active">
					<div class="table-wrap"
						th:if="${!#lists.isEmpty(reportsListData.?[reportStatus != 2])}">
						<table>
							<thead>
								<tr>
									<th>回報編號</th>
									<th>會員編號</th>
									<th>會員姓名</th>
									<th>訂單編號</th>
									<th>諮商日期</th>
									<th>問題描述</th>
									<th>回報日期</th>
									<th>處理狀態</th>
									<th>處理人員</th>
									<th>操作</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="report : ${reportsListData}"
									th:if="${report.reportStatus != 2}">
									<td th:text="${report.reportId}"></td>
									<td th:text="${report.member.memberId}"></td>
									<td class="nowrap" th:text="${report.member.name}"></td>
									<td
										th:text="${report.orders != null ? report.orders.orderId : '-'}"></td>
									<td class="nowrap"
										th:text="${report.orders != null ? #temporals.format(report.orders.consStart, 'yyyy-MM-dd HH:mm') : '-'}"></td>
									<td class="desc" th:text="${report.issueDesc}"></td>
									<td class="nowrap"
										th:text="${#temporals.format(report.reportDate, 'yyyy-MM-dd HH:mm')}"></td>
									<td th:switch="${report.reportStatus}"><span th:case="0"
										class="status pending">待處理</span> <span th:case="1"
										class="status processing">處理中</span></td>
									<td
										th:text="${report.admin != null ? report.admin.adminId : '尚未指派'}"></td>
									<td class="nowrap">
										<form method="post"
											th:action="@{/admin/reports/getOne_For_Reply}">
											<input type="hidden" name="reportId"
												th:value="${report.reportId}">
											<button type="submit" class="btn">回覆</button>
										</form>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
					<div class="empty-state"
						th:if="${#lists.isEmpty(reportsListData.?[reportStatus != 2])}">目前沒有待處理的回報。</div>
				</div>

				<!-- 已解決 -->
				<div id="resolved" class="tab-content">
					<div class="table-wrap"
						th:if="${!#lists.isEmpty(reportsListData.?[reportStatus == 2])}">
						<table>
							<thead>
								<tr>
									<th>回報編號</th>
									<th>會員編號</th>
									<th>會員姓名</th>
									<th>訂單編號</th>
									<th>諮商日期</th>
									<th>問題描述</th>
									<th>回報日期</th>
									<th>處理備註</th>
									<th>狀態</th>
									<th>處理人員</th>
									<th>操作</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="report : ${reportsListData}"
									th:if="${report.reportStatus == 2}">
									<td th:text="${report.reportId}"></td>
									<td th:text="${report.member.memberId}"></td>
									<td class="nowrap" th:text="${report.member.name}"></td>
									<td
										th:text="${report.orders != null ? report.orders.orderId : '-'}"></td>
									<td class="nowrap"
										th:text="${report.orders != null ? #temporals.format(report.orders.consStart, 'yyyy-MM-dd HH:mm') : '-'}"></td>
									<td class="desc" th:text="${report.issueDesc}"></td>
									<td class="nowrap"
										th:text="${#temporals.format(report.reportDate, 'yyyy-MM-dd HH:mm')}"></td>
									<td class="desc"
										th:text="${report.reportNote != null ? report.reportNote : '-'}"></td>
									<td><span class="status resolved">已解決</span></td>
									<td
										th:text="${report.admin != null ? report.admin.adminId : '尚未指派'}"></td>
									<td class="nowrap">
										<form method="post"
											th:action="@{/admin/reports/getOne_For_Reply}">
											<input type="hidden" name="reportId"
												th:value="${report.reportId}">
											<button type="submit" class="btn">回覆</button>
										</form>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
					<div class="empty-state"
						th:if="${#lists.isEmpty(reportsListData.?[reportStatus == 2])}">目前沒有已解決的回報。</div>
				</div>
			</div>
		</div>
	</main>

	<footer class="site-footer">
		<div class="wrap footer-inner">
			<span><strong>諮由自在 Free Mind</strong>｜後台管理系統</span> <span>請妥善保管管理員帳號資訊</span>
		</div>
	</footer>

	<script>
		function showTab(id, btn) {
			document.querySelectorAll('.tab-content').forEach(function(p) {
				p.classList.remove('active');
			});
			document.querySelectorAll('.tabs button').forEach(function(t) {
				t.classList.remove('active');
			});
			document.getElementById(id).classList.add('active');
			btn.classList.add('active');
		}
	</script>
</body>
</html>
