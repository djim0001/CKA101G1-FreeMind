<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>諮商問題回報列表</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
        color: #333;
    }

    .card {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        padding: 36px 40px;
    }

    .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 2px solid #e8b4b4;
    }
    .card-header h3 {
        font-size: 22px;
        color: #4a3e3e;
        margin: 0;
    }
    .card-header .actions a {
        display: inline-block;
        margin-left: 8px;
        padding: 8px 18px;
        background-color: #e8b4b4;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
        transition: background-color 0.2s;
    }
    .card-header .actions a:hover {
        background-color: #d39393;
    }

    .success { color: #2e7d43; font-size: 14px; margin-bottom: 12px; }

    table {
        border-collapse: collapse;
        width: 100%;
    }
    th, td {
        border: 1px solid #f2dddd;
        padding: 11px 10px;
        text-align: center;
        vertical-align: middle;
        font-size: 14px;
    }
    th {
        background-color: #fbf2f2;
        color: #7a6b6b;
        font-weight: 600;
        white-space: nowrap;
    }
    tr:nth-child(even) td {
        background-color: #fdfafa;
    }

    .nowrap { white-space: nowrap; }
    .desc-cell { text-align: left; word-break: break-word; }

    .status-pending { color: #b8860b; font-weight: bold; }
    .status-processing { color: #1565c0; font-weight: bold; }
    .status-resolved { color: #2e7d43; font-weight: bold; }

    .op-form { display: inline-block; margin: 0 3px; }
    .op-btn {
        padding: 6px 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        color: #fff;
        font-size: 13px;
        transition: opacity 0.2s;
    }
    .op-btn:hover { opacity: 0.85; }
    .op-reply  { background-color: #1565c0; }
    .op-delete { background-color: #c62828; }
</style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h3>諮商問題回報列表</h3>
            <div class="actions">
                <a th:href="@{/admin/reports/addReports}">新增回報</a>
                <a th:href="@{/admin/reports/select_Page}">查詢</a>
            </div>
        </div>

        <span class="success" th:if="${success != null}" th:text="${success}"></span>

        <table>
            <tr>
                <th>編號</th>
                <th>會員編號</th>
                <th>會員姓名</th>
                <th>問題描述</th>
                <th>回報日期</th>
                <th>處理狀態</th>
                <th>操作</th>
            </tr>
            <tr th:each="report : ${reportsListData}">
                <td th:text="${report.reportId}"></td>
                <td th:text="${report.member.memberId}"></td>
                <td class="nowrap" th:text="${report.member.name}"></td>
                <td class="desc-cell" th:text="${report.issueDesc}"></td>
                <td class="nowrap" th:text="${#temporals.format(report.reportDate, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:switch="${report.reportStatus}">
                    <span th:case="0" class="status-pending">待處理</span>
                    <span th:case="1" class="status-processing">處理中</span>
                    <span th:case="2" class="status-resolved">已解決</span>
                </td>
                <td class="nowrap">
                    <form method="post" th:action="@{/admin/reports/getOne_For_Reply}" class="op-form">
                        <input type="hidden" name="reportId" th:value="${report.reportId}">
                        <input type="submit" class="op-btn op-reply" value="回覆">
                    </form>
                    <form method="post" th:action="@{/admin/reports/delete}" class="op-form">
                        <input type="hidden" name="reportId" th:value="${report.reportId}">
                        <input type="submit" class="op-btn op-delete" value="刪除"
                               onclick="return confirm('確定要刪除此筆資料嗎？')">
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
