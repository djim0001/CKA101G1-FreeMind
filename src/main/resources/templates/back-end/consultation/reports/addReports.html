<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增諮商問題回報</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
        color: #333;
    }

    .card {
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        padding: 36px 40px;
    }

    .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 2px solid #e8b4b4;
    }
    .card-header h3 {
        font-size: 22px;
        color: #4a3e3e;
        margin: 0;
    }
    .back-link {
        display: inline-block;
        padding: 8px 18px;
        background-color: #e8b4b4;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
        transition: background-color 0.2s;
    }
    .back-link:hover { background-color: #d39393; }

    .error { color: #c62828; font-size: 13px; margin-left: 4px; }

    .field { margin-bottom: 16px; }
    .field > label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #7a6b6b;
        margin-bottom: 6px;
    }

    input[type="text"], select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #e0d5d5;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
    }
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #e8b4b4;
    }

    textarea {
        width: 100%;
        height: 100px;
        resize: none;
        padding: 10px;
        border: 1px solid #e0d5d5;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
    }

    input[type="submit"] {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 12px 0;
        background-color: #e8b4b4;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    input[type="submit"]:hover { background-color: #d39393; }
</style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h3>新增諮商問題回報</h3>
            <a class="back-link" th:href="@{/admin/reports/listAllReports}">回列表</a>
        </div>

        <span class="error" th:if="${errorMessage != null}" th:utext="${errorMessage}"></span>

        <form method="post" th:action="@{/admin/reports/insert}" th:object="${reports}">

            <div class="field">
                <label>會員編號</label>
                <input type="text" th:field="*{member.memberId}">
                <span class="error" th:if="${#fields.hasErrors('member.memberId')}" th:errors="*{member.memberId}"></span>
            </div>

            <div class="field">
                <label>諮詢訂單編號</label>
                <select th:field="*{orders}">
                    <option value="">請選擇訂單</option>
                    <option th:each="order : ${ordersList}"
                            th:value="${order.orderId}"
                            th:text="${order.orderId}"></option>
                </select>
                <span class="error" th:if="${#fields.hasErrors('orders')}" th:errors="*{orders}"></span>
            </div>

            <div class="field">
                <label>問題描述</label>
                <textarea th:field="*{issueDesc}"></textarea>
                <span class="error" th:if="${#fields.hasErrors('issueDesc')}" th:errors="*{issueDesc}"></span>
            </div>

            <div class="field">
                <label>處理備註</label>
                <textarea th:field="*{reportNote}"></textarea>
            </div>

            <input type="submit" value="新增">
        </form>
    </div>
</body>
</html>
