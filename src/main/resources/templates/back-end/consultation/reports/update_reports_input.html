<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>修改諮商問題回報｜諮由自在後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<style>
@font-face {
	font-family: 'OpenHuninn';
	src:
		url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff')
		format('woff'),
		url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf')
		format('truetype');
	font-weight: 400;
	font-style: normal;
	font-display: swap;
}

:root {
	--bg-warm: #FFFAEE;
	--bg-soothing: #C2D9ED;
	--blue-soft: #DCEAF5;
	--orange: #F58E6B;
	--orange-deep: #E5764F;
	--pink: #FBD0BE;
	--pink-soft: #FDE6DB;
	--ink: #3A4B53;
	--ink-soft: #6b7981;
	--white: #FFFFFF;
	--line: #ecdfce;
	--shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
	--shadow-md: 0 16px 44px rgba(58, 75, 83, .13);
	--radius-lg: 34px;
	--radius-md: 22px;
	--serif: "OpenHuninn", "Noto Sans TC", sans-serif;
	--zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
	--sans: "Noto Sans TC", system-ui, sans-serif;
	--display-en: "Baloo 2", sans-serif;
}

* {
	box-sizing: border-box;
}

html {
	min-width: 320px;
}

body {
	display: flex;
	min-width: 320px;
	min-height: 100vh;
	flex-direction: column;
	margin: 0;
	color: var(--ink);
	background: var(--bg-warm);
	font-family: var(--sans);
	line-height: 1.78;
	-webkit-font-smoothing: antialiased;
	overflow-x: hidden;
}

a {
	color: inherit;
	text-decoration: none;
}

button, input, select, textarea {
	font: inherit;
}

button {
	border: 0;
	background: none;
	cursor: pointer;
}

img, svg {
	display: block;
	max-width: 100%;
}

.wrap {
	width: min(640px, 92vw);
	margin-inline: auto;
}

.site-header {
	position: sticky;
	top: 0;
	z-index: 100;
	border-bottom: 1px solid rgba(236, 223, 206, .7);
	color: var(--ink);
	background: rgba(253, 246, 237, .85);
	backdrop-filter: blur(12px);
}

.nav-inner {
	width: min(1240px, 94vw);
	margin-inline: auto;
	display: flex;
	align-items: center;
	gap: 1.4rem;
	height: 74px;
}

.brand {
	display: flex;
	align-items: center;
	gap: .8rem;
	flex: 0 0 auto;
}

.logo-mind {
	display: flex;
	flex: 0 0 auto;
	flex-direction: column;
	align-items: flex-start;
	line-height: 1;
	user-select: none;
}

.logo-mind .word {
	display: flex;
	align-items: flex-end;
}

.logo-mind .word span {
	display: inline-block;
	font-family: var(--display-en);
	font-size: 1.5rem;
	font-weight: 700;
	letter-spacing: -.03em;
	text-align: center;
}

.logo-mind .word .m {
	width: 24px;
	color: #EFB65E;
}

.logo-mind .word .i {
	width: 9px;
	color: #DB93A9;
}

.logo-mind .word .n {
	width: 17px;
	color: #8FB2C9;
}

.logo-mind .word .d {
	width: 17px;
	color: #9BB893;
}

.logo-mind .faces {
	display: flex;
	align-items: flex-start;
	margin-top: -1px;
}

.logo-mind .faces svg {
	display: block;
}

.logo-mind .faces .fm {
	width: 24px;
	height: 11px;
}

.logo-mind .faces .fi {
	width: 9px;
	height: 11px;
}

.logo-mind .faces .fn {
	width: 17px;
	height: 11px;
}

.logo-mind .faces .fd {
	width: 17px;
	height: 11px;
}

.brand-text {
	display: flex;
	flex-direction: column;
	line-height: 1.15;
}

.brand-text .logo {
	color: var(--ink);
	font-family: var(--zen-maru);
	font-size: 1.18rem;
	font-weight: 700;
	letter-spacing: .02em;
}

.brand-text .en {
	margin-top: .15em;
	color: var(--ink-soft);
	font-family: var(--display-en);
	font-size: .85rem;
	font-weight: 700;
	letter-spacing: .24em;
	text-transform: uppercase;
}

.admin-badge {
	padding-left: 1.05rem;
	border-left: 1px solid var(--line);
	color: var(--ink-soft);
	font-size: .84rem;
	font-weight: 700;
	letter-spacing: .08em;
}

.nav-actions {
	display: flex;
	align-items: center;
	gap: .55rem;
	margin-left: auto;
}

.profile-entry {
	display: flex;
	align-items: center;
	gap: .65rem;
	min-height: 46px;
	padding: .3rem .75rem .3rem .35rem;
	border: 1px solid var(--line);
	border-radius: 999px;
	background: var(--white);
	box-shadow: var(--shadow-sm);
}

.profile-photo {
	display: grid;
	place-items: center;
	width: 36px;
	height: 36px;
	flex: 0 0 auto;
	border-radius: 50%;
	color: var(--ink);
	background: linear-gradient(135deg, var(--pink), var(--bg-soothing));
}

.profile-photo svg {
	width: 21px;
	height: 21px;
	stroke: currentColor;
}

.profile-copy {
	display: flex;
	min-width: 0;
	flex-direction: column;
	line-height: 1.25;
}

.profile-copy small {
	color: var(--ink-soft);
	font-size: .68rem;
}

.profile-copy strong {
	max-width: 9.5rem;
	overflow: hidden;
	color: var(--ink);
	font-size: .82rem;
	font-weight: 500;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.logout-form {
	margin: 0;
}

.logout-button {
	display: inline-flex;
	align-items: center;
	gap: .4rem;
	min-height: 46px;
	padding: .6rem .8rem;
	border: 1px solid var(--line);
	border-radius: 999px;
	color: var(--ink);
	background: var(--white);
	box-shadow: var(--shadow-sm);
	cursor: pointer;
}

.logout-button:hover {
	border-color: var(--orange);
	color: var(--white);
	background: var(--orange-deep);
}

.logout-button svg {
	width: 17px;
	height: 17px;
	stroke: currentColor;
}

main {
	width: 100%;
	flex: 1;
	padding: clamp(1.5rem, 3vw, 2.5rem) 0 4rem;
}

.panel {
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
	background: var(--white);
	box-shadow: var(--shadow-md);
	overflow: hidden;
}

.panel-heading {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 1rem;
	padding: 1.1rem 1.5rem;
	border-bottom: 1px solid var(--line);
	background: linear-gradient(90deg, var(--pink-soft), var(--white) 52%,
		var(--blue-soft));
}

.panel-heading h1 {
	margin: 0;
	color: var(--ink);
	font-family: var(--serif);
	font-size: 1.2rem;
	letter-spacing: .02em;
}

.back-link {
	color: var(--ink-soft);
	font-size: .84rem;
}

.back-link:hover {
	color: var(--orange-deep);
}

.panel-body {
	padding: 1.5rem;
}

.error-box {
	color: var(--orange-deep);
	font-size: .82rem;
	margin-bottom: 1rem;
}

.error-box ul {
	margin: .3rem 0 0 1.1rem;
}

.field {
	margin-bottom: 1.2rem;
}

.field label {
	display: block;
	font-size: .82rem;
	font-weight: 700;
	color: var(--ink);
	margin-bottom: .45rem;
}

.field .readonly {
	display: block;
	padding: .65rem .85rem;
	border: 1px solid var(--line);
	border-radius: 12px;
	background: var(--bg-warm);
	color: var(--ink-soft);
	font-size: .88rem;
}

input[type="text"], select, textarea {
	width: 100%;
	min-height: 44px;
	padding: .65rem .85rem;
	border: 1px solid var(--line);
	border-radius: 12px;
	color: var(--ink);
	background: var(--white);
	outline: none;
	transition: border-color .16s ease, box-shadow .16s ease;
}

input:focus, select:focus, textarea:focus {
	border-color: var(--orange);
	box-shadow: 0 0 0 3px rgba(245, 142, 107, .14);
}

textarea {
	resize: none;
}

.error {
	color: var(--orange-deep);
	font-size: .78rem;
	margin-left: .4rem;
}

.submit {
	width: 100%;
	min-height: 44px;
	padding: .8rem 0;
	border: 1px solid var(--orange);
	border-radius: 999px;
	color: #fff;
	background: var(--orange);
	font-size: .92rem;
	font-weight: 700;
	cursor: pointer;
	margin-top: .4rem;
	transition: background .16s ease;
}

.submit:hover {
	background: var(--orange-deep);
}

.site-footer {
	padding: 1.35rem 0;
	border-top: 1px solid var(--line);
	color: var(--ink-soft);
	background: var(--white);
	font-size: .78rem;
}

.footer-inner {
	width: min(1240px, 94vw);
	margin-inline: auto;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 1rem;
	flex-wrap: wrap;
}

.footer-inner strong {
	color: var(--ink);
	font-weight: 700;
}

@media ( max-width : 940px) {
	.profile-copy, .admin-badge {
		display: none;
	}
}
</style>
</head>
<body>
	<header class="nav site-header">
		<div class="nav-inner">
			<a class="brand" th:href="@{/admin/home}" aria-label="諮由自在後台管理首頁">
				<span class="logo-mind" aria-hidden="true"> <span
					class="word"><span class="m">m</span><span class="i">i</span><span
						class="n">n</span><span class="d">d</span></span> <span class="faces">
						<svg class="fm" viewBox="0 0 24 11">
							<g stroke="#B8813A" stroke-width="1.6" stroke-linecap="round"
								fill="none">
							<circle cx="8" cy="3.5" r="1" fill="#B8813A" stroke="none" />
							<circle cx="16" cy="3.5" r="1" fill="#B8813A" stroke="none" />
							<path d="M8 7 c2.4 2.4 5.6 2.4 8 0" /></g></svg> <svg class="fi"
							viewBox="0 0 9 11">
							<g stroke="#A85974" stroke-width="1.5" stroke-linecap="round"
								fill="none">
							<circle cx="4.5" cy="8" r="1.6" /></g></svg> <svg class="fn"
							viewBox="0 0 17 11">
							<g stroke="#4F7B96" stroke-width="1.6" stroke-linecap="round"
								fill="none">
							<path d="M5.5 7.5 l6 0" /></g></svg> <svg class="fd" viewBox="0 0 17 11">
							<g stroke="#5A7A57" stroke-width="1.6" stroke-linecap="round"
								fill="none">
							<path d="M4 4 c1 -1.6 2.6 -1.6 3.6 0" />
							<path d="M9.4 4 c1 -1.6 2.6 -1.6 3.6 0" /></g></svg>
				</span>
			</span> <span class="brand-text"><span class="logo">諮由自在</span><span
					class="en">Free&nbsp;Mind</span></span>
			</a> <span class="admin-badge">系統管理後台</span>
			<div class="nav-actions">
				<a class="profile-entry" th:href="@{/admin/select_page}"
					aria-label="前往管理員檔案"> <span class="profile-photo"
					aria-hidden="true"> <img th:if="${admin != null}"
						th:src="@{/admin/DBGifReader(adminId=${admin.adminId})}"
						alt="管理員照片" /> <svg th:if="${admin == null}" viewBox="0 0 24 24"
							fill="none">
							<path d="M20 21a8 8 0 0 0-16 0" stroke-width="1.8"
								stroke-linecap="round" />
							<circle cx="12" cy="7" r="4" stroke-width="1.8" /></svg>
				</span> <span class="profile-copy"> <small
						th:text="${admin != null ? admin.adminAccount : '管理員帳號'}"></small>
						<strong th:text="${admin!=null?admin.name:'尚未登入'}"></strong>
				</span>
				</a>
				<form class="logout-form" th:action="@{/back-end/logout}"
					method="post">
					<button class="logout-button" type="submit" aria-label="登出後台">
						<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
							<path
								d="M14 8l4 4-4 4M18 12H8M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"
								stroke-width="1.8" stroke-linecap="round"
								stroke-linejoin="round" /></svg>
						<span>登出</span>
					</button>
				</form>
			</div>
		</div>
	</header>

	<main>
		<div class="wrap">
			<div class="panel">
				<div class="panel-heading">
					<h1>修改諮商問題回報</h1>
					<a class="back-link" th:href="@{/admin/reports/listAllReports}">回列表</a>
				</div>
				<div class="panel-body">
					<div class="error-box" th:if="${#fields.hasAnyErrors()}">
						<ul>
							<li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
						</ul>
					</div>

					<form method="post" th:action="@{/admin/reports/update}"
						th:object="${reports}">
						<div class="field">
							<label>諮商問題編號</label> <span class="readonly"
								th:text="${reports.reportId}"></span> <input type="hidden"
								th:field="*{reportId}"> <span class="error"
								th:if="${#fields.hasErrors('reportId')}" th:errors="*{reportId}"></span>
						</div>

						<div class="field">
							<label>會員編號</label> <span class="readonly"
								th:text="${reports.member.memberId}"></span> <input
								type="hidden" th:field="*{member.memberId}"> <span
								class="error" th:if="${#fields.hasErrors('member.memberId')}"
								th:errors="*{member.memberId}"></span>
						</div>

						<div class="field">
							<label>諮詢訂單編號</label> <span class="readonly"
								th:text="${reports.orders.orderId}"></span> <input type="hidden"
								th:field="*{orders}"> <span class="error"
								th:if="${#fields.hasErrors('orders')}" th:errors="*{orders}"></span>
						</div>

						<div class="field">
							<label>員工編號</label> <input type="text"
								th:field="*{admin.adminId}"> <span class="error"
								th:if="${#fields.hasErrors('admin.adminId')}"
								th:errors="*{admin.adminId}"></span>
						</div>

						<div class="field">
							<label>問題描述</label> <span class="readonly"
								th:text="${reports.issueDesc}"></span> <input type="hidden"
								th:field="*{issueDesc}"> <span class="error"
								th:if="${#fields.hasErrors('issueDesc')}"
								th:errors="*{issueDesc}"></span>
						</div>

						<div class="field">
							<label>回報日期</label> <span class="readonly"
								th:text="${#temporals.format(reports.reportDate, 'yyyy-MM-dd HH:mm:ss')}"></span>
							<input type="hidden" th:field="*{reportDate}"> <span
								class="error" th:if="${#fields.hasErrors('reportDate')}"
								th:errors="*{reportDate}"></span>
						</div>

						<div class="field">
							<label>處理狀態</label> <select th:field="*{reportStatus}">
								<option value="0">0：待處理</option>
								<option value="1">1：處理中</option>
								<option value="2">2：已解決</option>
							</select>
						</div>

						<div class="field">
							<label>處理備註</label>
							<textarea th:field="*{reportNote}" rows="3"></textarea>
						</div>

						<button type="submit" class="submit">修改</button>
					</form>
				</div>
			</div>
		</div>
	</main>

	<footer class="site-footer">
		<div class="footer-inner">
			<span><strong>諮由自在 Free Mind</strong>｜後台管理系統</span> <span>請妥善保管管理員帳號資訊</span>
		</div>
	</footer>
</body>
</html>
