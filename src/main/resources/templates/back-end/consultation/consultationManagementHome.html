<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>諮商預約管理｜諮由自在後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
	href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
	rel="stylesheet" />
<style>
@font-face {
	font-family: 'OpenHuninn';
	src:
		url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff')
		format('woff'),
		url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf')
		format('truetype');
	font-weight: 400;
	font-style: normal;
	font-display: swap;
}

:root {
	--bg-warm: #FFFAEE;
	--bg-soothing: #C2D9ED;
	--blue-soft: #DCEAF5;
	--orange: #F58E6B;
	--orange-deep: #E5764F;
	--pink: #FBD0BE;
	--pink-soft: #FDE6DB;
	--ink: #3A4B53;
	--ink-soft: #6b7981;
	--white: #FFFFFF;
	--line: #ecdfce;
	--shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
	--shadow-md: 0 16px 44px rgba(58, 75, 83, .13);
	--radius-lg: 34px;
	--radius-md: 22px;
	--serif: "OpenHuninn", "Noto Sans TC", sans-serif;
	--zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
	--sans: "Noto Sans TC", system-ui, sans-serif;
	--display-en: "Baloo 2", sans-serif;
}

* {
	box-sizing: border-box;
}

html {
	min-width: 320px;
}

body {
	display: flex;
	min-width: 320px;
	min-height: 100vh;
	flex-direction: column;
	margin: 0;
	color: var(--ink);
	background: var(--bg-warm);
	font-family: var(--sans);
	line-height: 1.78;
	-webkit-font-smoothing: antialiased;
	overflow-x: hidden;
}

a {
	color: inherit;
	text-decoration: none;
}

button {
	border: 0;
	background: none;
	font-family: inherit;
	cursor: pointer;
}

img, svg {
	display: block;
	max-width: 100%;
}

.wrap {
	width: min(1160px, 92vw);
	margin-inline: auto;
}

.site-header {
	position: sticky;
	top: 0;
	z-index: 100;
	border-bottom: 1px solid rgba(236, 223, 206, .7);
	color: var(--ink);
	background: rgba(253, 246, 237, .85);
	backdrop-filter: blur(12px);
}

.nav-inner {
	display: flex;
	align-items: center;
	gap: 1.4rem;
	height: 74px;
}

.brand {
	display: flex;
	align-items: center;
	gap: .8rem;
	flex: 0 0 auto;
}

.logo-mind {
	display: flex;
	flex: 0 0 auto;
	flex-direction: column;
	align-items: flex-start;
	line-height: 1;
	user-select: none;
}

.logo-mind .word {
	display: flex;
	align-items: flex-end;
}

.logo-mind .word span {
	display: inline-block;
	font-family: var(--display-en);
	font-size: 1.5rem;
	font-weight: 700;
	letter-spacing: -.03em;
	text-align: center;
}

.logo-mind .word .m {
	width: 24px;
	color: #EFB65E;
}

.logo-mind .word .i {
	width: 9px;
	color: #DB93A9;
}

.logo-mind .word .n {
	width: 17px;
	color: #8FB2C9;
}

.logo-mind .word .d {
	width: 17px;
	color: #9BB893;
}

.logo-mind .faces {
	display: flex;
	align-items: flex-start;
	margin-top: -1px;
}

.logo-mind .faces svg {
	display: block;
}

.logo-mind .faces .fm {
	width: 24px;
	height: 11px;
}

.logo-mind .faces .fi {
	width: 9px;
	height: 11px;
}

.logo-mind .faces .fn {
	width: 17px;
	height: 11px;
}

.logo-mind .faces .fd {
	width: 17px;
	height: 11px;
}

.brand-text {
	display: flex;
	flex-direction: column;
	line-height: 1.15;
}

.brand-text .logo {
	color: var(--ink);
	font-family: var(--zen-maru);
	font-size: 1.18rem;
	font-weight: 700;
	letter-spacing: .02em;
}

.brand-text .en {
	margin-top: .15em;
	color: var(--ink-soft);
	font-family: var(--display-en);
	font-size: .85rem;
	font-weight: 700;
	letter-spacing: .24em;
	text-transform: uppercase;
}

.admin-badge {
	padding-left: 1.05rem;
	border-left: 1px solid var(--line);
	color: var(--ink-soft);
	font-size: .84rem;
	font-weight: 700;
	letter-spacing: .08em;
}

.nav-actions {
	display: flex;
	align-items: center;
	gap: .55rem;
	margin-left: auto;
}

.profile-entry {
	display: flex;
	align-items: center;
	gap: .65rem;
	min-height: 46px;
	padding: .3rem .75rem .3rem .35rem;
	border: 1px solid var(--line);
	border-radius: 999px;
	background: var(--white);
	box-shadow: var(--shadow-sm);
	transition: border-color .16s ease, background .16s ease, transform .16s
		ease;
}

.profile-entry:hover {
	border-color: var(--bg-soothing);
	background: var(--blue-soft);
	transform: translateY(-2px);
}

.profile-photo {
	display: grid;
	place-items: center;
	width: 36px;
	height: 36px;
	flex: 0 0 auto;
	border-radius: 50%;
	color: var(--ink);
	background: linear-gradient(135deg, var(--pink), var(--bg-soothing));
}

.profile-photo svg {
	width: 21px;
	height: 21px;
	stroke: currentColor;
}

.profile-photo img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}

.profile-copy {
	display: flex;
	min-width: 0;
	flex-direction: column;
	line-height: 1.25;
}

.profile-copy small {
	color: var(--ink-soft);
	font-size: .68rem;
}

.profile-copy strong {
	max-width: 9.5rem;
	overflow: hidden;
	color: var(--ink);
	font-size: .82rem;
	font-weight: 500;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.logout-form {
	margin: 0;
}

.logout-button {
	display: inline-flex;
	align-items: center;
	gap: .4rem;
	min-height: 46px;
	padding: .6rem .8rem;
	border: 1px solid var(--line);
	border-radius: 999px;
	color: var(--ink);
	background: var(--white);
	box-shadow: var(--shadow-sm);
	cursor: pointer;
	transition: border-color .16s ease, background .16s ease, color .16s
		ease, transform .16s ease;
}

.logout-button:hover {
	border-color: var(--orange);
	color: var(--white);
	background: var(--orange-deep);
	transform: translateY(-2px);
}

.logout-button svg {
	width: 17px;
	height: 17px;
	stroke: currentColor;
}

main {
	width: 100%;
	flex: 1;
	padding: clamp(1.25rem, 2vw, 1.75rem) 0 4rem;
}

.page-header {
	display: flex;
	align-items: flex-end;
	justify-content: space-between;
	gap: 2rem;
	margin-bottom: 1.75rem;
	padding-bottom: 1.4rem;
	border-bottom: 1px solid var(--line);
}

.page-kicker {
	display: block;
	margin-bottom: .35rem;
	color: var(--orange);
	font-size: .75rem;
	font-weight: 700;
	letter-spacing: .16em;
	text-transform: uppercase;
}

h1 {
	margin: 0;
	color: var(--ink);
	font-family: var(--serif);
	font-size: clamp(1.75rem, 3vw, 2.35rem);
	line-height: 1.3;
	letter-spacing: -.02em;
}

.page-header p {
	max-width: 31rem;
	margin: 0;
	color: var(--ink-soft);
	font-size: .92rem;
	text-align: right;
}

.management-panel {
	overflow: hidden;
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
	background: var(--white);
	box-shadow: var(--shadow-md);
}

.panel-heading {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 1rem;
	min-height: 64px;
	padding: 1rem 1.25rem;
	border-bottom: 1px solid var(--line);
	background: linear-gradient(90deg, var(--pink-soft), var(--white) 48%,
		var(--blue-soft));
}

.panel-heading h2 {
	margin: 0;
	color: var(--ink);
	font-family: var(--serif);
	font-size: 1.05rem;
	letter-spacing: .02em;
}

.panel-heading p {
	margin: 0;
	color: var(--ink-soft);
	font-size: .82rem;
}

.function-grid {
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
}

.function-card {
	position: relative;
	display: grid;
	grid-template-columns: 44px minmax(0, 1fr) 22px;
	gap: .9rem;
	align-items: start;
	min-height: 168px;
	padding: 1.35rem 1.25rem;
	border-right: 1px solid var(--line);
	border-bottom: 1px solid var(--line);
	background: var(--white);
	transition: background .16s ease, box-shadow .16s ease;
}

.function-card:last-child {
	border-right: 0;
	border-bottom: 0;
}

.function-card:hover {
	z-index: 1;
	background: var(--bg-warm);
	box-shadow: inset 4px 0 0 var(--orange);
}

.card-icon {
	display: grid;
	place-items: center;
	width: 44px;
	height: 44px;
	border: 1px solid rgba(194, 217, 237, .8);
	border-radius: 14px;
	color: var(--orange-deep);
	background: var(--blue-soft);
	font-size: 22px;
}

.card-copy {
	min-width: 0;
}

.function-card h3 {
	margin: .05rem 0 .4rem;
	color: var(--ink);
	font-family: var(--serif);
	font-size: 1rem;
	line-height: 1.4;
}

.function-card p {
	margin: 0;
	color: var(--ink-soft);
	font-size: .84rem;
	line-height: 1.65;
}

.card-arrow {
	display: grid;
	place-items: center;
	width: 22px;
	height: 44px;
	color: var(--ink-soft);
}

.card-arrow svg {
	width: 17px;
	height: 17px;
	stroke: currentColor;
	transition: transform .16s ease;
}

.function-card:hover .card-arrow {
	color: var(--orange-deep);
}

.function-card:hover .card-arrow svg {
	transform: translateX(2px);
}

.site-footer {
	padding: 1.35rem 0;
	border-top: 1px solid var(--line);
	color: var(--ink-soft);
	background: var(--white);
	font-size: .78rem;
}

.footer-inner {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 1rem;
	flex-wrap: wrap;
}

.footer-inner strong {
	color: var(--ink);
	font-weight: 700;
}

@media ( max-width : 940px) {
	.profile-copy, .admin-badge {
		display: none;
	}
	.function-grid {
		grid-template-columns: repeat(2, minmax(0, 1fr));
	}
	.function-card:nth-child(2n) {
		border-right: 0;
	}
}

@media ( max-width : 640px) {
	.page-header {
		display: block;
		margin-bottom: 1.25rem;
	}
	.page-header p {
		margin-top: .55rem;
		text-align: left;
	}
	.panel-heading {
		display: block;
	}
	.function-grid {
		grid-template-columns: 1fr;
	}
	.function-card {
		border-right: 0 !important;
		border-bottom: 1px solid var(--line);
	}
	.function-card:last-child {
		border-bottom: 0;
	}
}
</style>
</head>
<body>
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<main>
		<div class="wrap">
			<section class="page-header" aria-labelledby="page-title">
				<div>
					<span class="page-kicker">Consultation Management</span>
					<h1 id="page-title">諮商預約管理</h1>
				</div>
				<p>總覽並維護所有諮商預約、問題回報與時段狀態。</p>
			</section>

			<section class="management-panel" aria-labelledby="function-title">
				<div class="panel-heading">
					<h2 id="function-title">諮商管理功能</h2>
					<p>選擇要處理的項目，進入對應功能頁面。</p>
				</div>

				<nav class="function-grid" aria-label="諮商管理功能">
					<a class="function-card" th:href="@{/admin/orders/listAllOrders}">
						<span class="card-icon" aria-hidden="true">📋</span> <span
						class="card-copy">
							<h3>諮商預約紀錄</h3>
							<p>查看所有諮商訂單與詳情、依條件查詢。</p>
					</span> <span class="card-arrow" aria-hidden="true"><svg
								viewBox="0 0 24 24" fill="none">
								<path d="m9 6 6 6-6 6" stroke-width="1.8" stroke-linecap="round"
									stroke-linejoin="round" /></svg></span>
					</a> <a class="function-card"
						th:href="@{/admin/reports/listAllReports}"> <span
						class="card-icon" aria-hidden="true">💬</span> <span
						class="card-copy">
							<h3>會員問題回報</h3>
							<p>處理會員回報的問題並回覆處理進度。</p>
					</span> <span class="card-arrow" aria-hidden="true"><svg
								viewBox="0 0 24 24" fill="none">
								<path d="m9 6 6 6-6 6" stroke-width="1.8" stroke-linecap="round"
									stroke-linejoin="round" /></svg></span>
					</a> <a class="function-card" th:href="@{/admin/slots/listAllSlots}">
						<span class="card-icon" aria-hidden="true">🗓️</span> <span
						class="card-copy">
							<h3>預約時段檢視</h3>
							<p>依月份檢視各心理師的預約行事曆。</p>
					</span> <span class="card-arrow" aria-hidden="true"><svg
								viewBox="0 0 24 24" fill="none">
								<path d="m9 6 6 6-6 6" stroke-width="1.8" stroke-linecap="round"
									stroke-linejoin="round" /></svg></span>
					</a>
				</nav>
			</section>
		</div>
	</main>

	<footer class="site-footer">
		<div class="wrap footer-inner">
			<span><strong>諮由自在 Free Mind</strong>｜後台管理系統</span> <span>請妥善保管管理員帳號資訊</span>
		</div>
	</footer>
</body>
</html>
