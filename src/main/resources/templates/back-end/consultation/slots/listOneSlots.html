<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>時段詳細</title>
</head>
<body>
    <h3>時段詳細</h3>

    <span style="color:green;" th:if="${success != null}" th:text="${success}"></span><br>

    時段編號：<span th:text="${slots.timeslotId}"></span><br>
    心理師編號：<span th:text="${slots.psychId}"></span><br>
    預約日期：<span th:text="${slots.slotDate}"></span><br>
    預約狀態：<span th:text="${slots.consStatus}"></span><br>

    <a th:href="@{/slots/listAllSlots}">回列表</a>

</body>
</html>
