<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>時段列表</title>
</head>
<body>
    <h3>時段列表</h3>

    <span style="color:green;" th:if="${success != null}" th:text="${success}"></span>

    <table border="1">
        <tr>
            <th>時段編號</th>
            <th>心理師編號</th>
            <th>預約日期</th>
            <th>預約狀態</th>
            <th>操作</th>
        </tr>
        <tr th:each="slot : ${slotsListData}">
            <td th:text="${slot.timeslotId}"></td>
            <td th:text="${slot.psychologist.psychId}"></td>
            <td th:text="${slot.slotDate}"></td>
            <td th:text="${slot.consStatus}"></td>
            <td>
                <form method="post" th:action="@{/admin/slots/getOne_For_Update}">
                    <input type="hidden" name="timeslotId" th:value="${slot.timeslotId}">
                    <input type="submit" value="修改">
                </form>
                <form method="post" th:action="@{/admin/slots/delete}">
                    <input type="hidden" name="timeslotId" th:value="${slot.timeslotId}">
                    <input type="submit" value="刪除"
                           onclick="return confirm('確定要刪除此筆時段嗎？')">
                </form>
            </td>
        </tr>
    </table>

    <a th:href="@{/admin/slots/addSlots}">新增時段</a>
    <a th:href="@{/admin/slots/select_Page}">查詢</a>

</body>
</html>
