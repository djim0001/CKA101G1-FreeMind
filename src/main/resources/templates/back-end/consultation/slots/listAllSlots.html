<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>心理師預約行事曆</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft JhengHei","Noto Sans TC",sans-serif; background: #faf6f4; color: #4a3e3e; line-height: 1.7; padding: 44px 20px; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
    }
    .back-btn {
        flex-shrink: 0;
        display: inline-block;
        padding: 9px 20px;
        background: #fff;
        color: #c07d7d;
        border: 1.5px solid #e8b4b4;
        border-radius: 8px;
        font-size: 14px;
        text-decoration: none;
        transition: all 0.2s;
    }
    .back-btn:hover { background: #e8b4b4; color: #fff; }
    .top h1 { font-size: 26px; font-weight: 700; }
    .top p { color: #a99a95; font-size: 14px; }

    .search-card { background: #fff; border-radius: 14px; box-shadow: 0 3px 16px rgba(160,120,120,0.08); padding: 20px 24px; margin: 18px 0 22px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-card label { font-size: 14px; color: #7a6b6b; }
    .search-card select { padding: 8px 12px; border: 1px solid #e0d5d5; border-radius: 7px; font-family: inherit; font-size: 14px; color: #4a3e3e; }
    .search-card select:focus { outline: none; border-color: #e8b4b4; box-shadow: 0 0 0 3px rgba(232,180,180,0.18); }
    .btn-search { padding: 9px 24px; background: #e8b4b4; color: #fff; border: none; border-radius: 7px; font-size: 14px; cursor: pointer; }
    .btn-search:hover { background: #d39393; }
    .btn-reset { padding: 9px 20px; background: #fff; color: #c07d7d; border: 1.5px solid #e8b4b4; border-radius: 7px; font-size: 14px; text-decoration: none; }
    .btn-reset:hover { background: #fbf2f2; }

    .card { background: #fff; border-radius: 16px; box-shadow: 0 3px 16px rgba(160,120,120,0.08); padding: 26px 28px; }
    .card-title { font-size: 17px; font-weight: 700; color: #5a4a45; margin-bottom: 6px; }
    .card-title span { color: #a99a95; font-weight: 400; font-size: 14px; }
    .legend { display: flex; gap: 20px; margin: 12px 0 18px; font-size: 13px; color: #7a6b6b; }
    .legend .item { display: flex; align-items: center; gap: 7px; }
    .legend .box { width: 16px; height: 16px; border-radius: 4px; }
    .box.has { background: #cfe8d4; border: 1px solid #7cc98d; }
    .box.none { background: #f2ece9; border: 1px solid #e5d9d4; }

    .cal-head, .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .cal-head { margin-bottom: 8px; }
    .cal-head div { text-align: center; font-size: 13px; font-weight: 600; color: #b3a5a0; }

    .cal-day {
        min-height: 74px; border-radius: 10px; padding: 8px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 13px;
    }
    .cal-day.blank { background: transparent; }
    .cal-day.none { background: #f2ece9; color: #c4b8b3; }
    .cal-day.has {
        background: #cfe8d4; border: 1px solid #7cc98d; color: #2e6b45;
        cursor: pointer; transition: background 0.15s, transform 0.1s;
    }
    .cal-day.has:hover { background: #b6e0c1; transform: translateY(-2px); }
    .cal-day .dnum { font-weight: 700; }
    .cal-day .dcount { font-size: 11px; margin-top: 3px; }

    /* 彈窗 */
    .modal-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(74,62,62,0.35); z-index: 100;
        align-items: center; justify-content: center;
    }
    .modal { background: #fff; border-radius: 14px; width: 90%; max-width: 420px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .modal-head { background: #5a4a45; color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
    .modal-head .x { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    .modal-body { padding: 16px 20px; max-height: 60vh; overflow-y: auto; }
    .mo { margin: 0 0 10px; }
    .mo-btn {
        width: 100%; text-align: left; background: #faf6f4; border: 1px solid #f2dddd;
        border-radius: 8px; padding: 12px 14px; cursor: pointer; font-family: inherit;
        display: flex; align-items: center; gap: 12px; transition: background 0.15s;
    }
    .mo-btn:hover { background: #fbeeee; }
    .mo-id { font-weight: 700; color: #c07d7d; }
    .mo-time { color: #7a6b6b; font-size: 13px; }
    .mo-status { margin-left: auto; font-size: 12.5px; font-weight: 600; }
    .s0 { color: #b8860b; } .s1 { color: #1a7a1a; } .s2 { color: #c62828; } .s3 { color: #ef6c00; } .s4 { color: #1565c0; }

    .empty { color: #b3a5a0; font-size: 15px; padding: 60px; text-align: center; background: #fff; border-radius: 16px; }
</style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <div>
                <h1>心理師預約行事曆</h1>
                <p>依月份檢視心理師的預約情況，點有訂單的日期可查看當日訂單（僅供查看）</p>
            </div>
            <a class="back-btn" th:href="@{/admin/orders/home}">← 回諮商預約管理</a>
        </div>

        <form class="search-card" method="get" th:action="@{/admin/slots/listAllSlots}">
            <label>選擇心理師：</label>
            <select name="psychId">
                <option value="">請選擇心理師</option>
                <option th:each="p : ${psychologistsList}" th:value="${p.psychId}"
                        th:text="${p.psychId} + ' - ' + ${p.name}"
                        th:selected="${selectedPsychId != null and selectedPsychId == #strings.toString(p.psychId)}"></option>
            </select>
            <label>月份：</label>
            <select name="month">
                <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}"
                        th:text="${m} + ' 月'" th:selected="${selectedMonth == m}"></option>
            </select>
            <button type="submit" class="btn-search">查詢</button>
            <a class="btn-reset" th:href="@{/admin/slots/listAllSlots}">重設</a>
        </form>

        <div class="empty" th:if="${selectedPsychId == null or selectedPsychId == ''}">
            請先從上方選擇一位心理師與月份。
        </div>

        <div class="card" th:if="${selectedPsychId != null and selectedPsychId != '' and psychologist != null}">
            <div class="card-title">
                <span th:text="'心理師 ' + ${psychologist.psychId} + '　' + ${psychologist.name}"></span>
                <span th:text="'　' + ${selectedMonth} + ' 月預約行事曆'"></span>
            </div>
            <div class="legend">
                <span class="item"><span class="box has"></span>有訂單（可點擊）</span>
                <span class="item"><span class="box none"></span>無訂單</span>
            </div>

            <div class="cal-head">
                <div>週一</div><div>週二</div><div>週三</div><div>週四</div><div>週五</div><div>週六</div><div>週日</div>
            </div>
            <div class="cal">
                <div class="cal-day blank" th:each="b : ${blanks}"></div>
                <div class="cal-day" th:each="d : ${dateList}"
                     th:classappend="${ordersByDate.containsKey(d.toString())} ? 'has clickable' : 'none'"
                     th:attr="data-date=${d.toString()}">
                    <div class="dnum" th:text="${d.dayOfMonth}"></div>
                    <div class="dcount" th:if="${ordersByDate.containsKey(d.toString())}"
                         th:text="${ordersByDate.get(d.toString()).size()} + ' 筆訂單'"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 每個有訂單的日期各一個彈窗 -->
    <div th:if="${ordersByDate != null}">
        <div class="modal-overlay" th:each="entry : ${ordersByDate}" th:id="'modal-' + ${entry.key}"
             onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
                <div class="modal-head">
                    <span th:text="${entry.key} + ' 的訂單'"></span>
                    <button type="button" class="x" onclick="closeModal()">✕</button>
                </div>
                <div class="modal-body">
                    <form th:each="o : ${entry.value}" method="post" th:action="@{/admin/orders/viewDetail}" class="mo">
                        <input type="hidden" name="orderId" th:value="${o.orderId}">
                        <button type="submit" class="mo-btn">
                            <span class="mo-id">#<span th:text="${o.orderId}"></span></span>
                            <span class="mo-time"
                                  th:text="${#temporals.format(o.consStart,'HH:mm')} + ' - ' + ${#temporals.format(o.consEnd,'HH:mm')}"></span>
                            <span class="mo-status" th:switch="${o.orderStatus}">
                                <span th:case="0" class="s0">待確認</span>
                                <span th:case="1" class="s1">已確認</span>
                                <span th:case="2" class="s2">已取消</span>
                                <span th:case="3" class="s3">未出席</span>
                                <span th:case="4" class="s4">已完成</span>
                            </span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.clickable').forEach(function (el) {
            el.addEventListener('click', function () {
                var m = document.getElementById('modal-' + el.getAttribute('data-date'));
                if (m) m.style.display = 'flex';
            });
        });
        function closeModal() {
            document.querySelectorAll('.modal-overlay').forEach(function (m) { m.style.display = 'none'; });
        }
    </script>
</body>
</html>
