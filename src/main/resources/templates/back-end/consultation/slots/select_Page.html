<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>查詢時段</title>
</head>
<body>
    <h3>查詢時段</h3>

    <!-- 依時段編號查詢 -->
    <form method="post" th:action="@{/slots/getOne_For_Display}">
        時段編號：<input type="text" name="timeslotId">
        <input type="submit" value="查詢">
    </form><br>

    <!-- 依心理師編號查詢 -->
    <form method="post" th:action="@{/slots/getByPsychId}">
        心理師編號：<input type="text" name="psychId">
        <input type="submit" value="查詢">
    </form><br>

    <!-- 依預約日期查詢 -->
    <form method="post" th:action="@{/slots/getBySlotDate}">
        預約日期：<input type="date" name="slotDate">
        <input type="submit" value="查詢">
    </form><br>

    <!-- 依預約狀態查詢 -->
    <form method="post" th:action="@{/slots/getByConsStatus}">
        預約狀態（24碼）：<input type="text" name="consStatus" maxlength="24">
        <input type="submit" value="查詢">
    </form><br>

    <!-- 單筆查詢結果 -->
    <div th:if="${slots != null}">
        <h4>查詢結果（單筆）</h4>
        <table border="1">
            <tr><th>時段編號</th><td th:text="${slots.timeslotId}"></td></tr>
            <tr><th>心理師編號</th><td th:text="${slots.psychId}"></td></tr>
            <tr><th>預約日期</th><td th:text="${slots.slotDate}"></td></tr>
            <tr><th>預約狀態</th><td th:text="${slots.consStatus}"></td></tr>
        </table>
    </div>

    <!-- 多筆查詢結果 -->
    <div th:if="${slotsListData != null}">
        <h4>查詢結果（多筆）</h4>
        <table border="1">
            <tr>
                <th>時段編號</th>
                <th>心理師編號</th>
                <th>預約日期</th>
                <th>預約狀態</th>
            </tr>
            <tr th:each="slot : ${slotsListData}">
                <td th:text="${slot.timeslotId}"></td>
                <td th:text="${slot.psychId}"></td>
                <td th:text="${slot.slotDate}"></td>
                <td th:text="${slot.consStatus}"></td>
            </tr>
        </table>
    </div>

    <a th:href="@{/slots/listAllSlots}">回列表</a>

</body>
</html>
