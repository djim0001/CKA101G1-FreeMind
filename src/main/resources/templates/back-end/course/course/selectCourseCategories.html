<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>課程分類｜管理後台</title><link rel="stylesheet" th:href="@{/css/course/admin-style.css}" /></head><body class="thy2-page"><div class="layout"><aside class="sidebar"><a class="brand" href="/admin/home" th:href="@{/admin/home}">諮由自在 Free Mind<small>ADMIN CONSOLE</small></a><p class="nav-label">課程商城管理</p><nav class="nav"><a th:href="@{/admin/course/select_course}">課程發布管理</a><a th:href="@{/admin/course/select_course_order}">訂單與退款</a><a th:href="@{/admin/adminPayout/listAll}">營運與撥款</a><a th:href="@{/admin/coupon/select_coupon}">優惠券管理</a><a class="active" th:href="@{/admin/course/select_course_categories}">課程分類</a></nav></aside><div class="main"><header class="topbar"><span>課程發布管理／課程分類</span><div class="admin-id"><span class="avatar">管</span><b th:text="${admin != null ? admin.name : '系統管理員'}">系統管理員</b></div></header><main class="content"><div class="page-head"><div><h1>課程分類</h1><p>新增分類並查看現有課程分類。</p></div><a class="btn ghost" th:href="@{/admin/course/select_course}">返回課程發布管理</a></div><div class="grid-2"><section class="panel"><h2>新增課程分類</h2><form th:action="@{insert_course_categories}" method="post" th:object="${courseCategories}"><div class="form-group"><label for="courseCatName">課程分類名稱 <span class="required">＊</span></label><input id="courseCatName" class="field" type="text" th:field="*{courseCatName}" required><span class="error" th:if="${#fields.hasErrors('courseCatName')}" th:errors="*{courseCatName}"></span></div><button class="btn" type="submit" style="margin-top:16px">送出新增</button></form></section><section class="panel"><h2>課程分類一覽</h2><div class="table-wrap"><table style="min-width:0"><thead><tr><th>分類名稱</th></tr></thead><tbody><tr th:each="courseCategories : ${courseCategoriesListAll}"><td><strong th:text="${courseCategories.courseCatName}">分類名稱</strong></td></tr></tbody></table></div></section></div></main></div></div><script th:src="@{/js/course/admin-js.js}"></script></body></html>
