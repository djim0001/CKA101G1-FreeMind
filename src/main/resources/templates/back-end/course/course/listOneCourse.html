<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="課程審核預覽後台管理頁面" />
	<title>課程審核預覽｜管理後台</title>
	<style>
		@font-face {
			font-family: 'OpenHuninn';
			src:
				url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff') format('woff'),
				url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf') format('truetype');
			font-weight: 400;
			font-style: normal;
			font-display: swap;
		}

		:root {
			--bg-warm: #FFFAEE;
			--bg-soothing: #C2D9ED;
			--blue-soft: #DCEAF5;
			--orange: #F58E6B;
			--orange-deep: #E5764F;
			--pink: #FBD0BE;
			--pink-soft: #FDE6DB;
			--ink: #3A4B53;
			--ink-soft: #6b7981;
			--white: #FFFFFF;
			--line: #ecdfce;
			--shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
			--shadow-md: 0 16px 44px rgba(58, 75, 83, .13);
			--radius-lg: 34px;
			--radius-md: 22px;
			--serif: "OpenHuninn", "Noto Sans TC", sans-serif;
			--zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
			--sans: "Noto Sans TC", system-ui, sans-serif;
			--script: "Caveat", "OpenHuninn", cursive;
			--display-en: "Baloo 2", sans-serif;
		}

		body.admin-course-page {
			margin: 0;
			color: var(--ink);
			background: var(--bg-warm);
			font-family: var(--sans);
			line-height: 1.78;
			-webkit-font-smoothing: antialiased;
		}

		body.admin-course-page *,
		body.admin-course-page *::before,
		body.admin-course-page *::after {
			box-sizing: border-box;
		}

		body.admin-course-page .admin-main {
			min-height: 70vh;
			padding: clamp(2rem, 4vw, 3.5rem) 0 4.5rem;
		}

		body.admin-course-page .wrap {
			width: min(1160px, 92vw);
			margin-inline: auto;
		}

		body.admin-course-page .page-head {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 1.5rem;
			margin-bottom: 1.25rem;
		}

		body.admin-course-page .page-kicker {
			display: inline-block;
			margin-bottom: .25rem;
			color: var(--orange-deep);
			font-size: .82rem;
			font-weight: 700;
			letter-spacing: .14em;
		}

		body.admin-course-page h1,
		body.admin-course-page h2,
		body.admin-course-page h3,
		body.admin-course-page p {
			margin-top: 0;
		}

		body.admin-course-page h1,
		body.admin-course-page h2,
		body.admin-course-page h3 {
			font-family: var(--serif);
			color: var(--ink);
		}

		body.admin-course-page h1 {
			margin-bottom: 0;
			font-size: clamp(1.8rem, 4vw, 2.5rem);
			line-height: 1.35;
		}

		body.admin-course-page h2 {
			margin-bottom: .35rem;
			font-size: clamp(1.3rem, 2.5vw, 1.65rem);
		}

		body.admin-course-page h3 {
			font-size: 1.05rem;
		}

		body.admin-course-page .course-nav {
			display: grid;
			grid-template-columns: repeat(5, minmax(0, 1fr));
			gap: .65rem;
			margin-bottom: 1.5rem;
			padding: .7rem;
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: rgba(255, 255, 255, .72);
			box-shadow: var(--shadow-sm);
		}

		body.admin-course-page .course-nav a {
			display: flex;
			min-height: 44px;
			align-items: center;
			justify-content: center;
			padding: .65rem .8rem;
			border-radius: 14px;
			color: var(--ink-soft);
			font-size: .9rem;
			font-weight: 700;
			text-align: center;
			text-decoration: none;
			transition: background .2s ease, color .2s ease, transform .2s ease;
		}

		body.admin-course-page .course-nav a:hover {
			color: var(--ink);
			background: var(--blue-soft);
			transform: translateY(-1px);
		}

		body.admin-course-page .course-nav a.active,
		body.admin-course-page .course-nav a[aria-current="page"] {
			color: var(--ink);
			background: var(--bg-soothing);
		}

		body.admin-course-page .btn {
			display: inline-flex;
			min-height: 44px;
			align-items: center;
			justify-content: center;
			gap: .45rem;
			padding: .72rem 1.35rem;
			border: 1px solid transparent;
			border-radius: 999px;
			color: var(--white);
			background: var(--orange);
			box-shadow: 0 7px 18px rgba(245, 142, 107, .25);
			font: inherit;
			font-weight: 700;
			text-decoration: none;
			cursor: pointer;
			transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
		}

		body.admin-course-page .btn:hover {
			background: var(--orange-deep);
			box-shadow: 0 10px 22px rgba(245, 142, 107, .32);
			transform: translateY(-2px);
		}

		body.admin-course-page .btn.ghost {
			border-color: var(--line);
			color: var(--ink);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}

		body.admin-course-page .btn.ghost:hover {
			border-color: var(--orange);
			color: var(--orange-deep);
			background: var(--white);
		}

		body.admin-course-page .btn.danger {
			border-color: #D99090;
			color: #9B4646;
			background: #FFF7F5;
			box-shadow: none;
		}

		body.admin-course-page .btn.danger:hover {
			color: var(--white);
			background: #B85C5C;
		}

		body.admin-course-page .course-preview-layout {
			display: grid;
			gap: 1.25rem;
		}

		body.admin-course-page .panel {
			padding: clamp(1.35rem, 3vw, 2rem);
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}

		body.admin-course-page .panel-heading {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 1rem;
			margin-bottom: 1.3rem;
		}

		body.admin-course-page .meta {
			margin-bottom: 0;
			color: var(--ink-soft);
			font-size: .92rem;
		}

		body.admin-course-page .status {
			flex: 0 0 auto;
			padding: .38rem .85rem;
			border-radius: 999px;
			color: var(--ink);
			background: var(--blue-soft);
			font-size: .82rem;
			font-weight: 700;
		}

		body.admin-course-page .detail-grid,
		body.admin-course-page .video-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1.25rem;
		}

		body.admin-course-page .summary-list {
			margin: 0;
		}

		body.admin-course-page .summary-list > div {
			display: grid;
			grid-template-columns: minmax(7rem, .42fr) minmax(0, 1fr);
			gap: 1rem;
			padding: .8rem 0;
			border-bottom: 1px solid var(--line);
		}

		body.admin-course-page .summary-list > div:last-child {
			border-bottom: 0;
		}

		body.admin-course-page dt {
			color: var(--ink-soft);
			font-size: .88rem;
		}

		body.admin-course-page dd {
			margin: 0;
			font-weight: 700;
			overflow-wrap: anywhere;
		}

		body.admin-course-page .video-grid {
			margin-top: 1.5rem;
		}

		body.admin-course-page .video-card {
			padding: 1rem;
			border: 1px solid var(--line);
			border-radius: 18px;
			background: var(--bg-warm);
		}

		body.admin-course-page .video-card h3 {
			margin-bottom: .75rem;
		}

		body.admin-course-page .video-card video {
			display: block;
			width: 100%;
			aspect-ratio: 16 / 9;
			border-radius: 14px;
			background: #1F2A30;
		}

		body.admin-course-page .outline-box {
			min-height: 9rem;
			padding: 1.1rem 1.2rem;
			border: 1px solid var(--line);
			border-radius: 16px;
			color: var(--ink);
			background: var(--bg-warm);
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		body.admin-course-page .review-actions-panel {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			align-items: center;
			gap: 1.5rem;
			border-left: 5px solid var(--orange);
		}

		body.admin-course-page .review-actions-panel .page-kicker {
			margin-bottom: .2rem;
		}

		body.admin-course-page .review-actions-panel h2 {
			margin-bottom: .2rem;
		}

		body.admin-course-page .page-actions {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: .75rem;
			flex-wrap: wrap;
		}

		body.admin-course-page .page-actions form {
			margin: 0;
		}

		body.admin-course-page :focus-visible {
			outline: 3px solid rgba(245, 142, 107, .55);
			outline-offset: 3px;
		}

		@media (max-width: 900px) {
			body.admin-course-page .course-nav {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}

			body.admin-course-page .detail-grid,
			body.admin-course-page .video-grid {
				grid-template-columns: 1fr;
			}

			body.admin-course-page .review-actions-panel {
				grid-template-columns: 1fr;
			}

			body.admin-course-page .page-actions {
				justify-content: flex-start;
			}
		}

		@media (max-width: 620px) {
			body.admin-course-page .admin-main {
				padding-top: 1.5rem;
			}

			body.admin-course-page .page-head,
			body.admin-course-page .panel-heading {
				align-items: stretch;
				flex-direction: column;
			}

			body.admin-course-page .course-nav {
				grid-template-columns: 1fr;
			}

			body.admin-course-page .summary-list > div {
				grid-template-columns: 1fr;
				gap: .2rem;
			}

			body.admin-course-page .page-actions,
			body.admin-course-page .page-actions form,
			body.admin-course-page .page-actions .btn,
			body.admin-course-page .page-head > .btn {
				width: 100%;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			body.admin-course-page *,
			body.admin-course-page *::before,
			body.admin-course-page *::after {
				scroll-behavior: auto !important;
				transition: none !important;
			}
		}
	</style>
</head>
<body class="thy2-page admin-course-page">
	<div th:replace="~{fragments/adminHeader :: header}"></div>

	<main id="main-content" class="admin-main">
		<div class="wrap">
			<header class="page-head">
				<div>
					<span class="page-kicker">後台管理</span>
					<h1 th:text="${course.courseName}">課程名稱</h1>
				</div>
				<a class="btn ghost" th:href="@{/admin/course/select_course}">返回課程發布管理</a>
			</header>

			<nav class="course-nav page-function-nav" aria-label="課程商城管理" data-admin-course-nav>
				<a data-admin-nav="courses" th:href="@{/admin/course/select_course}">課程發布管理</a>
				<a data-admin-nav="orders" th:href="@{/admin/course/select_course_order}">訂單與退款</a>
				<a data-admin-nav="payout" th:href="@{/admin/adminPayout/listAll}">營運與撥款</a>
				<a data-admin-nav="coupon" th:href="@{/admin/coupon/select_coupon}">優惠券管理</a>
				<a data-admin-nav="categories" th:href="@{/admin/course/select_course_categories}">課程分類</a>
			</nav>

			<div class="course-preview-layout">
				<section class="panel" aria-labelledby="course-detail-title">
					<div class="panel-heading">
						<div>
							<h2 id="course-detail-title">課程資料</h2>
							<p class="meta">
								<span th:text="${course.courseCategories.courseCatName}">分類</span>
								・
								<span th:text="${course.psychologist.name}">心理師</span>
								心理師
							</p>
						</div>
						<span class="status" th:text="${course.courseStatusText}">狀態</span>
					</div>

					<div class="detail-grid">
						<dl class="summary-list">
							<div>
								<dt>課程名稱</dt>
								<dd th:text="${course.courseName}">課程</dd>
							</div>
							<div>
								<dt>課程定價</dt>
								<dd>NT$ <span th:text="${course.price}">0</span></dd>
							</div>
							<div>
								<dt>收藏／評價／提問</dt>
								<dd>
									<span th:text="${course.saveCount}">0</span>
									／
									<span th:text="${course.reviewCount}">0</span>
									／
									<span th:text="${course.commentCount}">0</span>
								</dd>
							</div>
						</dl>

						<dl class="summary-list">
							<div th:if="${course.courseStatus == 4}">
								<dt>上架時間</dt>
								<dd th:text="${#temporals.format(course.listedAt,'yyyy年MM月dd日 HH:mm')}">—</dd>
							</div>
							<div th:if="${course.courseStatus == 5}">
								<dt>下架時間</dt>
								<dd th:text="${#temporals.format(course.delistedAt,'yyyy年MM月dd日 HH:mm')}">—</dd>
							</div>
							<div th:if="${course.courseStatus == 5}">
								<dt>下架原因</dt>
								<dd th:text="${course.delistReason != null and course.delistReason.label != null ? course.delistReason.label : '--'}">--</dd>
							</div>
							<th:block th:if="${course.psychDiscount != null}">
								<div>
									<dt>心理師折扣</dt>
									<dd th:text="${course.psychDiscount}">—</dd>
								</div>
								<div>
									<dt>折扣開始</dt>
									<dd th:text="${course.discountStart != null ? #temporals.format(course.discountStart,'yyyy/MM/dd HH:mm') : '--'}">--</dd>
								</div>
								<div>
									<dt>折扣結束</dt>
									<dd th:text="${course.discountEnd != null ? #temporals.format(course.discountEnd,'yyyy/MM/dd HH:mm') : '--'}">--</dd>
								</div>
							</th:block>
						</dl>
					</div>

					<div class="video-grid">
						<article class="video-card">
							<h3>完整課程影片</h3>
							<video controls>
								<source th:src="@{${course.videoSrc}}" type="video/mp4" />
							</video>
						</article>
						<article class="video-card">
							<h3>課程預覽影片</h3>
							<video controls>
								<source th:src="@{${course.videoSrcPre}}" type="video/mp4" />
							</video>
						</article>
					</div>
				</section>

				<section class="panel" aria-labelledby="course-outline-title">
					<h2 id="course-outline-title">純文字內容大綱</h2>
					<div class="outline-box" th:text="${course.outline}">課程大綱</div>
				</section>

				<section class="panel review-actions-panel"
					th:if="${course.courseStatus == 1}"
					aria-labelledby="course-review-actions-title">
					<div>
						<span class="page-kicker">課程審核</span>
						<h2 id="course-review-actions-title">選擇審核結果</h2>
						<p class="meta">請確認課程資料、影片與內容大綱後，再送出審核結果。</p>
					</div>
					<div class="page-actions">
						<form class="inline-form"
							method="post"
							th:action="@{examine_course}"
							data-confirm-form="確定退回此課程？">
							<input type="hidden" name="courseId" th:value="${course.courseId}" />
							<input type="hidden" name="courseStatus" value="3" />
							<button class="btn danger" type="submit">退回修改</button>
						</form>
						<form class="inline-form"
							method="post"
							th:action="@{examine_course}"
							data-confirm-form="確定核准此課程？">
							<input type="hidden" name="courseId" th:value="${course.courseId}" />
							<input type="hidden" name="courseStatus" value="2" />
							<button class="btn" type="submit">核准課程</button>
						</form>
					</div>
				</section>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/adminFooter :: footer}"></div>
	<script th:src="@{/js/course/admin-js.js}"></script>
</body>
</html>
