<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>退款審核列表</title>

<a th:href="@{/course_index}">
<button class="btn" type="button">
返回列表
</button>
</a>

<style>
body {
    font-family: Arial;
    margin: 30px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th {
    background: #f2f2f2;
}

.btn {
    padding: 6px 14px;
    cursor: pointer;
}
</style>
</head>
<body>

<h2>退款審核列表</h2>

<table>
    <thead>
        <tr>
            <th>訂單編號</th>
            <th>會員編號</th>
            <th>退款金額</th>
            <th>申請時間</th>
            <th>退款時間</th>
            <th>退款狀態</th>
            <th>操作</th>
        </tr>
    </thead>

    <tbody>
        <tr th:if="${refundList == null || refundList.isEmpty()}">
            <td colspan="7">目前沒有退款申請</td>
        </tr>

        <tr th:each="refund : ${refundList}">
            <td th:text="${refund.courseOrder.courseOrderId}"></td>
            <td th:text="${refund.member.memberId}"></td>
            <td th:text="${refund.refundAmount}"></td>
            <td th:text="${#temporals.format(refund.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${refund.refundedAt == null ? '--' : #temporals.format(refund.refundedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td>
                <span th:if="${refund.refundStatus == 0}">待審核</span>
                <span th:if="${refund.refundStatus == 1}">審核成功</span>
                <span th:if="${refund.refundStatus == 2}">審核失敗</span>
                <span th:if="${refund.refundStatus == 3}">已退款</span>
                <span th:if="${refund.refundStatus == 4}">退款異常</span>
            </td>
            <td>
                <a th:href="@{/admin/refund/detail/{courseOrderId}/{memberId}
                    (courseOrderId=${refund.courseOrder.courseOrderId},
                     memberId=${refund.member.memberId})}">
                    <button class="btn" type="button">查看明細</button>
                </a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
