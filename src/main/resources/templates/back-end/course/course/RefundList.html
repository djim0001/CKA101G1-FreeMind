<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>退款審核列表｜管理後台</title><link rel="stylesheet" th:href="@{/css/course/admin-style.css}" /></head><body class="thy2-page"><div class="layout"><aside class="sidebar"><a class="brand" href="/admin/home" th:href="@{/admin/home}">諮由自在 Free Mind<small>ADMIN CONSOLE</small></a><p class="nav-label">課程商城管理</p><nav class="nav"><a th:href="@{/admin/course/select_course}">課程發布管理</a><a class="active" th:href="@{/admin/course/select_course_order}">訂單與退款</a><a th:href="@{/admin/adminPayout/listAll}">營運與撥款</a><a th:href="@{/admin/coupon/select_coupon}">優惠券管理</a><a th:href="@{/admin/course/select_course_categories}">課程分類</a></nav></aside><div class="main"><header class="topbar"><span>訂單與退款／退款審核</span><div class="admin-id"><span class="avatar">管</span><b th:text="${admin != null ? admin.name : '系統管理員'}">系統管理員</b></div></header><main class="content"><div class="page-head"><div><h1>退款審核列表</h1><p>查看會員退款申請與目前處理狀態。</p></div><a class="btn ghost" th:href="@{/admin/course/select_course_order(tab='refunds')}">返回訂單管理</a></div><div class="table-wrap"><table><thead><tr><th>訂單編號</th><th>會員</th><th>退款金額</th><th>申請時間</th><th>退款時間</th><th>退款狀態</th><th>操作</th></tr></thead><tbody><tr th:if="${refundList == null || refundList.isEmpty()}"><td class="empty-state" colspan="7">目前沒有退款申請</td></tr><tr th:each="refund : ${refundList}"><td th:text="${refund.courseOrder.courseOrderId}">—</td><td th:text="${refund.member.name}">—</td><td>NT$ <span th:text="${refund.refundAmount}">0</span></td><td th:text="${#temporals.format(refund.createdAt,'yyyy-MM-dd HH:mm:ss')}">—</td><td th:text="${refund.refundedAt == null ? '--' : #temporals.format(refund.refundedAt,'yyyy-MM-dd HH:mm:ss')}">—</td><td><span class="status" th:text="${refund.refundStatus == 0 ? '待審核' : refund.refundStatus == 1 ? '審核成功' : refund.refundStatus == 2 ? '審核失敗' : refund.refundStatus == 3 ? '已退款' : '退款異常'}">狀態</span></td><td><a class="btn secondary" th:href="@{/admin/refund/detail/{courseOrderId}/{memberId}(courseOrderId=${refund.courseOrder.courseOrderId},memberId=${refund.member.memberId},tab='refunds')}">查看明細</a></td></tr></tbody></table></div></main></div></div><script th:src="@{/js/course/admin-js.js}"></script></body></html>
