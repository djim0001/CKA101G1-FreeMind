<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>退款審核</title>

<style>

body{
    font-family: Arial;
    margin:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
}

th{
    background:#f2f2f2;
    width:180px;
}

textarea{
    width:100%;
    resize:none;
}

.btn{
    padding:8px 18px;
    margin-right:10px;
    cursor:pointer;
}

</style>

</head>
<body>

<h2>退款詳細資料</h2>

<table>

<tr>
    <th>訂單編號</th>
    <td th:text="${refund.courseOrder.courseOrderId}"></td>
</tr>

<tr>
    <th>會員編號</th>
    <td th:text="${refund.member.memberId}"></td>
</tr>

<tr>
    <th>退款金額</th>
    <td th:text="${refund.refundAmount}"></td>
</tr>

<tr>
    <th>退款原因</th>
    <td>
        <textarea rows="5" readonly
                  th:text="${refund.refundReason}"></textarea>
    </td>
</tr>

<tr>
    <th>申請時間</th>
    <td th:text="${#temporals.format(refund.createdAt,'yyyy-MM-dd HH:mm:ss')}"></td>
</tr>

<tr>
    <th>退款時間</th>
    <td th:text="${refund.refundedAt==null?'--':#temporals.format(refund.refundedAt,'yyyy-MM-dd HH:mm:ss')}"></td>
</tr>

<tr>
    <th>目前狀態</th>
    <td>

        <span th:if="${refund.refundStatus==0}">
            待審核
        </span>

        <span th:if="${refund.refundStatus==1}">
            審核成功
        </span>

        <span th:if="${refund.refundStatus==2}">
            審核失敗
        </span>

        <span th:if="${refund.refundStatus==3}">
            已退款
        </span>

        <span th:if="${refund.refundStatus==4}">
            退款異常
        </span>

    </td>
</tr>

</table>

<br>

<form th:action="@{/admin/refund/approve/{orderId}/{memberId}
(orderId=${refund.courseOrder.courseOrderId},
memberId=${refund.member.memberId})}"
method="post"
style="display:inline;">

<button class="btn" type="submit">
審核成功
</button>

</form>


<form th:action="@{/admin/refund/reject/{orderId}/{memberId}
(orderId=${refund.courseOrder.courseOrderId},
memberId=${refund.member.memberId})}"
method="post"
style="display:inline;">

<button class="btn" type="submit">
審核失敗
</button>

</form>


<form th:action="@{/admin/refund/complete/{orderId}/{memberId}
(orderId=${refund.courseOrder.courseOrderId},
memberId=${refund.member.memberId})}"
method="post"
style="display:inline;">

<button class="btn" type="submit">
確認退款
</button>

</form>

<a th:href="@{/admin/refund/list}">
<button class="btn" type="button">
返回列表
</button>
</a>

</body>
</html>
