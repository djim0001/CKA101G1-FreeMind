<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="營運與撥款後台管理頁面" />
	<title>營運與撥款｜管理後台</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" href="/css/styles.css" />
	<style>

		@font-face {
			font-family: 'OpenHuninn';
			src:
				url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff') format('woff'),
				url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf') format('truetype');
			font-weight: 400;
			font-style: normal;
			font-display: swap;
		}

		:root {
			--bg-warm: #FFFAEE;
			--bg-soothing: #C2D9ED;
			--blue-soft: #DCEAF5;
			--orange: #F58E6B;
			--orange-deep: #E5764F;
			--pink: #FBD0BE;
			--pink-soft: #FDE6DB;
			--ink: #3A4B53;
			--ink-soft: #6b7981;
			--white: #FFFFFF;
			--line: #ecdfce;
			--shadow-sm: 0 4px 18px rgba(58, 75, 83, .07);
			--shadow-md: 0 16px 44px rgba(58, 75, 83, .13);
			--radius-lg: 34px;
			--radius-md: 22px;
			--serif: "OpenHuninn", "Noto Sans TC", sans-serif;
			--zen-maru: "Zen Maru Gothic", "OpenHuninn", "Noto Sans TC", sans-serif;
			--sans: "Noto Sans TC", system-ui, sans-serif;
			--script: "Caveat", "OpenHuninn", cursive;
			--display-en: "Baloo 2", sans-serif;
		}

		* {
			box-sizing: border-box;
		}

		html {
			min-width: 320px;
			scroll-behavior: smooth;
		}

		body.admin-course-page {
			display: flex;
			min-width: 320px;
			min-height: 100vh;
			flex-direction: column;
			margin: 0;
			color: var(--ink);
			background: var(--bg-warm);
			font-family: var(--sans);
			line-height: 1.78;
			-webkit-font-smoothing: antialiased;
			overflow-x: hidden;
		}

		body.admin-course-page a {
			color: inherit;
			text-decoration: none;
		}

		body.admin-course-page button,
		body.admin-course-page input,
		body.admin-course-page select,
		body.admin-course-page textarea {
			font: inherit;
		}

		body.admin-course-page button {
			border: 0;
			cursor: pointer;
		}

		body.admin-course-page img,
		body.admin-course-page svg {
			display: block;
			max-width: 100%;
		}

		body.admin-course-page [hidden] {
			display: none !important;
		}

		body.admin-course-page .wrap {
			width: min(1160px, 92vw);
			margin-inline: auto;
		}

		body.admin-course-page .skip-link {
			position: fixed;
			top: .75rem;
			left: .75rem;
			z-index: 999;
			padding: .65rem 1rem;
			border-radius: 999px;
			color: var(--white);
			background: var(--orange);
			transform: translateY(-160%);
		}

		body.admin-course-page .skip-link:focus {
			transform: translateY(0);
		}

		body.admin-course-page .site-header {
			position: sticky;
			top: 0;
			z-index: 100;
			border-bottom: 1px solid rgba(236, 223, 206, .7);
			color: var(--ink);
			background: rgba(253, 246, 237, .85);
			backdrop-filter: blur(12px);
		}

		body.admin-course-page .nav-inner {
			display: flex;
			align-items: center;
			gap: 1.4rem;
			height: 74px;
		}

		body.admin-course-page .brand {
			display: flex;
			align-items: center;
			gap: .8rem;
			flex: 0 0 auto;
		}

		body.admin-course-page .logo-mind {
			display: flex;
			flex: 0 0 auto;
			flex-direction: column;
			align-items: flex-start;
			line-height: 1;
			user-select: none;
		}

		body.admin-course-page .logo-mind .word,
		body.admin-course-page .logo-mind .faces {
			display: flex;
			align-items: flex-end;
		}

		body.admin-course-page .logo-mind .faces {
			align-items: flex-start;
			margin-top: -1px;
		}

		body.admin-course-page .logo-mind .word span {
			display: inline-block;
			font-family: var(--display-en);
			font-size: 1.5rem;
			font-weight: 700;
			letter-spacing: -.03em;
			text-align: center;
		}

		body.admin-course-page .logo-mind .word .m { width: 24px; color: #EFB65E; }
		body.admin-course-page .logo-mind .word .i { width: 9px; color: #DB93A9; }
		body.admin-course-page .logo-mind .word .n { width: 17px; color: #8FB2C9; }
		body.admin-course-page .logo-mind .word .d { width: 17px; color: #9BB893; }
		body.admin-course-page .logo-mind .faces .fm { width: 24px; height: 11px; }
		body.admin-course-page .logo-mind .faces .fi { width: 9px; height: 11px; }
		body.admin-course-page .logo-mind .faces .fn { width: 17px; height: 11px; }
		body.admin-course-page .logo-mind .faces .fd { width: 17px; height: 11px; }

		body.admin-course-page .brand-text {
			display: flex;
			flex-direction: column;
			line-height: 1.15;
		}

		body.admin-course-page .brand-text .logo {
			color: var(--ink);
			font-family: var(--zen-maru);
			font-size: 1.18rem;
			font-weight: 700;
			letter-spacing: .02em;
		}

		body.admin-course-page .brand-text .en {
			margin-top: .15em;
			color: var(--ink-soft);
			font-family: var(--display-en);
			font-size: .85rem;
			font-weight: 700;
			letter-spacing: .24em;
			text-transform: uppercase;
		}

		body.admin-course-page .admin-badge {
			padding-left: 1.05rem;
			border-left: 1px solid var(--line);
			color: var(--ink-soft);
			font-size: .84rem;
			font-weight: 700;
			letter-spacing: .08em;
		}

		body.admin-course-page .nav-actions {
			display: flex;
			align-items: center;
			gap: .55rem;
			margin-left: auto;
		}

		body.admin-course-page .profile-entry {
			display: flex;
			align-items: center;
			gap: .65rem;
			min-height: 46px;
			padding: .3rem .75rem .3rem .35rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: var(--white);
			box-shadow: var(--shadow-sm);
			transition: border-color .16s ease, background .16s ease, transform .16s ease;
		}

		body.admin-course-page .profile-entry:hover {
			border-color: var(--bg-soothing);
			background: var(--blue-soft);
			transform: translateY(-2px);
		}

		body.admin-course-page .profile-photo {
			display: grid;
			place-items: center;
			width: 36px;
			height: 36px;
			flex: 0 0 auto;
			border-radius: 50%;
			color: var(--ink);
			background: linear-gradient(135deg, var(--pink), var(--bg-soothing));
		}

		body.admin-course-page .profile-photo svg {
			width: 21px;
			height: 21px;
			stroke: currentColor;
		}

		body.admin-course-page .profile-copy {
			display: flex;
			min-width: 0;
			flex-direction: column;
			line-height: 1.25;
		}

		body.admin-course-page .profile-copy small {
			color: var(--ink-soft);
			font-size: .68rem;
		}

		body.admin-course-page .profile-copy strong {
			max-width: 9.5rem;
			overflow: hidden;
			color: var(--ink);
			font-size: .82rem;
			font-weight: 500;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		body.admin-course-page .logout-form {
			margin: 0;
		}

		body.admin-course-page .logout-button {
			display: inline-flex;
			align-items: center;
			gap: .4rem;
			min-height: 46px;
			padding: .6rem .8rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--ink);
			background: var(--white);
			box-shadow: var(--shadow-sm);
			transition: border-color .16s ease, background .16s ease, color .16s ease, transform .16s ease;
		}

		body.admin-course-page .logout-button:hover {
			border-color: var(--orange);
			color: var(--white);
			background: var(--orange-deep);
			transform: translateY(-2px);
		}

		body.admin-course-page .logout-button svg {
			width: 17px;
			height: 17px;
			stroke: currentColor;
		}

		body.admin-course-page .course-nav {
			display: flex;
			align-items: center;
			gap: .1rem;
			min-width: 0;
			margin-left: .35rem;
			padding: 0;
			overflow-x: auto;
			scrollbar-width: thin;
		}

		body.admin-course-page .course-nav a {
			flex: 0 0 auto;
			padding: .44rem .7rem;
			border: 1px solid transparent;
			border-radius: 999px;
			color: var(--ink-soft);
			background: transparent;
			box-shadow: none;
			font-size: .84rem;
			font-weight: 500;
			white-space: nowrap;
			transition: color .16s ease;
		}

		body.admin-course-page .course-nav a:hover {
			border-color: transparent;
			color: var(--ink);
			background: transparent;
		}

		body.admin-course-page .course-nav a.active,
		body.admin-course-page .course-nav a[aria-current="page"] {
			border-color: rgba(194, 217, 237, .9);
			color: var(--ink);
			background: var(--blue-soft);
		}

		body.admin-course-page .admin-main {
			width: 100%;
			flex: 1;
			padding: clamp(1.25rem, 2vw, 1.75rem) 0 4rem;
		}

		body.admin-course-page .page-head {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 2rem;
			margin-bottom: 1.75rem;
			padding-bottom: 1.4rem;
			border-bottom: 1px solid var(--line);
		}

		body.admin-course-page h1,
		body.admin-course-page h2,
		body.admin-course-page h3,
		body.admin-course-page p {
			margin-top: 0;
		}

		body.admin-course-page h1 {
			margin-bottom: .3rem;
			font-family: var(--serif);
			font-size: clamp(1.75rem, 3vw, 2.35rem);
			line-height: 1.3;
		}

		body.admin-course-page .page-kicker {
			display: block;
			margin-bottom: .35rem;
			color: var(--orange);
			font-size: .75rem;
			font-weight: 700;
			letter-spacing: .16em;
			text-transform: uppercase;
		}

		body.admin-course-page .page-head-actions {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: flex-end;
			gap: 1rem;
			margin-left: auto;
		}

		body.admin-course-page .page-head-actions .page-function-nav {
			display: flex;
			flex-flow: row nowrap;
			align-items: center;
			justify-content: flex-end;
			gap: .25rem;
			width: max-content;
			max-width: 100%;
			margin-left: 0;
			padding: 0;
			overflow-x: auto;
		}

		body.admin-course-page .page-head-actions .page-function-nav a {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 42px;
			padding: .5rem .8rem;
			font-size: .84rem;
			line-height: 1.2;
		}

		body.admin-course-page .page-head-actions p {
			max-width: 31rem;
			margin: 0;
			color: var(--ink-soft);
			font-size: .92rem;
			text-align: right;
		}

		body.admin-course-page .page-head h1 {
			margin: 0;
		}

		body.admin-course-page h2 {
			margin-bottom: .8rem;
			font-family: var(--serif);
			font-size: 1.08rem;
		}

		body.admin-course-page h3 {
			font-family: var(--serif);
			font-size: .98rem;
		}

		body.admin-course-page .page-head p,
		body.admin-course-page .meta,
		body.admin-course-page .form-note {
			margin-bottom: 0;
			color: var(--ink-soft);
			font-size: .84rem;
		}

		body.admin-course-page .btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 40px;
			padding: .55rem 1rem;
			border: 1px solid var(--orange);
			border-radius: 999px;
			color: var(--white);
			background: var(--orange);
			box-shadow: 0 6px 16px rgba(245, 142, 107, .22);
			font-size: .85rem;
			font-weight: 700;
			white-space: nowrap;
			transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
		}

		body.admin-course-page .btn:hover {
			border-color: var(--orange-deep);
			background: var(--orange-deep);
			transform: translateY(-1px);
		}

		body.admin-course-page .btn.ghost,
		body.admin-course-page .btn.secondary {
			border-color: var(--line);
			color: var(--ink);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}

		body.admin-course-page .btn.secondary {
			border-color: rgba(194, 217, 237, .95);
			background: var(--blue-soft);
		}

		body.admin-course-page .btn.danger {
			border-color: var(--orange-deep);
			background: var(--orange-deep);
		}

		body.admin-course-page .stats {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
			gap: 1rem;
			margin-bottom: 1.4rem;
		}

		body.admin-course-page .stat,
		body.admin-course-page .panel,
		body.admin-course-page .tab-panel {
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			background: var(--white);
			box-shadow: var(--shadow-sm);
		}

		body.admin-course-page .stat {
			padding: 1.1rem 1.2rem;
		}

		body.admin-course-page .stat span {
			display: block;
			color: var(--ink-soft);
			font-size: .78rem;
		}

		body.admin-course-page .stat strong {
			display: block;
			margin-top: .2rem;
			font-family: var(--serif);
			font-size: 1.7rem;
		}

		body.admin-course-page .tabs {
			display: flex;
			gap: .45rem;
			margin-bottom: 1rem;
			overflow-x: auto;
		}

		body.admin-course-page .tabs button {
			padding: .65rem 1rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--ink-soft);
			background: var(--white);
			white-space: nowrap;
		}

		body.admin-course-page .tabs button.active {
			border-color: var(--bg-soothing);
			color: var(--ink);
			background: var(--blue-soft);
			font-weight: 700;
		}

		body.admin-course-page .tab-panel,
		body.admin-course-page .panel {
			padding: 1.25rem;
		}

		body.admin-course-page .tab-panel > .panel {
			padding: 0;
			border: 0;
			box-shadow: none;
		}

		body.admin-course-page .panel-heading {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			margin: -1.25rem -1.25rem 1.2rem;
			padding: 1rem 1.25rem;
			border-bottom: 1px solid var(--line);
			border-radius: var(--radius-md) var(--radius-md) 0 0;
			background: linear-gradient(90deg, var(--pink-soft), var(--white) 52%, var(--blue-soft));
		}

		body.admin-course-page .panel-heading h2,
		body.admin-course-page .panel-heading p {
			margin-bottom: 0;
		}

		body.admin-course-page .toolbar,
		body.admin-course-page .form-grid,
		body.admin-course-page .page-actions,
		body.admin-course-page .inline-actions,
		body.admin-course-page .dialog-actions {
			display: flex;
			align-items: flex-end;
			gap: .75rem;
			flex-wrap: wrap;
		}

		body.admin-course-page .toolbar {
			margin-bottom: 1rem;
			padding: 1rem;
			border: 1px solid var(--line);
			border-radius: 16px;
			background: var(--bg-warm);
		}

		body.admin-course-page .form-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
		}

		body.admin-course-page .form-group {
			min-width: 0;
		}

		body.admin-course-page label {
			display: block;
			margin-bottom: .35rem;
			color: var(--ink);
			font-size: .82rem;
			font-weight: 700;
		}

		body.admin-course-page .field {
			width: 100%;
			min-height: 42px;
			padding: .62rem .78rem;
			border: 1px solid var(--line);
			border-radius: 12px;
			color: var(--ink);
			background: var(--white);
			outline: none;
			transition: border-color .16s ease, box-shadow .16s ease;
		}

		body.admin-course-page textarea.field {
			min-height: 112px;
			resize: vertical;
		}

		body.admin-course-page .field:focus {
			border-color: var(--orange);
			box-shadow: 0 0 0 3px rgba(245, 142, 107, .14);
		}

		body.admin-course-page .error,
		body.admin-course-page .required {
			color: var(--orange-deep);
			font-size: .78rem;
		}

		body.admin-course-page .notice {
			padding: .85rem 1rem;
			border: 1px solid rgba(194, 217, 237, .9);
			border-radius: 14px;
			color: var(--ink);
			background: var(--blue-soft);
			font-size: .84rem;
		}

		body.admin-course-page .grid-2,
		body.admin-course-page .detail-grid,
		body.admin-course-page .video-grid,
		body.admin-course-page .review-shell {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1.2rem;
		}

		body.admin-course-page .review-shell {
			grid-template-columns: minmax(0, 1fr) minmax(260px, .34fr);
			align-items: start;
		}

		body.admin-course-page .review-shell-full {
			grid-template-columns: 1fr;
		}

		body.admin-course-page .review-side {
			position: sticky;
			top: 154px;
		}

		body.admin-course-page .table-wrap {
			width: 100%;
			overflow-x: auto;
			border: 1px solid var(--line);
			border-radius: 16px;
			background: var(--white);
		}

		body.admin-course-page table {
			width: 100%;
			min-width: 720px;
			border-collapse: collapse;
			font-size: .82rem;
		}

		body.admin-course-page th,
		body.admin-course-page td {
			padding: .78rem .85rem;
			border-bottom: 1px solid var(--line);
			text-align: left;
			vertical-align: middle;
		}

		body.admin-course-page th {
			color: var(--ink);
			background: var(--bg-warm);
			font-size: .76rem;
			font-weight: 700;
			letter-spacing: .03em;
			white-space: nowrap;
		}

		body.admin-course-page tbody tr:last-child td {
			border-bottom: 0;
		}

		body.admin-course-page tbody tr:hover td {
			background: rgba(220, 234, 245, .28);
		}

		body.admin-course-page .empty-state {
			padding: 2rem 1rem;
			color: var(--ink-soft);
			text-align: center;
		}

		body.admin-course-page .course-summary {
			display: flex;
			min-width: 150px;
			flex-direction: column;
		}

		body.admin-course-page .status,
		body.admin-course-page .status-paid,
		body.admin-course-page .status-unpaid,
		body.admin-course-page .status-cancelled,
		body.admin-course-page .status-refunded {
			display: inline-flex;
			padding: .22rem .58rem;
			border-radius: 999px;
			color: var(--ink);
			background: var(--blue-soft);
			font-size: .76rem;
			font-weight: 700;
			white-space: nowrap;
		}

		body.admin-course-page .status-paid { background: #DCEBDD; }
		body.admin-course-page .status-unpaid { background: var(--pink-soft); }
		body.admin-course-page .status-cancelled,
		body.admin-course-page .status-refunded { background: var(--pink); }

		body.admin-course-page .inline-form,
		body.admin-course-page .page-actions form {
			margin: 0;
		}

		body.admin-course-page .summary-list {
			margin: 0;
		}

		body.admin-course-page .summary-list > div {
			display: grid;
			grid-template-columns: minmax(100px, .42fr) minmax(0, 1fr);
			gap: .8rem;
			padding: .7rem 0;

<body class="thy2-page admin-course-page">
	<div th:replace="~{fragments/adminHeader :: header}"></div>
	<main id="main-content" class="admin-main">
		<div class="wrap">
<div class="page-head">
					<div>
						<span class="page-kicker">後台管理</span>
						<h1>課程營運與撥款</h1>
					</div>
					<div class="page-head-actions">
						<nav class="course-nav page-function-nav" aria-label="課程商城管理" data-admin-course-nav>
							<a data-admin-nav="courses" th:href="@{/admin/course/select_course}">課程發布管理</a>
							<a data-admin-nav="orders" th:href="@{/admin/course/select_course_order}">訂單與退款</a>
							<a data-admin-nav="payout" th:href="@{/admin/adminPayout/listAll}">營運與撥款</a>
							<a data-admin-nav="coupon" th:href="@{/admin/coupon/select_coupon}">優惠券管理</a>
							<a data-admin-nav="categories" th:href="@{/admin/course/select_course_categories}">課程分類</a>
						</nav>
						<button class="btn ghost" type="button" data-toast="營運報表已匯出">匯出月報</button>
					</div>
				</div>

      <section class="stats payout-stats">
        <div class="stat">
          <span>售出課程</span>
          <strong th:text="${allDetailCount != null ? allDetailCount : 0}">0</strong>
        </div>
        <div class="stat">
          <span>待撥款</span>
          <strong th:text="${UnpaidPayouts != null ? UnpaidPayouts : 0}">0</strong>
        </div>
      </section>

      <section class="panel revenue-panel">
        <div class="panel-heading">
          <div>
            <h2>各心理師營收統計</h2>
            <p class="meta">本月營收前五名</p>
          </div>
        </div>

        <div
          class="empty-state"
          th:if="${psychologistNo1 == null and psychologistNo2 == null and psychologistNo3 == null and psychologistNo4 == null and psychologistNo5 == null}">
          目前沒有心理師營收資料
        </div>

        <div class="revenue-chart" data-revenue-chart>
          <div
            class="revenue-chart-row"
            data-revenue-row
            th:if="${psychologistNo1 != null}"
            th:attr="data-revenue-value=${totalSales1 != null ? totalSales1 : 0}">
            <span class="revenue-rank">1</span>
            <strong class="revenue-name" th:text="${psychologistNo1.name}">心理師</strong>
            <div class="revenue-bar-track"><span data-revenue-bar role="progressbar"></span></div>
            <strong class="revenue-amount">NT$ <span th:text="${totalSales1 != null ? totalSales1 : 0}">0</span></strong>
          </div>

          <div
            class="revenue-chart-row"
            data-revenue-row
            th:if="${psychologistNo2 != null}"
            th:attr="data-revenue-value=${totalSales2 != null ? totalSales2 : 0}">
            <span class="revenue-rank">2</span>
            <strong class="revenue-name" th:text="${psychologistNo2.name}">心理師</strong>
            <div class="revenue-bar-track"><span data-revenue-bar role="progressbar"></span></div>
            <strong class="revenue-amount">NT$ <span th:text="${totalSales2 != null ? totalSales2 : 0}">0</span></strong>
          </div>

          <div
            class="revenue-chart-row"
            data-revenue-row
            th:if="${psychologistNo3 != null}"
            th:attr="data-revenue-value=${totalSales3 != null ? totalSales3 : 0}">
            <span class="revenue-rank">3</span>
            <strong class="revenue-name" th:text="${psychologistNo3.name}">心理師</strong>
            <div class="revenue-bar-track"><span data-revenue-bar role="progressbar"></span></div>
            <strong class="revenue-amount">NT$ <span th:text="${totalSales3 != null ? totalSales3 : 0}">0</span></strong>
          </div>

          <div
            class="revenue-chart-row"
            data-revenue-row
            th:if="${psychologistNo4 != null}"
            th:attr="data-revenue-value=${totalSales4 != null ? totalSales4 : 0}">
            <span class="revenue-rank">4</span>
            <strong class="revenue-name" th:text="${psychologistNo4.name}">心理師</strong>
            <div class="revenue-bar-track"><span data-revenue-bar role="progressbar"></span></div>
            <strong class="revenue-amount">NT$ <span th:text="${totalSales4 != null ? totalSales4 : 0}">0</span></strong>
          </div>

          <div
            class="revenue-chart-row"
            data-revenue-row
            th:if="${psychologistNo5 != null}"
            th:attr="data-revenue-value=${totalSales5 != null ? totalSales5 : 0}">
            <span class="revenue-rank">5</span>
            <strong class="revenue-name" th:text="${psychologistNo5.name}">心理師</strong>
            <div class="revenue-bar-track"><span data-revenue-bar role="progressbar"></span></div>
            <strong class="revenue-amount">NT$ <span th:text="${totalSales5 != null ? totalSales5 : 0}">0</span></strong>
          </div>
        </div>
      </section>

      <section class="panel" style="margin-top:20px">
        <div class="panel-heading">
          <div>
            <h2>撥款審核與發放</h2>
            <p class="meta" th:if="${psychologist != null}">
              目前顯示：
              <strong th:text="${psychologist.name}">心理師</strong>
            </p>
          </div>
        </div>

        <form class="toolbar payout-search-form" th:action="@{/admin/adminPayout/listAll}" method="get">
          <label for="payoutPsychId">心理師</label>
          <input
            id="payoutPsychId"
            class="field"
            type="number"
            name="psychId"
            min="1"
            th:value="${psychologist != null ? psychologist.psychId : ''}"
            placeholder="輸入心理師編號">
          <button class="btn" type="submit">搜尋</button>
          <a class="btn ghost" th:href="@{/admin/adminPayout/listAll}">顯示全部</a>
        </form>

        <div class="table-wrap">
          <table class="payout-records-table">
            <thead>
            <tr>
              <th>撥款編號</th>
              <th>月份</th>
              <th>心理師</th>
              <th>應撥金額</th>
              <th>平台抽成</th>
              <th>退款扣除</th>
              <th>實際撥款</th>
              <th>撥款時間</th>
              <th>狀態</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${allPayout == null or allPayout.isEmpty()}">
              <td class="empty-state" colspan="9">目前沒有撥款資料</td>
            </tr>
            <tr th:each="onePayout : ${allPayout}">
              <td th:text="${onePayout.payoutId}">—</td>
              <td th:text="${onePayout.billingMonth}">—</td>
              <td th:text="${onePayout.psychologist.name}">—</td>
              <td>NT$ <span th:text="${onePayout.grossPayoutAmount}">0</span></td>
              <td>NT$ <span th:text="${onePayout.platformCommission}">0</span></td>
              <td>NT$ <span th:text="${onePayout.billingOffset}">0</span></td>
              <td><strong>NT$ <span th:text="${onePayout.netPayoutAmount}">0</span></strong></td>
              <td th:text="${onePayout.paidAt != null ? #temporals.format(onePayout.paidAt, 'yyyy-MM-dd HH:mm:ss') : '--'}">—</td>
              <td><span class="status" th:text="${onePayout.payoutStatusText}">狀態</span></td>
            </tr>
            </tbody>
          </table>
        </div>
      </section>
		</div>
	</main>
	<div th:replace="~{fragments/adminFooter :: footer}"></div>
	<script th:src="@{/js/course/admin-js.js}"></script>
</body>
</html>
