<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>退款審核詳情｜管理後台</title><link rel="stylesheet" th:href="@{/css/course/admin-style.css}" /></head><body class="thy2-page"><div class="layout"><aside class="sidebar"><a class="brand" href="/admin/home" th:href="@{/admin/home}">諮由自在 Free Mind<small>ADMIN CONSOLE</small></a><p class="nav-label">課程商城管理</p><nav class="nav"><a th:href="@{/admin/course/select_course}">課程發布管理</a><a class="active" th:href="@{/admin/course/select_course_order}">訂單與退款</a><a th:href="@{/admin/adminPayout/listAll}">營運與撥款</a><a th:href="@{/admin/coupon/select_coupon}">優惠券管理</a><a th:href="@{/admin/course/select_course_categories}">課程分類</a></nav></aside><div class="main"><header class="topbar"><span>退款審核／申請詳情</span><div class="admin-id"><span class="avatar">管</span><b th:text="${admin != null ? admin.name : '系統管理員'}">系統管理員</b></div></header><main class="content"><div class="page-head"><div><h1>退款詳細資料</h1><p>檢查退款原因、課程明細與會員課程權限。</p></div><a class="btn ghost" th:href="@{/admin/course/select_course_order(tab='refunds')}">返回退款列表</a></div><div class="grid-2"><section class="panel"><h2>退款申請資訊</h2><dl class="summary-list"><div><dt>訂單編號</dt><dd th:text="${refund.courseOrder.courseOrderId}">—</dd></div><div><dt>會員</dt><dd th:text="${refund.member.name}">—</dd></div><div><dt>退款金額</dt><dd>NT$ <span th:text="${refund.refundAmount}">0</span></dd></div><div><dt>申請時間</dt><dd th:text="${#temporals.format(refund.createdAt,'yyyy-MM-dd HH:mm:ss')}">—</dd></div><div><dt>退款時間</dt><dd th:text="${refund.refundedAt == null ? '--' : #temporals.format(refund.refundedAt,'yyyy-MM-dd HH:mm:ss')}">—</dd></div><div><dt>目前狀態</dt><dd th:text="${refund.refundStatus == 0 ? '待審核' : refund.refundStatus == 1 ? '審核成功' : refund.refundStatus == 2 ? '審核失敗' : refund.refundStatus == 3 ? '已退款' : '退款異常'}">狀態</dd></div></dl></section><section class="panel"><h2>退款原因</h2><textarea class="field" rows="8" readonly th:text="${refund.refundReason}">退款原因</textarea><div class="notice" style="margin-top:16px">審核前請確認退款資格、付款狀態及課程觀看權限。</div></section></div><section class="panel" style="margin-top:20px"><h2>退款課程明細</h2><div class="table-wrap"><table><thead><tr><th>課程編號</th><th>課程名稱</th><th>課程原價</th><th>折扣後價格</th><th>課程權限</th></tr></thead><tbody><tr th:if="${orderDetails == null || orderDetails.isEmpty()}"><td class="empty-state" colspan="5">查無課程明細</td></tr><tr th:each="detail : ${orderDetails}"><td th:text="${detail.course.courseId}">—</td><td th:text="${detail.course.courseName}">—</td><td th:text="${detail.price}">—</td><td th:text="${detail.discountedPrice == null ? '--' : detail.discountedPrice}">—</td><td th:text="${detail.coursePermissionText}">—</td></tr></tbody></table></div></section><div class="page-actions" style="margin-top:20px" th:if="${refund != null and refund.refundStatus == 0}"><form method="post" th:action="@{/admin/refund/approve/{orderId}/{memberId}(orderId=${refund.courseOrder.courseOrderId},memberId=${refund.member.memberId})}" data-confirm-form="確定核准此退款？"><button class="btn" type="submit">核准退款</button></form><form method="post" th:action="@{/admin/refund/reject/{orderId}/{memberId}(orderId=${refund.courseOrder.courseOrderId},memberId=${refund.member.memberId})}" data-confirm-form="確定退回此退款？"><button class="btn danger" type="submit">退回申請</button></form></div></main></div></div><script th:src="@{/js/course/admin-js.js}"></script></body></html>
