
<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>新增優惠券｜管理後台</title>
<link rel="stylesheet" th:href="@{/css/course/admin.css}" />
<link rel="stylesheet" th:href="@{/css/course/style.css}" />
</head>
<body class="thy2-page">
	<div class="layout">
		<aside class="sidebar">
			<a class="brand" th:href="@{/}">諮由自在 Free Mind<small>ADMIN
					CONSOLE</small></a>
			<p class="nav-label">課程商城管理</p>
			<nav class="nav">
				<a th:href="@{/admin/course/select_course}">課程發布管理</a><a
					th:href="@{/admin/course/select_course_order}">訂單與退款</a><a
					class="active" th:href="@{/admin/coupon/select_coupon}">優惠券管理</a>
			</nav>
		</aside>
		<div class="main">
			<header class="topbar">
				<span>優惠券管理／新增規格</span>
				<div class="admin-id">
					<span class="avatar">管</span>系統管理員
				</div>
			</header>
			<main class="content">
				<div class="page-head">
					<div>
						<h1>新增優惠券</h1>
						<p>建立全站課程優惠券規格。</p>
					</div>
					<a class="btn ghost" th:href="@{/admin/coupon/select_coupon}">返回優惠券管理</a>
				</div>
				<section class="panel">
					<div class="notice">優惠券不使用優惠碼、不指定課程；會員取得後依優惠效期計算可使用期限。</div>
					<p class="error" th:if="${errorMessage != null}"
						th:text="${errorMessage}"></p>
					<form class="form-grid" th:action="@{insert_coupon}" method="post"
						th:object="${coupon}" style="margin-top: 18px">
						<div class="form-group">
							<label for="couponName">優惠券名稱 <span class="required">＊</span></label><input
								id="couponName" class="field" type="text"
								th:field="*{couponName}" required><span class="error"
								th:if="${#fields.hasErrors('couponName')}"
								th:errors="*{couponName}"></span>
						</div>
						<div class="form-group">
							<label for="discountDuration">發放後有效天數 <span
								class="required">＊</span></label><input id="discountDuration"
								class="field" type="number" min="1"
								th:field="*{discountDuration}" required><span
								class="error" th:if="${#fields.hasErrors('discountDuration')}"
								th:errors="*{discountDuration}"></span>
						</div>
						<div class="form-group">
							<label for="triggerThreshold">消費觸發門檻（NT$）</label><input
								id="triggerThreshold" class="field" type="number" min="0"
								th:field="*{triggerThreshold}"><span class="error"
								th:if="${#fields.hasErrors('triggerThreshold')}"
								th:errors="*{triggerThreshold}"></span>
						</div>
						<div class="form-group">
							<label for="discount">折扣倍率 <span class="required">＊</span></label><input
								id="discount" class="field" type="number" min="0.1" max="0.95"
								step="0.05" th:field="*{discount}" required><span
								class="form-note">例如九五折填 0.95，八折填 0.8。</span><span class="error"
								th:if="${#fields.hasErrors('discount')}" th:errors="*{discount}"></span>
						</div>
						<div class="form-group">
							<label for="discountLimit">最高折抵金額（NT$）</label><input
								id="discountLimit" class="field" type="number" min="0"
								th:field="*{discountLimit}"><span class="error"
								th:if="${#fields.hasErrors('discountLimit')}"
								th:errors="*{discountLimit}"></span>
						</div>
						<div class="form-group" style="align-self: end">
							<div class="inline-actions">
								<a class="btn ghost" th:href="@{/admin/coupon/select_coupon}">取消</a>
								<button class="btn" type="submit">儲存優惠券規格</button>
							</div>
						</div>
					</form>
				</section>
			</main>
		</div>
	</div>
<script th:src="@{/js/course/app.js}"></script>
</body>
</html>
