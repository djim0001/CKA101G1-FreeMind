<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
<head>
<meta charset="UTF-8">
<title>優惠券搜尋頁面</title>
</head>
<body>
	<h1>優惠券</h1>

	<h3>
		<a th:href="@{/course_index}">課程商城</a>
	</h3>
	<h3>
		<a th:href="@{/coupon/addCoupon}">新增優惠券</a>
	</h3>
	<br>
	<div th:utext="${errorMessage}">${errorMessage}</div>
	<br>
	<form method="post" th:action="@{select_one_coupon}">
		選擇優惠券: <select name="couponId">
			<option th:each="coupon : ${couponListAll}"
				th:value="${coupon.couponId}" th:text="${coupon.couponName}" />
		</select> <input type="submit" value="送出">
	</form>
	<br>

	<p th:if="${session.couponPageQty > 0}">
	現在頁數:<b th:text=|${currentPage}/${session.couponPageQty}|>0</b>
	</p>
	<table>
		<thead>
			<tr>
				<th>優惠券名稱</th>
				<th>優惠效期(天)</th>
				<th>消費觸發門檻</th>
				<th>優惠券折扣</th>
				<th>折扣上限</th>
				<th>其他功能</th>
			</tr>
		</thead>
		<tbody>
			<th:block th:each="coupon : ${couponListAllPages}">
				<tr>
					<td th:text="${coupon.couponName}"></td>
					<td th:text="${coupon.discountDuration}"></td>
					<td
						th:text="${coupon.triggerThreshold != null ? coupon.triggerThreshold : 0}"></td>
					<td th:text="${coupon.discount}"></td>
					<td
						th:text="${coupon.discountLimit != null ? coupon.discountLimit : 0}">
					</td>
				</tr>
			</th:block>
		</tbody>

	</table>
	<span th:if="${currentPage > 1}">
		<a th:href="@{/coupon/selectCoupon(page=1)}">至第一頁</a>&nbsp;
	</span>
	<span th:if="${currentPage-1 != 0}">
		<a th:href="@{/coupon/selectCoupon(page=${currentPage-1})}">上一頁</a>&nbsp;
	</span>
	<span th:if="${currentPage+1 <= session.couponPageQty}">
		<a th:href="@{/coupon/selectCoupon(page=${currentPage+1})}">下一頁</a>&nbsp;
	</span>
	<span th:if="${currentPage != session.couponPageQty}">
		<a th:href="@{/coupon/selectCoupon(page=${session.couponPageQty})}">至最後一頁</a>&nbsp;
	</span>




</body>
</html>
