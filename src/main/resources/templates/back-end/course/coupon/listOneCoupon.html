
<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>優惠券詳情｜管理後台</title>
<link rel="stylesheet" th:href="@{/css/course/style.css}" />
<link rel="stylesheet" th:href="@{/css/course/admin.css}" />
</head>
<body class="thy2-page">
	<div class="layout">
		<aside class="sidebar">
			<a class="brand" th:href="@{/}">諮由自在 Free Mind<small>ADMIN
					CONSOLE</small></a>
			<p class="nav-label">課程商城管理</p>
			<nav class="nav">
				<a th:href="@{/admin/course/select_course}">課程發布管理</a><a
					class="active" th:href="@{/admin/coupon/select_coupon}">優惠券管理</a>
			</nav>
		</aside>
		<div class="main">
			<header class="topbar">
				<span>優惠券管理／規格詳情</span>
				<div class="admin-id">
					<span class="avatar">管</span>系統管理員
				</div>
			</header>
			<main class="content">
				<div class="page-head">
					<div>
						<h1>優惠券詳情</h1>
						<p>查看優惠券的折扣與使用條件。</p>
					</div>
					<a class="btn ghost" th:href="@{/admin/coupon/select_coupon}">返回優惠券管理</a>
				</div>
				<section class="panel">
					<dl class="summary-list">
						<div>
							<dt>優惠券編號</dt>
							<dd th:text="${coupon.couponId}">—</dd>
						</div>
						<div>
							<dt>優惠券名稱</dt>
							<dd th:text="${coupon.couponName}">—</dd>
						</div>
						<div>
							<dt>折扣</dt>
							<dd th:text="${coupon.Discount}">—</dd>
						</div>
						<div>
							<dt>最高折抵</dt>
							<dd>
								NT$ <span
									th:text="${coupon.DiscountLimit != null ? coupon.DiscountLimit : 0}">0</span>
							</dd>
						</div>
						<div>
							<dt>消費門檻</dt>
							<dd>
								NT$ <span
									th:text="${coupon.triggerThreshold != null ? coupon.triggerThreshold : 0}">0</span>
							</dd>
						</div>
						<div>
							<dt>有效天數</dt>
							<dd>
								<span th:text="${coupon.DiscountDuration}">0</span> 天
							</dd>
						</div>
						<div>
							<dt>適用範圍</dt>
							<dd>全站已上架課程</dd>
						</div>
					</dl>
				</section>
			</main>
		</div>
	</div>
<script th:src="@{/js/course/app.js}"></script>
</body>
</html>
